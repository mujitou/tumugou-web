<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TUMUGOU | 旅を紡ぐ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --bg:#f8f5ee;
  --sand:#e9dfcc;
  --brown:#493c30;
  --green:#59634a;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--brown);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
header{
  background:var(--green);
  color:white;
  text-align:center;
  padding:24px 12px;
}
header h1{
  font:bold 36px Georgia,serif;
  letter-spacing:5px;
  margin:0;
}
header p{font-size:12px;margin:8px 0 0}
main{max-width:760px;margin:auto;padding:20px 15px 110px}
h2{font-size:24px}
h3{font-size:18px}
p{line-height:1.6}
.muted{color:#817768;font-size:13px}
.card,.box{
  background:white;
  border:1px solid #e8dfd1;
  border-radius:15px;
  padding:16px;
  margin:14px 0;
}
.cover{
  background:linear-gradient(120deg,#a6b4a0,#e5cba9);
  text-align:center;
  border-radius:12px;
  padding:25px;
  font-size:45px;
}
.tag{
  display:inline-block;
  background:#edf0e7;
  color:var(--green);
  padding:5px 9px;
  border-radius:15px;
  font-size:12px;
  margin:7px 5px 0 0;
}
button{cursor:pointer;touch-action:manipulation}
.btn{
  background:var(--green);
  color:white;
  border:0;
  border-radius:9px;
  padding:11px 13px;
  margin:5px 5px 5px 0;
  font-size:14px;
}
.secondary{background:var(--sand);color:var(--brown)}
.danger{background:#f3e4e0;color:#8d4238}
button:disabled{opacity:.5}
input,textarea,select{
  width:100%;
  padding:11px;
  border:1px solid #d5c9b8;
  border-radius:8px;
  font:inherit;
  background:white;
  margin:6px 0 12px;
}
label{display:block;font-size:13px;font-weight:600}
textarea{min-height:70px}
nav{
  position:fixed;
  z-index:1000;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:white;
  border-top:1px solid #ddd;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;
  border:0;
  background:white;
  padding:12px 0;
  font-size:11px;
  color:var(--brown);
}
nav button.active{background:#edf0e7;font-weight:bold}
.notice{
  background:#eee9da;
  border-radius:10px;
  padding:12px;
  font-size:13px;
  line-height:1.6;
}
.map{height:360px;border-radius:12px;margin:15px 0;z-index:0}
.day{border-left:5px solid var(--green)}
.stop{border-bottom:1px solid #eee;padding:9px 0}
.row{display:flex;gap:9px;align-items:flex-start}
.row .time{width:110px;flex-shrink:0}
.row .place{flex:1;min-width:0}
.spot{
  background:#f8f5ee;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}
.spot-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.spot-head .btn{padding:8px 11px}
.status{font-size:12px;margin:5px 0;color:#956239}
.ok{color:#466846}
.results{max-height:280px;overflow:auto}
.result{
  padding:11px;
  border:1px solid #ddd;
  border-radius:8px;
  margin:7px 0;
  background:white;
}
.result p{font-size:12px;margin:5px 0;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px}
.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:5px;
}
.number{
  display:inline-flex;
  background:var(--green);
  color:white;
  border-radius:50%;
  width:24px;
  height:24px;
  align-items:center;
  justify-content:center;
  margin-right:6px;
  font-size:12px;
}
.travel-info{
  margin:10px 0 10px 12px;
  padding:9px 12px;
  background:#f1eee6;
  border-left:3px solid #b8a990;
  border-radius:6px;
  font-size:13px;
}
.transport-box{
  border-top:1px dashed #c8bda9;
  margin-top:12px;
  padding-top:12px;
}
.transport-row{display:flex;gap:10px}
.transport-row label{flex:1;min-width:0}
.hint{font-size:12px;color:#756d61}
.plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:-7px;margin-bottom:20px}
.plan-actions .btn{margin:0}
.map-pin{
  display:flex;
  justify-content:center;
  align-items:center;
  width:29px;
  height:29px;
  border:2px solid white;
  border-radius:50%;
  color:white;
  font-weight:bold;
  font-size:13px;
  box-shadow:0 2px 5px #0005;
}
.route-arrow{
  display:flex;
  align-items:center;
  justify-content:center;
  width:24px;
  height:24px;
  background:white;
  border:1px solid #ddd;
  border-radius:50%;
  font-size:20px;
  font-weight:bold;
}
.time-check{
  padding:11px;
  border-radius:9px;
  margin:9px 0;
  font-size:13px;
  line-height:1.6;
}
.time-ok{background:#eaf1e7;color:#3d633d}
.time-warn{background:#fff0e7;color:#975333}
.time-unknown{background:#f1eee6;color:#756d61}
</style>
</head>

<body>

<header>
<h1>TUMUGOU</h1>
<p>あなたの旅が、次の誰かの旅になる。</p>
</header>

<main id="app"></main>
<nav id="nav"></nav>

<script>
'use strict';

const KEY='tumugou_v02';

const COLORS=[
  '#59634a',
  '#a66b4b',
  '#607f9a',
  '#b38b45',
  '#9872a0'
];

const MODES={
  '':'未設定',
  walk:'🚶 徒歩',
  train:'🚃 電車',
  bus:'🚌 バス',
  car:'🚗 車',
  taxi:'🚕 タクシー',
  bike:'🚲 自転車',
  ferry:'⛴️ 船',
  other:'🚩 その他'
};

const aliases={
  'コロッセオ':'Colosseo, Roma, Italia',
  'トレビの泉':'Fontana di Trevi, Roma, Italia',
  'スペイン広場':'Piazza di Spagna, Roma, Italia',
  'パンテオン':'Pantheon, Roma, Italia',
  'ナヴォーナ広場':'Piazza Navona, Roma, Italia'
};

const known={
  '清水寺':[34.9949,135.785],
  '祇園で昼食':[35.003,135.778],
  '鴨川散歩':[35.01,135.771],
  '嵐山':[35.0094,135.6668],
  '竹林の小径':[35.017,135.671],
  '京都駅':[34.9858,135.7588],
  '迪化街':[25.0545,121.509],
  '寧夏夜市':[25.0567,121.5153],
  '龍山寺':[25.0372,121.4999],
  '中正紀念堂':[25.0345,121.5219],
  'カフェ巡り':[25.043,121.525],
  '空港へ移動':[25.0797,121.2342],
  '札幌時計台':[43.0626,141.3535],
  '大通公園':[43.06,141.35],
  '小樽運河':[43.199,141.001],
  '堺町通り':[43.192,141.006]
};

const samples=[
  {
    id:'kyoto',
    title:'京都、街歩きと喫茶の2日間',
    place:'京都',
    days:2,
    icon:'🍵',
    description:'寺社と喫茶をゆっくり巡る旅。',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {time:'09:30',name:'清水寺'},
          {time:'12:00',name:'祇園で昼食',transport:'walk',travelMinutes:25},
          {time:'15:00',name:'鴨川散歩',transport:'walk',travelMinutes:15}
        ]
      },
      {
        name:'Day 2',
        stops:[
          {time:'10:00',name:'嵐山'},
          {time:'13:00',name:'竹林の小径',transport:'walk',travelMinutes:15},
          {time:'16:00',name:'京都駅',transport:'train',travelMinutes:35}
        ]
      }
    ]
  },
  {
    id:'taipei',
    title:'台北の街と夜市を楽しむ3日間',
    place:'台北',
    days:3,
    icon:'🏮',
    description:'ローカルグルメと街歩き。',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {time:'11:00',name:'迪化街'},
          {time:'18:00',name:'寧夏夜市'}
        ]
      },
      {
        name:'Day 2',
        stops:[
          {time:'09:00',name:'龍山寺'},
          {time:'14:00',name:'中正紀念堂'}
        ]
      },
      {
        name:'Day 3',
        stops:[
          {time:'10:00',name:'カフェ巡り'},
          {time:'15:00',name:'空港へ移動'}
        ]
      }
    ]
  },
  {
    id:'hokkaido',
    title:'札幌・小樽を巡る2日間',
    place:'北海道',
    days:2,
    icon:'🌲',
    description:'海辺の街と北海道グルメ。',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {time:'10:00',name:'札幌時計台'},
          {time:'13:00',name:'大通公園'}
        ]
      },
      {
        name:'Day 2',
        stops:[
          {time:'10:00',name:'小樽運河'},
          {time:'14:00',name:'堺町通り'}
        ]
      }
    ]
  }
];

let state={saved:[],plans:[]};

try{
  const x=JSON.parse(localStorage.getItem(KEY));
  if(x&&Array.isArray(x.saved)&&Array.isArray(x.plans)){
    state=x;
  }
}catch(e){}

const app=document.getElementById('app');
const nav=document.getElementById('nav');

let page='home';
let selected='';
let query='';
let duration='';
let draft=null;
let editing='';
let map=null;
let searchContext=null;
let searchResults=[];
let searchBusy=false;
let lastSearch=0;
let reorderNotice='';

function uid(){
  return 's'+Date.now().toString(36)+
    Math.random().toString(36).slice(2,8);
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch(e){
    alert('保存できませんでした。ブラウザの空き容量を確認してください。');
    return false;
  }
}

function all(){
  return [...samples,...state.plans];
}

function find(id){
  return all().find(t=>t.id===id);
}

function validCoords(p){
  return Array.isArray(p)&&p.length===2&&
    p.every(n=>Number.isFinite(Number(n)));
}

function normalizeTrip(t){
  const x=JSON.parse(JSON.stringify(t));

  x.schedule=(x.schedule||[]).map((d,i)=>({
    name:d.name||'Day '+(i+1),
    stops:(d.stops||[]).map(s=>({
      ...s,
      uid:s.uid||uid(),
      transport:s.transport||'',
      travelMinutes:s.travelMinutes??'',
      stayMinutes:s.stayMinutes??''
    }))
  }));

  return x;
}

function go(p,id=''){
  if(map){
    map.remove();
    map=null;
  }

  page=p;
  selected=id;
  window.scrollTo(0,0);
  render();

  if(p==='detail'){
    setTimeout(()=>{
      if(page==='detail'&&selected===id){
        drawMap(find(id));
      }
    },50);
  }
}

function card(t){
  return `
    <article class="card">
      <div class="cover">${esc(t.icon||'🧳')}</div>
      <span class="tag">${esc(t.place)}</span>
      <span class="tag">${esc(t.days)}日間</span>
      <h3>${esc(t.title)}</h3>
      <p class="muted">${esc(t.description)}</p>
      <button class="btn"
        data-action="detail"
        data-id="${esc(t.id)}">
        旅程を見る →
      </button>
    </article>
  `;
}

function menu(){
  nav.innerHTML=[
    ['home','HOME','⌂'],
    ['search','SEARCH','⌕'],
    ['my','MY TRIP','♡'],
    ['post','POST','＋']
  ].map(([id,name,icon])=>`
    <button data-action="page"
      data-id="${id}"
      class="${page===id?'active':''}">
      ${icon}<br>${name}
    </button>
  `).join('');
}

function hasNumber(v){
  return v!==''&&v!==null&&v!==undefined&&
    Number.isFinite(Number(v));
}

function transportText(s){
  const mode=MODES[s.transport]||'';

  const minutes=hasNumber(s.travelMinutes)
    ?Number(s.travelMinutes)+'分'
    :'';

  return [mode==='未設定'?'':mode,minutes]
    .filter(Boolean)
    .join('・')||'移動情報未設定';
}

function minutesFromTime(t){
  if(!/^\d\d:\d\d$/.test(t||''))return null;

  const [h,m]=t.split(':').map(Number);

  if(h>23||m>59)return null;

  return h*60+m;
}

function formatMinutes(n){
  const h=Math.floor(n/60);
  const m=n%60;

  return String(h).padStart(2,'0')+':'+
    String(m).padStart(2,'0');
}

function timeCheck(previous,current){
  const start=minutesFromTime(previous.time);
  const next=minutesFromTime(current.time);

  if(start===null||next===null){
    return {
      type:'unknown',
      text:'訪問時間が未設定のため計算できません。'
    };
  }

  if(next<start){
    return {
      type:'warn',
      text:'⚠ 訪問時間が前のスポットより早くなっています。'
    };
  }

  if(!hasNumber(previous.stayMinutes)||
     !hasNumber(current.travelMinutes)){
    return {
      type:'unknown',
      text:'滞在時間または移動時間が未設定です。'
    };
  }

  const stay=Number(previous.stayMinutes);
  const travel=Number(current.travelMinutes);
  const earliest=start+stay+travel;
  const difference=next-earliest;

  if(difference<0){
    return {
      type:'warn',
      text:'⚠ '+Math.abs(difference)+
        '分不足しています。最短到着目安は'+
        (earliest<1440?formatMinutes(earliest):'翌日以降')+
        'です。'
    };
  }

  return {
    type:'ok',
    text:'✓ '+difference+'分の余裕があります。'
  };
}

function checkHTML(previous,current){
  const c=timeCheck(previous,current);

  return `
    <div class="time-check time-${c.type}">
      ${esc(c.text)}
    </div>
  `;
}

function render(){
  menu();

  if(page==='home'){
    app.innerHTML=`
      <small>EXPLORE JOURNEYS</small>
      <h2>次の旅のヒントを探そう。</h2>
      <p>あなたの旅が、次の誰かの旅になる。</p>
      <div class="notice">
        以下は動作確認用のサンプル旅程です。
        実際の旅行記録ではありません。
      </div>
      ${samples.map(card).join('')}
    `;
  }

  else if(page==='search'){
    app.innerHTML=`
      <h2>旅程を探す</h2>

      <label>目的地・キーワード
        <input id="query"
          value="${esc(query)}"
          placeholder="例：京都">
      </label>

      <label>旅行日数
        <select id="duration">
          <option value="">すべて</option>
          ${Array.from({length:14},(_,i)=>i+1).map(n=>`
            <option value="${n}"
              ${duration===String(n)?'selected':''}>
              ${n}日間
            </option>
          `).join('')}
        </select>
      </label>

      <div id="results"></div>
    `;

    results();
  }

  else if(page==='my'){
    const saved=state.saved.map(find).filter(Boolean);

    app.innerHTML=`
      <h2>MY TRIP</h2>

      <h3>PLANNING｜自分の旅程</h3>

      ${state.plans.length
        ?state.plans.map(t=>`
          <div>
            ${card(t)}

            <div class="plan-actions">
              <button class="btn secondary"
                data-action="edit"
                data-id="${esc(t.id)}">
                ✎ 編集
              </button>

              <button class="btn danger"
                data-action="delete-trip"
                data-id="${esc(t.id)}">
                🗑 この旅程を削除
              </button>
            </div>
          </div>
        `).join('')
        :'<p>まだ旅程がありません。</p>'}

      <h3>SAVED｜保存した旅程</h3>

      ${saved.length
        ?saved.map(card).join('')
        :'<p>まだ保存した旅程がありません。</p>'}
    `;
  }

  else if(page==='detail'){
    const t=find(selected);

    if(!t){
      go('home');
      return;
    }

    const own=state.plans.some(x=>x.id===t.id);

    app.innerHTML=`
      <button class="btn secondary"
        data-action="page" data-id="home">
        ← HOME
      </button>

      <div class="cover">${esc(t.icon||'🧳')}</div>
      <h2>${esc(t.title)}</h2>

      <span class="tag">${esc(t.place)}</span>
      <span class="tag">${esc(t.days)}日間</span>

      <p>${esc(t.description)}</p>

      <button class="btn secondary"
        data-action="bookmark"
        data-id="${esc(t.id)}">
        ${state.saved.includes(t.id)?'♥ 保存済み':'♡ 保存する'}
      </button>

      <button class="btn"
        data-action="copy"
        data-id="${esc(t.id)}">
        この旅程をコピー
      </button>

      ${own?`
        <button class="btn secondary"
          data-action="edit"
          data-id="${esc(t.id)}">
          編集する
        </button>
      `:''}

      <h3>全体ルートマップ</h3>
      <div id="trip-map" class="map"></div>

      <div class="legend">
        ${t.schedule.map((d,i)=>`
          <span>
            <span class="dot"
              style="background:${COLORS[i%COLORS.length]}"></span>
            ${esc(d.name)}
          </span>
        `).join('')}
      </div>

      <p class="muted">
        地図の番号は訪問順、矢印は移動方向です。
        線は直線であり、実際の道路・鉄道経路ではありません。
      </p>

      <h3>DAY別スケジュール</h3>

      ${t.schedule.map((d,di)=>`
        <div class="box day"
          style="border-left-color:${COLORS[di%COLORS.length]}">

          <h3>${esc(d.name)}</h3>

          ${d.stops.map((s,si)=>`
            ${si>0?`
              <div class="travel-info">
                ↓ ${esc(transportText(s))}
              </div>

              ${checkHTML(d.stops[si-1],s)}
            `:''}

            <div class="stop">
              <span class="number"
                style="background:${COLORS[di%COLORS.length]}">
                ${si+1}
              </span>

              <b>${esc(s.time)}</b>
              ${esc(s.name)}

              ${validCoords(s.coords)
                ?'<span class="ok">📍</span>'
                :''}

              ${hasNumber(s.stayMinutes)?`
                <div class="muted">
                  滞在時間：${esc(s.stayMinutes)}分
                </div>
              `:''}
            </div>
          `).join('')}
        </div>
      `).join('')}
    `;
  }

  else if(page==='post'||page==='edit'){
    renderEditor();
  }
}

function results(){
  const el=document.getElementById('results');
  if(!el)return;

  const r=all().filter(t=>
    (t.place+' '+t.title).toLowerCase()
      .includes(query.toLowerCase())&&
    (!duration||t.days===Number(duration))
  );

  el.innerHTML=r.length
    ?r.map(card).join('')
    :'<p>該当する旅程がありません。</p>';
}

function newSpot(){
  return {
    uid:uid(),
    time:'09:00',
    name:'',
    transport:'',
    travelMinutes:'',
    stayMinutes:''
  };
}

function newDraft(){
  return {
    id:'plan-'+Date.now()+'-'+
      Math.random().toString(36).slice(2,6),
    title:'',
    place:'',
    days:2,
    icon:'🧳',
    description:'',
    schedule:[
      {name:'Day 1',stops:[newSpot()]},
      {name:'Day 2',stops:[newSpot()]}
    ]
  };
}

function openNew(){
  editing='';
  reorderNotice='';
  draft=newDraft();
  go('post');
}

function openEdit(id){
  const t=find(id);
  if(!t)return;

  editing=id;
  reorderNotice='';
  draft=normalizeTrip(t);
  go('edit');
}

function renderEditor(){
  if(!draft)draft=newDraft();

  app.innerHTML=`
    <h2>${editing?'旅程を編集':'新しい旅程を作成'}</h2>

    <div class="notice">
      DAYごとに訪問場所・時間・滞在時間・移動手段を入力。
      ▲ ▼ ボタンで訪問順を変更できます。
    </div>

    <div class="box">
      <label>旅程タイトル
        <input id="trip-title"
          value="${esc(draft.title)}"
          placeholder="ローマを巡る2日間">
      </label>

      <label>目的地
        <input id="trip-place"
          value="${esc(draft.place)}"
          placeholder="ローマ, イタリア">
      </label>

      <label>旅の説明
        <textarea id="trip-description">${esc(draft.description)}</textarea>
      </label>

      <label>旅行日数
        <select id="trip-days">
          ${Array.from({length:14},(_,i)=>i+1).map(n=>`
            <option value="${n}"
              ${draft.days===n?'selected':''}>
              ${n}日間
            </option>
          `).join('')}
        </select>
      </label>

      <div id="day-editor"></div>

      <button class="btn" data-action="save-trip">
        旅程を保存
      </button>
    </div>

    <div class="notice">
      データはこのブラウザ内に保存されます。
      他の端末とは同期されません。
    </div>
  `;

  renderDays();
}

function renderDays(){
  const el=document.getElementById('day-editor');
  if(!el||!draft)return;

  el.innerHTML=`
    ${reorderNotice?`
      <div class="time-check time-warn">
        ${esc(reorderNotice)}
      </div>
    `:''}

    ${draft.schedule.map((d,di)=>`
      <section class="box day"
        style="border-left-color:${COLORS[di%COLORS.length]}">

        <h3>${esc(d.name)}</h3>

        ${d.stops.map((s,si)=>`
          <div class="spot">

            <div class="spot-head">
              <b>スポット ${si+1}</b>

              <div>
                <button class="btn secondary"
                  data-action="move-up"
                  data-day="${di}"
                  data-spot="${si}"
                  ${si===0?'disabled':''}>
                  ▲
                </button>

                <button class="btn secondary"
                  data-action="move-down"
                  data-day="${di}"
                  data-spot="${si}"
                  ${si===d.stops.length-1?'disabled':''}>
                  ▼
                </button>
              </div>
            </div>

            <div class="row">
              <label class="time">訪問時間
                <input type="time"
                  data-field="time"
                  data-day="${di}"
                  data-spot="${si}"
                  value="${esc(
                    /^\d\d:\d\d$/.test(s.time)?s.time:'09:00'
                  )}">
              </label>

              <label class="place">訪問場所
                <input
                  data-field="name"
                  data-day="${di}"
                  data-spot="${si}"
                  value="${esc(s.name)}"
                  placeholder="例：コロッセオ">
              </label>
            </div>

            <label>滞在時間（分）
              <input type="number"
                min="0"
                step="1"
                data-field="stayMinutes"
                data-day="${di}"
                data-spot="${si}"
                value="${esc(s.stayMinutes??'')}"
                placeholder="例：90">
            </label>

            ${si>0?`
              <div class="transport-box">
                <b>前のスポットからの移動</b>

                <div class="transport-row">
                  <label>移動手段
                    <select
                      data-field="transport"
                      data-day="${di}"
                      data-spot="${si}">
                      ${Object.entries(MODES).map(([value,label])=>`
                        <option value="${esc(value)}"
                          ${(s.transport||'')===value?'selected':''}>
                          ${esc(label)}
                        </option>
                      `).join('')}
                    </select>
                  </label>

                  <label>移動時間（分）
                    <input type="number"
                      min="0"
                      step="1"
                      data-field="travelMinutes"
                      data-day="${di}"
                      data-spot="${si}"
                      value="${esc(s.travelMinutes??'')}"
                      placeholder="例：25">
                  </label>
                </div>
              </div>
            `:''}

            <div class="status ${validCoords(s.coords)?'ok':''}">
              ${validCoords(s.coords)
                ?'✓ 位置登録済み：'+esc(s.locationLabel||s.name)
                :'位置未登録'}
            </div>

            <label>検索キーワード
              <input
                data-field="lookup"
                data-day="${di}"
                data-spot="${si}"
                value="${esc(s.lookup||aliases[s.name]||s.name)}"
                placeholder="例：Colosseo, Roma, Italia">
            </label>

            <button class="btn secondary"
              data-action="find-place"
              data-day="${di}"
              data-spot="${si}">
              🔎 この場所を検索
            </button>

            <button class="btn danger"
              data-action="remove-spot"
              data-day="${di}"
              data-spot="${si}">
              削除
            </button>

            <div id="lookup-${di}-${si}"></div>
          </div>
        `).join('')}

        <button class="btn secondary"
          data-action="add-spot"
          data-day="${di}">
          ＋ スポットを追加
        </button>

        <button class="btn secondary"
          data-action="check-times"
          data-day="${di}">
          🕒 時間をチェック
        </button>

        <div id="check-${di}"></div>
      </section>
    `).join('')}
  `;
}

function syncDraft(){
  if(!draft)return;

  const t=document.getElementById('trip-title');
  const p=document.getElementById('trip-place');
  const desc=document.getElementById('trip-description');

  if(t)draft.title=t.value;
  if(p)draft.place=p.value;
  if(desc)draft.description=desc.value;

  document.querySelectorAll('[data-field]').forEach(el=>{
    const d=draft.schedule[Number(el.dataset.day)];
    const s=d?.stops[Number(el.dataset.spot)];

    if(!s)return;

    const field=el.dataset.field;

    if(field==='time'){
      s.time=el.value;
    }

    if(field==='lookup'){
      s.lookup=el.value;
    }

    if(field==='transport'){
      s.transport=el.value;
    }

    if(field==='travelMinutes'){
      s.travelMinutes=el.value;
    }

    if(field==='stayMinutes'){
      s.stayMinutes=el.value;
    }

    if(field==='name'&&s.name!==el.value){
      s.name=el.value;
      s.lookup='';
      delete s.coords;
      delete s.locationLabel;
    }
  });
}

function changeDays(n){
  syncDraft();
  n=Number(n);

  if(!Number.isInteger(n)||n<1||n>14)return;

  while(draft.schedule.length<n){
    draft.schedule.push({
      name:'Day '+(draft.schedule.length+1),
      stops:[newSpot()]
    });
  }

  draft.schedule.length=n;
  draft.days=n;
  renderDays();
}

function addSpot(di){
  syncDraft();
  draft.schedule[di].stops.push(newSpot());
  renderDays();
}

function removeSpot(di,si){
  syncDraft();

  const stops=draft.schedule[di].stops;
  stops.splice(si,1);

  if(si===0&&stops.length){
    stops[0].transport='';
    stops[0].travelMinutes='';
  }

  renderDays();
}

function moveSpot(di,si,direction){
  syncDraft();

  const stops=draft?.schedule[di]?.stops;
  if(!stops)return;

  const target=si+direction;

  if(target<0||target>=stops.length)return;

  [stops[si],stops[target]]=
    [stops[target],stops[si]];

  // 移動情報はスポットではなく区間に関する情報。
  // 並べ替えで影響を受ける区間は未設定へ戻す。
  const affected=new Set([
    si,
    si+1,
    target,
    target+1
  ]);

  affected.forEach(index=>{
    if(stops[index]){
      stops[index].transport='';
      stops[index].travelMinutes='';
    }
  });

  if(stops.length){
    stops[0].transport='';
    stops[0].travelMinutes='';
  }

  reorderNotice=
    '訪問順を変更しました。影響する区間の移動手段・移動時間を未設定に戻しました。再入力してください。';

  renderDays();
}

function checkTimes(di){
  syncDraft();

  const d=draft?.schedule[di];
  const el=document.getElementById('check-'+di);

  if(!d||!el)return;

  if(d.stops.length<2){
    el.innerHTML=`
      <div class="time-check time-unknown">
        スポットを2つ以上登録すると時間をチェックできます。
      </div>
    `;
    return;
  }

  el.innerHTML=d.stops.slice(1).map((s,i)=>`
    <div>
      <b>${i+1} → ${i+2}</b>
      ${checkHTML(d.stops[i],s)}
    </div>
  `).join('');
}

function getSpotByUid(id){
  for(const d of draft?.schedule||[]){
    for(const s of d.stops){
      if(s.uid===id)return s;
    }
  }
  return null;
}

async function lookup(di,si){
  syncDraft();

  const s=draft?.schedule[di]?.stops[si];
  const destination=draft?.place.trim();
  const el=document.getElementById('lookup-'+di+'-'+si);

  if(!s||!el)return;

  if(!s.name.trim()){
    el.innerHTML='<p class="status">先に訪問場所を入力してください。</p>';
    return;
  }

  if(!destination){
    el.innerHTML='<p class="status">先に目的地を入力してください。</p>';
    return;
  }

  if(searchBusy){
    el.innerHTML='<p class="status">前の検索が完了してからお試しください。</p>';
    return;
  }

  if(Date.now()-lastSearch<1300){
    el.innerHTML='<p class="status">少し時間を空けて再検索してください。</p>';
    return;
  }

  lastSearch=Date.now();
  searchBusy=true;
  searchContext={uid:s.uid,di,si};

  el.innerHTML='<p class="muted">検索中...</p>';

  const button=document.querySelector(
    `[data-action="find-place"][data-day="${di}"][data-spot="${si}"]`
  );

  if(button)button.disabled=true;

  try{
    const searchText=(
      s.lookup||aliases[s.name]||s.name
    ).trim();

    const params=new URLSearchParams({
      format:'jsonv2',
      q:searchText,
      limit:'10',
      addressdetails:'1',
      accept_language:'ja,en'
    });

    if(/イタリア|italy|italia/i.test(destination)){
      params.set('countrycodes','it');
    }

    const response=await fetch(
      'https://nominatim.openstreetmap.org/search?'+params.toString(),
      {headers:{Accept:'application/json'}}
    );

    if(!response.ok){
      throw new Error('HTTP '+response.status);
    }

    const data=await response.json();

    if(!getSpotByUid(s.uid))return;

    searchResults=data.map(x=>({
      name:x.display_name,
      coords:[Number(x.lat),Number(x.lon)]
    })).filter(x=>validCoords(x.coords));

    const current=document.getElementById('lookup-'+di+'-'+si);
    if(!current)return;

    current.innerHTML=searchResults.length
      ?`
        <p class="hint">
          所在地を確認し、正しい候補を選択してください。
        </p>

        <div class="results">
          ${searchResults.map((r,i)=>`
            <div class="result">
              <p>${esc(r.name)}</p>

              <button class="btn secondary"
                data-action="choose-place"
                data-index="${i}"
                data-uid="${esc(s.uid)}">
                この場所を選択
              </button>
            </div>
          `).join('')}
        </div>
      `
      :`
        <p class="status">
          候補が見つかりません。
          施設名を英語・現地語で入力して再検索してください。
        </p>
      `;

  }catch(e){
    const current=document.getElementById('lookup-'+di+'-'+si);

    if(current){
      current.innerHTML=`
        <p class="status">
          検索できませんでした。
          時間を空けて再試行してください。
        </p>
      `;
    }

    console.error(e);

  }finally{
    searchBusy=false;

    if(button&&document.contains(button)){
      button.disabled=false;
    }
  }
}

function choosePlace(index,id){
  if(searchContext?.uid!==id)return;

  const s=getSpotByUid(id);
  const r=searchResults[index];

  if(!s||!r)return;

  s.coords=r.coords;
  s.locationLabel=r.name;

  searchResults=[];
  searchContext=null;

  renderDays();
}

function submitTrip(){
  syncDraft();

  if(!draft.title.trim()||!draft.place.trim()){
    alert('タイトルと目的地を入力してください。');
    return;
  }

  if(draft.schedule.some(d=>d.stops.some(s=>!s.name.trim()))){
    alert('空欄の訪問場所があります。入力するか削除してください。');
    return;
  }

  if(!draft.schedule.some(d=>d.stops.length)){
    alert('スポットを1つ以上登録してください。');
    return;
  }

  for(const d of draft.schedule){
    for(const s of d.stops){
      for(const value of [s.travelMinutes,s.stayMinutes]){
        if(
          hasNumber(value)&&
          (!Number.isInteger(Number(value))||Number(value)<0)
        ){
          alert('移動時間・滞在時間は0以上の整数で入力してください。');
          return;
        }

        if(
          value!==''&&value!==null&&value!==undefined&&
          !hasNumber(value)
        ){
          alert('移動時間・滞在時間を確認してください。');
          return;
        }
      }
    }
  }

  const t=normalizeTrip(draft);

  if(editing){
    const i=state.plans.findIndex(p=>p.id===editing);

    if(i<0){
      alert('編集対象が見つかりません。');
      return;
    }

    const prev=state.plans[i];
    state.plans[i]=t;

    if(!save()){
      state.plans[i]=prev;
      return;
    }

  }else{
    state.plans.unshift(t);

    if(!save()){
      state.plans.shift();
      return;
    }
  }

  draft=null;
  editing='';
  reorderNotice='';
  go('detail',t.id);
}

function deleteTrip(id){
  const trip=state.plans.find(t=>t.id===id);

  if(!trip){
    alert('削除対象の旅程が見つかりません。');
    return;
  }

  const confirmed=window.confirm(
    '「'+trip.title+'」を削除しますか？\n\n'+
    'この操作は取り消せません。'
  );

  if(!confirmed)return;

  const previousPlans=[...state.plans];
  const previousSaved=[...state.saved];

  state.plans=state.plans.filter(t=>t.id!==id);
  state.saved=state.saved.filter(x=>x!==id);

  if(!save()){
    state.plans=previousPlans;
    state.saved=previousSaved;
    return;
  }

  if(editing===id){
    draft=null;
    editing='';
  }

  go('my');
}

function bookmark(id){
  const previous=[...state.saved];

  state.saved=state.saved.includes(id)
    ?state.saved.filter(x=>x!==id)
    :[...state.saved,id];

  if(!save()){
    state.saved=previous;
    return;
  }

  go('detail',id);
}

function copyTrip(id){
  const t=find(id);
  if(!t)return;

  const c=normalizeTrip(t);

  c.id='plan-'+Date.now()+'-'+
    Math.random().toString(36).slice(2,6);

  c.title+='（コピー）';

  state.plans.unshift(c);

  if(!save()){
    state.plans.shift();
    return;
  }

  openEdit(c.id);
}

function drawMap(t){
  const el=document.getElementById('trip-map');

  if(!el||!t)return;

  if(typeof L==='undefined'){
    el.innerHTML='<div class="notice">地図を読み込めません。</div>';
    return;
  }

  try{
    map=L.map(el,{scrollWheelZoom:false});

    L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution:'&copy; OpenStreetMap contributors',
        maxZoom:19
      }
    ).addTo(map);

    const bounds=[];
    const arrows=[];
    let missing=0;

    t.schedule.forEach((d,di)=>{
      const color=COLORS[di%COLORS.length];
      let previous=null;

      d.stops.forEach((s,si)=>{
        const p=validCoords(s.coords)
          ?s.coords
          :known[s.name];

        if(!validCoords(p)){
          missing++;
          previous=null;
          return;
        }

        const pos=p.map(Number);
        bounds.push(pos);

        const pin=L.divIcon({
          className:'',
          html:`
            <div class="map-pin"
              style="background:${color}">
              ${si+1}
            </div>
          `,
          iconSize:[29,29],
          iconAnchor:[14,14]
        });

        L.marker(pos,{icon:pin})
          .addTo(map)
          .bindPopup(
            '<b>'+esc(d.name)+' / '+(si+1)+'. '+
            esc(s.name)+'</b><br>'+
            esc(s.time)+
            (si>0?'<br>'+esc(transportText(s)):'')+
            (hasNumber(s.stayMinutes)
              ?'<br>滞在 '+esc(s.stayMinutes)+'分'
              :'')
          );

        if(previous){
          L.polyline(
            [previous,pos],
            {
              color,
              weight:4,
              opacity:.85
            }
          ).addTo(map);

          arrows.push({
            from:previous,
            to:pos,
            color
          });
        }

        previous=pos;
      });
    });

    if(bounds.length){
      map.fitBounds(bounds,{
        padding:[35,35],
        maxZoom:13
      });
    }else{
      map.setView([35.6812,139.7671],5);
    }

    let arrowMarkers=[];

    function updateArrows(){
      arrowMarkers.forEach(m=>map.removeLayer(m));
      arrowMarkers=[];

      arrows.forEach(a=>{
        const from=map.latLngToLayerPoint(a.from);
        const to=map.latLngToLayerPoint(a.to);

        const dx=to.x-from.x;
        const dy=to.y-from.y;

        if(Math.hypot(dx,dy)<12)return;

        const angle=Math.atan2(dy,dx)*180/Math.PI;

        const midpoint=[
          (a.from[0]+a.to[0])/2,
          (a.from[1]+a.to[1])/2
        ];

        const icon=L.divIcon({
          className:'',
          html:`
            <div class="route-arrow"
              style="color:${a.color}">
              <span style="
                display:inline-block;
                transform:rotate(${angle}deg);
              ">➜</span>
            </div>
          `,
          iconSize:[24,24],
          iconAnchor:[12,12]
        });

        const marker=L.marker(midpoint,{
          icon,
          interactive:false,
          keyboard:false
        }).addTo(map);

        arrowMarkers.push(marker);
      });
    }

    map.on('zoomend',updateArrows);
    updateArrows();

    if(missing){
      el.insertAdjacentHTML(
        'afterend',
        `<p class="status">
          位置未登録：${missing}件。
          編集画面から場所を検索・選択してください。
        </p>`
      );
    }

    setTimeout(()=>{
      if(map)map.invalidateSize();
    },150);

  }catch(e){
    console.error(e);
    el.innerHTML='<div class="notice">地図の表示に失敗しました。</div>';
  }
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-action]');
  if(!b)return;

  const a=b.dataset.action;
  const id=b.dataset.id;
  const di=Number(b.dataset.day);
  const si=Number(b.dataset.spot);

  if(a==='page'){
    if(id==='post'){
      openNew();
    }else{
      go(id);
    }
  }

  else if(a==='detail'){
    go('detail',id);
  }

  else if(a==='bookmark'){
    bookmark(id);
  }

  else if(a==='copy'){
    copyTrip(id);
  }

  else if(a==='edit'){
    openEdit(id);
  }

  else if(a==='add-spot'){
    addSpot(di);
  }

  else if(a==='remove-spot'){
    removeSpot(di,si);
  }

  else if(a==='move-up'){
    moveSpot(di,si,-1);
  }

  else if(a==='move-down'){
    moveSpot(di,si,1);
  }

  else if(a==='check-times'){
    checkTimes(di);
  }

  else if(a==='find-place'){
    lookup(di,si);
  }

  else if(a==='choose-place'){
    choosePlace(Number(b.dataset.index),b.dataset.uid);
  }

  else if(a==='save-trip'){
    submitTrip();
  }

  else if(a==='delete-trip'){
    deleteTrip(id);
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='query'){
    query=e.target.value;
    results();
  }

  else if(e.target.dataset.field==='name'){
    const d=draft?.schedule[Number(e.target.dataset.day)];
    const s=d?.stops[Number(e.target.dataset.spot)];

    if(s&&s.name!==e.target.value){
      s.name=e.target.value;
      s.lookup='';
      delete s.coords;
      delete s.locationLabel;

      const spot=e.target.closest('.spot');
      const status=spot?.querySelector('.status');

      if(status){
        status.textContent='位置未登録';
        status.classList.remove('ok');
      }

      const lookupEl=spot?.querySelector('[id^="lookup-"]');

      if(lookupEl){
        lookupEl.innerHTML='';
      }
    }
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='duration'){
    duration=e.target.value;
    results();
  }

  else if(e.target.id==='trip-days'){
    changeDays(e.target.value);
  }
});

render();
</script>
