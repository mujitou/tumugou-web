<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TUMUGOU ver.0.9</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --bg:#f8f5ee;
  --sand:#e9dfcc;
  --brown:#493c30;
  --green:#59634a;
  --border:#e4dacb;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--brown);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
header{
  background:var(--green);
  color:white;
  text-align:center;
  padding:23px 12px;
}
header h1{
  font:bold 35px Georgia,serif;
  letter-spacing:5px;
  margin:0;
}
header p{font-size:12px;margin:8px 0 0}
main{
  max-width:760px;
  margin:auto;
  padding:18px 14px 110px;
}
h2{font-size:23px}
h3{font-size:18px}
p{line-height:1.6}
.muted,.hint{
  color:#817768;
  font-size:13px;
}
.card,.box{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin:14px 0;
}
.cover{
  background:linear-gradient(120deg,#a6b4a0,#e5cba9);
  text-align:center;
  border-radius:12px;
  padding:23px;
  font-size:40px;
}
.tag{
  display:inline-block;
  background:#edf0e7;
  color:var(--green);
  padding:5px 9px;
  border-radius:15px;
  font-size:12px;
  margin:7px 5px 0 0;
}
button{
  cursor:pointer;
  touch-action:manipulation;
}
.btn{
  background:var(--green);
  color:white;
  border:0;
  border-radius:9px;
  padding:10px 12px;
  margin:5px 5px 5px 0;
  font-size:14px;
}
.secondary{
  background:var(--sand);
  color:var(--brown);
}
.danger{
  background:#f3e4e0;
  color:#8d4238;
}
button:disabled{opacity:.45}
input,textarea,select{
  width:100%;
  padding:10px;
  border:1px solid #d5c9b8;
  border-radius:8px;
  font:inherit;
  background:white;
  margin:6px 0 12px;
}
label{
  display:block;
  font-size:13px;
  font-weight:600;
}
textarea{min-height:70px}
nav{
  position:fixed;
  z-index:1000;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:white;
  border-top:1px solid #ddd;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;
  border:0;
  background:white;
  padding:12px 0;
  font-size:11px;
  color:var(--brown);
}
nav button.active{
  background:#edf0e7;
  font-weight:bold;
}
.notice{
  background:#eee9da;
  border-radius:10px;
  padding:12px;
  font-size:13px;
  line-height:1.6;
  margin:10px 0;
}
.map{
  height:350px;
  border-radius:12px;
  margin:15px 0;
  z-index:0;
}
.day{
  border-left:5px solid var(--green);
}
.spot{
  background:#f8f5ee;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}
.row{
  display:flex;
  gap:9px;
  align-items:flex-start;
}
.row .time{
  width:115px;
  flex-shrink:0;
}
.row .place{
  flex:1;
  min-width:0;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}
.status{
  font-size:12px;
  margin:6px 0;
  color:#956239;
}
.ok{color:#466846}
.results{
  max-height:260px;
  overflow:auto;
}
.result{
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  margin:7px 0;
  background:white;
}
.result p{
  font-size:12px;
  overflow-wrap:anywhere;
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  font-size:12px;
}
.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:5px;
}
.number{
  display:inline-flex;
  color:white;
  border-radius:50%;
  width:24px;
  height:24px;
  align-items:center;
  justify-content:center;
  margin-right:6px;
  font-size:12px;
}
.travel-info{
  margin:10px 0 10px 12px;
  padding:9px 12px;
  background:#f1eee6;
  border-left:3px solid #b8a990;
  border-radius:6px;
  font-size:13px;
}
.time-check{
  padding:10px;
  border-radius:8px;
  margin:8px 0;
  font-size:13px;
}
.time-ok{
  background:#eaf1e7;
  color:#3d633d;
}
.time-warn{
  background:#fff0e7;
  color:#975333;
}
.time-unknown{
  background:#f1eee6;
  color:#756d61;
}
.map-pin{
  display:flex;
  justify-content:center;
  align-items:center;
  width:29px;
  height:29px;
  border:2px solid white;
  border-radius:50%;
  color:white;
  font-weight:bold;
  font-size:13px;
  box-shadow:0 2px 5px #0005;
}
.route-arrow{
  display:flex;
  align-items:center;
  justify-content:center;
  width:24px;
  height:24px;
  background:white;
  border:1px solid #ddd;
  border-radius:50%;
  font-size:20px;
}
.stop{
  border-bottom:1px solid #eee;
  padding:9px 0;
}
.tabs{
  display:flex;
  gap:5px;
  overflow:auto;
}
.tabs button{white-space:nowrap}
.tabs .selected{
  background:var(--green);
  color:white;
}
.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:15px 0;
}
.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  text-align:center;
}
.stat strong{
  display:block;
  font-size:28px;
  color:var(--green);
}
.stat span{
  font-size:12px;
  color:#817768;
}
.backup-text{
  min-height:180px;
  font-size:12px;
  font-family:monospace;
  overflow-wrap:anywhere;
}
.success{
  background:#eaf1e7;
  color:#3d633d;
  border-radius:9px;
  padding:12px;
  margin:10px 0;
}
.warning{
  background:#fff0e7;
  color:#975333;
  border-radius:9px;
  padding:12px;
  margin:10px 0;
}
</style>
</head>

<body>

<header>
<h1>TUMUGOU</h1>
<p>あなたの旅が、次の誰かの旅になる。</p>
</header>

<main id="app"></main>
<nav id="nav"></nav>

<script>
'use strict';

const KEY='tumugou_v02';
const BACKUP_VERSION=1;

const COLORS=[
  '#59634a',
  '#a66b4b',
  '#607f9a',
  '#b38b45',
  '#9872a0'
];

const MODES={
  '':'未設定',
  walk:'🚶 徒歩',
  train:'🚃 電車',
  bus:'🚌 バス',
  car:'🚗 車',
  taxi:'🚕 タクシー',
  bike:'🚲 自転車',
  ferry:'⛴️ 船',
  other:'🚩 その他'
};

const ALIASES={
  'コロッセオ':'Colosseo, Roma, Italia',
  'トレビの泉':'Fontana di Trevi, Roma, Italia',
  'スペイン広場':'Piazza di Spagna, Roma, Italia',
  'パンテオン':'Pantheon, Roma, Italia'
};

const KNOWN={
  '清水寺':[34.9949,135.785],
  '祇園で昼食':[35.003,135.778],
  '鴨川散歩':[35.01,135.771],
  '嵐山':[35.0094,135.6668],
  '竹林の小径':[35.017,135.671],
  '京都駅':[34.9858,135.7588],
  '迪化街':[25.0545,121.509],
  '寧夏夜市':[25.0567,121.5153],
  '龍山寺':[25.0372,121.4999],
  '中正紀念堂':[25.0345,121.5219],
  '札幌時計台':[43.0626,141.3535],
  '大通公園':[43.06,141.35],
  '小樽運河':[43.199,141.001],
  '堺町通り':[43.192,141.006]
};

const SAMPLES=[
  {
    id:'kyoto',
    title:'京都、街歩きと喫茶の2日間',
    place:'京都',
    days:2,
    icon:'🍵',
    description:'寺社と喫茶をゆっくり巡る旅。',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {time:'09:30',name:'清水寺'},
          {
            time:'12:00',
            name:'祇園で昼食',
            transport:'walk',
            travelMinutes:25
          },
          {
            time:'15:00',
            name:'鴨川散歩',
            transport:'walk',
            travelMinutes:15
          }
        ]
      },
      {
        name:'Day 2',
        stops:[
          {time:'10:00',name:'嵐山'},
          {
            time:'13:00',
            name:'竹林の小径',
            transport:'walk',
            travelMinutes:15
          },
          {
            time:'16:00',
            name:'京都駅',
            transport:'train',
            travelMinutes:35
          }
        ]
      }
    ]
  },
  {
    id:'taipei',
    title:'台北の街と夜市を楽しむ2日間',
    place:'台北',
    days:2,
    icon:'🏮',
    description:'ローカルグルメと街歩き。',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {time:'11:00',name:'迪化街'},
          {time:'18:00',name:'寧夏夜市'}
        ]
      },
      {
        name:'Day 2',
        stops:[
          {time:'09:00',name:'龍山寺'},
          {time:'14:00',name:'中正紀念堂'}
        ]
      }
    ]
  },
  {
    id:'hokkaido',
    title:'札幌・小樽を巡る2日間',
    place:'北海道',
    days:2,
    icon:'🌲',
    description:'海辺の街と北海道グルメ。',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {time:'10:00',name:'札幌時計台'},
          {time:'13:00',name:'大通公園'}
        ]
      },
      {
        name:'Day 2',
        stops:[
          {time:'10:00',name:'小樽運河'},
          {time:'14:00',name:'堺町通り'}
        ]
      }
    ]
  }
];

let state={
  saved:[],
  plans:[]
};

try{
  const v=JSON.parse(localStorage.getItem(KEY));

  if(
    v&&
    Array.isArray(v.plans)&&
    Array.isArray(v.saved)
  ){
    state=v;
  }
}catch(e){
  console.error(e);
}

const app=document.getElementById('app');
const nav=document.getElementById('nav');

let page='home';
let selected='';
let myTab='planning';
let query='';
let duration='';
let draft=null;
let editing='';
let map=null;

let searchBusy=false;
let lastSearch=0;
let searchContext=null;
let searchResults=[];
let reorderNotice='';

let backupText='';
let restoreCandidate=null;
let restoreMode='merge';

function uid(){
  return 's'+Date.now().toString(36)+
    Math.random().toString(36).slice(2,8);
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function clone(x){
  return JSON.parse(JSON.stringify(x));
}

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch(e){
    alert(
      '保存に失敗しました。ブラウザの容量を確認してください。'
    );
    return false;
  }
}

function update(mutator){
  const old=clone(state);

  mutator();

  if(!persist()){
    state=old;
    return false;
  }

  return true;
}

function all(){
  return [...SAMPLES,...state.plans];
}

function find(id){
  return all().find(t=>t.id===id);
}

function own(id){
  return state.plans.some(t=>t.id===id);
}

function coords(p){
  return Array.isArray(p)&&
    p.length===2&&
    p.every(v=>Number.isFinite(Number(v)));
}

function hasNum(v){
  return v!==''&&
    v!==null&&
    v!==undefined&&
    Number.isFinite(Number(v));
}

function norm(t){
  const x=clone(t);

  x.status=x.status==='completed'
    ?'completed'
    :'planning';

  x.published=!!x.published;

  x.schedule=(x.schedule||[]).map((d,i)=>({
    name:d.name||'Day '+(i+1),
    stops:(d.stops||[]).map(s=>({
      ...s,
      uid:s.uid||uid(),
      transport:s.transport||'',
      travelMinutes:s.travelMinutes??'',
      stayMinutes:s.stayMinutes??''
    }))
  }));

  x.days=x.schedule.length;

  return x;
}

function badge(t){
  if(SAMPLES.includes(t))return 'サンプル';

  return t.status==='completed'
    ?'実際に行った旅'
    :'旅行計画';
}

function transport(s){
  return [
    MODES[s.transport]||'',
    hasNum(s.travelMinutes)
      ?Number(s.travelMinutes)+'分'
      :''
  ].filter(v=>v&&v!=='未設定')
    .join('・')||'移動情報未設定';
}

function minutes(t){
  if(!/^\d\d:\d\d$/.test(t||'')){
    return null;
  }

  const [h,m]=t.split(':').map(Number);

  return h<24&&m<60
    ?h*60+m
    :null;
}

function clock(n){
  return String(Math.floor(n/60)).padStart(2,'0')+
    ':'+String(n%60).padStart(2,'0');
}

function timeCheck(a,b){
  const start=minutes(a.time);
  const end=minutes(b.time);

  if(start===null||end===null){
    return ['unknown','時刻未設定'];
  }

  if(end<start){
    return ['warn','⚠ 訪問時刻が前後しています'];
  }

  if(
    !hasNum(a.stayMinutes)||
    !hasNum(b.travelMinutes)
  ){
    return [
      'unknown',
      '滞在時間または移動時間が未設定'
    ];
  }

  const earliest=start+
    Number(a.stayMinutes)+
    Number(b.travelMinutes);

  const gap=end-earliest;

  return gap<0
    ?[
      'warn',
      '⚠ '+(-gap)+'分不足（最短到着：'+
      (earliest<1440?clock(earliest):'翌日以降')+
      '）'
    ]
    :[
      'ok',
      '✓ '+gap+'分の余裕があります'
    ];
}

function checkHTML(a,b){
  const [type,msg]=timeCheck(a,b);

  return `
    <div class="time-check time-${type}">
      ${esc(msg)}
    </div>
  `;
}

function menu(){
  nav.innerHTML=[
    ['home','HOME','⌂'],
    ['search','SEARCH','⌕'],
    ['my','MY TRIP','♡'],
    ['post','POST','＋']
  ].map(([id,label,icon])=>`
    <button
      data-action="page"
      data-id="${id}"
      class="${page===id?'active':''}">
      ${icon}<br>${label}
    </button>
  `).join('');
}

function go(p,id=''){
  if(map){
    map.remove();
    map=null;
  }

  page=p;
  selected=id;

  window.scrollTo(0,0);
  render();

  if(p==='detail'){
    setTimeout(()=>{
      if(page==='detail'&&selected===id){
        drawMap(find(id));
      }
    },60);
  }
}

function card(t){
  return `
    <article class="card">
      <div class="cover">
        ${esc(t.icon||'🧳')}
      </div>

      <span class="tag">${esc(t.place)}</span>
      <span class="tag">${esc(t.days)}日間</span>
      <span class="tag">${badge(t)}</span>

      ${t.published
        ?'<span class="tag">🌐 公開中（この端末のみ）</span>'
        :''}

      <h3>${esc(t.title)}</h3>

      <p class="muted">
        ${esc(t.description||'')}
      </p>

      <button
        class="btn"
        data-action="detail"
        data-id="${esc(t.id)}">
        旅程を見る →
      </button>
    </article>
  `;
}

function getCounts(){
  return {
    planning:state.plans.filter(
      t=>t.status!=='completed'
    ).length,

    completed:state.plans.filter(
      t=>t.status==='completed'
    ).length,

    post:state.plans.filter(
      t=>t.published
    ).length,

    saved:state.saved.length
  };
}

function statsHTML(){
  const c=getCounts();

  return `
    <div class="stats">
      <div class="stat">
        <strong>${c.planning}</strong>
        <span>PLANNING</span>
      </div>

      <div class="stat">
        <strong>${c.completed}</strong>
        <span>COMPLETED</span>
      </div>

      <div class="stat">
        <strong>${c.post}</strong>
        <span>POST</span>
      </div>

      <div class="stat">
        <strong>${c.saved}</strong>
        <span>SAVED</span>
      </div>
    </div>
  `;
}

function render(){
  menu();

  if(page==='home'){
    app.innerHTML=`
      <small>EXPLORE JOURNEYS</small>

      <h2>次の旅のヒントを探そう。</h2>

      <p>
        あなたの旅が、次の誰かの旅になる。
      </p>

      <div class="notice">
        現在はローカル試作版です。
        公開旅程は同じブラウザでのみ検索できます。
        サンプルは実際の旅行記録ではありません。
      </div>

      <h3>公開した旅程</h3>

      ${
        state.plans.filter(t=>t.published)
          .map(card).join('')||
        '<p class="muted">まだ公開旅程がありません。</p>'
      }

      <h3>サンプル旅程</h3>

      ${SAMPLES.map(card).join('')}
    `;
  }

  else if(page==='search'){
    app.innerHTML=`
      <h2>旅程を探す</h2>

      <div class="notice">
        検索対象はサンプルと、
        このブラウザで公開した旅程です。
        他のユーザーの投稿はまだ表示されません。
      </div>

      <label>
        目的地・キーワード
        <input
          id="query"
          value="${esc(query)}"
          placeholder="例：京都">
      </label>

      <label>
        旅行日数
        <select id="duration">
          <option value="">すべて</option>

          ${
            Array.from(
              {length:14},
              (_,i)=>i+1
            ).map(n=>`
              <option
                value="${n}"
                ${duration===String(n)?'selected':''}>
                ${n}日間
              </option>
            `).join('')
          }
        </select>
      </label>

      <div id="results"></div>
    `;

    results();
  }

  else if(page==='my'){
    renderMy();
  }

  else if(page==='detail'){
    renderDetail();
  }

  else if(page==='post'){
    renderPost();
  }

  else if(page==='edit'){
    renderEditor();
  }

  else if(page==='backup'){
    renderBackup();
  }
}

function renderMy(){
  const entries=state.plans.filter(t=>
    myTab==='post'
      ?t.published
      :t.status===myTab
  );

  const saved=state.saved
    .map(find)
    .filter(Boolean);

  app.innerHTML=`
    <h2>MY TRIP</h2>

    ${statsHTML()}

    <button
      class="btn secondary"
      data-action="page"
      data-id="backup">
      🛡 データのバックアップ・復元
    </button>

    <div class="tabs">
      ${
        [
          ['planning','PLANNING'],
          ['completed','COMPLETED'],
          ['post','POST'],
          ['saved','SAVED']
        ].map(([id,label])=>`
          <button
            class="btn ${myTab===id?'selected':'secondary'}"
            data-action="tab"
            data-id="${id}">
            ${label}
          </button>
        `).join('')
      }
    </div>

    ${
      myTab==='saved'
        ?(
          saved.map(t=>`
            ${card(t)}

            <button
              class="btn secondary"
              data-action="copy"
              data-id="${esc(t.id)}">
              コピーして編集
            </button>
          `).join('')||
          '<p>保存した旅程はありません。</p>'
        )
        :(
          entries.map(t=>`
            <div>
              ${card(t)}

              <div class="actions">
                <button
                  class="btn secondary"
                  data-action="edit"
                  data-id="${esc(t.id)}">
                  ✎ 編集
                </button>

                ${myTab==='planning'?`
                  <button
                    class="btn secondary"
                    data-action="complete"
                    data-id="${esc(t.id)}">
                    ✓ 旅行を完了
                  </button>
                `:''}

                ${myTab==='completed'?`
                  <button
                    class="btn secondary"
                    data-action="planning"
                    data-id="${esc(t.id)}">
                    PLANNINGに戻す
                  </button>
                `:''}

                <button
                  class="btn secondary"
                  data-action="${t.published?'unpublish':'publish'}"
                  data-id="${esc(t.id)}">
                  ${t.published?'公開を取り消す':'🌐 POSTに公開'}
                </button>

                <button
                  class="btn danger"

function sync(){
  if(!draft)return;

  for(const [id,key] of [
    ['trip-title','title'],
    ['trip-place','place'],
    ['trip-description','description'],
    ['trip-status','status']
  ]){
    const e=document.getElementById(id);

    if(e)draft[key]=e.value;
  }

  document.querySelectorAll('[data-field]')
    .forEach(el=>{
      const s=draft.schedule[+el.dataset.day]
        ?.stops[+el.dataset.spot];

      if(!s)return;

      const f=el.dataset.field;

      if(f==='name'&&s.name!==el.value){
        s.name=el.value;
        s.lookup='';
        delete s.coords;
        delete s.locationLabel;
      }else if(f!=='name'){
        s[f]=el.value;
      }
    });
}

function changeDays(n){
  sync();

  n=+n;

  if(
    !Number.isInteger(n)||
    n<1||
    n>14
  )return;

  while(draft.schedule.length<n){
    draft.schedule.push({
      name:'Day '+(draft.schedule.length+1),
      stops:[newSpot()]
    });
  }

  draft.schedule.length=n;
  draft.days=n;

  renderDays();
}

function add(di){
  sync();
  draft.schedule[di].stops.push(newSpot());
  renderDays();
}

function remove(di,si){
  sync();

  const a=draft.schedule[di].stops;
  a.splice(si,1);

  if(a.length){
    a[0].transport='';
    a[0].travelMinutes='';

    if(si<a.length){
      a[si].transport='';
      a[si].travelMinutes='';
    }
  }

  renderDays();
}

function move(di,si,delta){
  sync();

  const a=draft.schedule[di].stops;
  const to=si+delta;

  if(to<0||to>=a.length)return;

  [a[si],a[to]]=[a[to],a[si]];

  new Set([
    si,
    si+1,
    to,
    to+1
  ]).forEach(i=>{
    if(a[i]){
      a[i].transport='';
      a[i].travelMinutes='';
    }
  });

  a[0].transport='';
  a[0].travelMinutes='';

  reorderNotice=
    '並べ替えにより、影響する区間の移動情報を未設定にしました。再入力してください。';

  renderDays();
}

  el.innerHTML=a.length<2

function spotByUid(id){
  for(const d of draft?.schedule||[]){
    for(const s of d.stops){
      if(s.uid===id)return s;
    }
  }

  return null;
}

async function lookup(di,si){
  sync();

  const s=draft?.schedule[di]?.stops[si];
  const el=document.getElementById(
    'lookup-'+di+'-'+si
  );

  if(!s||!el)return;

  if(!s.name.trim()||!draft.place.trim()){
    el.textContent=
      '訪問場所と目的地を入力してください。';
    return;
  }

  if(
    searchBusy||
    Date.now()-lastSearch<1300
  ){
    el.textContent=
      '少し時間を空けて再検索してください。';
    return;
  }

  searchBusy=true;
  lastSearch=Date.now();
  searchContext={uid:s.uid,di,si};

  el.textContent='検索中...';

  try{
    const q=(
      s.lookup||
      ALIASES[s.name]||
      s.name
    ).trim();

    const params=new URLSearchParams({
      format:'jsonv2',
      q,
      limit:'10',
      addressdetails:'1',
      accept_language:'ja,en'
    });

    if(
      /イタリア|italy|italia/i.test(draft.place)
    ){
      params.set('countrycodes','it');
    }

    const res=await fetch(
      'https://nominatim.openstreetmap.org/search?'+
      params.toString(),
      {
        headers:{
          Accept:'application/json'
        }
      }
    );

    if(!res.ok){
      throw Error(res.status);
    }

    const data=await res.json();

    if(
      !spotByUid(s.uid)||
      searchContext?.uid!==s.uid
    )return;

    searchResults=data.map(x=>({
      name:x.display_name,
      coords:[+x.lat,+x.lon]
    })).filter(x=>coords(x.coords));

    const target=document.getElementById(
      'lookup-'+di+'-'+si
    );

    if(target){
      target.innerHTML=searchResults.length
        ?`
          <p class="hint">
            正しい所在地の候補を選んでください。
          </p>

          <div class="results">
            ${
              searchResults.map((r,i)=>`
                <div class="result">
                  <p>${esc(r.name)}</p>

                  <button
                    class="btn secondary"
                    data-action="choose"
                    data-index="${i}"
                    data-uid="${esc(s.uid)}">
                    この場所を選択
                  </button>
                </div>
              `).join('')
            }
          </div>
        `
        :`
          <p class="status">
            候補がありません。
            現地語や英語で再検索してください。
          </p>
        `;
    }

  }catch(e){
    const target=document.getElementById(
      'lookup-'+di+'-'+si
    );

    if(target){
      target.textContent=
        '検索に失敗しました。時間を空けて再試行してください。';
    }

  }finally{
    searchBusy=false;
  }
}

function choose(i,id){
  if(searchContext?.uid!==id)return;

  const s=spotByUid(id);
  const r=searchResults[i];

  if(!s||!r)return;

  s.coords=r.coords;
  s.locationLabel=r.name;

  searchResults=[];
  searchContext=null;

  renderDays();
}

function saveTrip(){
  sync();

  if(
    !draft.title.trim()||
    !draft.place.trim()
  ){
    alert('タイトルと目的地を入力してください。');
    return;
  }

  if(
    !draft.schedule.some(d=>d.stops.length)||
    draft.schedule.some(
      d=>d.stops.some(s=>!s.name.trim())
    )
  ){
    alert(
      'スポットを1つ以上入力し、空欄をなくしてください。'
    );
    return;
  }

  for(const d of draft.schedule){
    for(const s of d.stops){
      for(const v of [
        s.travelMinutes,
        s.stayMinutes
      ]){
        if(
          v!==''&&
          v!==null&&
          v!==undefined&&
          (
            !Number.isInteger(Number(v))||
            Number(v)<0
          )
        ){
          alert(
            '移動・滞在時間は0以上の整数で入力してください。'
          );
          return;
        }
      }
    }
  }

  const t=norm(draft);

  if(draft.publishAfterSave){
    t.published=true;
  }

  delete t.publishAfterSave;

  if(
    editing&&
    !state.plans.some(x=>x.id===editing)
  ){
    alert('編集対象が見つかりません。');
    return;
  }

  const ok=update(()=>{
    if(editing){
      const i=state.plans.findIndex(
        x=>x.id===editing
      );

      state.plans[i]=t;
    }else{
      state.plans.unshift(t);
    }
  });

  if(!ok)return;

  draft=null;
  editing='';
  reorderNotice='';

  go('detail',t.id);
}

function drawMap(t){
  const el=document.getElementById('trip-map');

  if(!el||!t)return;

  if(typeof L==='undefined'){
    el.textContent=
      '地図ライブラリを読み込めませんでした。';
    return;
  }

  try{
    map=L.map(el,{
      scrollWheelZoom:false
    });

    L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution:'&copy; OpenStreetMap contributors',
        maxZoom:19
      }
    ).addTo(map);

    const bounds=[];
    const arrows=[];
    let missing=0;

    t.schedule.forEach((d,di)=>{
      const color=COLORS[di%COLORS.length];
      let prev=null;

      d.stops.forEach((s,si)=>{
        const p=coords(s.coords)
          ?s.coords
          :KNOWN[s.name];

        if(!coords(p)){
          missing++;
          prev=null;
          return;
        }

        const pos=p.map(Number);

        bounds.push(pos);

        const icon=L.divIcon({
          className:'',
          html:`
            <div
              class="map-pin"
              style="background:${color}">
              ${si+1}
            </div>
          `,
          iconSize:[29,29],
          iconAnchor:[14,14]
        });

        L.marker(pos,{icon})
          .addTo(map)
          .bindPopup(`
            <b>
              ${esc(d.name)} /
              ${si+1}. ${esc(s.name)}
            </b>
            <br>
            ${esc(s.time||'')}
            ${si?'<br>'+esc(transport(s)):''}
          `);

        if(prev){
          L.polyline(
            [prev,pos],
            {
              color,
              weight:4,
              opacity:.85
            }
          ).addTo(map);

          arrows.push({
            from:prev,
            to:pos,
            color
          });
        }

        prev=pos;
      });
    });

    if(bounds.length){
      map.fitBounds(bounds,{
        padding:[35,35],
        maxZoom:13
      });
    }else{
      map.setView(
        [35.6812,139.7671],
        5
      );
    }

    let markers=[];

    function drawArrows(){
      markers.forEach(m=>{
        map.removeLayer(m);
      });

      markers=[];

      arrows.forEach(a=>{
        const f=map.latLngToLayerPoint(a.from);
        const t=map.latLngToLayerPoint(a.to);

        const dx=t.x-f.x;
        const dy=t.y-f.y;

        if(Math.hypot(dx,dy)<12)return;

        const angle=
          Math.atan2(dy,dx)*180/Math.PI;

        const center=[
          (a.from[0]+a.to[0])/2,
          (a.from[1]+a.to[1])/2
        ];

        const icon=L.divIcon({
          className:'',
          html:`
            <div
              class="route-arrow"
              style="color:${a.color}">
              <span style="
                display:inline-block;
                transform:rotate(${angle}deg)
              ">➜</span>
            </div>
          `,
          iconSize:[24,24],
          iconAnchor:[12,12]
        });

        markers.push(
          L.marker(center,{
            icon,
            interactive:false,
            keyboard:false
          }).addTo(map)
        );
      });
    }

    map.on('zoomend',drawArrows);
    drawArrows();

    if(missing){
      el.insertAdjacentHTML(
        'afterend',
        `
          <p class="status">
            位置未登録：${missing}件。
            編集画面で場所を検索してください。
          </p>
        `
      );
    }

    setTimeout(()=>{
      if(map)map.invalidateSize();
    },150);

  }catch(e){
    console.error(e);
    el.textContent=
      '地図の表示に失敗しました。';
  }
}

/* ==========================
   ver.0.9 バックアップ機能
========================== */

function createBackup(){
  const data={
    app:'TUMUGOU',
    backupVersion:BACKUP_VERSION,
    exportedAt:new Date().toISOString(),
    data:{
      plans:clone(state.plans),
      saved:clone(state.saved)
    }
  };

  backupText=JSON.stringify(data,null,2);

  const el=document.getElementById('backup-output');

  if(el){
    el.value=backupText;
  }

  const msg=document.getElementById('backup-message');

  if(msg){
    msg.innerHTML=`
      <div class="success">
        バックアップを作成しました。
        下のテキストをコピーして、
        メモアプリなどに保存してください。
      </div>
    `;
  }
}

async function copyBackup(){
  const el=document.getElementById('backup-output');

  if(!el||!el.value.trim()){
    alert('先にバックアップを作成してください。');
    return;
  }

  try{
    await navigator.clipboard.writeText(el.value);

    alert('バックアップテキストをコピーしました。');

  }catch(e){
    el.focus();
    el.select();

    alert(
      '自動コピーできませんでした。\n'+
      'テキストが選択されているので、'+
      'iPadのコピー操作で保存してください。'
    );
  }
}

function validTrip(t){
  if(!t||typeof t!=='object')return false;

  if(
    typeof t.id!=='string'||
    !t.id.trim()||
    typeof t.title!=='string'||
    typeof t.place!=='string'
  )return false;

  if(
    !Array.isArray(t.schedule)||
    t.schedule.length<1||
    t.schedule.length>14
  )return false;

  for(const d of t.schedule){
    if(
      !d||
      !Array.isArray(d.stops)||
      d.stops.length>500
    )return false;

    for(const s of d.stops){
      if(
        !s||
        typeof s.name!=='string'||
        typeof s.time!=='string'
      )return false;

      if(
        s.coords!==undefined&&
        !coords(s.coords)
      )return false;
    }
  }

  return true;
}

function validateBackup(raw){
  if(raw.length>2000000){
    throw Error(
      'バックアップテキストが大きすぎます。'
    );
  }

  let parsed;

  try{
    parsed=JSON.parse(raw);
  }catch(e){
    throw Error(
      'JSON形式として読み取れませんでした。'
    );
  }

  if(
    !parsed||
    parsed.app!=='TUMUGOU'||
    parsed.backupVersion!==BACKUP_VERSION
  ){
    throw Error(
      '対応していないバックアップ形式です。'
    );
  }

  if(
    !parsed.data||
    !Array.isArray(parsed.data.plans)||
    !Array.isArray(parsed.data.saved)
  ){
    throw Error(
      '旅程データの構造が正しくありません。'
    );
  }

  if(
    parsed.data.plans.length>1000||
    parsed.data.saved.length>2000
  ){
    throw Error(
      'データ件数が上限を超えています。'
    );
  }

  const ids=new Set();

  for(const t of parsed.data.plans){
    if(!validTrip(t)){
      throw Error(
        '正しくない旅程データが含まれています。'
      );
    }

    if(ids.has(t.id)){
      throw Error(
        'バックアップ内に重複した旅程IDがあります。'
      );
    }

    ids.add(t.id);
  }

  for(const id of parsed.data.saved){
    if(typeof id!=='string'){
      throw Error(
        '保存済み旅程のデータが正しくありません。'
      );
    }
  }

  return parsed;
}

function previewRestore(){
  const input=document.getElementById('restore-input');
  const preview=document.getElementById('restore-preview');

  if(!input||!preview)return;

  restoreCandidate=null;

  const raw=input.value.trim();

  if(!raw){
    preview.innerHTML=`
      <div class="warning">
        バックアップテキストを貼り付けてください。
      </div>
    `;
    return;
  }

  try{
    const parsed=validateBackup(raw);

    restoreCandidate=parsed;

    const plans=parsed.data.plans;
    const saved=parsed.data.saved;

    const existingIds=new Set(
      state.plans.map(t=>t.id)
    );

    const duplicates=plans.filter(
      t=>existingIds.has(t.id)
    ).length;

    const planning=plans.filter(
      t=>t.status!=='completed'
    ).length;

    const completed=plans.filter(
      t=>t.status==='completed'
    ).length;

    const published=plans.filter(
      t=>t.published
    ).length;

    preview.innerHTML=`
      <div class="success">
        ✓ バックアップ形式を確認しました。
      </div>

      <div class="box">
        <h3>復元するデータ</h3>

        <p>旅程：${plans.length}件</p>
        <p>PLANNING：${planning}件</p>
        <p>COMPLETED：${completed}件</p>
        <p>POST：${published}件</p>
        <p>SAVED：${saved.length}件</p>

        <p>
          既存データとIDが重複する旅程：
          ${duplicates}件
        </p>

        <p class="muted">
          バックアップ日時：
          ${esc(parsed.exportedAt||'不明')}
        </p>
      </div>

      <label>
        復元方法
        <select id="restore-mode">
          <option value="merge">
            既存データに追加する
          </option>

          <option value="replace">
            既存データを置き換える
          </option>
        </select>
      </label>

      <div class="notice">
        「追加」では既存旅程を残し、
        同じIDの旅程は追加しません。

        「置き換え」では現在の旅程・保存情報を
        バックアップの内容に置き換えます。
      </div>

      <button
        class="btn danger"
        data-action="restore-confirm">
        復元を実行
      </button>
    `;

  }catch(e){
    preview.innerHTML=`
      <div class="warning">
        ⚠ ${esc(e.message)}
      </div>
    `;
  }
}

function restoreData(){
  if(!restoreCandidate){
    alert(
      '先にバックアップを確認してください。'
    );
    return;
  }

  const mode=document.getElementById(
    'restore-mode'
  )?.value||'merge';

  const data=restoreCandidate.data;

  const message=mode==='replace'
    ?(
      '現在の旅程と保存情報を、'+
      'バックアップの内容に置き換えます。\n\n'+
      '現在のデータは失われる可能性があります。\n'+
      '実行しますか？'
    )
    :(
      'バックアップの旅程を追加します。\n'+
      '同じIDの旅程は追加しません。\n\n'+
      '実行しますか？'
    );

  if(!confirm(message))return;

  const success=update(()=>{
    if(mode==='replace'){
      state.plans=data.plans.map(norm);
      state.saved=[...new Set(data.saved)];
    }else{
      const existing=new Set(
        state.plans.map(t=>t.id)
      );

      const additions=data.plans
        .filter(t=>!existing.has(t.id))
        .map(norm);

      state.plans=[
        ...state.plans,
        ...additions
      ];

      state.saved=[
        ...new Set([
          ...state.saved,
          ...data.saved
        ])
      ];
    }
  });

  if(!success)return;

  restoreCandidate=null;
  backupText='';

  alert(
    'データの復元が完了しました。\n'+
    'MY TRIPで旅程を確認してください。'
  );

  myTab='planning';
  go('my');
}

    <h2>データのバックアップ・復元</h2>

    <div class="notice">

      ブラウザのデータ消去や端末変更に備え、

      </p>

      <label>

}

document.addEventListener('click',e=>{
  const b=e.target.closest(
    'button[data-action]'
  );

  if(!b)return;

  const a=b.dataset.action;
  const id=b.dataset.id;
  const di=+b.dataset.day;
  const si=+b.dataset.spot;

  if(a==='page'){
    go(id);
  }

  else if(a==='tab'){
    myTab=id;
    render();
  }

  else if(a==='detail'){
    go('detail',id);
  }

  else if(a==='new-publish'){
    openNew(true);
  }

  else if(a==='edit'){
    openEdit(id);
  }

  else if(a==='add'){
    add(di);
  }

  else if(a==='remove'){
    remove(di,si);
  }

  else if(a==='up'){
    move(di,si,-1);
  }

  else if(a==='down'){
    move(di,si,1);
  }

  else if(a==='check'){
    check(di);
  }

  else if(a==='lookup'){
    lookup(di,si);
  }

  else if(a==='choose'){
    choose(
      +b.dataset.index,
      b.dataset.uid
    );
  }

  else if(a==='save-trip'){
    saveTrip();
  }

  else if(a==='delete'){
    deleteTrip(id);
  }

  else if(a==='complete'){
    setStatus(id,'completed');
  }

  else if(a==='planning'){
    setStatus(id,'planning');
  }

  else if(a==='publish'){
    publish(id,true);
  }

  else if(a==='unpublish'){
    publish(id,false);
  }

  else if(a==='bookmark'){
    bookmark(id);
  }

  else if(a==='copy'){
    copyTrip(id);
  }

  else if(a==='backup-create'){
    createBackup();
  }

  else if(a==='backup-copy'){
    copyBackup();
  }

  else if(a==='restore-preview'){
    previewRestore();
  }

  else if(a==='restore-confirm'){
    restoreData();
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='query'){
    query=e.target.value;
    results();
  }

  else if(e.target.id==='restore-input'){
    restoreCandidate=null;

    const preview=document.getElementById(
      'restore-preview'
    );

    if(preview){
      preview.innerHTML='';
    }
  }

  else if(
    e.target.dataset.field==='name'
  ){
    const s=draft?.schedule[
      +e.target.dataset.day
    ]?.stops[
      +e.target.dataset.spot
    ];

    if(s&&s.name!==e.target.value){
      s.name=e.target.value;
      s.lookup='';

      delete s.coords;
      delete s.locationLabel;

      const box=e.target.closest('.spot');
      const status=box?.querySelector('.status');

      const lookupField=box?.querySelector(
        '[data-field="lookup"]'
      );

      if(status){
        status.textContent='位置未登録';
        status.classList.remove('ok');
      }

      if(lookupField){
        lookupField.value=
          ALIASES[s.name]||s.name;
      }

      const res=box?.querySelector(
        '[id^="lookup-"]'
      );

      if(res){
        res.innerHTML='';
      }
    }
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='duration'){
    duration=e.target.value;
    results();
  }

  else if(e.target.id==='trip-days'){
    changeDays(e.target.value);
  }
});

render();
