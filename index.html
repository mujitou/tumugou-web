<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#59634a">
<title>TUMUGOU ver.1.8</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --bg:#f8f5ee;
  --paper:#fffefa;
  --sand:#e9dfcc;
  --brown:#493c30;
  --olive:#59634a;
  --line:#ddd3c4;
  --muted:#817768;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--brown);
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN",sans-serif;
}
header{
  padding:20px 12px;
  text-align:center;
  border-bottom:1px solid var(--line);
}
header strong{
  font: bold 34px Georgia,serif;
  letter-spacing:5px;
}
header small{
  display:block;
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
}
main{
  max-width:800px;
  margin:auto;
  padding:20px 15px 115px;
}
h1,h2,h3{line-height:1.35}
h2{font-size:25px}
h3{font-size:18px}
p{line-height:1.65}
.eyebrow{
  font-size:11px;
  letter-spacing:2px;
  color:var(--olive);
  font-weight:bold;
}
.muted{color:var(--muted);font-size:13px}
.card,.panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  margin:14px 0;
}
.btn{
  border:0;
  border-radius:9px;
  background:var(--olive);
  color:white;
  padding:11px 14px;
  margin:4px 4px 4px 0;
  font-size:13px;
  cursor:pointer;
  touch-action:manipulation;
}
.btn.alt{background:var(--sand);color:var(--brown)}
.btn.danger{background:#f4e2df;color:#88493c}
.btn:disabled{opacity:.35}
.actions{display:flex;flex-wrap:wrap;gap:4px}
.tag{
  display:inline-block;
  padding:5px 9px;
  margin:4px 4px 4px 0;
  border-radius:20px;
  background:#e9eee3;
  color:var(--olive);
  font-size:11px;
}
label{
  display:block;
  margin:11px 0;
  font-size:13px;
  font-weight:600;
}
input,select,textarea{
  display:block;
  width:100%;
  padding:11px;
  margin-top:6px;
  border:1px solid #d3c8b8;
  border-radius:8px;
  background:white;
  color:var(--brown);
  font:inherit;
}
textarea{min-height:80px}
input[type="checkbox"]{width:auto;display:inline}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.short{flex:0 0 120px}
.notice{
  background:#eee9dc;
  border-radius:10px;
  padding:13px;
  font-size:13px;
  line-height:1.7;
  margin:12px 0;
}
.ok{
  background:#e8efe4;
  color:#42613e;
  padding:10px;
  border-radius:8px;
  font-size:12px;
}
.warn{
  background:#fff0e6;
  color:#925333;
  padding:10px;
  border-radius:8px;
  font-size:12px;
}
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:var(--paper);
  border-top:1px solid var(--line);
  z-index:1000;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;
  border:0;
  background:transparent;
  padding:12px 0;
  color:var(--brown);
  font-size:11px;
}
nav button.active{
  background:#e8ede0;
  font-weight:bold;
}
.hero{
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(125deg,#bac6b4,#ead4b7);
  border-radius:11px;
  overflow:hidden;
  font-size:65px;
}
.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.day{
  border-left:5px solid var(--olive);
}
.spot{
  background:#f6f2e9;
  padding:13px;
  border-radius:11px;
  margin:12px 0;
}
.spot-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.travel{
  background:#eee9dc;
  border-left:3px solid #b5a48d;
  padding:9px;
  font-size:12px;
  margin:9px 0;
}
.photo{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:9px;
  margin:9px 0;
}
.map{
  height:360px;
  border-radius:12px;
  margin:14px 0;
  z-index:0;
}
.pin{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid white;
  border-radius:50%;
  color:white;
  font-weight:bold;
  box-shadow:0 2px 5px #0004;
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  font-size:12px;
}
.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:5px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.stat{
  padding:12px 3px;
  text-align:center;
  background:white;
  border:1px solid var(--line);
  border-radius:10px;
}
.stat b{
  display:block;
  font-size:23px;
  color:var(--olive);
}
.stat small{font-size:9px}
.tabs{display:flex;overflow:auto;gap:5px}
.tabs button{white-space:nowrap}
.file-label{
  display:block;
  padding:13px;
  text-align:center;
  border:1px dashed #9c9487;
  border-radius:9px;
  background:#eee9dc;
}
.file-label input{display:none}
.result{
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:12px;
}
.divider{
  border:0;
  border-top:1px solid var(--line);
  margin:23px 0;
}
.preview img{
  display:block;
  width:100%;
  max-width:440px;
  margin:10px auto;
  box-shadow:0 5px 15px #0002;
}
.backup-text{
  min-height:180px;
  font:11px monospace;
}
.template-scrapbook .day{
  box-shadow:4px 4px 0 var(--sand);
  border-radius:3px 15px 8px 15px;
}
.template-minimal .day{
  border-left-width:2px;
  border-radius:3px;
}
.template-magazine h2{
  font-family:Georgia,serif;
}
.filter-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.search-summary{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0;
}
.search-summary span{
  background:#eee9dc;
  border-radius:8px;
  padding:7px 9px;
  font-size:12px;
}
.timeline-item{
  border-left:2px solid #b8c1ad;
  padding:0 0 12px 15px;
  margin-left:9px;
  position:relative;
}
.timeline-item:before{
  content:"";
  position:absolute;
  left:-6px;
  top:4px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--olive);
}
.tool-bar{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin:10px 0;
}
.result-card{
  border-left:4px solid var(--olive);
}
@media(max-width:420px){
  .row{gap:6px}
  .short{flex:0 0 105px}
  .btn{padding:10px;font-size:12px}
}
</style>
</head>

<body>
<header>
  <strong>TUMUGOU</strong>
  <small>あなたの旅が、次の誰かの旅になる。</small>
</header>

<main id="app"></main>
<nav id="nav"></nav>

<script>
'use strict';

/* ==========================================
   TUMUGOU VERSION 1.8
   Compatible with tumugou_v02
========================================== */

const KEY='tumugou_v02';

const COLORS=[
  '#59634a',
  '#b47b59',
  '#66869a',
  '#b49a55',
  '#977d9d'
];

const MODES={
  '':'未設定',
  walk:'🚶 徒歩',
  train:'🚃 電車',
  bus:'🚌 バス',
  car:'🚗 車',
  taxi:'🚕 タクシー',
  bike:'🚲 自転車',
  ferry:'⛴️ 船',
  other:'その他'
};

const STYLES={
  '':'未設定',
  culture:'歴史・文化',
  food:'グルメ',
  nature:'自然・絶景',
  relax:'のんびり',
  active:'アクティブ',
  city:'街歩き'
};

const TEMPLATES={
  scrapbook:'手描きスクラップ',
  magazine:'トラベルマガジン',
  minimal:'シンプル'
};

const KNOWN={
  '清水寺':[34.9949,135.785],
  '祇園で昼食':[35.003,135.778],
  '鴨川散歩':[35.01,135.771],
  '嵐山':[35.0094,135.6668],
  '竹林の小径':[35.017,135.671],
  '京都駅':[34.9858,135.7588],
  '迪化街':[25.0545,121.509],
  '寧夏夜市':[25.0567,121.5153],
  '龍山寺':[25.0372,121.4999],
  '中正紀念堂':[25.0345,121.5219],
  '札幌時計台':[43.0626,141.3535],
  '大通公園':[43.06,141.35],
  '小樽運河':[43.199,141.001],
  '堺町通り':[43.192,141.006]
};

const SAMPLES=[
  {
    id:'kyoto',
    title:'京都、街歩きと喫茶の2日間',
    place:'京都',
    icon:'🍵',
    description:'寺社と喫茶をゆっくり巡る旅。',
    style:'culture',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {
            time:'09:30',
            name:'清水寺',
            stayMinutes:90
          },
          {
            time:'11:25',
            name:'祇園で昼食',
            transport:'walk',
            travelMinutes:25,
            stayMinutes:90
          },
          {
            time:'13:10',
            name:'鴨川散歩',
            transport:'walk',
            travelMinutes:15,
            stayMinutes:60
          }
        ]
      },
      {
        name:'Day 2',
        stops:[
          {
            time:'10:00',
            name:'嵐山',
            stayMinutes:120
          },
          {
            time:'12:15',
            name:'竹林の小径',
            transport:'walk',
            travelMinutes:15,
            stayMinutes:90
          },
          {
            time:'14:20',
            name:'京都駅',
            transport:'train',
            travelMinutes:35,
            stayMinutes:60
          }
        ]
      }
    ]
  },
  {
    id:'taipei',
    title:'台北の街と夜市を楽しむ2日間',
    place:'台北',
    icon:'🏮',
    description:'ローカルグルメと街歩き。',
    style:'food',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {
            time:'11:00',
            name:'迪化街',
            stayMinutes:120
          },
          {
            time:'18:00',
            name:'寧夏夜市',
            transport:'walk',
            travelMinutes:20,
            stayMinutes:120
          }
        ]
      },
      {
        name:'Day 2',
        stops:[
          {
            time:'09:00',
            name:'龍山寺',
            stayMinutes:90
          },
          {
            time:'14:00',
            name:'中正紀念堂',
            transport:'train',
            travelMinutes:30,
            stayMinutes:90
          }
        ]
      }
    ]
  },
  {
    id:'hokkaido',
    title:'札幌・小樽を巡る2日間',
    place:'北海道',
    icon:'🌲',
    description:'海辺の街と北海道グルメ。',
    style:'nature',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {
            time:'10:00',
            name:'札幌時計台',
            stayMinutes:60
          },
          {
            time:'13:00',
            name:'大通公園',
            transport:'walk',
            travelMinutes:15,
            stayMinutes:60
          }
        ]
      },
      {
        name:'Day 2',
        stops:[
          {
            time:'10:00',
            name:'小樽運河',
            stayMinutes:90
          },
          {
            time:'14:00',
            name:'堺町通り',
            transport:'walk',
            travelMinutes:15,
            stayMinutes:90
          }
        ]
      }
    ]
  }
];

/* ==========================================
   STATE
========================================== */

let state={
  plans:[],
  saved:[]
};

try{
  const saved=JSON.parse(localStorage.getItem(KEY));

  if(
    saved &&
    Array.isArray(saved.plans) &&
    Array.isArray(saved.saved)
  ){
    state=saved;
  }
}catch(e){
  console.error(e);
}

const app=document.getElementById('app');
const nav=document.getElementById('nav');

let page='home';
let selected='';
let myTab='planning';

let draft=null;
let editing='';

let map=null;
let exportTrip=null;
let exportIndex=0;

let searchBusy=false;
let lastSearch=0;
let searchResults=[];

let backupText='';
let restoreCandidate=null;

let search={
  q:'',
  days:'',
  style:'',
  status:'',
  minStops:'',
  sort:'recommended'
};

/* ==========================================
   UTILITIES
========================================== */

function uid(){
  return 't'+Date.now().toString(36)
    +Math.random().toString(36).slice(2,9);
}

function esc(v){
  return String(v??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function clone(v){
  return JSON.parse(JSON.stringify(v));
}

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch(e){
    alert(
      '保存に失敗しました。写真の保存容量を確認してください。'
    );
    return false;
  }
}

function update(fn){
  const old=clone(state);
  fn();

  if(!persist()){
    state=old;
    return false;
  }

  return true;
}

function all(){
  return [...SAMPLES,...state.plans];
}

function find(id){
  return all().find(t=>t.id===id);
}

function own(id){
  return state.plans.some(t=>t.id===id);
}

function hasNum(v){
  return v!=='' &&
    v!==null &&
    v!==undefined &&
    Number.isFinite(+v);
}

function coords(p){
  return Array.isArray(p)
    &&p.length===2
    &&p.every(n=>Number.isFinite(+n))
    &&Math.abs(+p[0])<=90
    &&Math.abs(+p[1])<=180;
}

function norm(t){
  const x=clone(t);

  x.status=x.status==='completed'
    ?'completed':'planning';

  x.published=!!x.published;

  x.template=TEMPLATES[x.template]
    ?x.template:'scrapbook';

  x.style=STYLES[x.style]
    ?x.style:'';

  x.schedule=(x.schedule||[]).map((d,i)=>({
    name:d.name||'Day '+(i+1),
    stops:(d.stops||[]).map(s=>({
      ...s,
      uid:s.uid||uid(),
      time:s.time||'09:00',
      name:s.name||'',
      transport:s.transport||'',
      travelMinutes:s.travelMinutes??'',
      stayMinutes:s.stayMinutes??'',
      comment:s.comment||'',
      photo:s.photo||''
    }))
  }));

  x.days=x.schedule.length;

  return x;
}

function stopCount(t){
  return (t.schedule||[]).reduce(
    (n,d)=>n+(d.stops||[]).length,
    0
  );
}

function firstPhoto(t){
  for(const d of t.schedule||[]){
    for(const s of d.stops||[]){
      if(s.photo)return s.photo;
    }
  }
  return '';
}

function statusLabel(t){
  if(SAMPLES.includes(t))return 'サンプル';

  return t.status==='completed'
    ?'実際に行った旅'
    :'旅行計画';
}

function travel(s){
  return [
    MODES[s.transport]||'',
    hasNum(s.travelMinutes)
      ?s.travelMinutes+'分':''
  ].filter(v=>v&&v!=='未設定').join('・')
  ||'移動情報未設定';
}

function timeMin(v){
  if(!/^\d\d:\d\d$/.test(v||''))return null;

  const [h,m]=v.split(':').map(Number);

  if(h>23||m>59)return null;

  return h*60+m;
}

function timeText(n){
  if(!Number.isFinite(n)||n<0||n>=1440){
    return null;
  }

  const h=Math.floor(n/60);
  const m=n%60;

  return String(h).padStart(2,'0')
    +':'
    +String(m).padStart(2,'0');
}

function checkHTML(a,b){
  const x=timeMin(a.time);
  const y=timeMin(b.time);

  if(x===null||y===null){
    return '<p class="muted">時刻未設定</p>';
  }

  if(y<x){
    return '<p class="warn">⚠ 時刻が前後しています</p>';
  }

  if(
    !hasNum(a.stayMinutes) ||
    !hasNum(b.travelMinutes)
  ){
    return '<p class="muted">移動・滞在時間が未設定</p>';
  }

  const gap=y-x
    -(+a.stayMinutes)
    -(+b.travelMinutes);

  return `
    <p class="${gap<0?'warn':'ok'}">
      ${gap<0
        ?'⚠ '+(-gap)+'分不足'
        :'✓ '+gap+'分の余裕'}
    </p>
  `;
}

/* ==========================================
   NAVIGATION
========================================== */

function menu(){
  nav.innerHTML=[
    ['home','HOME','⌂'],
    ['search','SEARCH','⌕'],
    ['my','MY TRIP','♡'],
    ['post','POST','＋']
  ].map(([id,name,icon])=>`
    <button
      class="${page===id?'active':''}"
      data-a="page"
      data-id="${id}">
      ${icon}<br>${name}
    </button>
  `).join('');
}

function go(p,id=''){
  if(map){
    map.remove();
    map=null;
  }

  page=p;
  selected=id;

  window.scrollTo(0,0);

  render();

  if(p==='detail'){
    setTimeout(()=>{
      if(page==='detail'&&selected===id){
        drawMap(find(id));
      }
    },100);
  }
}

function render(){
  menu();

  ({
    home:renderHome,
    search:renderSearch,
    my:renderMy,
    post:renderPost,
    detail:renderDetail,
    edit:renderEditor,
    copy:renderCopy,
    backup:renderBackup,
    export:renderExport
  })[page]?.();
}

/* ==========================================
   CARDS
========================================== */

function hero(t){
  const p=firstPhoto(t);

  return `
    <div class="hero">
      ${p
        ?`<img src="${p}" alt="">`
        :esc(t.icon||'🧳')}
    </div>
  `;
}

function card(t,enhanced=false){
  return `
    <article class="card ${enhanced?'result-card':''}">
      ${hero(t)}

      <div style="margin-top:9px">
        <span class="tag">${esc(t.place)}</span>
        <span class="tag">${t.schedule.length}日間</span>
        <span class="tag">${stopCount(t)}スポット</span>
        <span class="tag">${statusLabel(t)}</span>

        ${t.style?`
          <span class="tag">${esc(STYLES[t.style])}</span>
        `:''}
      </div>

      <h3>${esc(t.title)}</h3>

      <p class="muted">${esc(t.description||'')}</p>

      ${enhanced?`
        <div class="search-summary">
          <span>📍 ${stopCount(t)}カ所</span>
          <span>📅 ${t.schedule.length}日間</span>
          <span>🎨 ${esc(
            STYLES[t.style]||'未設定'
          )}</span>
        </div>

        <p class="muted">
          ${esc(
            t.schedule.flatMap(
              d=>d.stops.map(s=>s.name)
            ).slice(0,5).join(' → ')
          )}
        </p>
      `:''}

      <button
        class="btn"
        data-a="detail"
        data-id="${esc(t.id)}">
        旅程を見る →
      </button>

      ${enhanced?`
        <button
          class="btn alt"
          data-a="copy"
          data-id="${esc(t.id)}">
          この旅程をコピー
        </button>
      `:''}
    </article>
  `;
}

function stats(){
  const c={
    PLANNING:state.plans.filter(
      t=>t.status!=='completed'
    ).length,
    COMPLETED:state.plans.filter(
      t=>t.status==='completed'
    ).length,
    POST:state.plans.filter(
      t=>t.published
    ).length,
    SAVED:state.saved.length
  };

  return `
    <div class="stats">
      ${Object.entries(c).map(([k,v])=>`
        <div class="stat">
          <b>${v}</b>
          <small>${k}</small>
        </div>
      `).join('')}
    </div>
  `;
}

/* ==========================================
   HOME
========================================== */

function renderHome(){
  app.innerHTML=`
    <div class="eyebrow">
      YOUR JOURNEY, OUR STORY
    </div>

    <h2>
      誰かの旅から、<br>
      次の旅がはじまる。
    </h2>

    <p>
      実際の旅程を参考に、
      自分だけの旅を紡いでいこう。
    </p>

    <button class="btn" data-a="new">

function renderResults(){
  const el=document.getElementById(
    'search-results'
  );

  if(!el)return;

  let list=[
    ...SAMPLES,
    ...state.plans.filter(t=>t.published)
  ].filter(t=>{
    const sample=SAMPLES.includes(t);

    const text=[
      t.title,
      t.place,
      t.description,
      ...t.schedule.flatMap(
        d=>d.stops.map(s=>s.name)
      )
    ].join(' ').toLowerCase();

    return (
      text.includes(search.q.toLowerCase())
      &&(
        !search.days
        ||t.schedule.length===+search.days
      )
      &&(
        !search.style
        ||t.style===search.style
      )
      &&(
        !search.minStops
        ||stopCount(t)>=+search.minStops
      )
      &&(
        !search.status
        ||(
          search.status==='sample'
            ?sample
            :!sample
              &&(t.status||'planning')===search.status
        )
      )
    );
  });

  if(search.sort==='stops-desc'){
    list.sort((a,b)=>stopCount(b)-stopCount(a));
  }else if(search.sort==='stops-asc'){
    list.sort((a,b)=>stopCount(a)-stopCount(b));
  }else if(search.sort==='days-asc'){
    list.sort((a,b)=>a.schedule.length-b.schedule.length);
  }else if(search.sort==='days-desc'){
    list.sort((a,b)=>b.schedule.length-a.schedule.length);
  }

  el.innerHTML=`
    <h3>検索結果：${list.length}件</h3>

    ${list.map(t=>card(t,true)).join('')
      ||'<p class="muted">条件に合う旅程がありません。</p>'}
  `;
}

function drawMap(t){
  const el=document.getElementById('trip-map');

  if(!el||!t)return;

  if(typeof L==='undefined'){
    el.textContent='地図を読み込めませんでした。';
    return;
  }

  try{
    map=L.map(el,{
      scrollWheelZoom:false
    });

    L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution:'&copy; OpenStreetMap contributors',
        maxZoom:19
      }
    ).addTo(map);

    const bounds=[];
    let missing=0;

    t.schedule.forEach((d,di)=>{
      const color=COLORS[di%COLORS.length];
      let previous=null;

      d.stops.forEach((s,si)=>{
        const p=coords(s.coords)
          ?s.coords
          :KNOWN[s.name];

        if(!coords(p)){
          missing++;
          previous=null;
          return;
        }

        const pos=p.map(Number);
        bounds.push(pos);

        L.marker(pos,{
          icon:L.divIcon({
            className:'',
            html:`
              <div
                class="pin"
                style="background:${color}">
                ${si+1}
              </div>
            `,
            iconSize:[30,30],
            iconAnchor:[15,15]
          })
        })
        .addTo(map)
        .bindPopup(
          esc(d.name)+' / '+esc(s.name)
        );

        if(previous){
          L.polyline(
            [previous,pos],
            {
              color,
              weight:4,
              opacity:.85
            }
          ).addTo(map);
        }

        previous=pos;
      });
    });

    if(bounds.length){
      map.fitBounds(bounds,{
        padding:[35,35],
        maxZoom:13
      });
    }else{
      map.setView([35.6812,139.7671],5);
    }

    if(missing){
      el.insertAdjacentHTML(
        'afterend',
        `
          <p class="muted">
            位置未登録：${missing}件。
            編集画面で場所を検索してください。
          </p>
        `
      );
    }

    setTimeout(()=>{
      if(map)map.invalidateSize();
    },150);

  }catch(e){
    console.error(e);
    el.textContent='地図表示に失敗しました。';
  }
}

            <img

              src="${s.photo}"

              class="btn danger"

              data-spot="${si}">

          <label class="file-label">

          </label>

          <p class="muted">

          </p>

          <label>
            地図検索キーワード
            <input
              data-field="lookup"
              data-day="${di}"
              data-spot="${si}"
              value="${esc(s.lookup||s.name)}">
          </label>

          <button
            class="btn alt"
            data-a="lookup"
            data-day="${di}"
            data-spot="${si}">
            🔎 場所を検索
          </button>

          <div id="lookup-${di}-${si}"></div>

          <label>
            別のDAYに移動
            <select
              data-move-target="${di}-${si}">

              ${draft.schedule.map((day,j)=>`
                <option
                  value="${j}"
                  ${j===di?'selected':''}>
                  ${esc(day.name)}
                </option>
              `).join('')}
            </select>
          </label>

          <div class="tool-bar">
            <button
              class="btn alt"
              data-a="move-day"
              data-day="${di}"
              data-spot="${si}">
              DAY移動

            <button
              class="btn alt"
              data-a="duplicate"
              data-day="${di}"
              data-spot="${si}">
              📋 複製
            </button>

            <button
              class="btn danger"
              data-a="remove"
              data-day="${di}"
              data-spot="${si}">

      `).join('')}

      <button
        class="btn alt"
        data-a="add"
        data-day="${di}">
        ＋ スポット追加
      </button>
    </section>
  `).join('');
}

/* ==========================================
   EDITOR SYNC
========================================== */

function sync(){
  if(!draft)return;

  for(const [id,key] of [
    ['trip-title','title'],
    ['trip-place','place'],
    ['trip-description','description'],
    ['trip-style','style'],
    ['trip-template','template'],
    ['trip-status','status']
  ]){
    const el=document.getElementById(id);

    if(el)draft[key]=el.value;
  }

  document.querySelectorAll(
    '[data-dayname]'
  ).forEach(el=>{
    const d=draft.schedule[
      +el.dataset.dayname
    ];

    if(d)d.name=el.value;
  });

  document.querySelectorAll(
    '[data-field]'
  ).forEach(el=>{
    const s=draft.schedule[
      +el.dataset.day
    ]?.stops[
      +el.dataset.spot
    ];

    if(!s)return;

    const f=el.dataset.field;

    if(f==='name'&&s.name!==el.value){
      s.name=el.value;
      s.lookup='';
      delete s.coords;
      delete s.locationLabel;
    }else if(f!=='name'){
      s[f]=el.value;
    }
  });
}

function resizeDays(n){
  while(draft.schedule.length<n){
    draft.schedule.push({
      name:'Day '+(draft.schedule.length+1),
      stops:[newSpot()]
    });
  }

  draft.schedule.length=n;
  draft.days=n;
}

function dayAdd(){
  sync();

  if(draft.schedule.length>=14){
    alert('最大14日間です。');
    return;
  }

  resizeDays(draft.schedule.length+1);
  renderDays();
}

function dayDelete(di){
  sync();

  if(draft.schedule.length<=1)return;

  if(!confirm(
    'このDAYとすべてのスポットを削除しますか？'
  ))return;

  draft.schedule.splice(di,1);
  renderDays();
}

function daySwap(di,delta){
  sync();

  const j=di+delta;

  if(j<0||j>=draft.schedule.length)return;

  [
    draft.schedule[di],
    draft.schedule[j]
  ]=[
    draft.schedule[j],
    draft.schedule[di]
  ];

  renderDays();
}

function resetIncoming(a,i){
  if(a[i]){
    a[i].transport='';
    a[i].travelMinutes='';
  }
}

function add(di){
  sync();

  draft.schedule[di].stops.push(newSpot());
  renderDays();
}

function remove(di,si){
  sync();

  if(!confirm(
    'このスポットを削除しますか？'
  ))return;

  const a=draft.schedule[di].stops;

  a.splice(si,1);

  resetIncoming(a,si);
  resetIncoming(a,0);

  renderDays();
}

function move(di,si,delta){
  sync();

  const a=draft.schedule[di].stops;
  const j=si+delta;

  if(j<0||j>=a.length)return;

  [a[si],a[j]]=[a[j],a[si]];

  [si,si+1,j,j+1,0].forEach(
    i=>resetIncoming(a,i)
  );

  renderDays();

  alert(
    '順番を変更しました。移動情報を再確認してください。'
  );
}

function moveDay(di,si){
  sync();

  const target=+document.querySelector(
    `[data-move-target="${di}-${si}"]`
  )?.value;

  if(
    !Number.isInteger(target)
    ||target===di
    ||!draft.schedule[target]
  ){
    alert('別のDAYを選択してください。');
    return;
  }

  const from=draft.schedule[di].stops;
  const to=draft.schedule[target].stops;

  const [s]=from.splice(si,1);

  resetIncoming(from,si);
  resetIncoming(from,0);

  s.transport='';
  s.travelMinutes='';

  to.push(s);
  resetIncoming(to,0);

  renderDays();

  alert(
    'DAYを移動しました。移動時間を確認してください。'
  );
}

/* ==========================================
   DUPLICATE SPOT ver.1.6
========================================== */

function duplicateSpot(di,si){
  sync();

  const a=draft.schedule[di].stops;
  const original=a[si];

  if(!original)return;

  const copy=clone(original);

  copy.uid=uid();
  copy.transport='';
  copy.travelMinutes='';

  a.splice(si+1,0,copy);

  resetIncoming(a,si+2);

  renderDays();

  alert(
    'スポットを複製しました。時刻と移動情報を調整してください。'
  );
}

/* ==========================================
   AUTO TIME CALCULATION ver.1.7
========================================== */

function calculateDay(di){
  sync();

  const d=draft.schedule[di];

  if(!d||d.stops.length<2){
    alert(
      'スポットを2件以上登録してください。'
    );
    return;
  }

  const first=timeMin(d.stops[0].time);

  if(first===null){
    alert(
      '最初のスポットの時刻を設定してください。'
    );
    return;
  }

  let current=first;
  const calculated=[];

  for(let i=1;i<d.stops.length;i++){
    const previous=d.stops[i-1];
    const next=d.stops[i];

    if(
      !hasNum(previous.stayMinutes)
      ||!hasNum(next.travelMinutes)
    ){
      alert(
        'スポット'+i+'の滞在時間、またはスポット'
        +(i+1)+'への移動時間が未入力です。'
      );
      return;
    }

    const stay=+previous.stayMinutes;
    const travelMinutes=+next.travelMinutes;

    if(
      !Number.isInteger(stay)
      ||!Number.isInteger(travelMinutes)
      ||stay<0
      ||travelMinutes<0
    ){
      alert('時間は0以上の整数で入力してください。');
      return;
    }

    current+=stay+travelMinutes;

    const result=timeText(current);

    if(!result){
      alert(
        '計算結果が翌日にまたがります。'
        +'DAYを分けてください。'
      );
      return;
    }

    calculated.push(result);
  }

  if(!confirm(
    'DAY '+(di+1)
    +'の2件目以降の到着時刻を自動計算します。'
    +'現在の時刻を上書きしてよいですか？'
  ))return;

  calculated.forEach((v,i)=>{
    d.stops[i+1].time=v;
  });

  renderDays();

  const box=document.getElementById(
    'check-'+di
  );

  if(box){
    box.innerHTML=`
      <p class="ok">
        ✓ 到着時刻を自動計算しました。
        保存ボタンを押すと確定します。
      </p>
    `;
  }
}

function checkDay(di){
  sync();

  const a=draft.schedule[di].stops;

  document.getElementById(
    'check-'+di
  ).innerHTML=a.slice(1).map((s,i)=>`
    <p>${i+1} → ${i+2}</p>
    ${checkHTML(a[i],s)}
  `).join('')
  ||'<p class="muted">スポットが2件以上必要です。</p>';
}

/* ==========================================
   LOCATION SEARCH
========================================== */

function spotByUid(id){
  for(const d of draft?.schedule||[]){
    for(const s of d.stops){
      if(s.uid===id)return s;
    }
  }
  return null;
}

async function lookup(di,si){
  sync();

  const s=draft.schedule[di]?.stops[si];
  const el=document.getElementById(
    `lookup-${di}-${si}`
  );

  if(!s||!el)return;

  const q=(s.lookup||s.name).trim();

  if(!q){
    el.textContent='検索語を入力してください。';
    return;
  }

  if(
    searchBusy
    ||Date.now()-lastSearch<1300
  ){
    el.textContent=
      '少し時間を空けて再検索してください。';
    return;
  }

  searchBusy=true;
  lastSearch=Date.now();

  const spotId=s.uid;

  el.textContent='検索中...';

  try{
    const params=new URLSearchParams({
      format:'jsonv2',
      q,
      limit:'10',
      addressdetails:'1',
      'accept-language':'ja,en'
    });

    const res=await fetch(
      'https://nominatim.openstreetmap.org/search?'
      +params,
      {
        headers:{
          Accept:'application/json'
        }
      }
    );

    if(!res.ok)throw Error(res.status);

    const data=await res.json();

    if(!spotByUid(spotId))return;

    searchResults=data.map(x=>({
      name:x.display_name,
      coords:[+x.lat,+x.lon]
    })).filter(x=>coords(x.coords));

    const target=document.getElementById(
      `lookup-${di}-${si}`
    );

    if(target){
      target.innerHTML=searchResults.map((r,i)=>`
        <div class="result">
          ${esc(r.name)}
          <br>

          <button
            class="btn alt"
            data-a="choose"
            data-index="${i}"
            data-uid="${esc(spotId)}">
            この場所を選択
          </button>
        </div>
      `).join('')
      ||'<p>候補がありません。</p>';
    }

  }catch(e){
    el.textContent='検索に失敗しました。';
  }finally{
    searchBusy=false;
  }
}

function choose(i,id){
  const s=spotByUid(id);
  const r=searchResults[i];

  if(!s||!r)return;

  sync();

  s.coords=r.coords;
  s.locationLabel=r.name;

  searchResults=[];

  renderDays();
}

/* ==========================================
   PHOTO
========================================== */

async function photo(file,di,si){
  if(
    !file
    ||!file.type.startsWith('image/')
  ){
    alert('画像を選択してください。');
    return;
  }

  if(file.size>20*1024*1024){
    alert('20MB以下の画像を選択してください。');
    return;
  }

  sync();

  const spotId=draft.schedule[di]
    ?.stops[si]?.uid;

  try{
    const url=URL.createObjectURL(file);
    const img=new Image();

    try{
      await new Promise((ok,fail)=>{
        img.onload=ok;
        img.onerror=fail;
        img.src=url;
      });
    }finally{
      URL.revokeObjectURL(url);
    }

    const ratio=Math.min(
      1,
      900/Math.max(img.width,img.height)
    );

    const c=document.createElement('canvas');

    c.width=Math.max(
      1,
      Math.round(img.width*ratio)
    );

    c.height=Math.max(
      1,
      Math.round(img.height*ratio)
    );

    const ctx=c.getContext('2d');

    ctx.fillStyle='white';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);

    const s=spotByUid(spotId);

    if(s){
      s.photo=c.toDataURL('image/jpeg',.65);
      renderDays();

      alert(
        '写真を追加しました。旅程を保存してください。'
      );
    }

  }catch(e){
    alert('写真を読み込めませんでした。');
  }
}

/* ==========================================
   SAVE / DELETE / STATUS
========================================== */

function saveTrip(){
  sync();

  if(
    !draft.title.trim()
    ||!draft.place.trim()
  ){
    alert('タイトルと目的地を入力してください。');
    return;
  }

  if(
    !draft.schedule.some(d=>d.stops.length)
    ||draft.schedule.some(
      d=>d.stops.some(s=>!s.name.trim())
    )
  ){
    alert(
      'スポットを1件以上入力し、空欄をなくしてください。'
    );
    return;
  }

  for(const d of draft.schedule){
    for(const s of d.stops){
      for(const v of [
        s.travelMinutes,
        s.stayMinutes
      ]){
        if(
          v!==''&&v!=null
          &&(
            !Number.isInteger(+v)
            ||+v<0
          )
        ){
          alert(
            '時間は0以上の整数で入力してください。'
          );
          return;
        }
      }
    }
  }

  const t=norm(draft);

  if(draft.publishAfterSave){
    t.published=true;
  }

  delete t.publishAfterSave;

  if(editing&&!own(editing)){
    alert('編集対象がありません。');
    return;
  }

  if(!update(()=>{
    if(editing){
      const i=state.plans.findIndex(
        x=>x.id===editing
      );

      state.plans[i]=t;
    }else{
      state.plans.unshift(t);
    }
  }))return;

  draft=null;
  editing='';

  go('detail',t.id);
}

function deleteTrip(id){
  const t=state.plans.find(
    x=>x.id===id
  );

  if(
    !t
    ||!confirm(
      '「'+t.title+'」を削除しますか？'
    )
  )return;

  if(update(()=>{
    state.plans=state.plans.filter(
      x=>x.id!==id
    );

    state.saved=state.saved.filter(
      x=>x!==id
    );
  })){
    go('my');
  }
}

function setStatus(id,status){
  const t=state.plans.find(
    x=>x.id===id
  );

  if(!t)return;

  if(
    status==='completed'
    &&!confirm(
      '実際に行った旅として記録しますか？'
    )
  )return;

  if(update(()=>{
    t.status=status;
  })){
    myTab=status;
    go('my');
  }
}

function publish(id,value){
  const t=state.plans.find(
    x=>x.id===id
  );

  if(!t)return;

  if(
    value
    &&!confirm(
      '公開しますか？ 現在はこのブラウザ内のみの公開です。'
    )
  )return;

  if(update(()=>{
    t.published=value;
  })){
    if(page==='detail'){
      go('detail',id);
    }else{
      render();
    }
  }
}

function bookmark(id){
  if(update(()=>{
    state.saved=state.saved.includes(id)
      ?state.saved.filter(x=>x!==id)
      :[...state.saved,id];
  })){
    go('detail',id);
  }
}

   BACKUP

function renderBackup(){
  app.innerHTML=`
    <h2>バックアップ・復元</h2>

    ${stats()}

    <div class="notice">
      写真を含むバックアップは非常に長くなります。
      コピーしてメモアプリ等に保管してください。
    </div>

    <section class="panel">
      <h3>① バックアップ</h3>

      <button
        class="btn"
        data-a="backup-create">
        バックアップを作成
      </button>

      <textarea
        id="backup-output"
        class="backup-text"
        readonly>${esc(backupText)}</textarea>

      <button
        class="btn alt"
        data-a="backup-copy">
        テキストをコピー
      </button>
    </section>

    <section class="panel">
      <h3>② 復元</h3>

      <textarea
        id="restore-input"
        class="backup-text"
        placeholder="バックアップテキストを貼り付け"></textarea>

      <button
        class="btn alt"
        data-a="restore-preview">
        データを確認
      </button>

      <div id="restore-preview"></div>
    </section>
  `;
}

function createBackup(){
  backupText=JSON.stringify({
    app:'TUMUGOU',
    backupVersion:1,
    exportedAt:new Date().toISOString(),
    data:clone(state)
  },null,2);

  document.getElementById(
    'backup-output'
  ).value=backupText;
}

async function copyBackup(){
  const el=document.getElementById(
    'backup-output'
  );

  if(!el?.value){
    alert('先にバックアップを作成してください。');
    return;
  }

  try{
    await navigator.clipboard.writeText(
      el.value
    );

    alert('コピーしました。');

  }catch(e){
    el.focus();
    el.select();

    alert(
      '選択したテキストを手動でコピーしてください。'
    );
  }
}

function validTrip(t){
  return t
    &&typeof t.id==='string'
    &&!!t.id
    &&typeof t.title==='string'
    &&typeof t.place==='string'
    &&Array.isArray(t.schedule)
    &&t.schedule.length>=1
    &&t.schedule.length<=14
    &&t.schedule.every(d=>
      d
      &&Array.isArray(d.stops)
      &&d.stops.length<=500
      &&d.stops.every(s=>
        s
        &&typeof s.name==='string'
        &&typeof s.time==='string'
        &&(
          s.coords===undefined
          ||coords(s.coords)
        )
        &&(
          s.photo===undefined
          ||(
            typeof s.photo==='string'
            &&(
              !s.photo
              ||/^data:image\/jpeg;base64,/.test(s.photo)
            )
          )
        )
      )
    );
}

function previewRestore(){
  const raw=document.getElementById(
    'restore-input'
  )?.value.trim()||'';

  const el=document.getElementById(
    'restore-preview'
  );

  restoreCandidate=null;

  try{
    if(raw.length>15000000){
      throw Error(
        'バックアップが大きすぎます。'
      );
    }

    const v=JSON.parse(raw);

    if(
      v.app!=='TUMUGOU'
      ||v.backupVersion!==1
      ||!v.data
      ||!Array.isArray(v.data.plans)
      ||!Array.isArray(v.data.saved)
    ){
      throw Error(
        '対応していないデータです。'
      );
    }

    if(
      v.data.plans.length>1000
      ||v.data.saved.length>2000
      ||!v.data.plans.every(validTrip)
      ||!v.data.saved.every(
        x=>typeof x==='string'
      )
    ){
      throw Error(
        '旅程データが正しくありません。'
      );
    }

    const ids=v.data.plans.map(t=>t.id);

    if(new Set(ids).size!==ids.length){
      throw Error(
        '重複した旅程IDがあります。'
      );
    }

    restoreCandidate=v;

    const existing=new Set(
      state.plans.map(t=>t.id)
    );

    el.innerHTML=`
      <p class="ok">
        ✓ バックアップを確認しました。
      </p>

      <p>
        旅程：${ids.length}件／
        既存と重複：
        ${ids.filter(
          id=>existing.has(id)
        ).length}件
      </p>

      <label>
        復元方法
        <select id="restore-mode">
          <option value="merge">
            既存データに追加（重複を除く）
          </option>

          <option value="replace">
            既存データを置き換え
          </option>
        </select>
      </label>

      <button
        class="btn danger"
        data-a="restore-confirm">
        復元を実行
      </button>
    `;

  }catch(e){
    el.innerHTML=`
      <p class="warn">
        ${esc(e.message)}
      </p>
    `;
  }
}

function restoreData(){
  if(!restoreCandidate)return;

  const mode=document.getElementById(
    'restore-mode'
  )?.value||'merge';

  if(!confirm(
    mode==='replace'
      ?'現在のデータを置き換えます。実行しますか？'
      :'重複を除いて追加します。実行しますか？'
  ))return;

  const data=restoreCandidate.data;

  if(update(()=>{
    if(mode==='replace'){
      state.plans=data.plans.map(norm);
      state.saved=[
        ...new Set(data.saved)
      ];
    }else{
      const ids=new Set(
        state.plans.map(t=>t.id)
      );

      state.plans.push(
        ...data.plans
          .filter(t=>!ids.has(t.id))
          .map(norm)
      );

      state.saved=[
        ...new Set([
          ...state.saved,
          ...data.saved
        ])
      ];
    }
  })){
    restoreCandidate=null;
    alert('復元しました。');
    go('my');
  }
}

function lines(ctx,text,width){
  let out=[];
  let line='';

  for(const ch of String(text||'')){
    if(ch==='\n'){
      out.push(line);
      line='';
      continue;
    }

    if(
      line
      &&ctx.measureText(line+ch).width>width
    ){
      out.push(line);
      line=ch;
    }else{
      line+=ch;
    }
  }

  if(line)out.push(line);

  return out;
}

function drawLines(
  ctx,text,x,y,w,step,max=3
){
  const a=lines(ctx,text,w);

  a.slice(0,max).forEach((v,i)=>{
    ctx.fillText(v,x,y+i*step);
  });
}

async function imageOf(src){
  return new Promise(resolve=>{
    if(!src)return resolve(null);

    const img=new Image();

    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src=src;
  });
}

function coverImage(ctx,img,x,y,w,h){
  if(!img)return;

  const scale=Math.max(
    w/img.width,
    h/img.height
  );

  const sw=w/scale;
  const sh=h/scale;

  ctx.drawImage(
    img,
    (img.width-sw)/2,
    (img.height-sh)/2,
    sw,sh,
    x,y,w,h
  );
}

async function drawExport(){
  const t=exportTrip;
  const index=exportIndex;

  const el=document.getElementById(
    'export-preview'
  );

  if(!t||!el)return;

  const c=document.createElement('canvas');

  c.width=1080;
  c.height=1350;

  const ctx=c.getContext('2d');

  ctx.fillStyle='#f8f5ee';
  ctx.fillRect(0,0,1080,1350);

  ctx.fillStyle='#59634a';
  ctx.fillRect(0,0,1080,14);

  ctx.fillStyle='#493c30';
  ctx.font='bold 42px Georgia,serif';

  ctx.fillText('TUMUGOU',65,90);

  ctx.font='22px sans-serif';

  ctx.fillText(
    'あなたの旅が、次の誰かの旅になる。',
    65,130
  );

  ctx.strokeStyle='#d9cfc0';
  ctx.beginPath();
  ctx.moveTo(65,160);
  ctx.lineTo(1015,160);
  ctx.stroke();

  if(index===0){
    const img=await imageOf(firstPhoto(t));

    if(img){
      coverImage(
        ctx,img,
        65,195,950,640
      );
    }else{
      ctx.fillStyle='#d9decf';
      ctx.fillRect(65,195,950,640);

      ctx.font='170px sans-serif';
      ctx.textAlign='center';
      ctx.fillStyle='#493c30';

      ctx.fillText(
        t.icon||'🧳',
        540,585
      );

      ctx.textAlign='left';
    }

    ctx.fillStyle='#59634a';
    ctx.font='bold 28px sans-serif';

    ctx.fillText(
      t.place+' / '
      +t.schedule.length+' DAYS',
      70,925
    );

    ctx.fillStyle='#493c30';
    ctx.font='bold 64px sans-serif';

    drawLines(
      ctx,t.title,
      70,1020,930,82,3
    );

    ctx.font='25px sans-serif';

    drawLines(
      ctx,t.description,
      70,1220,930,34,2
    );

  }else if(index===1){
    ctx.fillStyle='#59634a';
    ctx.font='bold 32px sans-serif';

    ctx.fillText(
      'OUR TRAVEL ROUTE',
      65,230
    );

    ctx.fillStyle='#493c30';
    ctx.font='bold 50px sans-serif';

    ctx.fillText(
      '旅の全体ルート',
      65,310
    );

    let y=365;

    for(
      let di=0;
      di<t.schedule.length;
      di++
    ){
      if(y>1180)break;

      const d=t.schedule[di];

      ctx.fillStyle=
        COLORS[di%COLORS.length];

      ctx.fillRect(65,y,950,54);

      ctx.fillStyle='white';
      ctx.font='bold 26px sans-serif';

      ctx.fillText(
        d.name,
        90,y+36
      );

      y+=73;

      for(
        let si=0;
        si<d.stops.length;
        si++
      ){
        if(y>1200)break;

        const s=d.stops[si];

        ctx.fillStyle='#493c30';
        ctx.font='26px sans-serif';

        drawLines(
          ctx,
          (si+1)+'. '+s.time+'  '+s.name,
          90,y+25,900,33,1
        );

        y+=49;
      }

      y+=20;
    }

    ctx.fillStyle='#817768';
    ctx.font='20px sans-serif';

    ctx.fillText(
      '訪問順の一覧です。地理的な地図ではありません。',
      65,1300
    );

  }else{
    const di=index-2;
    const d=t.schedule[di];

    ctx.fillStyle=
      COLORS[di%COLORS.length];

    ctx.font='bold 35px sans-serif';

    ctx.fillText(
      'DAY '+(di+1),
      65,235
    );

    ctx.fillStyle='#493c30';
    ctx.font='bold 49px sans-serif';

    ctx.fillText(
      d.name,
      65,310
    );

    let y=360;

    for(
      let si=0;
      si<d.stops.length;
      si++
    ){
      if(y>1180)break;

      const s=d.stops[si];
      const h=s.photo?255:140;

      ctx.fillStyle='#fffefa';
      ctx.fillRect(65,y,950,h);

      ctx.fillStyle=
        COLORS[di%COLORS.length];

      ctx.fillRect(65,y,8,h);

      ctx.font='bold 28px sans-serif';

      ctx.fillText(
        s.time,
        95,y+45
      );

      ctx.fillStyle='#493c30';
      ctx.font='bold 30px sans-serif';

      drawLines(
        ctx,
        (si+1)+'. '+s.name,
        260,y+45,710,38,2
      );

      if(s.photo){
        const img=await imageOf(s.photo);

        if(img){
          coverImage(
            ctx,img,
            95,y+95,395,135
          );
        }

        ctx.fillStyle='#817768';
        ctx.font='21px sans-serif';

        drawLines(
          ctx,s.comment,
          515,y+120,450,30,3
        );

      }else if(s.comment){
        ctx.fillStyle='#817768';
        ctx.font='21px sans-serif';

        drawLines(
          ctx,s.comment,
          260,y+105,700,29,2
        );
      }

      y+=h+18;

      if(si<d.stops.length-1){
        ctx.fillStyle='#817768';
        ctx.font='20px sans-serif';

        ctx.fillText(
          '↓ '+travel(d.stops[si+1]),
          95,y+10
        );

        y+=45;
      }
    }
  }

  ctx.fillStyle='#493c30';
  ctx.font='22px Georgia,serif';
  ctx.textAlign='right';

  ctx.fillText(
    'TUMUGOU • '
    +(index+1)
    +' / '
    +(t.schedule.length+2),
    1010,1320
  );

  if(
    page!=='export'
    ||exportIndex!==index
  )return;

  const img=document.createElement('img');

  img.alt='Instagram投稿用画像';
  img.src=c.toDataURL('image/png');

  el.innerHTML='';
  el.appendChild(img);

  document.getElementById(
    'export-count'
  ).textContent=
    (index+1)
    +' / '
    +(t.schedule.length+2);
}

function exportMove(delta){
  if(!exportTrip)return;

  exportIndex=Math.max(
    0,
    Math.min(
      exportTrip.schedule.length+1,
      exportIndex+delta
    )
  );

  renderExport();
}

/* ==========================================
   BUTTON EVENTS
========================================== */

document.addEventListener('click',e=>{
  const b=e.target.closest(
    'button[data-a]'
  );

  if(!b)return;

  const a=b.dataset.a;
  const id=b.dataset.id;
  const di=+b.dataset.day;
  const si=+b.dataset.spot;

  if(a==='page'){
    go(id);

  }else if(a==='tab'){
    myTab=id;
    render();

  }else if(a==='detail'){
    go('detail',id);

  }else if(a==='new'){
    openNew(false);

  }else if(a==='new-publish'){
    openNew(true);

  }else if(a==='edit'){
    openEdit(id);

  }else if(a==='copy'){
    openCopy(id);

  }else if(a==='copy-next'){
    copyNext();

  }else if(a==='day-add'){
    dayAdd();

  }else if(a==='day-delete'){
    dayDelete(di);

  }else if(a==='day-up'){
    daySwap(di,-1);

  }else if(a==='day-down'){
    daySwap(di,1);

  }else if(a==='add'){
    add(di);

  }else if(a==='remove'){
    remove(di,si);

  }else if(a==='up'){
    move(di,si,-1);

  }else if(a==='down'){
    move(di,si,1);

  }else if(a==='move-day'){
    moveDay(di,si);

  }else if(a==='duplicate'){
    duplicateSpot(di,si);

  }else if(a==='calculate'){
    calculateDay(di);

  }else if(a==='check'){
    checkDay(di);

  }else if(a==='lookup'){
    lookup(di,si);

  }else if(a==='choose'){
    choose(
      +b.dataset.index,
      b.dataset.uid
    );

  }else if(a==='remove-photo'){
    sync();

    const s=draft.schedule[di]
      ?.stops[si];

    if(
      s
      &&confirm('写真を削除しますか？')
    ){
      s.photo='';
      renderDays();
    }

  }else if(a==='save-trip'){
    saveTrip();

  }else if(a==='delete'){
    deleteTrip(id);

  }else if(a==='complete'){
    setStatus(id,'completed');

  }else if(a==='planning'){
    setStatus(id,'planning');

  }else if(a==='publish'){
    publish(id,true);

  }else if(a==='unpublish'){
    publish(id,false);

  }else if(a==='bookmark'){
    bookmark(id);

  }else if(a==='backup-create'){
    createBackup();

  }else if(a==='backup-copy'){
    copyBackup();

  }else if(a==='restore-preview'){
    previewRestore();

  }else if(a==='restore-confirm'){
    restoreData();

  }else if(a==='export'){
    openExport(id);

  }else if(a==='export-prev'){
    exportMove(-1);

  }else if(a==='export-next'){
    exportMove(1);

  }else if(a==='reset-search'){
    search={
      q:'',
      days:'',
      style:'',
      status:'',
      minStops:'',
      sort:'recommended'
    };

    renderSearch();
  }
});

/* ==========================================
   INPUT EVENTS
========================================== */

document.addEventListener('input',e=>{
  if(e.target.id==='search-q'){
    search.q=e.target.value;
    renderResults();
  }

  if(e.target.id==='restore-input'){
    restoreCandidate=null;

    const el=document.getElementById(
      'restore-preview'
    );

    if(el)el.innerHTML='';
  }

  if(e.target.dataset.field==='name'){
    const s=draft?.schedule[
      +e.target.dataset.day
    ]?.stops[
      +e.target.dataset.spot
    ];

    if(s&&s.name!==e.target.value){
      s.name=e.target.value;
      s.lookup='';

      delete s.coords;
      delete s.locationLabel;

      const box=e.target.closest('.spot');

      const input=box?.querySelector(
        '[data-field="lookup"]'
      );

      if(input)input.value=s.name;

      const res=box?.querySelector(
        '[id^="lookup-"]'
      );

      if(res)res.innerHTML='';
    }
  }
});

/* ==========================================
   CHANGE EVENTS
========================================== */

document.addEventListener('change',async e=>{
  if([
    'search-days',
    'search-style',
    'search-status',
    'search-minStops',
    'search-sort'
  ].includes(e.target.id)){

    search[
      e.target.id.replace('search-','')
    ]=e.target.value;

    renderResults();

  }else if(e.target.id==='export-index'){
    exportIndex=+e.target.value;
    renderExport();

  }else if(e.target.dataset.photo){
    await photo(
      e.target.files?.[0],
      +e.target.dataset.day,
      +e.target.dataset.spot
    );
  }
});

/* ==========================================
   START
========================================== */

render();
