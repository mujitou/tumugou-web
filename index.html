<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TUMUGOU | 旅を紡ぐ</title>
  <style>
    body {
      margin: 0;
      background: #F8F5EE;
      color: #443B32;
      font-family: sans-serif;
      text-align: center;
    }
    header {
      background: #59634A;
      color: white;
      padding: 30px 15px;
    }
    h1 { letter-spacing: 4px; }
    main { padding: 50px 20px; }
    button {
      background: #59634A;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>TUMUGOU</h1>
    <p>誰かの旅が、次の誰かの旅になる。</p>
  </header>

  <main>
    <h2>旅を紡ぎ、人生を豊かに。</h2>
    <p>あなたの次の旅を、ここから。</p>
    <button onclick="alert('TUMUGOUへようこそ！')">
      旅を探す
    </button>
  </main>
</body>
</html>
