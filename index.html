<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#59634a">
<title>TUMUGOU ver.1.5</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --ivory:#f8f5ee;
  --sand:#e9dfcc;
  --brown:#493c30;
  --olive:#59634a;
  --line:#ddd3c4;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ivory);
  color:var(--brown);
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN",sans-serif;
}
header{
  text-align:center;
  padding:23px 10px;
  border-bottom:1px solid var(--line);
}
header strong{
  font:bold 34px Georgia,serif;
  letter-spacing:5px;
}
header small{
  display:block;
  color:#82776a;
  margin-top:7px;
}
main{
  max-width:760px;
  margin:auto;
  padding:20px 15px 115px;
}
h2{font-size:25px}
h3{font-size:18px}
p{line-height:1.65}
.muted{color:#817768;font-size:13px}
.eyebrow{
  font-size:11px;
  letter-spacing:2px;
  color:var(--olive);
  font-weight:bold;
}
.card,.panel{
  background:#fffefa;
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  margin:14px 0;
  overflow:hidden;
}
.hero{
  height:180px;
  border-radius:10px;
  background:linear-gradient(125deg,#bac6b4,#ead4b7);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  overflow:hidden;
}
.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.btn{
  border:0;
  border-radius:9px;
  background:var(--olive);
  color:white;
  padding:11px 13px;
  margin:4px 4px 4px 0;
  font-size:13px;
  cursor:pointer;
  touch-action:manipulation;
}
.alt{background:var(--sand);color:var(--brown)}
.danger{background:#f4e2df;color:#88493c}
.btn:disabled{opacity:.4}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
}
.tag{
  display:inline-block;
  background:#e9eee3;
  color:var(--olive);
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  margin:7px 4px 3px 0;
}
label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin:11px 0;
}
input,select,textarea{
  display:block;
  width:100%;
  padding:10px;
  margin-top:6px;
  border:1px solid #d3c8b8;
  border-radius:8px;
  background:white;
  color:var(--brown);
  font:inherit;
}
textarea{min-height:75px}
.notice{
  background:#eee9dc;
  border-radius:10px;
  padding:12px;
  font-size:13px;
  line-height:1.6;
  margin:12px 0;
}
.warn{
  background:#fff0e6;
  color:#925333;
  padding:10px;
  border-radius:8px;
  font-size:12px;
}
.ok{
  background:#e8efe4;
  color:#42613e;
  padding:10px;
  border-radius:8px;
  font-size:12px;
}
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:#fffefa;
  border-top:1px solid var(--line);
  z-index:1000;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;
  border:0;
  background:transparent;
  padding:12px 0;
  font-size:11px;
  color:var(--brown);
}
nav button.active{
  background:#e8ede0;
  font-weight:bold;
}
.tabs{
  display:flex;
  gap:5px;
  overflow:auto;
}
.tabs .btn{white-space:nowrap}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}
.stat{
  text-align:center;
  background:white;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 2px;
}
.stat b{
  display:block;
  font-size:23px;
  color:var(--olive);
}
.stat small{font-size:9px}
.day{border-left:5px solid var(--olive)}
.spot{
  background:#f6f2e9;
  padding:12px;
  border-radius:11px;
  margin:10px 0;
}
.photo{
  width:100%;
  max-height:240px;
  object-fit:cover;
  border-radius:9px;
  margin:7px 0;
}
.row{display:flex;gap:9px}
.row>*{flex:1;min-width:0}
.row .short{flex:0 0 110px}
.travel{
  background:#eee9dc;
  padding:9px;
  border-left:3px solid #b5a48d;
  font-size:12px;
  margin:8px 0;
}
.map{
  height:350px;
  border-radius:12px;
  margin:14px 0;
  z-index:0;
}
.pin{
  width:29px;
  height:29px;
  border:2px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
  box-shadow:0 2px 5px #0004;
}
.arrow{
  background:white;
  border-radius:50%;
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  font-size:12px;
}
.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:5px;
}
.template-scrapbook .day{
  box-shadow:4px 4px 0 #e9dfcc;
  border-radius:3px 15px 8px 15px;
}
.template-minimal .day{
  border-left-width:2px;
  border-radius:3px;
}
.template-magazine h2{
  font-family:Georgia,serif;
}
.file-label{
  display:block;
  border:1px dashed #9c9487;
  padding:12px;
  text-align:center;
  border-radius:9px;
  background:#eee9dc;
  cursor:pointer;
}
.file-label input{display:none}
.result{
  border-bottom:1px solid var(--line);
  padding:9px 0;
  font-size:12px;
}
.preview img{
  width:100%;
  max-width:420px;
  display:block;
  margin:10px auto;
  box-shadow:0 5px 15px #0002;
}
.backup-text{
  font-size:11px;
  min-height:170px;
  font-family:monospace;
}
.divider{
  border:0;
  border-top:1px solid var(--line);
  margin:20px 0;
}
</style>
</head>

<body>
<header>
  <strong>TUMUGOU</strong>
  <small>あなたの旅が、次の誰かの旅になる。</small>
</header>

<main id="app"></main>
<nav id="nav"></nav>

<script>
'use strict';

const KEY='tumugou_v02';

const COLORS=[
  '#59634a',
  '#b47b59',
  '#66869a',
  '#b49a55',
  '#977d9d'
];

const MODES={
  '':'未設定',
  walk:'🚶 徒歩',
  train:'🚃 電車',
  bus:'🚌 バス',
  car:'🚗 車',
  taxi:'🚕 タクシー',
  bike:'🚲 自転車',
  ferry:'⛴️ 船',
  other:'その他'
};

const STYLES={
  '':'未設定',
  culture:'歴史・文化',
  food:'グルメ',
  nature:'自然・絶景',
  relax:'のんびり',
  active:'アクティブ',
  city:'街歩き'
};

const TEMPLATES={
  scrapbook:'手描きスクラップ',
  magazine:'トラベルマガジン',
  minimal:'シンプル'
};

const KNOWN={
  '清水寺':[34.9949,135.785],
  '祇園で昼食':[35.003,135.778],
  '鴨川散歩':[35.01,135.771],
  '嵐山':[35.0094,135.6668],
  '竹林の小径':[35.017,135.671],
  '京都駅':[34.9858,135.7588],
  '迪化街':[25.0545,121.509],
  '寧夏夜市':[25.0567,121.5153],
  '龍山寺':[25.0372,121.4999],
  '中正紀念堂':[25.0345,121.5219],
  '札幌時計台':[43.0626,141.3535],
  '大通公園':[43.06,141.35],
  '小樽運河':[43.199,141.001],
  '堺町通り':[43.192,141.006]
};

const SAMPLES=[
  {
    id:'kyoto',
    title:'京都、街歩きと喫茶の2日間',
    place:'京都',
    icon:'🍵',
    description:'寺社と喫茶をゆっくり巡る旅。',
    style:'culture',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {time:'09:30',name:'清水寺'},
          {
            time:'12:00',
            name:'祇園で昼食',
            transport:'walk',
            travelMinutes:25
          },
          {
            time:'15:00',
            name:'鴨川散歩',
            transport:'walk',
            travelMinutes:15
          }
        ]
      },
      {
        name:'Day 2',
        stops:[
          {time:'10:00',name:'嵐山'},
          {
            time:'13:00',
            name:'竹林の小径',
            transport:'walk',
            travelMinutes:15
          },
          {
            time:'16:00',
            name:'京都駅',
            transport:'train',
            travelMinutes:35
          }
        ]
      }
    ]
  },
  {
    id:'taipei',
    title:'台北の街と夜市を楽しむ2日間',
    place:'台北',
    icon:'🏮',
    description:'ローカルグルメと街歩き。',
    style:'food',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {time:'11:00',name:'迪化街'},
          {time:'18:00',name:'寧夏夜市'}
        ]
      },
      {
        name:'Day 2',
        stops:[
          {time:'09:00',name:'龍山寺'},
          {time:'14:00',name:'中正紀念堂'}
        ]
      }
    ]
  },
  {
    id:'hokkaido',
    title:'札幌・小樽を巡る2日間',
    place:'北海道',
    icon:'🌲',
    description:'海辺の街と北海道グルメ。',
    style:'nature',
    schedule:[
      {
        name:'Day 1',
        stops:[
          {time:'10:00',name:'札幌時計台'},
          {time:'13:00',name:'大通公園'}
        ]
      },
      {
        name:'Day 2',
        stops:[
          {time:'10:00',name:'小樽運河'},
          {time:'14:00',name:'堺町通り'}
        ]
      }
    ]
  }
];

let state={
  plans:[],
  saved:[]
};

try{
  const v=JSON.parse(localStorage.getItem(KEY));
  if(
    v &&
    Array.isArray(v.plans) &&
    Array.isArray(v.saved)
  ){
    state=v;
  }
}catch(e){
  console.error(e);
}

const app=document.getElementById('app');
const nav=document.getElementById('nav');

let page='home';
let selected='';
let myTab='planning';
let draft=null;
let editing='';
let map=null;

let searchBusy=false;
let lastSearch=0;
let searchToken='';
let searchResults=[];

let exportTrip=null;
let exportIndex=0;

let restoreCandidate=null;
let backupText='';

let search={
  q:'',
  days:'',
  style:'',
  status:''
};

function uid(){
  return 't'+Date.now().toString(36)
    +Math.random().toString(36).slice(2,9);
}

function esc(v){
  return String(v??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function clone(v){
  return JSON.parse(JSON.stringify(v));
}

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch(e){
    alert(
      '保存に失敗しました。写真の保存容量などを確認してください。'
    );
    return false;
  }
}

function update(fn){
  const old=clone(state);
  fn();

  if(!persist()){
    state=old;
    return false;
  }

  return true;
}

function all(){
  return [...SAMPLES,...state.plans];
}

function find(id){
  return all().find(t=>t.id===id);
}

function own(id){
  return state.plans.some(t=>t.id===id);
}

function coords(p){
  return Array.isArray(p)
    &&p.length===2
    &&p.every(n=>Number.isFinite(+n))
    &&Math.abs(+p[0])<=90
    &&Math.abs(+p[1])<=180;
}

function hasNum(v){
  return v!==''&&v!=null&&Number.isFinite(+v);
}

function norm(t){
  const x=clone(t);

  x.status=x.status==='completed'
    ?'completed':'planning';

  x.published=!!x.published;

  x.template=TEMPLATES[x.template]
    ?x.template:'scrapbook';

  x.style=STYLES[x.style]
    ?x.style:'';

  x.schedule=(x.schedule||[]).map((d,i)=>({
    name:d.name||'Day '+(i+1),
    stops:(d.stops||[]).map(s=>({
      ...s,
      uid:s.uid||uid(),
      time:s.time||'09:00',
      transport:s.transport||'',
      travelMinutes:s.travelMinutes??'',
      stayMinutes:s.stayMinutes??'',
      comment:s.comment||'',
      photo:s.photo||''
    }))
  }));

  x.days=x.schedule.length;

  return x;
}

function statusLabel(t){
  return SAMPLES.includes(t)
    ?'サンプル'
    :t.status==='completed'
      ?'実際に行った旅'
      :'旅行計画';
}

function firstPhoto(t){
  for(const d of t.schedule||[]){
    for(const s of d.stops||[]){
      if(s.photo)return s.photo;
    }
  }
  return '';
}

function travel(s){
  return [
    MODES[s.transport]||'',
    hasNum(s.travelMinutes)
      ?s.travelMinutes+'分':''
  ].filter(x=>x&&x!=='未設定').join('・')
  ||'移動情報未設定';
}

function menu(){
  nav.innerHTML=[
    ['home','HOME','⌂'],
    ['search','SEARCH','⌕'],
    ['my','MY TRIP','♡'],
    ['post','POST','＋']
  ].map(([id,n,icon])=>`
    <button
      class="${page===id?'active':''}"
      data-a="page"
      data-id="${id}">
      ${icon}<br>${n}
    </button>
  `).join('');
}

function go(p,id=''){
  if(map){
    map.remove();
    map=null;
  }

  page=p;
  selected=id;

  window.scrollTo(0,0);
  render();

  if(p==='detail'){
    setTimeout(()=>{
      if(page==='detail'&&selected===id){
        drawMap(find(id));
      }
    },80);
  }
}

function hero(t){
  const p=firstPhoto(t);

  return `
    <div class="hero">
      ${p
        ?`<img src="${p}" alt="">`
        :esc(t.icon||'🧳')
      }
    </div>
  `;
}

function card(t){
  return `
    <article class="card">
      ${hero(t)}

      <span class="tag">${esc(t.place)}</span>
      <span class="tag">${t.schedule.length}日間</span>
      <span class="tag">${statusLabel(t)}</span>

      ${t.style?`
        <span class="tag">
          ${esc(STYLES[t.style])}
        </span>
      `:''}

      <h3>${esc(t.title)}</h3>

      <p class="muted">
        ${esc(t.description||'')}
      </p>

      <button
        class="btn"
        data-a="detail"
        data-id="${esc(t.id)}">
        旅程を見る →
      </button>
    </article>
  `;
}

function stats(){
  const c={
    PLANNING:state.plans.filter(
      t=>t.status!=='completed'
    ).length,

    COMPLETED:state.plans.filter(
      t=>t.status==='completed'
    ).length,

    POST:state.plans.filter(
      t=>t.published
    ).length,

    SAVED:state.saved.length
  };

  return `
    <div class="stats">
      ${Object.entries(c).map(([k,v])=>`
        <div class="stat">
          <b>${v}</b>
          <small>${k}</small>
        </div>
      `).join('')}
    </div>
  `;
}

function render(){
  menu();

  ({
    home:renderHome,
    search:renderSearch,
    my:renderMy,
    post:renderPost,
    detail:renderDetail,
    edit:renderEditor,
    backup:renderBackup,
    export:renderExport,
    copy:renderCopy
  })[page]?.();
}

/* =========================
   HOME
========================= */

function renderHome(){
  app.innerHTML=`
    <div class="eyebrow">
      YOUR JOURNEY, OUR STORY
    </div>

    <h2>
      誰かの旅から、<br>
      次の旅がはじまる。
    </h2>

    <p>
      実際の旅程を参考に、
      自分だけの旅を紡いでいこう。
    </p>

    <button class="btn" data-a="new">
      ＋ 新しい旅を計画
    </button>

    <button
      class="btn alt"
      data-a="page"
      data-id="search">
      旅程を探す
    </button>

    <div class="notice">
      試作版です。
      公開した旅程は同じブラウザ内だけで表示されます。
      サンプルは実体験を保証するものではありません。
    </div>

    <h2>公開した旅程</h2>

    ${state.plans.filter(t=>t.published)
      .map(card).join('')
      ||'<p class="muted">まだ公開旅程がありません。</p>'}

    <h2>サンプル旅程</h2>

    ${SAMPLES.map(card).join('')}
  `;
}

/* =========================
   SEARCH ver.1.5
========================= */

function renderSearch(){
  app.innerHTML=`
    <div class="eyebrow">
      FIND YOUR NEXT TRIP
    </div>

    <h2>旅程を探す</h2>

    <label>
      目的地・キーワード
      <input
        id="search-q"
        value="${esc(search.q)}"
        placeholder="例：京都、台北、夜市">
    </label>

    <div class="row">
      <label>
        旅行日数
        <select id="search-days">
          <option value="">すべて</option>

          ${Array.from(
            {length:14},
            (_,i)=>i+1
          ).map(n=>`
            <option
              value="${n}"
              ${search.days===String(n)?'selected':''}>
              ${n}日間
            </option>
          `).join('')}
        </select>
      </label>

      <label>
        旅行スタイル
        <select id="search-style">
          ${Object.entries(STYLES)
            .map(([k,v])=>`
              <option
                value="${k}"
                ${search.style===k?'selected':''}>
                ${k?v:'すべて'}
              </option>
            `).join('')}
        </select>
      </label>
    </div>

    <label>
      旅程の種類
      <select id="search-status">
        <option
          value=""
          ${!search.status?'selected':''}>
          すべて
        </option>

        <option
          value="completed"
          ${search.status==='completed'?'selected':''}>
          実際に行った旅
        </option>

        <option
          value="planning"
          ${search.status==='planning'?'selected':''}>
          旅行計画
        </option>

        <option
          value="sample"
          ${search.status==='sample'?'selected':''}>
          サンプル
        </option>
      </select>
    </label>

    <button
      class="btn alt"
      data-a="reset-search">
      絞り込みを解除
    </button>

    <div id="search-results"></div>
  `;

  renderResults();
}

function renderResults(){
  const el=document.getElementById('search-results');
  if(!el)return;

  const list=[
    ...SAMPLES,
    ...state.plans.filter(t=>t.published)
  ].filter(t=>{
    const isSample=SAMPLES.includes(t);

    const text=[
      t.title,
      t.place,
      t.description,
      ...t.schedule.flatMap(
        d=>d.stops.map(s=>s.name)
      )
    ].join(' ').toLowerCase();

    return text.includes(search.q.toLowerCase())
      &&(!search.days
        ||t.schedule.length===+search.days)
      &&(!search.style
        ||t.style===search.style)
      &&(!search.status
        ||(
          search.status==='sample'
            ?isSample
            :!isSample
              &&(t.status||'planning')===search.status
        ));
  });

  el.innerHTML=`
    <p class="muted">${list.length}件の旅程</p>

    ${list.map(card).join('')
      ||'<p>該当する旅程はありません。</p>'}
  `;
}

/* =========================
   MY TRIP
========================= */

function renderMy(){
  const list=myTab==='saved'
    ?state.saved.map(find).filter(Boolean)
    :myTab==='post'
      ?state.plans.filter(t=>t.published)
      :state.plans.filter(
        t=>(t.status||'planning')===myTab
      );

  app.innerHTML=`
    <div class="eyebrow">MY JOURNEYS</div>

    <h2>MY TRIP</h2>

    ${stats()}

    <button class="btn" data-a="new">
      ＋ 旅程を作成
    </button>

    <button
      class="btn alt"
      data-a="page"
      data-id="backup">
      🛡 バックアップ・復元
    </button>

    <div class="tabs">
      ${['planning','completed','post','saved']
        .map(k=>`
          <button
            class="btn ${myTab===k?'':'alt'}"
            data-a="tab"
            data-id="${k}">
            ${k.toUpperCase()}
          </button>

function timeMin(v){
  if(!/^\d\d:\d\d$/.test(v||''))return null;

  const [h,m]=v.split(':').map(Number);

  return h<24&&m<60
    ?h*60+m
    :null;
}

function checkHTML(a,b){
  const x=timeMin(a.time);
  const y=timeMin(b.time);

  if(x===null||y===null){
    return '<p class="muted">時刻未設定</p>';
  }

  if(y<x){
    return '<p class="warn">⚠ 時刻が前後しています</p>';
  }

  if(
    !hasNum(a.stayMinutes)
    ||!hasNum(b.travelMinutes)
  ){
    return `
      <p class="muted">
        移動・滞在時間が未設定
      </p>
    `;
  }

  const gap=y-x
    -(+a.stayMinutes)
    -(+b.travelMinutes);

  return `
    <p class="${gap<0?'warn':'ok'}">
      ${gap<0
        ?'⚠ '+(-gap)+'分不足'
        :'✓ '+gap+'分の余裕'}
    </p>
  `;
}

/* =========================
   MAP
========================= */

function drawMap(t){
  const el=document.getElementById('trip-map');

  if(!el||!t)return;

  if(typeof L==='undefined'){
    el.textContent='地図を読み込めませんでした。';
    return;
  }

  try{
    map=L.map(el,{
      scrollWheelZoom:false
    });

    L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution:'&copy; OpenStreetMap contributors',
        maxZoom:19
      }
    ).addTo(map);

    const bounds=[];
    const arrows=[];
    let missing=0;

    t.schedule.forEach((d,di)=>{
      const color=COLORS[di%COLORS.length];
      let prev=null;

      d.stops.forEach((s,si)=>{
        const p=coords(s.coords)
          ?s.coords
          :KNOWN[s.name];

        if(!coords(p)){
          missing++;
          prev=null;
          return;
        }

        const pos=p.map(Number);
        bounds.push(pos);

        L.marker(pos,{
          icon:L.divIcon({
            className:'',
            html:`
              <div
                class="pin"
                style="background:${color}">
                ${si+1}
              </div>
            `,
            iconSize:[29,29],
            iconAnchor:[14,14]
          })
        })
        .addTo(map)
        .bindPopup(
          esc(d.name)+' / '+esc(s.name)
        );

        if(prev){
          L.polyline(
            [prev,pos],
            {
              color,
              weight:4,
              opacity:.85
            }
          ).addTo(map);

          arrows.push({
            from:prev,
            to:pos,
            color
          });
        }

        prev=pos;
      });
    });

    if(bounds.length){
      map.fitBounds(bounds,{
        padding:[35,35],
        maxZoom:13
      });
    }else{
      map.setView([35.6812,139.7671],5);
    }

    let markers=[];

    function redraw(){
      markers.forEach(m=>map.removeLayer(m));
      markers=[];

      arrows.forEach(a=>{
        const f=map.latLngToLayerPoint(a.from);
        const t=map.latLngToLayerPoint(a.to);

        const dx=t.x-f.x;
        const dy=t.y-f.y;

        if(Math.hypot(dx,dy)<12)return;

        const angle=
          Math.atan2(dy,dx)*180/Math.PI;

        const mid=[
          (a.from[0]+a.to[0])/2,
          (a.from[1]+a.to[1])/2
        ];

        markers.push(
          L.marker(mid,{
            interactive:false,
            icon:L.divIcon({
              className:'',
              html:`
                <div
                  class="arrow"
                  style="color:${a.color}">
                  <span
                    style="transform:
                      rotate(${angle}deg)">
                    ➜
                  </span>
                </div>
              `,
              iconSize:[24,24],
              iconAnchor:[12,12]
            })
          }).addTo(map)
        );
      });
    }

    map.on('zoomend',redraw);
    redraw();

    if(missing){
      el.insertAdjacentHTML(
        'afterend',
        `
          <p class="muted">
            位置未登録：${missing}件。
            編集画面で場所を検索してください。
          </p>
        `
      );
    }

    setTimeout(()=>{
      if(map)map.invalidateSize();
    },150);

  }catch(e){
    console.error(e);
    el.textContent='地図表示に失敗しました。';
  }
}

/* =========================
   EDITOR DATA
========================= */

function sync(){
  if(!draft)return;

  for(const [id,key] of [
    ['trip-title','title'],
    ['trip-place','place'],
    ['trip-description','description'],
    ['trip-style','style'],
    ['trip-template','template'],
    ['trip-status','status']
  ]){
    const el=document.getElementById(id);
    if(el)draft[key]=el.value;
  }

  document.querySelectorAll(
    '[data-dayname]'
  ).forEach(el=>{
    const d=draft.schedule[
      +el.dataset.dayname
    ];

    if(d)d.name=el.value;
  });

  document.querySelectorAll(
    '[data-field]'
  ).forEach(el=>{
    const s=draft.schedule[
      +el.dataset.day
    ]?.stops[
      +el.dataset.spot
    ];

    if(!s)return;

    const f=el.dataset.field;

    if(f==='name'&&s.name!==el.value){
      s.name=el.value;
      s.lookup='';
      delete s.coords;
      delete s.locationLabel;
    }else if(f!=='name'){
      s[f]=el.value;
    }
  });
}

function resizeDays(n){
  while(draft.schedule.length<n){
    draft.schedule.push({
      name:'Day '+(draft.schedule.length+1),
      stops:[newSpot()]
    });
  }

  draft.schedule.length=n;
  draft.days=n;
}

function dayAdd(){
  sync();

  if(draft.schedule.length>=14){
    alert('最大14日間です。');
    return;
  }

  resizeDays(draft.schedule.length+1);
  renderDays();
}

function dayDelete(di){
  sync();

  if(draft.schedule.length<=1)return;

  if(!confirm(
    'このDAYとすべてのスポットを削除しますか？'
  ))return;

  draft.schedule.splice(di,1);
  renderDays();
}

function daySwap(di,delta){
  sync();

  const j=di+delta;

  if(j<0||j>=draft.schedule.length)return;

  [
    draft.schedule[di],
    draft.schedule[j]
  ]=[
    draft.schedule[j],
    draft.schedule[di]
  ];

  renderDays();
}

function resetIncoming(a,i){
  if(a[i]){
    a[i].transport='';
    a[i].travelMinutes='';
  }
}

function add(di){
  sync();
  draft.schedule[di].stops.push(newSpot());
  renderDays();
}

function remove(di,si){
  sync();

  if(!confirm(
    'このスポットを削除しますか？'
  ))return;

  const a=draft.schedule[di].stops;

  a.splice(si,1);

  resetIncoming(a,si);
  resetIncoming(a,0);

  renderDays();
}

function move(di,si,delta){
  sync();

  const a=draft.schedule[di].stops;
  const j=si+delta;

  if(j<0||j>=a.length)return;

  [a[si],a[j]]=[a[j],a[si]];

  [si,si+1,j,j+1,0].forEach(
    i=>resetIncoming(a,i)
  );

  renderDays();

  alert(
    '訪問順を変更しました。影響する移動時間・手段を再入力してください。'
  );
}

function moveDay(di,si){
  sync();

  const target=+document.querySelector(
    `[data-move-target="${di}-${si}"]`
  )?.value;

  if(
    !Number.isInteger(target)
    ||target===di
    ||!draft.schedule[target]
  ){
    alert('移動先に別のDAYを選択してください。');
    return;
  }

  const from=draft.schedule[di].stops;
  const to=draft.schedule[target].stops;

  const [s]=from.splice(si,1);

  resetIncoming(from,si);
  resetIncoming(from,0);

  s.transport='';
  s.travelMinutes='';

  to.push(s);
  resetIncoming(to,0);

  renderDays();

  alert(
    'スポットを移動しました。移動元・移動先の移動情報を確認してください。'
  );
}

function check(di){
  sync();

  const a=draft.schedule[di].stops;

  document.getElementById(
    'check-'+di
  ).innerHTML=a.slice(1).map((s,i)=>`
    <p>${i+1} → ${i+2}</p>
    ${checkHTML(a[i],s)}
  `).join('')
  ||'<p class="muted">スポットが2件以上必要です。</p>';
}

========================= */

function spotByUid(id){
  for(const d of draft?.schedule||[]){
    for(const s of d.stops){
      if(s.uid===id)return s;
    }
  }

  return null;
}

async function lookup(di,si){
  sync();

  const s=draft.schedule[di]?.stops[si];
  const el=document.getElementById(
    `lookup-${di}-${si}`
  );

  if(!s||!el)return;

  const q=(s.lookup||s.name).trim();

  if(!q){
    el.textContent='検索語を入力してください。';
    return;
  }

  if(
    searchBusy
    ||Date.now()-lastSearch<1300
  ){
    el.textContent=
      '少し時間を空けて再検索してください。';
    return;
  }

  searchBusy=true;
  lastSearch=Date.now();

  const token=uid();
  searchToken=token;

  el.textContent='検索中...';

  try{
    const params=new URLSearchParams({
      format:'jsonv2',
      q,
      limit:'10',
      addressdetails:'1',
      'accept-language':'ja,en'
    });

    const res=await fetch(
      'https://nominatim.openstreetmap.org/search?'
      +params,
      {
        headers:{
          Accept:'application/json'
        }
      }
    );

    if(!res.ok)throw Error(res.status);

    const data=await res.json();

    if(
      searchToken!==token
      ||!spotByUid(s.uid)
    )return;

    searchResults=data.map(x=>({
      name:x.display_name,
      coords:[+x.lat,+x.lon]
    })).filter(x=>coords(x.coords));

    const target=document.getElementById(
      `lookup-${di}-${si}`
    );

    if(target){
      target.innerHTML=searchResults
        .map((r,i)=>`
          <div class="result">
            ${esc(r.name)}
            <br>

            <button
              class="btn alt"
              data-a="choose"
              data-index="${i}"
              data-uid="${esc(s.uid)}">
              この場所を選択
            </button>
          </div>
        `).join('')
        ||'<p>候補がありません。</p>';
    }

  }catch(e){
    el.textContent='検索に失敗しました。';
  }finally{
    searchBusy=false;
  }
}

function choose(i,id){
  const s=spotByUid(id);
  const r=searchResults[i];

  if(!s||!r)return;

  sync();

  s.coords=r.coords;
  s.locationLabel=r.name;

  searchResults=[];

  renderDays();
}

async function photo(file,di,si){
  if(
    !file
    ||!file.type.startsWith('image/')
  ){
    alert('画像を選択してください。');
    return;
  }

  if(file.size>20*1024*1024){
    alert('20MB以下の画像を選択してください。');
    return;
  }

  sync();

  const spotId=draft.schedule[di]
    ?.stops[si]?.uid;

  try{
    const url=URL.createObjectURL(file);
    const img=new Image();

    try{
      await new Promise((ok,fail)=>{
        img.onload=ok;
        img.onerror=fail;
        img.src=url;
      });
    }finally{
      URL.revokeObjectURL(url);
    }

    const ratio=Math.min(
      1,
      900/Math.max(img.width,img.height)
    );

    const c=document.createElement('canvas');

    c.width=Math.max(
      1,
      Math.round(img.width*ratio)
    );

    c.height=Math.max(
      1,
      Math.round(img.height*ratio)
    );

    const ctx=c.getContext('2d');

    ctx.fillStyle='white';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);

    const s=spotByUid(spotId);

    if(s){
      s.photo=c.toDataURL('image/jpeg',.65);

      renderDays();

      alert(
        '写真を追加しました。旅程を保存してください。'
      );
    }

  }catch(e){
    alert('写真を読み込めませんでした。');
  }
}

function saveTrip(){
  sync();

  if(
    !draft.title.trim()
    ||!draft.place.trim()
  ){
    alert('タイトルと目的地を入力してください。');
    return;
  }

  if(
    !draft.schedule.some(
      d=>d.stops.length
    )
    ||draft.schedule.some(
      d=>d.stops.some(s=>!s.name.trim())
    )
  ){
    alert(
      'スポットを1件以上入力し、空欄をなくしてください。'
    );
    return;
  }

  for(const d of draft.schedule){
    for(const s of d.stops){
      for(const v of [
        s.travelMinutes,
        s.stayMinutes
      ]){
        if(
          v!==''
          &&v!=null
          &&(
            !Number.isInteger(+v)
            ||+v<0
          )
        ){
          alert(
            '時間は0以上の整数で入力してください。'
          );
          return;
        }
      }
    }
  }

  const t=norm(draft);

  if(draft.publishAfterSave){
    t.published=true;
  }

  delete t.publishAfterSave;

  if(editing&&!own(editing)){
    alert('編集対象がありません。');
    return;
  }

  if(!update(()=>{
    if(editing){
      const i=state.plans.findIndex(
        x=>x.id===editing
      );

      state.plans[i]=t;
    }else{
      state.plans.unshift(t);
    }
  }))return;

  draft=null;
  editing='';

  go('detail',t.id);
}

function deleteTrip(id){
  const t=state.plans.find(
    x=>x.id===id
  );

  if(
    !t
    ||!confirm(
      '「'+t.title+'」を削除しますか？'
    )
  )return;

  if(update(()=>{
    state.plans=state.plans.filter(
      x=>x.id!==id
    );

    state.saved=state.saved.filter(
      x=>x!==id
    );
  })){
    go('my');
  }
}

function setStatus(id,status){
  const t=state.plans.find(
    x=>x.id===id
  );

  if(!t)return;

  if(
    status==='completed'
    &&!confirm(
      '実際に行った旅として記録しますか？'
    )
  )return;

  if(update(()=>{
    t.status=status;
  })){
    myTab=status;
    go('my');
  }
}

function publish(id,value){
  const t=state.plans.find(
    x=>x.id===id
  );

  if(!t)return;

  if(
    value
    &&!confirm(
      '公開しますか？ 現在はこのブラウザ内のみの公開です。'
    )
  )return;

  if(update(()=>{
    t.published=value;
  })){
    if(page==='detail'){
      go('detail',id);
    }else{
      render();
    }
  }
}

function bookmark(id){
  if(update(()=>{
    state.saved=state.saved.includes(id)
      ?state.saved.filter(x=>x!==id)
      :[...state.saved,id];
  })){
    go('detail',id);
  }
}

function validTrip(t){
  return t
    &&typeof t.id==='string'
    &&!!t.id
    &&typeof t.title==='string'
    &&typeof t.place==='string'
    &&Array.isArray(t.schedule)
    &&t.schedule.length>=1
    &&t.schedule.length<=14
    &&t.schedule.every(d=>
      d
      &&Array.isArray(d.stops)
      &&d.stops.length<=500
      &&d.stops.every(s=>
        s
        &&typeof s.name==='string'
        &&typeof s.time==='string'
        &&(
          s.coords===undefined
          ||coords(s.coords)
        )
        &&(
          s.photo===undefined
          ||(
            typeof s.photo==='string'
            &&(
              !s.photo
              ||/^data:image\/jpeg;base64,/.test(
                s.photo
              )
            )
          )
        )
      )
    );
}

function previewRestore(){
  const raw=document.getElementById(
    'restore-input'
  )?.value.trim()||'';

  const el=document.getElementById(
    'restore-preview'
  );

  restoreCandidate=null;

  try{
    if(raw.length>15000000){
      throw Error(
        'バックアップが大きすぎます。'
      );
    }

    const v=JSON.parse(raw);

    if(
      v.app!=='TUMUGOU'
      ||v.backupVersion!==1
      ||!v.data
      ||!Array.isArray(v.data.plans)
      ||!Array.isArray(v.data.saved)
    ){
      throw Error(
        '対応していないデータです。'
      );
    }

    if(
      v.data.plans.length>1000
      ||v.data.saved.length>2000
      ||!v.data.plans.every(validTrip)
      ||!v.data.saved.every(
        x=>typeof x==='string'
      )
    ){
      throw Error(
        '旅程データが正しくありません。'
      );
    }

    const ids=v.data.plans.map(
      t=>t.id
    );

    if(
      new Set(ids).size!==ids.length
    ){
      throw Error(
        '重複した旅程IDがあります。'
      );
    }

    restoreCandidate=v;

    const existing=new Set(
      state.plans.map(t=>t.id)
    );

    el.innerHTML=`
      <p class="ok">
        ✓ バックアップを確認しました。
      </p>

      <p>
        旅程：${ids.length}件／
        既存と重複：
        ${ids.filter(
          id=>existing.has(id)
        ).length}件
      </p>

      <label>
        復元方法
        <select id="restore-mode">
          <option value="merge">
            既存データに追加（重複を除く）
          </option>

          <option value="replace">
            既存データを置き換え
          </option>
        </select>
      </label>

      <button
        class="btn danger"
        data-a="restore-confirm">
        復元を実行
      </button>
    `;

  }catch(e){
    el.innerHTML=`
      <p class="warn">
        ${esc(e.message)}
      </p>
    `;
  }
}

function restoreData(){
  if(!restoreCandidate)return;

  const mode=document.getElementById(
    'restore-mode'
  )?.value||'merge';

  if(!confirm(
    mode==='replace'
      ?'現在のデータを置き換えます。実行しますか？'
      :'重複を除いて追加します。実行しますか？'
  ))return;

  const data=restoreCandidate.data;

  if(update(()=>{
    if(mode==='replace'){
      state.plans=data.plans.map(norm);
      state.saved=[
        ...new Set(data.saved)
      ];
    }else{
      const ids=new Set(
        state.plans.map(t=>t.id)
      );

      state.plans.push(
        ...data.plans
          .filter(t=>!ids.has(t.id))
          .map(norm)
      );

      state.saved=[
        ...new Set([
          ...state.saved,
          ...data.saved
        ])
      ];
    }
  })){
    restoreCandidate=null;
    alert('復元しました。');
    go('my');
  }
}

function lines(ctx,text,width){
  let out=[];
  let line='';

  for(const ch of String(text)){
    if(ch==='\n'){
      out.push(line);
      line='';
      continue;
    }

    if(
      line
      &&ctx.measureText(line+ch).width>width
    ){
      out.push(line);
      line=ch;
    }else{
      line+=ch;
    }
  }

  if(line)out.push(line);

  return out;
}

function drawLines(
  ctx,text,x,y,w,step,max=3
){
  const a=lines(ctx,text,w);

  a.slice(0,max).forEach((v,i)=>{
    ctx.fillText(
      v,
      x,
      y+i*step
    );
  });
}

async function imageOf(src){
  return new Promise(resolve=>{
    if(!src)return resolve(null);

    const img=new Image();

    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src=src;
  });
}

function coverImage(ctx,img,x,y,w,h){
  if(!img)return;

  const scale=Math.max(
    w/img.width,
    h/img.height
  );

  const sw=w/scale;
  const sh=h/scale;

  ctx.drawImage(
    img,
    (img.width-sw)/2,
    (img.height-sh)/2,
    sw,
    sh,
    x,y,w,h
  );
}

      ctx.fillText(
        s.time,
        95,y+45
      );

      ctx.fillStyle='#493c30';
      ctx.font='bold 30px sans-serif';

      drawLines(
        ctx,
        (si+1)+'. '+s.name,
        260,y+45,710,38,2
      );

      if(s.photo){
        const img=await imageOf(
          s.photo
        );

        if(img){
          coverImage(
            ctx,img,
            95,y+95,395,135
          );
        }

        ctx.fillStyle='#817768';
        ctx.font='21px sans-serif';

        drawLines(
          ctx,s.comment,
          515,y+120,450,30,3
        );

      }else if(s.comment){
        ctx.fillStyle='#817768';
        ctx.font='21px sans-serif';

        drawLines(
          ctx,s.comment,
          260,y+105,700,29,2
        );
      }

      y+=h+18;

      if(si<d.stops.length-1){
        ctx.fillStyle='#817768';
        ctx.font='20px sans-serif';

        ctx.fillText(
          '↓ '+travel(
            d.stops[si+1]
          ),
          95,y+10
        );

        y+=45;
      }
    }
  }

  ctx.fillStyle='#493c30';
  ctx.font='22px Georgia,serif';
  ctx.textAlign='right';

  ctx.fillText(
    'TUMUGOU • '
    +(index+1)
    +' / '
    +(t.schedule.length+2),
    1010,1320
  );

  if(
    page!=='export'
    ||exportIndex!==index
  )return;

  const img=document.createElement('img');

  img.alt='Instagram投稿用画像';
  img.src=c.toDataURL('image/png');

  el.innerHTML='';
  el.appendChild(img);

  document.getElementById(
    'export-count'
  ).textContent=
    (index+1)
    +' / '
    +(t.schedule.length+2);
}

function exportMove(delta){
  if(!exportTrip)return;

  exportIndex=Math.max(
    0,
    Math.min(
      exportTrip.schedule.length+1,
      exportIndex+delta
    )
  );

  renderExport();
}

/* =========================
   BUTTON EVENTS
========================= */

document.addEventListener('click',e=>{
  const b=e.target.closest(
    'button[data-a]'
  );

  if(!b)return;

  const a=b.dataset.a;
  const id=b.dataset.id;
  const di=+b.dataset.day;
  const si=+b.dataset.spot;

  if(a==='page'){
    go(id);

  }else if(a==='tab'){
    myTab=id;
    render();

  }else if(a==='detail'){
    go('detail',id);

  }else if(a==='new'){
    openNew(false);

  }else if(a==='new-publish'){
    openNew(true);

  }else if(a==='edit'){
    openEdit(id);

  }else if(a==='copy'){
    openCopy(id);

  }else if(a==='copy-next'){
    copyNext();

  }else if(a==='day-add'){
    dayAdd();

  }else if(a==='day-delete'){
    dayDelete(di);

  }else if(a==='day-up'){
    daySwap(di,-1);

  }else if(a==='day-down'){
    daySwap(di,1);

  }else if(a==='add'){
    add(di);

  }else if(a==='remove'){
    remove(di,si);

  }else if(a==='up'){
    move(di,si,-1);

  }else if(a==='down'){
    move(di,si,1);

  }else if(a==='move-day'){
    moveDay(di,si);

  }else if(a==='check'){
    check(di);

  }else if(a==='lookup'){
    lookup(di,si);

  }else if(a==='choose'){
    choose(
      +b.dataset.index,
      b.dataset.uid
    );

  }else if(a==='remove-photo'){
    sync();

    const s=draft.schedule[di]
      ?.stops[si];

    if(
      s
      &&confirm(
        '写真を削除しますか？'
      )
    ){
      s.photo='';
      renderDays();
    }

  }else if(a==='save-trip'){
    saveTrip();

  }else if(a==='delete'){
    deleteTrip(id);

  }else if(a==='complete'){
    setStatus(id,'completed');

  }else if(a==='planning'){
    setStatus(id,'planning');

  }else if(a==='publish'){
    publish(id,true);

  }else if(a==='unpublish'){
    publish(id,false);

  }else if(a==='bookmark'){
    bookmark(id);

  }else if(a==='backup-create'){
    createBackup();

  }else if(a==='backup-copy'){
    copyBackup();

  }else if(a==='restore-preview'){
    previewRestore();

  }else if(a==='restore-confirm'){
    restoreData();

  }else if(a==='export'){
    openExport(id);

  }else if(a==='export-prev'){
    exportMove(-1);

  }else if(a==='export-next'){
    exportMove(1);

  }else if(a==='reset-search'){
    search={
      q:'',
      days:'',
      style:'',
      status:''
    };

    renderSearch();
  }
});

/* =========================
   INPUT EVENTS
========================= */

document.addEventListener('input',e=>{
  if(e.target.id==='search-q'){
    search.q=e.target.value;
    renderResults();
  }

  if(e.target.id==='restore-input'){
    restoreCandidate=null;

    const el=document.getElementById(
      'restore-preview'
    );

    if(el)el.innerHTML='';
  }

  if(e.target.dataset.field==='name'){
    const s=draft?.schedule[
      +e.target.dataset.day
    ]?.stops[
      +e.target.dataset.spot
    ];

    if(
      s
      &&s.name!==e.target.value
    ){
      s.name=e.target.value;
      s.lookup='';

      delete s.coords;
      delete s.locationLabel;

      const box=e.target.closest(
        '.spot'
      );

      const input=box?.querySelector(
        '[data-field="lookup"]'
      );

      if(input){
        input.value=s.name;
      }

      const res=box?.querySelector(
        '[id^="lookup-"]'
      );

      if(res){
        res.innerHTML='';
      }
    }
  }
});

/* =========================
   CHANGE EVENTS
========================= */

document.addEventListener('change',async e=>{
  if([
    'search-days',
    'search-style',
    'search-status'
  ].includes(e.target.id)){

    search[
      e.target.id.replace('search-','')
    ]=e.target.value;

    renderResults();

  }else if(e.target.id==='export-index'){
    exportIndex=+e.target.value;
    renderExport();

  }else if(e.target.dataset.photo){
    await photo(
      e.target.files?.[0],
      +e.target.dataset.day,
      +e.target.dataset.spot
    );
  }
});

/* =========================
   START
========================= */

render();

</script>
</body>
</html>
