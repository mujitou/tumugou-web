<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#59634a">
<title>TUMUGOU ver.5.0</title>

<style>
:root{
  --bg:#f7f4ec;
  --paper:#fffdf8;
  --cream:#eee8db;
  --sand:#d9c6a9;
  --brown:#493c30;
  --olive:#59634a;
  --sage:#b8c4ae;
  --muted:#857c6d;
  --line:#ded6c9;
  --red:#a45f50;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--brown);
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45}
header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fffdf8f2;
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:13px;
  text-align:center;
}
.logo{
  font:bold 29px Georgia,serif;
  letter-spacing:4px;
  color:var(--olive);
}
header small{
  display:block;
  font-size:10px;
  letter-spacing:1px;
  margin-top:4px;
}
main{
  max-width:960px;
  margin:auto;
  padding:22px 14px 120px;
}
h1,h2,h3{line-height:1.4}
h1{font-size:29px}
h2{font-size:23px}
h3{font-size:18px}
p{line-height:1.75}
.eyebrow{
  font-size:11px;
  letter-spacing:2px;
  color:var(--olive);
  font-weight:bold;
}
.muted{color:var(--muted);font-size:12px}
.card,.panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin:14px 0;
  box-shadow:0 5px 20px #493c300b;
}
.btn{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  margin:4px 4px 4px 0;
  background:var(--olive);
  color:white;
  font-size:13px;
}
.btn.alt{background:var(--cream);color:var(--brown)}
.btn.danger{background:#f3e2dd;color:#90473d}
.actions{display:flex;flex-wrap:wrap;gap:5px}
label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin:13px 0;
}
input,select,textarea{
  display:block;
  width:100%;
  padding:11px;
  margin-top:6px;
  background:white;
  border:1px solid #d4c8b7;
  border-radius:9px;
  color:var(--brown);
}
textarea{min-height:85px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.notice{
  background:#eee9dc;
  border-radius:12px;
  padding:14px;
  margin:14px 0;
  font-size:13px;
  line-height:1.7;
}
.warn{
  background:#fff0e6;
  color:#915438;
  border-radius:10px;
  padding:13px;
  margin:12px 0;
}
.tag{
  display:inline-block;
  background:#e9eee3;
  color:var(--olive);
  border-radius:30px;
  padding:5px 10px;
  margin:3px;
  font-size:11px;
}
.cover{
  height:220px;
  border-radius:13px;
  background:linear-gradient(135deg,#b8c5ad,#ead6b8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  overflow:hidden;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.trip-title{
  font-family:Georgia,"Hiragino Mincho ProN",serif;
  font-size:29px;
}
.day-card{border-left:5px solid var(--olive)}
.spot-card{
  background:#f6f1e7;
  border-radius:12px;
  padding:13px;
  margin:12px 0;
}
.spot-time{font-weight:bold;color:var(--olive)}
.timeline{
  border-left:2px dashed #c4b99f;
  padding-left:15px;
  margin-left:10px;
}
.travel{
  background:#eee9dc;
  padding:9px;
  border-radius:8px;
  font-size:12px;
  margin:9px 0;
}
.photo-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
  margin:10px 0;
}
.photo-grid img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}
.photo-grid img:only-child{
  grid-column:span 2;
  height:230px;
}
.photo-item{position:relative}
.photo-item img{display:block}
.photo-item button{font-size:11px}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 3px;
  text-align:center;
}
.stat b{
  display:block;
  font-size:22px;
  color:var(--olive);
}
.stat small{font-size:9px}
.tabs{display:flex;overflow:auto;gap:5px}
.route-svg{
  display:block;
  width:100%;
  height:auto;
  background:#f3eddf;
  border-radius:13px;
}
.search-step{border-left:3px solid var(--olive);padding-left:13px}
.export-preview{
  width:100%;
  max-width:360px;
  display:block;
  margin:15px auto;
  border-radius:10px;
  border:1px solid var(--line);
}
.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
}
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:200;
  background:#fffdf8f5;
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;
  border:0;
  background:transparent;
  padding:12px 1px;
  font-size:10px;
  color:var(--brown);
}
nav button.active{
  background:#e8ede1;
  color:var(--olive);
  font-weight:bold;
}
.template-magazine .trip-title{font-size:34px}
.template-minimal .day-card{
  border-left-width:2px;
  box-shadow:none;
}
.template-scrapbook .day-card{
  box-shadow:4px 4px 0 var(--sand);
}
@media(max-width:500px){
  .row{gap:7px}
  .stat b{font-size:18px}
  .cover{height:185px}
  .photo-grid img{height:120px}
}
</style>
</head>

<body>

<header>
  <div class="logo">TUMUGOU</div>
  <small>あなたの旅が、次の誰かの旅になる。</small>
</header>

<main id="app"></main>
<nav id="nav"></nav>

<script>
"use strict";

/* ========================================
   01. SETTINGS
======================================== */

const VERSION="5.0";
const STORAGE_KEY="tumugou_local_v50";

const COLORS=[
  "#59634a",
  "#b47b59",
  "#66869a",
  "#b49a55",
  "#977d9d",
  "#68867b"
];

const STYLES={
  "":"未設定",
  culture:"歴史・文化",
  food:"グルメ",
  nature:"自然・絶景",
  relax:"のんびり",
  active:"アクティブ",
  city:"街歩き"
};

const MODES={
  "":"未設定",
  walk:"徒歩",
  train:"電車",
  bus:"バス",
  car:"車",
  taxi:"タクシー",
  bike:"自転車",
  ferry:"船",
  other:"その他"
};

const TEMPLATES={
  scrapbook:"手描きスクラップ",
  magazine:"トラベルマガジン",
  minimal:"シンプル"
};

const CATEGORIES={
  food:"食事",
  transport:"交通",
  ticket:"入場料",
  hotel:"宿泊",
  shopping:"買い物",
  other:"その他"
};

const app=document.getElementById("app");
const nav=document.getElementById("nav");

let page="home";
let selected="";
let tab="planning";
let trips=[];
let bookmarks=[];
let draft=null;
let editingId="";
let searchStep=1;
let searchResults=[];
let search={
  q:"",
  days:"",
  people:"",
  style:"",
  status:""
};

let exportTrip=null;
let exportRatio="4:5";
let exportPages=[];
let exportIndex=0;

/* ========================================
   02. UTILITIES
======================================== */

function uid(){
  return "t"+Date.now().toString(36)+
    Math.random().toString(36).slice(2,9);
}

function clone(x){
  return JSON.parse(JSON.stringify(x));
}

function esc(x){
  return String(x??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function num(x){
  return x!==""&&x!=null&&Number.isFinite(+x);
}

function money(n){
  return Math.round(n||0).toLocaleString("ja-JP")+"円";
}

function schedule(t){
  return t?.itinerary?.schedule||[];
}

function count(t){
  return schedule(t).reduce(
    (n,d)=>n+(d.stops||[]).length,0
  );
}

function total(t){
  return schedule(t).reduce(
    (n,d)=>n+(d.stops||[]).reduce(
      (a,s)=>a+(num(s.cost)?+s.cost:0),0
    ),0
  );
}

function find(id){
  return [...trips,...SAMPLES].find(t=>t.id===id);
}

function photoArray(s){
  if(Array.isArray(s.photos))return s.photos;
  if(s.photo)return [{id:uid(),url:s.photo}];
  return [];
}

function normalize(t){
  const x=clone(t);

  if(!x.itinerary){
    x.itinerary={schedule:x.schedule||[]};
  }

  if(!Array.isArray(x.itinerary.schedule)){
    x.itinerary.schedule=[];
  }

  x.template=TEMPLATES[x.template]
    ?x.template:"scrapbook";

  x.status=x.status==="completed"
    ?"completed":"planning";

  x.people=Math.max(1,parseInt(x.people)||1);

  x.itinerary.schedule=x.itinerary.schedule.map(
    (d,i)=>({
      name:d.name||"Day "+(i+1),
      stops:(d.stops||[]).map(s=>({
        ...s,
        uid:s.uid||uid(),
        name:s.name||"",
        time:s.time||"09:00",
        stayMinutes:s.stayMinutes??"",
        travelMinutes:s.travelMinutes??"",
        transport:s.transport||"",
        comment:s.comment||"",
        cost:s.cost??"",
        costCategory:s.costCategory||"other",
        photos:photoArray(s)
      }))
    })
  );

  return x;
}

function firstPhoto(t){
  for(const d of schedule(t)){
    for(const s of d.stops||[]){
      const p=photoArray(s);
      if(p.length)return p[0];
    }
  }
  return null;
}

function photoURL(p){
  return p?.url||"";
}

function photoHTML(p){
  const url=photoURL(p);
  return url?`<img src="${esc(url)}" alt="旅の写真">`:"";
}

function photoGrid(s){
  const photos=photoArray(s);
  if(!photos.length)return "";
  return `<div class="photo-grid">
    ${photos.map(photoHTML).join("")}
  </div>`;
}

function options(obj,value){
  return Object.entries(obj).map(([k,v])=>
    `<option value="${esc(k)}"
      ${String(value)===k?"selected":""}>
      ${esc(v)}
    </option>`
  ).join("");
}

function timeMin(t){
  if(!/^\d\d:\d\d$/.test(t||""))return null;
  const [h,m]=t.split(":").map(Number);
  return h<24&&m<60?h*60+m:null;
}

function timeText(n){
  if(n<0||n>=1440)return "";
  return String(Math.floor(n/60)).padStart(2,"0")+
    ":"+String(n%60).padStart(2,"0");
}

function validCoords(c){
  return Array.isArray(c)&&
    c.length===2&&
    c.every(v=>Number.isFinite(+v))&&
    Math.abs(+c[0])<=90&&
    Math.abs(+c[1])<=180;
}

/* ========================================
   03. LOCAL STORAGE
======================================== */

function save(){
  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        version:VERSION,
        trips,
        bookmarks,
        updatedAt:new Date().toISOString()
      })
    );
    return true;
  }catch(e){
    console.error(e);
    alert("保存に失敗しました。写真が多すぎる可能性があります。バックアップを取ってください。");
    return false;
  }
}

function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);

    trips=Array.isArray(data.trips)
      ?data.trips.map(normalize):[];

    bookmarks=Array.isArray(data.bookmarks)
      ?data.bookmarks:[];
  }catch(e){
    console.error(e);
    alert("保存データを読み込めませんでした。");
  }
}

/* ========================================
   04. SAMPLE
======================================== */

const SAMPLES=[normalize({
  id:"sample-kyoto",
  sample:true,
  title:"京都、街歩きと喫茶の2日間",
  destination:"京都",
  description:"寺社と喫茶を巡る、ゆったりした京都旅行。",
  style:"culture",
  status:"completed",
  published:true,
  template:"scrapbook",
  people:1,
  trip_month:"2026-04",
  icon:"🍵",
  itinerary:{
    schedule:[
      {
        name:"京都東山と祇園",
        stops:[
          {
            name:"清水寺",
            time:"09:30",
            stayMinutes:90,
            coords:[34.9949,135.785]
          },
          {
            name:"祇園",
            time:"11:25",
            stayMinutes:90,
            transport:"walk",
            travelMinutes:25,
            coords:[35.003,135.778]
          },
          {
            name:"鴨川",
            time:"13:10",
            stayMinutes:60,
            transport:"walk",
            travelMinutes:15,
            coords:[35.01,135.771]
          }
        ]
      },
      {
        name:"嵐山を散策",
        stops:[
          {
            name:"嵐山",
            time:"10:00",
            stayMinutes:120,
            coords:[35.0094,135.6668]
          },
          {
            name:"竹林の小径",
            time:"12:15",
            stayMinutes:90,
            transport:"walk",
            travelMinutes:15,
            coords:[35.017,135.671]
          }
        ]
      }
    ]
  }
})];

/* ========================================
   05. NAVIGATION
======================================== */

function menu(){
  const items=[
    ["home","HOME","⌂"],
    ["search","SEARCH","⌕"],
    ["my","MY TRIP","♡"],
    ["post","POST","＋"],
    ["settings","SETTINGS","⚙"]
  ];

  nav.innerHTML=items.map(([id,name,icon])=>`
    <button class="${page===id?"active":""}"
      data-a="page" data-id="${id}">
      ${icon}<br>${name}
    </button>
  `).join("");
}

function go(p,id=""){
  page=p;
  selected=id;
  window.scrollTo(0,0);
  render();
}

function render(){
  menu();

  const views={
    home:renderHome,
    search:renderSearch,
    my:renderMy,
    post:renderPost,
    settings:renderSettings,
    detail:renderDetail,
    edit:renderEditor,
    export:renderExport
  };

  if(views[page])views[page]();
}

/* ========================================
   06. CARDS
======================================== */

function cover(t){
  const p=firstPhoto(t);

  return `<div class="cover">
    ${p?photoHTML(p):esc(t.icon||"🧳")}
  </div>`;
}

function card(t){
  return `
    <article class="card">
      ${cover(t)}

      <div>
        <span class="tag">
          ${esc(t.destination||"目的地未設定")}
        </span>
        <span class="tag">
          ${schedule(t).length}日間
        </span>
        <span class="tag">
          ${count(t)}スポット
        </span>
        <span class="tag">
          ${t.status==="completed"
            ?"実際に行った旅":"旅行計画"}
        </span>
      </div>

      <h3>${esc(t.title)}</h3>

      <p class="muted">
        ${esc(t.description||"")}
      </p>

      <button class="btn"
        data-a="detail" data-id="${esc(t.id)}">
        旅程を見る →
      </button>

      <button class="btn alt"
        data-a="copy" data-id="${esc(t.id)}">
        コピーして編集
      </button>
    </article>
  `;
}

function stats(){
  const values={
    PLANNING:trips.filter(
      t=>t.status==="planning"
    ).length,
    COMPLETED:trips.filter(
      t=>t.status==="completed"
    ).length,
    POST:trips.filter(
      t=>t.published
    ).length,
    SAVED:bookmarks.length
  };

  return `<div class="stats">
    ${Object.entries(values).map(([k,n])=>`
      <div class="stat">
        <b>${n}</b>
        <small>${k}</small>
      </div>
    `).join("")}
  </div>`;
}

/* ========================================
   07. HOME
======================================== */

function renderHome(){
  app.innerHTML=`
    <div class="eyebrow">
      YOUR JOURNEY, OUR STORY
    </div>

    <h1>
      誰かの旅から、<br>
      次の旅がはじまる。
    </h1>

    <p>
      実際の旅程を参考に、<br>
      自分だけの旅を紡いでいこう。
    </p>

    <button class="btn" data-a="new">
      ＋ 新しい旅を計画
    </button>

    <button class="btn alt"
      data-a="page" data-id="search">
      旅程を探す
    </button>

    <div class="notice">
      <b>LOCAL STUDIO ver.5.0</b><br>
      現在はログイン不要の開発モードです。
      旅程はこのブラウザ内に保存されます。
      他の端末とは同期されません。
    </div>

    ${stats()}

    <h2>あなたの旅</h2>

    ${trips.slice(0,4).map(card).join("")
      ||'<div class="empty">まだ旅程がありません。</div>'}

    <h2>旅のインスピレーション</h2>

    ${SAMPLES.map(card).join("")}
  `;
}

/* ========================================
   08. SEARCH
======================================== */

function renderSearch(){
  app.innerHTML=`
    <div class="eyebrow">
      FIND YOUR NEXT TRIP
    </div>

    <h2>旅程を探す</h2>

    <div class="panel">

      <div class="search-step">

        ${searchStep===1?`
          <h3>01｜目的地</h3>

          <label>行きたい場所
            <input id="search-q"
              value="${esc(search.q)}"
              placeholder="例：京都、イタリア">
          </label>

          <button class="btn"
            data-a="search-step" data-id="2">
            次へ →
          </button>
        `:""}

        ${searchStep===2?`
          <h3>02｜旅行日数・同行者</h3>

          <label>旅行日数
            <select id="search-days">
              <option value="">すべて</option>
              ${Array.from({length:14},(_,i)=>i+1)
                .map(n=>`
                  <option value="${n}"
                    ${search.days===String(n)
                      ?"selected":""}>
                    ${n}日間
                  </option>
                `).join("")}
            </select>
          </label>

          <label>人数
            <select id="search-people">
              <option value="">すべて</option>
              ${Array.from({length:10},(_,i)=>i+1)
                .map(n=>`
                  <option value="${n}"
                    ${search.people===String(n)
                      ?"selected":""}>
                    ${n}人
                  </option>
                `).join("")}
            </select>
          </label>

          <button class="btn alt"
            data-a="search-step" data-id="1">
            ← 戻る
          </button>

          <button class="btn"
            data-a="search-step" data-id="3">
            次へ →
          </button>
        `:""}

        ${searchStep===3?`
          <h3>03｜旅行スタイル</h3>

          <label>旅行スタイル
            <select id="search-style">
              ${options(STYLES,search.style)}
            </select>
          </label>

          <label>旅程の種類
            <select id="search-status">
              <option value="">すべて</option>
              <option value="completed"
                ${search.status==="completed"
                  ?"selected":""}>
                実際に行った旅
              </option>
              <option value="planning"
                ${search.status==="planning"
                  ?"selected":""}>
                旅行計画
              </option>
            </select>
          </label>

          <button class="btn alt"
            data-a="search-step" data-id="2">
            ← 戻る
          </button>

          <button class="btn"
            data-a="search-run">
            この条件で検索
          </button>
        `:""}

      </div>

      <button class="btn alt"
        data-a="search-reset">
        条件をリセット
      </button>
    </div>

    <div id="search-results"></div>
  `;

  renderResults();
}

function rememberSearch(){
  const fields={
    "search-q":"q",
    "search-days":"days",
    "search-people":"people",
    "search-style":"style",
    "search-status":"status"
  };

  for(const [id,key] of Object.entries(fields)){
    const el=document.getElementById(id);
    if(el)search[key]=el.value;
  }
}

function runSearch(){
  rememberSearch();

  searchResults=[...trips,...SAMPLES].filter(t=>{
    const q=search.q.toLowerCase();

    if(q&&![
      t.title,t.destination,t.description
    ].join(" ").toLowerCase().includes(q)){
      return false;
    }

    if(search.days&&
      schedule(t).length!==+search.days){
      return false;
    }

    if(search.people&&
      +t.people!==+search.people){
      return false;
    }

    if(search.style&&t.style!==search.style){
      return false;
    }

    if(search.status&&t.status!==search.status){
      return false;
    }

    return true;
  });

  renderResults();
}

function renderResults(){
  const el=document.getElementById("search-results");
  if(!el)return;

  el.innerHTML=`

/* ========================================
   11. ROUTE MAP
======================================== */

function routePoints(t){
  const points=[];

  schedule(t).forEach((d,di)=>{
    (d.stops||[]).forEach((s,si)=>{
      if(validCoords(s.coords)){
        points.push({
          lat:+s.coords[0],
          lng:+s.coords[1],
          name:s.name,
          di,si,
          travel:s.travelMinutes
        });
      }
    });
  });

  return points;
}

function projectPoints(points,w,h){
  if(!points.length)return [];

  const minLat=Math.min(...points.map(p=>p.lat));
  const maxLat=Math.max(...points.map(p=>p.lat));
  const minLng=Math.min(...points.map(p=>p.lng));
  const maxLng=Math.max(...points.map(p=>p.lng));

  const meanLat=(minLat+maxLat)/2;
  const cos=Math.max(
    .1,Math.cos(meanLat*Math.PI/180)
  );

  const xSpan=Math.max(
    .005,(maxLng-minLng)*cos
  );
  const ySpan=Math.max(
    .005,maxLat-minLat
  );

  const scale=Math.min(
    (w-120)/xSpan,
    (h-150)/ySpan
  );

  const centerLng=(minLng+maxLng)/2;
  const centerLat=(minLat+maxLat)/2;

  return points.map(p=>({
    ...p,
    x:w/2+(p.lng-centerLng)*cos*scale,
    y:h/2-(p.lat-centerLat)*scale
  }));
}

function routeSVG(t){
  const w=600,h=520;

  const points=projectPoints(
    routePoints(t),w,390
  ).map(p=>({...p,y:p.y+60}));

  let shapes="";

  schedule(t).forEach((d,di)=>{
    const ps=points.filter(p=>p.di===di);

    for(let i=1;i<ps.length;i++){
      const a=ps[i-1];
      const b=ps[i];
      const color=COLORS[di%COLORS.length];

      shapes+=`
        <path d="M${a.x},${a.y}
          Q${(a.x+b.x)/2+15},
          ${(a.y+b.y)/2-18}
          ${b.x},${b.y}"
          fill="none"
          stroke="${color}"
          stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="10 7"/>
      `;

      if(num(b.travel)){
        shapes+=`
          <text x="${(a.x+b.x)/2}"
            y="${(a.y+b.y)/2-13}"
            text-anchor="middle"
            font-size="12"
            fill="#493c30">
            ${esc(b.travel)}分
          </text>
        `;
      }
    }
  });

  points.forEach(p=>{
    const color=COLORS[p.di%COLORS.length];

    shapes+=`
      <circle cx="${p.x}" cy="${p.y}"
        r="16" fill="${color}"
        stroke="#fffdf8"
        stroke-width="3"/>

      <text x="${p.x}" y="${p.y+5}"
        text-anchor="middle"
        font-size="14"
        font-weight="bold"
        fill="white">
        ${p.si+1}
      </text>
    `;
  });

  const legend=schedule(t).map((d,i)=>`
    <circle cx="${25+(i%3)*190}"
      cy="${425+Math.floor(i/3)*23}"
      r="6"
      fill="${COLORS[i%COLORS.length]}"/>

    <text x="${38+(i%3)*190}"
      y="${430+Math.floor(i/3)*23}"
      font-size="13"
      fill="#493c30">
      ${esc(d.name)}
    </text>
  `).join("");

  return `
    <svg class="route-svg"
      viewBox="0 0 600 520"
      xmlns="http://www.w3.org/2000/svg">

      <rect width="600" height="520"
        fill="#f3eddf"/>

      <text x="30" y="37"
        font-family="Georgia,serif"
        font-size="25"
        fill="#59634a">
        THE JOURNEY MAP
      </text>

      ${shapes}
      ${legend}

      <text x="300" y="505"
        text-anchor="middle"
        font-size="11"
        fill="#857c6d">
        Illustrated route / Not to scale
      </text>
    </svg>
  `;
}

function updateField(el){
  if(!draft)return;

  if(el.dataset.field){
    const key=el.dataset.field;
    draft[key]=key==="published"
      ?el.checked:el.value;
    return;
  }

  if(el.dataset.dayField){
    const d=schedule(draft)[+el.dataset.day];
    if(d)d[el.dataset.dayField]=el.value;
    return;
  }

  if(el.dataset.spotField){
    const di=+el.dataset.di;
    const si=+el.dataset.si;
    const s=schedule(draft)[di]?.stops[si];
    if(!s)return;

    const key=el.dataset.spotField;

    if(key==="lat"||key==="lng"){
      const c=Array.isArray(s.coords)
        ?[...s.coords]:["",""];

      c[key==="lat"?0:1]=el.value;
      s.coords=c;
    }else{
      s[key]=el.value;
    }
  }
}

function saveTrip(){
  if(!draft)return;

  if(!draft.title.trim()){
    alert("旅のタイトルを入力してください。");
    return;
  }

  draft.people=Math.max(
    1,parseInt(draft.people)||1
  );

  draft.updated_at=new Date().toISOString();

  const t=normalize(draft);

  const i=trips.findIndex(x=>x.id===t.id);

  if(i>=0){
    trips[i]=t;
  }else{
    trips.unshift(t);
  }

  if(!save())return;

  draft=null;
  editingId="";
  go("detail",t.id);
}

/* ========================================
   14. EDIT ACTIONS
======================================== */

function move(arr,from,to){
  if(to<0||to>=arr.length)return;
  const [x]=arr.splice(from,1);
  arr.splice(to,0,x);
}

function editAction(a,di,si,pi){
  if(!draft)return;

  const days=schedule(draft);
  const d=days[di];
  const s=d?.stops[si];

  switch(a){
    case "day-add":
      days.push({
        name:"Day "+(days.length+1),
        stops:[]
      });
      break;

    case "day-delete":
      if(days.length<=1){
        alert("Dayは最低1つ必要です。");
        return;
      }
      if(!confirm("このDayを削除しますか？"))return;
      days.splice(di,1);
      break;

    case "day-up":
      move(days,di,di-1);
      break;

    case "day-down":
      move(days,di,di+1);
      break;

    case "spot-add":
      d.stops.push({
        uid:uid(),
        name:"",
        time:"09:00",
        stayMinutes:"",
        travelMinutes:"",
        transport:"",
        comment:"",
        cost:"",
        costCategory:"other",
        photos:[]
      });
      break;

    case "spot-delete":
      if(!confirm("このスポットを削除しますか？"))return;
      d.stops.splice(si,1);
      break;

    case "spot-up":
      move(d.stops,si,si-1);
      break;

    case "spot-down":
      move(d.stops,si,si+1);
      break;

    case "photo-delete":
      s.photos.splice(pi,1);
      break;

    case "photo-up":
      move(s.photos,pi,pi-1);
      break;

    case "photo-down":
      move(s.photos,pi,pi+1);
      break;
  }

  renderEditor();
}

async function addPhotos(files,di,si){
  if(!draft)return;

  const s=schedule(draft)[di]?.stops[si];
  if(!s)return;

  for(const file of files){
    if(!file.type.startsWith("image/"))continue;

    try{
      const url=await resizeImage(file,1000,0.72);
      s.photos.push({id:uid(),url});
    }catch(e){
      console.error(e);
      alert("写真の読み込みに失敗しました。");
    }
  }

  renderEditor();
}

function resizeImage(file,maxSize,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onerror=()=>reject(
      new Error("ファイル読み込み失敗")
    );

    reader.onload=()=>{
      const img=new Image();

      img.onerror=()=>reject(
        new Error("画像読み込み失敗")
      );

      img.onload=()=>{
        const scale=Math.min(
          1,maxSize/Math.max(img.width,img.height)
        );

        const canvas=document.createElement("canvas");
        canvas.width=Math.max(
          1,Math.round(img.width*scale)
        );
        canvas.height=Math.max(
          1,Math.round(img.height*scale)
        );

        const ctx=canvas.getContext("2d");
        ctx.drawImage(
          img,0,0,canvas.width,canvas.height
        );

        resolve(
          canvas.toDataURL("image/jpeg",quality)
        );
      };

      img.src=reader.result;
    };

    reader.readAsDataURL(file);
  });
}

/* ========================================

======================================== */

function toggleBookmark(id){
  const i=bookmarks.indexOf(id);

  if(i>=0){
    bookmarks.splice(i,1);
  }else{
    bookmarks.push(id);
  }

  save();
  render();
}

function toggleStatus(id){
  const t=trips.find(t=>t.id===id);
  if(!t)return;

  t.status=t.status==="completed"
    ?"planning":"completed";

  t.updated_at=new Date().toISOString();

  save();
  render();
}

function togglePublish(id){
  const t=trips.find(t=>t.id===id);
  if(!t)return;

  t.published=!t.published;
  t.updated_at=new Date().toISOString();

  save();
  render();
}

function deleteTrip(id){
  if(!confirm("この旅程を削除しますか？"))return;

  trips=trips.filter(t=>t.id!==id);
  bookmarks=bookmarks.filter(x=>x!==id);

  save();
  render();
}

/* ========================================
   16. INSTAGRAM EXPORT
======================================== */

function canvasText(ctx,text,x,y,maxWidth,lineHeight,maxLines=8){
  const chars=Array.from(String(text||""));
  let line="";
  let lines=0;

  for(const ch of chars){
    const test=line+ch;

    if(ctx.measureText(test).width>maxWidth&&line){
      ctx.fillText(line,x,y);
      y+=lineHeight;
      lines++;

      if(lines>=maxLines)return y;

      line=ch;
    }else{
      line=test;
    }
  }

  if(line){
    ctx.fillText(line,x,y);
    y+=lineHeight;
  }

  return y;
}

function roundRect(ctx,x,y,w,h,r,fill){
  ctx.fillStyle=fill;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function drawBase(ctx,w,h,t){
  ctx.fillStyle="#f7f4ec";
  ctx.fillRect(0,0,w,h);

  ctx.fillStyle="#59634a";
  ctx.fillRect(0,0,w,18);

  ctx.fillStyle="#59634a";
  ctx.font="bold 45px Georgia";
  ctx.textAlign="center";
  ctx.fillText("TUMUGOU",w/2,95);

  ctx.fillStyle="#857c6d";
  ctx.font="20px sans-serif";
  ctx.fillText(
    "YOUR JOURNEY, OUR STORY",
    w/2,128
  );

  ctx.fillStyle="#493c30";
  ctx.textAlign="left";
}

function makeCanvas(){
  const c=document.createElement("canvas");

  c.width=1080;
  c.height=exportRatio==="4:5"?1350:1920;

  return c;
}

function renderExport(){
  if(!exportTrip){
    go("my");
    return;
  }

  const t=exportTrip;

  exportPages=[
    {type:"cover",title:"表紙"},
    {type:"map",title:"全体ルート"},
    ...schedule(t).map((d,i)=>({
      type:"day",
      index:i,
      title:"Day "+(i+1)
    }))
  ];

  if(exportIndex>=exportPages.length){
    exportIndex=0;
  }

  app.innerHTML=`
    <div class="eyebrow">
      SHARE YOUR JOURNEY
    </div>

    <h2>Instagram画像を作る</h2>

    <div class="panel">
      <label>画像サイズ
        <select id="export-ratio">
          <option value="4:5"
            ${exportRatio==="4:5"?"selected":""}>
            4:5｜Instagram投稿
          </option>
          <option value="9:16"
            ${exportRatio==="9:16"?"selected":""}>
            9:16｜ストーリーズ
          </option>
        </select>
      </label>

      <label>出力ページ
        <select id="export-page">
          ${exportPages.map((p,i)=>`
            <option value="${i}"
              ${exportIndex===i?"selected":""}>
              ${esc(p.title)}
            </option>
          `).join("")}
        </select>
      </label>

      <button class="btn"
        data-a="export-save">
        このページを画像保存
      </button>

      <button class="btn alt"
        data-a="export-share">
        このページを共有
      </button>

      <p class="muted">
        写真が多いDayは、
        一部のスポットが画像内に収まらない
        場合があります。
      </p>

      <canvas id="export-canvas"
        class="export-preview"></canvas>
    </div>
  `;

  drawExport();
}

function drawExport(){
  const canvas=document.getElementById(
    "export-canvas"
  );

  if(!canvas||!exportTrip)return;

  const temp=makeCanvas();
  canvas.width=temp.width;
  canvas.height=temp.height;

  const ctx=canvas.getContext("2d");
  const w=canvas.width;
  const h=canvas.height;
  const t=exportTrip;
  const p=exportPages[exportIndex];

  drawBase(ctx,w,h,t);

  if(p.type==="cover"){
    ctx.textAlign="center";

    ctx.fillStyle="#e5d8c3";
    ctx.fillRect(65,185,w-130,h-360);

    ctx.fillStyle="#59634a";
    ctx.font="bold 38px Georgia";
    ctx.fillText("TRAVEL JOURNAL",w/2,285);

    ctx.fillStyle="#493c30";
    ctx.font="bold 68px serif";

    canvasText(
      ctx,t.title,w/2,420,w-210,95,5
    );

    ctx.fillStyle="#59634a";
    ctx.font="32px sans-serif";
    ctx.fillText(
      t.destination||"MY JOURNEY",
      w/2,h-320
    );

    ctx.font="28px sans-serif";
    ctx.fillText(
      schedule(t).length+" DAYS",
      w/2,h-255
    );
  }

  if(p.type==="map"){
    ctx.textAlign="center";
    ctx.fillStyle="#493c30";
    ctx.font="bold 48px serif";
    ctx.fillText("THE JOURNEY MAP",w/2,210);

    const points=projectPoints(
      routePoints(t),w-120,h-430
    ).map(q=>({
      ...q,
      x:q.x+60,
      y:q.y+260
    }));

    schedule(t).forEach((d,di)=>{
      const ps=points.filter(q=>q.di===di);

      ctx.strokeStyle=COLORS[di%COLORS.length];
      ctx.lineWidth=8;
      ctx.setLineDash([18,12]);

      ctx.beginPath();

      ps.forEach((q,i)=>{
        if(i===0)ctx.moveTo(q.x,q.y);
        else ctx.lineTo(q.x,q.y);
      });

      ctx.stroke();
      ctx.setLineDash([]);
    });

    points.forEach(q=>{
      ctx.fillStyle=COLORS[q.di%COLORS.length];
      ctx.beginPath();
      ctx.arc(q.x,q.y,23,0,Math.PI*2);
      ctx.fill();

      ctx.fillStyle="white";
      ctx.textAlign="center";
      ctx.font="bold 25px sans-serif";
      ctx.fillText(q.si+1,q.x,q.y+8);
    });

    ctx.textAlign="left";
    ctx.font="25px sans-serif";

    schedule(t).forEach((d,i)=>{
      ctx.fillStyle=COLORS[i%COLORS.length];
      ctx.fillText(
        "● Day "+(i+1)+" "+d.name,
        90,h-190+i*32
      );
    });
  }

  if(p.type==="day"){
    const d=schedule(t)[p.index];

    ctx.textAlign="left";
    ctx.fillStyle=COLORS[p.index%COLORS.length];
    ctx.font="bold 54px Georgia";
    ctx.fillText(
      "DAY "+(p.index+1),75,220
    );

    ctx.fillStyle="#493c30";
    ctx.font="bold 37px serif";

    canvasText(
      ctx,d.name,75,285,w-150,48,2
    );

    const available=h-460;
    const items=d.stops||[];
    const rowH=Math.min(
      205,available/Math.max(items.length,1)
    );

    let y=370;

    items.forEach((s,i)=>{
      if(y+rowH>h-80)return;

      roundRect(
        ctx,65,y,w-130,rowH-12,16,
        "#fffdf8"
      );

      ctx.fillStyle=COLORS[p.index%COLORS.length];
      ctx.font="bold 28px sans-serif";
      ctx.fillText(
        (s.time||"--:--")+"  "+(i+1),
        90,y+45
      );

      ctx.fillStyle="#493c30";
      ctx.font="bold 32px sans-serif";

      canvasText(
        ctx,s.name||"訪問スポット",
        90,y+88,w-190,39,2
      );

      ctx.fillStyle="#857c6d";
      ctx.font="22px sans-serif";

      const details=[
        num(s.stayMinutes)
          ?"滞在 "+s.stayMinutes+"分":"",
        num(s.travelMinutes)&&i
          ?"移動 "+s.travelMinutes+"分":"",
        num(s.cost)
          ?money(+s.cost):""
      ].filter(Boolean).join(" / ");

      ctx.fillText(
        details.slice(0,45),
        90,y+rowH-35
      );

      y+=rowH;
    });
  }

  ctx.textAlign="center";
  ctx.fillStyle="#857c6d";
  ctx.font="20px Georgia";
  ctx.fillText(
    "TUMUGOU • Someone's journey becomes yours.",
    w/2,h-35
  );
}

function exportStart(id){
  const t=find(id);
  if(!t)return;

  exportTrip=normalize(t);
  exportIndex=0;
  go("export");
}

function canvasBlob(canvas){
  return new Promise((resolve,reject)=>{
    canvas.toBlob(
      b=>b?resolve(b):reject(
        new Error("画像を生成できませんでした")
      ),
      "image/png"
    );
  });
}

async function exportImage(share=false){
  const canvas=document.getElementById(
    "export-canvas"
  );

  if(!canvas)return;

  const blob=await canvasBlob(canvas);
  const name="TUMUGOU_"+exportIndex+".png";

  if(share&&navigator.share&&navigator.canShare){
    const file=new File([blob],name,{
      type:"image/png"
    });

    if(navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
      return;
    }
  }

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=name;
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

/* ========================================
   17. BACKUP / RESTORE
======================================== */

function backup(){
  const data={
    version:VERSION,
    exportedAt:new Date().toISOString(),
    trips,
    bookmarks
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="tumugou_backup.json";
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

async function restore(file){
  if(!file)return;

  let data;

  try{
    data=JSON.parse(await file.text());
  }catch(e){
    alert("JSONファイルを読み込めません。");
    return;
  }

  if(!Array.isArray(data.trips)){
    alert("TUMUGOUのバックアップ形式ではありません。");
    return;
  }

  if(!confirm(
    "現在の旅程をバックアップの内容で置き換えますか？"
  ))return;

  const oldTrips=trips;
  const oldBookmarks=bookmarks;

  trips=data.trips.map(normalize);
  bookmarks=Array.isArray(data.bookmarks)
    ?data.bookmarks:[];

  if(!save()){
    trips=oldTrips;
    bookmarks=oldBookmarks;
    return;
  }

  alert("復元しました。");
  go("my");
}

/* ========================================
   19. EVENTS
======================================== */

document.addEventListener("input",e=>{
  const el=e.target;

  if(
    el.dataset.field||
    el.dataset.dayField||
    el.dataset.spotField
  ){
    updateField(el);
  }
});

document.addEventListener("change",async e=>{
  const el=e.target;

  if(el.dataset.photoDi!==undefined){
    await addPhotos(
      [...el.files],
      +el.dataset.photoDi,
      +el.dataset.photoSi
    );
  }

  if(el.id==="export-ratio"){
    exportRatio=el.value;
    renderExport();
  }

  if(el.id==="export-page"){
    exportIndex=+el.value;
    drawExport();
  }
});

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");
  if(!b)return;

  const a=b.dataset.a;
  const id=b.dataset.id||"";
  const di=+b.dataset.di;
  const si=+b.dataset.si;
  const pi=+b.dataset.pi;

  try{
    switch(a){
      case "page":
        go(id);
        break;

      case "detail":
        go("detail",id);
        break;

      case "new":
        startNew();
        break;

      case "new-publish":
        startNew(true);
        break;

      case "edit":
        startEdit(id);
        break;

      case "copy":
        startCopy(id);
        break;

      case "save-trip":
        saveTrip();
        break;

      case "tab":
        tab=id;
        renderMy();
        break;

      case "bookmark":
        toggleBookmark(id);
        break;

      case "status":
        toggleStatus(id);
        break;

      case "publish":
        togglePublish(id);
        break;

      case "delete":
        deleteTrip(id);
        break;

      case "search-step":
        rememberSearch();
        searchStep=+id;
        renderSearch();
        break;

      case "search-run":
        runSearch();
        break;

      case "search-reset":
        search={
          q:"",
          days:"",
          people:"",
          style:"",
          status:""
        };
        searchStep=1;
        searchResults=[];
        renderSearch();
        break;

      case "export":
        exportStart(id);
        break;

      case "export-save":
        await exportImage(false);
        break;

      case "export-share":
        await exportImage(true);
        break;

      case "backup":
        backup();
        break;

      case "restore":
        await restore(
          document.getElementById(
            "restore-file"
          )?.files[0]
        );
        break;

      default:
        if(
          a.startsWith("day-")||
          a.startsWith("spot-")||
          a.startsWith("photo-")
        ){
          editAction(a,di,si,pi);
        }
    }
  }catch(err){
    console.error(err);
    alert(
      "操作に失敗しました："+
      (err.message||String(err))
    );
  }
});
