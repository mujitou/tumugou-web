:root{
 --bg:#f8f5ee;
 --paper:#fffefa;
 --sand:#e9dfcc;
 --brown:#493c30;

*{box-sizing:border-box}

body{

 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;

header{

}

header strong{

}

header small{

 font-size:11px;

main{

h1,h2,h3{line-height:1.35}
h2{font-size:25px}
h3{font-size:18px}
p{line-height:1.7}

.card,.panel{

 margin:4px 4px 4px 0;

}

.btn.danger{

 color:#88493c;
}

.btn:disabled{

 cursor:not-allowed;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:4px;
}

label{
 display:block;
 font-size:13px;
 font-weight:600;
 margin:12px 0;
}

input,select,textarea{
 display:block;
 width:100%;
 padding:11px;
 margin-top:6px;
 border:1px solid #d3c8b8;
 border-radius:8px;
 background:white;
 color:var(--brown);
 font:inherit;
}

textarea{min-height:90px}

.row{
 display:flex;
 gap:9px;
}

.row>*{
 flex:1;
 min-width:0;
}

.muted{
 color:var(--muted);
 font-size:12px;
}

.eyebrow{
 font-size:11px;
 letter-spacing:2px;
 color:var(--olive);
 font-weight:bold;
}

.notice{

 padding:13px;
 border-radius:10px;
 font-size:13px;

}

.warn{
 background:#fff0e6;
 color:#925333;
 padding:12px;
 border-radius:9px;
 font-size:13px;
}

.ok{
 background:#e8efe4;
 color:#42613e;
 padding:12px;
 border-radius:9px;
 font-size:13px;
}

.tag{
 display:inline-block;
 background:#e9eee3;
 color:var(--olive);
 padding:5px 9px;
 border-radius:20px;
 font-size:11px;
 margin:5px 4px 5px 0;
}

.hero{
 height:190px;
 background:linear-gradient(120deg,#bac6b4,#ead4b7);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:65px;

 overflow:hidden;

.hero img{

.day{

}

.spot{
 background:#f6f2e9;
 padding:13px;
 border-radius:11px;
 margin:12px 0;
}

.photo{
 width:100%;

 object-fit:cover;
 border-radius:9px;
 margin-top:9px;

.map{
 height:360px;
 border-radius:12px;
 margin:14px 0;

.travel{

 padding:9px;
 margin:8px 0;

.pin{

 height:30px;

 border:2px solid white;
 display:flex;
 align-items:center;
 justify-content:center;
 color:white;

nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 display:flex;
 background:var(--paper);
 border-top:1px solid var(--line);
 z-index:1000;
 padding-bottom:env(safe-area-inset-bottom);
}

nav button{

 background:transparent;
 padding:13px 0;

 font-size:11px;

nav button.active{

.tabs{

 overflow:auto;

.stats{

.stat{

.template-scrapbook .day{

}

.loading{
 text-align:center;

/* =====================================================
   UTILITIES
===================================================== */

function uid(){
 return 't'+Date.now().toString(36)+
 Math.random().toString(36).slice(2,9);
}

function clone(x){
 return JSON.parse(JSON.stringify(x));
}

function esc(x){
 return String(x??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function numberValue(x){
 return x!==''&&x!=null&&Number.isFinite(+x);
}

function validCoords(x){
 return Array.isArray(x)&&
 x.length===2&&
 x.every(v=>Number.isFinite(+v))&&
 Math.abs(+x[0])<=90&&
 Math.abs(+x[1])<=180;
}

function money(n){
 return Math.round(n).toLocaleString('ja-JP')+'円';
}

function getSchedule(t){
 return t?.itinerary?.schedule||[];
}

function spotCount(t){
 return getSchedule(t).reduce(
  (n,d)=>n+(d.stops||[]).length,0
 );
}

function totalCost(t){
 return getSchedule(t).reduce(
  (sum,d)=>sum+(d.stops||[]).reduce(
   (a,s)=>a+(numberValue(s.cost)?+s.cost:0),0
  ),0
 );
}

function isOwner(t){
 return !!currentUser&&t.user_id===currentUser.id;
}

function findTrip(id){
 return [
  ...trips,
  ...publicTrips,
  ...SAMPLES
 ].find(t=>t.id===id);
}

function firstPhoto(t){
 for(const d of getSchedule(t)){
  for(const s of d.stops||[]){
   if(s.photo)return s.photo;
  }
 }
 return '';
}

function safeImage(src,cls='photo'){
 if(!src)return '';
 try{
  const u=new URL(src,location.href);
  if(!['https:','http:'].includes(u.protocol))return '';
  return `<img class="${cls}" src="${esc(u.href)}" alt="">`;
 }catch(e){
  return '';
 }
}

function normalizeTrip(t){
 const x=clone(t);

 if(!x.itinerary)x.itinerary={schedule:[]};
 if(!Array.isArray(x.itinerary.schedule)){
  x.itinerary.schedule=[];
 }

 x.template=TEMPLATES[x.template]?
 x.template:'scrapbook';

 x.status=x.status==='completed'?
 'completed':'planning';

 x.people=Math.max(
  1,Math.min(99,parseInt(x.people)||1)
 );

 x.itinerary.schedule=x.itinerary.schedule.map(
  (d,i)=>({
   name:d.name||'Day '+(i+1),
   stops:(d.stops||[]).map(s=>({
    ...s,
    uid:s.uid||uid(),
    name:s.name||'',
    time:s.time||'09:00',
    stayMinutes:s.stayMinutes??'',
    travelMinutes:s.travelMinutes??'',
    transport:s.transport||'',
    comment:s.comment||'',
    cost:s.cost??'',
    costCategory:s.costCategory||'other',
    photo:s.photo||''
   }))
  })
 );

 return x;
}

function showError(error){
 console.error(error);
 alert(error?.message||String(error));
}

function requireLogin(){
 if(currentUser)return true;
 alert('この機能を使うにはログインしてください。');
 go('account');
 return false;
}

function setBusy(value){
 busy=value;
 document.querySelectorAll('[data-action]').forEach(
  el=>{
   if(value)el.disabled=true;
  }
 );
}

function configured(){
 return SUPABASE_URL.startsWith('https://')&&
 SUPABASE_URL.includes('.supabase.co')&&
 SUPABASE_KEY.startsWith('sb_publishable_');
}

/* =====================================================
   SUPABASE INITIALIZATION
===================================================== */

async function initialize(){
 if(!configured()){
  app.innerHTML=`
   <div class="panel">
    <h2>Supabaseの設定が必要です</h2>
    <p>
     index.htmlの冒頭にある
     SUPABASE_URLとSUPABASE_KEYを
     設定してください。
    </p>
    <div class="warn">
     Secret keyではなく、
     Publishable keyを使用してください。
    </div>
   </div>`;
  return;
 }

 if(!window.supabase){
  app.innerHTML=`
   <div class="warn">
    Supabaseライブラリを読み込めませんでした。
    インターネット接続を確認してください。
   </div>`;
  return;
 }

 try{
  sb=window.supabase.createClient(
   SUPABASE_URL,
   SUPABASE_KEY
  );

  const {data,error}=await sb.auth.getUser();

  if(error){
   console.warn('Auth:',error.message);
  }

  currentUser=data?.user||null;

  sb.auth.onAuthStateChange((event,session)=>{
   const nextUser=session?.user||null;
   const changed=currentUser?.id!==nextUser?.id;

   currentUser=nextUser;

   if(changed){
    setTimeout(async()=>{
     await loadData();
     go('home');
    },0);
   }
  });

  await loadData();
  go('home');

 }catch(e){
  console.error(e);
  app.innerHTML=`
   <div class="warn">
    初期化に失敗しました。
    Supabaseの接続情報を確認してください。
   </div>`;
 }
}

/* =====================================================
   CLOUD DATA
===================================================== */

async function loadData(){
 if(!sb)return;

 try{
  if(currentUser){
   const {data,error}=await sb
    .from('trips')
    .select('*')
    .eq('user_id',currentUser.id)
    .order('updated_at',{ascending:false})
    .limit(200);

   if(error)throw error;

   trips=(data||[]).map(normalizeTrip);

   const saved=await sb
    .from('bookmarks')
    .select('trip_id')
    .eq('user_id',currentUser.id);

   if(saved.error)throw saved.error;

   bookmarks=(saved.data||[]).map(x=>x.trip_id);

  }else{
   trips=[];
   bookmarks=[];
  }

  const result=await sb
   .from('trips')
   .select('*')
   .eq('published',true)
   .order('updated_at',{ascending:false})
   .limit(100);

  if(result.error)throw result.error;

  publicTrips=(result.data||[]).map(normalizeTrip);

 }catch(e){
  console.error(e);
  alert(
   'クラウドデータの読み込みに失敗しました。\n'+
   e.message
  );
 }
}

async function refresh(){
 await loadData();
 render();
}

async function submitAuth(){
 if(busy)return;

 const email=document.getElementById(
  'auth-email'
 )?.value.trim();

 const password=document.getElementById(
  'auth-password'
 )?.value||'';

 if(!email||!password){
  return alert('メールアドレスとパスワードを入力してください。');
 }

 if(password.length<6){
  return alert('パスワードは6文字以上にしてください。');
 }

 setBusy(true);

 try{
  let result;

  if(authMode==='signup'){
   result=await sb.auth.signUp({
    email,
    password,
    options:{
     emailRedirectTo:
      location.origin+location.pathname
    }
   });
  }else{
   result=await sb.auth.signInWithPassword({
    email,
    password
   });
  }

  if(result.error)throw result.error;

  if(authMode==='signup'&&!result.data.session){
   alert(
    '登録を受け付けました。\n'+
    'メールに届いた確認リンクを開いてください。'
   );
   authMode='login';
   renderAccount();
  }else{
   currentUser=result.data.user;
   await loadData();
   go('home');
  }

 }catch(e){
  showError(e);
 }finally{
  setBusy(false);
 }
}

async function logout(){
 if(!confirm('ログアウトしますか？'))return;

 const {error}=await sb.auth.signOut();

 if(error)return showError(error);

 currentUser=null;
 trips=[];
 bookmarks=[];
 draft=null;
 editingId='';

 await loadData();
 go('home');
}

function stats(){
 const values={
  PLANNING:trips.filter(
   t=>t.status==='planning'
  ).length,
  COMPLETED:trips.filter(
   t=>t.status==='completed'
  ).length,
  POST:trips.filter(
   t=>t.published
  ).length,
  SAVED:bookmarks.length
 };

 return `
  <div class="stats">
   ${Object.entries(values).map(
    ([name,value])=>`
     <div class="stat">
      <b>${value}</b>
      <small>${name}</small>
     </div>`
   ).join('')}
  </div>`;
}

function renderResults(){
 const el=document.getElementById(
  'search-results'
 );

 if(!el)return;

 const q=search.q.toLowerCase();

 const list=[
  ...publicTrips,
  ...SAMPLES
 ].filter(t=>{
  const text=[
   t.title,
   t.destination,
   t.description,
   ...getSchedule(t).flatMap(
    d=>(d.stops||[]).map(s=>s.name)
   )
  ].join(' ').toLowerCase();

  return text.includes(q)&&
   (!search.days||
    getSchedule(t).length===+search.days)&&
   (!search.style||
    t.style===search.style)&&
   (!search.status||
    t.status===search.status);
 });

 el.innerHTML=`

  ${list.map(card).join('')||
   '<p>該当する旅程はありません。</p>'}

function drawMap(t){
 const el=document.getElementById('trip-map');

 if(!el||!t)return;

 if(typeof L==='undefined'){
  el.textContent='地図を読み込めませんでした。';
  return;
 }

 try{
  map=L.map(el,{
   scrollWheelZoom:false
  });

  L.tileLayer(
   'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
   {
    attribution:'&copy; OpenStreetMap contributors',
    maxZoom:19
   }
  ).addTo(map);

  const bounds=[];

  getSchedule(t).forEach((d,di)=>{
   let previous=null;

   const color=COLORS[di%COLORS.length];

   (d.stops||[]).forEach((s,si)=>{
    if(!validCoords(s.coords)){
     previous=null;
     return;
    }

    const pos=s.coords.map(Number);
    bounds.push(pos);

    L.marker(pos,{
     icon:L.divIcon({
      className:'',
      html:`<div class="pin"
       style="background:${color}">
       ${si+1}
      </div>`,
      iconSize:[30,30],
      iconAnchor:[15,15]
     })
    }).addTo(map).bindPopup(
     esc(d.name)+' / '+esc(s.name)
    );

    if(previous){
     L.polyline(
      [previous,pos],
      {
       color,
       weight:4,
       opacity:.85
      }
     ).addTo(map);
    }

    previous=pos;
   });
  });

  if(bounds.length){
   map.fitBounds(bounds,{
    padding:[35,35],
    maxZoom:13
   });
  }else{
   map.setView([35.6812,139.7671],5);
  }

  setTimeout(()=>{
   if(map)map.invalidateSize();
  },150);

 }catch(e){
  console.error(e);
  el.textContent='地図表示に失敗しました。';
 }
}

function syncEditor(){
 if(!draft)return;

 const fields={
  'trip-title':'title',
  'trip-destination':'destination',
  'trip-description':'description',
  'trip-month':'trip_month',
  'trip-people':'people',
  'trip-style':'style',
  'trip-template':'template',
  'trip-status':'status'
 };

 for(const [id,key] of Object.entries(fields)){
  const el=document.getElementById(id);

  if(el){
   draft[key]=el.value;
  }
 }

 const published=document.getElementById(
  'trip-published'
 );

 if(published){
  draft.published=published.value==='true';
 }

 draft.people=Math.max(
  1,Math.min(99,parseInt(draft.people)||1)
 );

 document.querySelectorAll(
  '[data-dayname]'
 ).forEach(el=>{
  const d=getSchedule(draft)[
   +el.dataset.dayname
  ];

  if(d)d.name=el.value;
 });

 document.querySelectorAll(
  '[data-field]'
 ).forEach(el=>{
  const s=getSchedule(draft)[
   +el.dataset.day
  ]?.stops[+el.dataset.spot];

  if(!s)return;

  const field=el.dataset.field;

  if(field==='name'&&s.name!==el.value){
   s.name=el.value;
   s.lookup='';
   delete s.coords;
   delete s.locationLabel;
  }else{
   s[field]=el.value;
  }
 });
}

function refreshCosts(){
 const a=document.getElementById('total-cost');
 const b=document.getElementById('per-person');

 if(a)a.textContent=money(totalCost(draft));

 if(b){
  b.textContent=money(
   totalCost(draft)/(draft.people||1)
  );
 }
}

function editorChanged(){
 renderDays();
 refreshCosts();
}

/* =====================================================
   DAY OPERATIONS
===================================================== */

function dayAdd(){
 syncEditor();

 const schedule=getSchedule(draft);

 if(schedule.length>=14){
  return alert('最大14日間です。');
 }

 schedule.push({
  name:'Day '+(schedule.length+1),
  stops:[newSpot()]
 });

 editorChanged();
}

function dayDelete(di){
 syncEditor();

 const schedule=getSchedule(draft);

 if(schedule.length<=1)return;

 if(!confirm('このDAYを削除しますか？')){
  return;
 }

 schedule.splice(di,1);
 editorChanged();
}

function dayMove(di,delta){
 syncEditor();

 const schedule=getSchedule(draft);
 const target=di+delta;

 if(target<0||target>=schedule.length)return;

 [
  schedule[di],
  schedule[target]
 ]=[
  schedule[target],
  schedule[di]
 ];

 editorChanged();
}

/* =====================================================
   SPOT OPERATIONS
===================================================== */

function spotAdd(di){
 syncEditor();

 getSchedule(draft)[di].stops.push(
  newSpot()
 );

 editorChanged();
}

function spotDelete(di,si){
 syncEditor();

 if(!confirm('このスポットを削除しますか？')){
  return;
 }

 getSchedule(draft)[di].stops.splice(si,1);
 editorChanged();
}

function spotMove(di,si,delta){
 syncEditor();

 const spots=getSchedule(draft)[di].stops;
 const target=si+delta;

 if(target<0||target>=spots.length)return;

 [
  spots[si],
  spots[target]
 ]=[
  spots[target],
  spots[si]
 ];

 editorChanged();
}

function spotDuplicate(di,si){
 syncEditor();

 const spots=getSchedule(draft)[di].stops;
 const s=clone(spots[si]);

 s.uid=uid();

 spots.splice(si+1,0,s);

 editorChanged();
}

/* =====================================================
   LOCATION SEARCH
===================================================== */

let lookupResults=[];

async function lookupPlace(di,si){
 syncEditor();

 const s=getSchedule(draft)[di]?.stops[si];

 const el=document.getElementById(
  `lookup-${di}-${si}`
 );

 if(!s||!el)return;

 const q=(s.lookup||s.name||'').trim();

 if(!q){
  return alert('検索キーワードを入力してください。');
 }

 el.textContent='検索中...';

 try{
  const params=new URLSearchParams({
   format:'jsonv2',
   q,
   limit:'5',
   'accept-language':'ja,en'
  });

  const response=await fetch(
   'https://nominatim.openstreetmap.org/search?'+
   params
  );

  if(!response.ok){
   throw Error('検索に失敗しました。');
  }

  lookupResults=(await response.json()).map(
   x=>({
    name:x.display_name,
    coords:[+x.lat,+x.lon]
   })
  ).filter(x=>validCoords(x.coords));

  el.innerHTML=lookupResults.map(
   (x,i)=>`
    <div class="card">
     <p class="muted">${esc(x.name)}</p>
     <button class="btn alt"
      data-action="choose-location"
      data-day="${di}"
      data-spot="${si}"
      data-index="${i}">
      この場所を選択
     </button>
    </div>`
  ).join('')||'候補がありません。';

 }catch(e){
  console.error(e);
  el.textContent='場所の検索に失敗しました。';
 }
}

function chooseLocation(di,si,index){
 syncEditor();

 const s=getSchedule(draft)[di]?.stops[si];
 const result=lookupResults[index];

 if(!s||!result)return;

 s.coords=result.coords;
 s.locationLabel=result.name;
 s.lookup=result.name;

 editorChanged();
}

/* =====================================================
   PHOTO UPLOAD
===================================================== */

async function uploadPhoto(file,di,si){
 if(!requireLogin())return;

 if(!file||!file.type.startsWith('image/')){
  return alert('画像ファイルを選択してください。');
 }

 if(file.size>20*1024*1024){
  return alert('20MB以下の画像を選択してください。');
 }

 syncEditor();

 const s=getSchedule(draft)[di]?.stops[si];

 if(!s)return;

 try{
  const url=URL.createObjectURL(file);
  const img=new Image();

  try{
   await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=reject;
    img.src=url;
   });
  }finally{
   URL.revokeObjectURL(url);
  }

  const scale=Math.min(
   1,
   1200/Math.max(img.width,img.height)
  );

  const canvas=document.createElement('canvas');

  canvas.width=Math.max(
   1,Math.round(img.width*scale)
  );

  canvas.height=Math.max(
   1,Math.round(img.height*scale)
  );

  const ctx=canvas.getContext('2d');

  ctx.fillStyle='white';
  ctx.fillRect(
   0,0,canvas.width,canvas.height
  );

  ctx.drawImage(
   img,0,0,canvas.width,canvas.height
  );

  const blob=await new Promise(resolve=>{
   canvas.toBlob(
    resolve,
    'image/jpeg',
    0.75
   );
  });

  if(!blob){
   throw Error('画像変換に失敗しました。');
  }

  const path=
   currentUser.id+'/'+
   uid()+'.jpg';

  const result=await sb.storage
   .from('trip-photos')
   .upload(path,blob,{
    contentType:'image/jpeg',
    upsert:false
   });

  if(result.error)throw result.error;

  const publicUrl=sb.storage
   .from('trip-photos')
   .getPublicUrl(path);

  s.photo=publicUrl.data.publicUrl;

  editorChanged();

  alert('写真をアップロードしました。');

 }catch(e){
  showError(e);
 }
}

/* =====================================================
   SAVE TRIP TO CLOUD
===================================================== */

async function saveTrip(){
 if(!requireLogin())return;
 if(busy)return;

 syncEditor();

 if(!draft.title.trim()||
    !draft.destination.trim()){
  return alert(
   'タイトルと目的地を入力してください。'
  );
 }

 const schedule=getSchedule(draft);

 if(!schedule.length){
  return alert('DAYを追加してください。');
 }

 if(schedule.some(
  d=>!d.stops.length||
  d.stops.some(s=>!s.name.trim())
 )){
  return alert(
   'すべてのDAYに訪問場所を入力してください。'
  );
 }

 for(const d of schedule){
  for(const s of d.stops){
   for(const v of [
    s.stayMinutes,
    s.travelMinutes,
    s.cost
   ]){
    if(v!==''&&v!=null&&
       (!Number.isInteger(+v)||+v<0)){
     return alert(
      '時間と費用は0以上の整数にしてください。'
     );
    }
   }
  }
 }

 const payload={
  user_id:currentUser.id,
  title:draft.title.trim(),
  destination:draft.destination.trim(),
  description:draft.description||'',
  style:draft.style||'',
  trip_month:draft.trip_month||null,
  people:draft.people||1,
  status:draft.status,
  published:!!draft.published,
  template:draft.template,
  itinerary:clone(draft.itinerary),
  updated_at:new Date().toISOString()
 };

 setBusy(true);

 try{
  let result;

  if(editingId){
   result=await sb
    .from('trips')
    .update(payload)
    .eq('id',editingId)
    .eq('user_id',currentUser.id)
    .select()
    .single();

  }else{
   result=await sb
    .from('trips')
    .insert(payload)
    .select()
    .single();
  }

  if(result.error)throw result.error;

  const id=result.data.id;

  draft=null;
  editingId='';

  await loadData();

  go('detail',id);

  alert('旅程をクラウドに保存しました。');

 }catch(e){
  showError(e);
 }finally{
  setBusy(false);
 }
}

/* =====================================================
   UPDATE STATUS / PUBLISH / DELETE
===================================================== */

async function updateTrip(id,changes){
 if(!requireLogin())return;

 const t=trips.find(x=>x.id===id);

 if(!t||!isOwner(t))return;

 try{
  const {error}=await sb
   .from('trips')
   .update({
    ...changes,
    updated_at:new Date().toISOString()
   })
   .eq('id',id)
   .eq('user_id',currentUser.id);

  if(error)throw error;

  await refresh();

 }catch(e){
  showError(e);
 }
}

async function toggleStatus(id){
 const t=trips.find(x=>x.id===id);

 if(!t)return;

 const status=t.status==='completed'?
 'planning':'completed';

 await updateTrip(id,{status});
}

async function togglePublish(id){
 const t=trips.find(x=>x.id===id);

 if(!t)return;

 const published=!t.published;

 if(published&&!confirm(
  'この旅程を他のユーザーに公開しますか？'
 )){
  return;
 }

 await updateTrip(id,{published});
}

async function deleteTrip(id){
 if(!requireLogin())return;

 const t=trips.find(x=>x.id===id);

 if(!t||!isOwner(t))return;

 if(!confirm(
  '「'+t.title+'」を削除しますか？'
 )){
  return;
 }

 try{
  const {error}=await sb
   .from('trips')
   .delete()
   .eq('id',id)
   .eq('user_id',currentUser.id);

  if(error)throw error;

  await loadData();
  go('my');

 }catch(e){
  showError(e);
 }
}

/* =====================================================
   BOOKMARKS
===================================================== */

async function toggleBookmark(id){
 if(!requireLogin())return;

 const t=findTrip(id);

 if(!t||t.sample){
  return alert(
   'サンプル旅程はブックマークできません。'
  );
 }

 try{
  if(bookmarks.includes(id)){
   const {error}=await sb
    .from('bookmarks')
    .delete()
    .eq('user_id',currentUser.id)
    .eq('trip_id',id);

   if(error)throw error;

  }else{
   const {error}=await sb
    .from('bookmarks')
    .insert({
     user_id:currentUser.id,
     trip_id:id
    });

   if(error)throw error;
  }

  await loadData();
  render();

 }catch(e){
  showError(e);
 }
}

/* =====================================================
   EVENT HANDLERS
===================================================== */

document.addEventListener('click',async e=>{
 const btn=e.target.closest('[data-action]');

 if(!btn||busy)return;

 const action=btn.dataset.action;
 const id=btn.dataset.id||'';

 const di=+btn.dataset.day;
 const si=+btn.dataset.spot;

 try{
  switch(action){

   case 'page':
    go(id);
    break;

   case 'detail':
    go('detail',id);
    break;

   case 'refresh':
    await refresh();
    break;

   case 'auth-toggle':
    authMode=authMode==='login'?
     'signup':'login';
    renderAccount();
    break;

   case 'auth-submit':
    await submitAuth();
    break;

   case 'logout':
    await logout();
    break;

   case 'new':
    openNew(false);
    break;

   case 'new-publish':
    openNew(true);
    break;

   case 'edit':
    openEdit(id);
    break;

   case 'copy':
    openCopy(id);
    break;

   case 'tab':
    tab=id;
    renderMy();
    break;

   case 'save-trip':
    await saveTrip();
    break;

   case 'status':
    await toggleStatus(id);
    break;

   case 'publish':
    await togglePublish(id);
    break;

   case 'delete':
    await deleteTrip(id);
    break;

   case 'bookmark':
    await toggleBookmark(id);
    break;

   case 'search-reset':
    search={
     q:'',
     days:'',
     style:'',
     status:''
    };
    renderSearch();
    break;

   case 'day-add':
    dayAdd();
    break;

   case 'day-delete':
    dayDelete(di);
    break;

   case 'day-up':
    dayMove(di,-1);
    break;

   case 'day-down':
    dayMove(di,1);
    break;

   case 'spot-add':
    spotAdd(di);
    break;

   case 'spot-delete':
    spotDelete(di,si);
    break;

   case 'spot-up':
    spotMove(di,si,-1);
    break;

   case 'spot-down':
    spotMove(di,si,1);
    break;

   case 'spot-duplicate':
    spotDuplicate(di,si);
    break;

   case 'lookup':
    await lookupPlace(di,si);
    break;

   case 'choose-location':
    chooseLocation(
     di,
     si,
     +btn.dataset.index
    );
    break;

   case 'photo-remove':
    syncEditor();
    getSchedule(draft)[di].stops[si].photo='';
    editorChanged();
    break;
  }

 }catch(error){
  showError(error);
 }
});

/* =====================================================
   INPUT EVENTS
===================================================== */

document.addEventListener('input',e=>{
 const id=e.target.id;

 if(id==='search-q'){
  search.q=e.target.value;
  renderResults();
 }

 if(page==='edit'){
  if(e.target.matches(
   '[data-field],#trip-people'
  )){
   syncEditor();
   refreshCosts();
  }
 }
});

document.addEventListener('change',async e=>{
 const id=e.target.id;

 if(id==='search-days'){
  search.days=e.target.value;
  renderResults();
 }

 if(id==='search-style'){
  search.style=e.target.value;
  renderResults();
 }

 if(id==='search-status'){
  search.status=e.target.value;
  renderResults();
 }

 if(e.target.matches('[data-photo]')){
  const file=e.target.files?.[0];

  if(file){
   await uploadPhoto(
    file,
    +e.target.dataset.day,
    +e.target.dataset.spot
   );
  }
 }
});

/* =====================================================
   START APPLICATION
===================================================== */

initialize();

</script>
