<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#59634a">
<title>TUMUGOU ver.3.3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{--bg:#f8f5ee;--paper:#fffefa;--sand:#e9dfcc;--brown:#493c30;--olive:#59634a;--line:#ddd3c4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
header{text-align:center;padding:22px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
header strong{font:bold 34px Georgia,serif;letter-spacing:5px}
header small{display:block;font-size:11px;margin-top:7px}
main{max-width:850px;margin:auto;padding:20px 15px 125px}
h2{font-size:25px}h3{font-size:18px}p{line-height:1.7}
.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.btn{background:var(--olive);color:white;border:0;border-radius:9px;padding:11px 13px;margin:4px 4px 4px 0;font-size:13px;cursor:pointer}
.alt{background:var(--sand);color:var(--brown)}
.danger{background:#f4e2df;color:#88493c}
.btn:disabled{opacity:.4}
.actions{display:flex;flex-wrap:wrap;gap:4px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0}
input,select,textarea{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid #d3c8b8;border-radius:8px;background:white;color:var(--brown);font:inherit}
textarea{min-height:85px}
.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}
.muted{font-size:12px;color:#817768}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--olive);font-weight:bold}
.notice{background:#eee9dc;padding:13px;border-radius:10px;font-size:13px;line-height:1.7;margin:12px 0}
.warn{background:#fff0e6;color:#925333;padding:12px;border-radius:9px;font-size:13px}
.ok{background:#e8efe4;color:#42613e;padding:12px;border-radius:9px;font-size:13px}
.tag{display:inline-block;background:#e9eee3;color:var(--olive);padding:5px 9px;border-radius:20px;font-size:11px;margin:5px 4px 5px 0}
.hero{height:190px;background:linear-gradient(120deg,#bac6b4,#ead4b7);display:flex;align-items:center;justify-content:center;font-size:65px;border-radius:11px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.day{border-left:5px solid var(--olive)}
.spot{background:#f6f2e9;padding:13px;border-radius:11px;margin:12px 0}
.photo{width:100%;max-height:300px;object-fit:cover;border-radius:9px;margin-top:9px}
.map{height:360px;border-radius:12px;margin:14px 0}
.travel{background:#eee9dc;padding:9px;margin:8px 0;font-size:12px}
.pin{width:30px;height:30px;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--paper);border-top:1px solid var(--line);z-index:1000;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;padding:12px 0;color:var(--brown);font-size:10px}
nav button.active{background:#e8ede0;font-weight:bold}
.tabs{display:flex;gap:5px;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{text-align:center;background:white;border:1px solid var(--line);border-radius:9px;padding:10px 2px}
.stat b{display:block;font-size:22px;color:var(--olive)}
.stat small{font-size:9px}
.template-scrapbook .day{box-shadow:4px 4px 0 var(--sand)}
.template-minimal .day{border-left-width:2px}
.template-magazine h2{font-family:Georgia,serif}
.search-step{border-left:3px solid var(--olive);padding-left:13px;margin:15px 0}
.search-step h3{margin-bottom:6px}
.loading{text-align:center;padding:40px 10px;color:var(--olive)}
@media(max-width:500px){.row{gap:6px}.stat b{font-size:18px}}
</style>
</head>
<body>
<header>
<strong>TUMUGOU</strong>
<small>あなたの旅が、次の誰かの旅になる。</small>
</header>
<main id="app"><div class="loading">読み込み中...</div></main>
<nav id="nav"></nav>

<script>

const SUPABASE_URL='https://cmaghzhmkdajtwfawpps.supabase.co/rest/v1/';
const SUPABASE_KEY='sb_publishable_LShArmYqRL5eRRHiCzH85Q_0L8aowMX';

/* =================================================
   APP SETTINGS
================================================= */

const VERSION='3.3';
const DRAFT_KEY='tumugou_draft_v33';
const LEGACY_KEY='tumugou_v02';
const PRIVATE_BUCKET='trip-private';
const COLORS=['#59634a','#b47b59','#66869a','#b49a55','#977d9d'];
const STYLES={'':'未設定',culture:'歴史・文化',food:'グルメ',nature:'自然・絶景',relax:'のんびり',active:'アクティブ',city:'街歩き'};
const MODES={'':'未設定',walk:'徒歩',train:'電車',bus:'バス',car:'車',taxi:'タクシー',bike:'自転車',ferry:'船',other:'その他'};
const TEMPLATES={scrapbook:'手描きスクラップ',magazine:'トラベルマガジン',minimal:'シンプル'};
const CATEGORIES={food:'食事',transport:'交通',ticket:'入場料',hotel:'宿泊',shopping:'買い物',other:'その他'};

const app=document.getElementById('app');
const nav=document.getElementById('nav');

let sb=null,user=null,page='home',selected='',tab='planning';
let trips=[],publicTrips=[],bookmarks=[];
let draft=null,editingId='',map=null,busy=false;
let authMode='login',searchPage=0,searchTotal=0;
let search={q:'',days:'',style:'',status:'',people:'',sort:'newest'};
let searchResults=[];
let lookupResults=[];
let lookupBusy=false,lastLookup=0;
let draftTimer=null;
let photoUrls=new Map();
let migrationBusy=false;

const SAMPLES=[{
 id:'sample-kyoto',sample:true,title:'京都、街歩きと喫茶の2日間',
 destination:'京都',description:'寺社と喫茶を巡る旅。',
 style:'culture',status:'completed',published:true,
 template:'scrapbook',people:1,trip_month:'',icon:'🍵',
 itinerary:{schedule:[
  {name:'Day 1',stops:[
   {name:'清水寺',time:'09:30',stayMinutes:90,coords:[34.9949,135.785]},
   {name:'祇園',time:'11:25',stayMinutes:90,transport:'walk',travelMinutes:25,coords:[35.003,135.778]},
   {name:'鴨川',time:'13:10',stayMinutes:60,transport:'walk',travelMinutes:15,coords:[35.01,135.771]}
  ]},
  {name:'Day 2',stops:[
   {name:'嵐山',time:'10:00',stayMinutes:120,coords:[35.0094,135.6668]},
   {name:'竹林の小径',time:'12:15',stayMinutes:90,transport:'walk',travelMinutes:15,coords:[35.017,135.671]}
  ]}
 ]}
}];

/* =================================================
   UTILITIES
================================================= */

function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(x){return x!==''&&x!=null&&Number.isFinite(+x)}
function coords(x){return Array.isArray(x)&&x.length===2&&x.every(v=>Number.isFinite(+v))&&Math.abs(+x[0])<=90&&Math.abs(+x[1])<=180}
function money(n){return Math.round(n).toLocaleString('ja-JP')+'円'}
function schedule(t){return t?.itinerary?.schedule||[]}
function count(t){return schedule(t).reduce((n,d)=>n+(d.stops||[]).length,0)}
function total(t){return schedule(t).reduce((n,d)=>n+(d.stops||[]).reduce((a,s)=>a+(num(s.cost)?+s.cost:0),0),0)}
function own(t){return !!user&&t?.user_id===user.id}
function find(id){return [...trips,...publicTrips,...SAMPLES].find(t=>t.id===id)}
function errorText(e){return e?.message||String(e)}
function fail(e){console.error(e);alert(errorText(e))}
function requireLogin(){if(user)return true;alert('ログインしてください。');go('account');return false}
function configured(){return SUPABASE_URL.startsWith('https://')&&SUPABASE_URL.includes('.supabase.co')&&SUPABASE_KEY.startsWith('sb_publishable_')}
function statusName(t){return t.sample?'サンプル':t.status==='completed'?'実際に行った旅':'旅行計画'}

function normalize(t){
 const x=clone(t);
 if(!x.itinerary)x.itinerary={schedule:x.schedule||[]};
 if(!Array.isArray(x.itinerary.schedule))x.itinerary.schedule=[];
 x.template=TEMPLATES[x.template]?x.template:'scrapbook';
 x.status=x.status==='completed'?'completed':'planning';
 x.people=Math.max(1,Math.min(99,parseInt(x.people)||1));
 x.itinerary.schedule=x.itinerary.schedule.map((d,i)=>({
  name:d.name||'Day '+(i+1),
  stops:(d.stops||[]).map(s=>({
   ...s,uid:s.uid||uid(),name:s.name||'',time:s.time||'09:00',
   stayMinutes:s.stayMinutes??'',travelMinutes:s.travelMinutes??'',
   transport:s.transport||'',comment:s.comment||'',cost:s.cost??'',
   costCategory:s.costCategory||'other',photo:s.photo||'',photoPath:s.photoPath||''
  }))
 }));
 return x;
}

function timeMin(t){
 if(!/^\d\d:\d\d$/.test(t||''))return null;
 const [h,m]=t.split(':').map(Number);
 return h<24&&m<60?h*60+m:null;
}
function timeText(n){
 return n>=0&&n<1440?String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'):null;
}
function safeUrl(url){
 try{
  const u=new URL(url,location.href);
  return ['https:','http:'].includes(u.protocol)?u.href:'';
 }catch(e){return ''}
}
function firstPhoto(t){
 for(const d of schedule(t))for(const s of d.stops||[]){
  if(s.photoPath||s.photo)return s;
 }
 return null;
}

/* =================================================
   PHOTOS: PRIVATE STORAGE / SIGNED URL
================================================= */

async function resolvePhoto(s){
 if(!s)return '';
 if(s.photoPath){
  if(photoUrls.has(s.photoPath)){
   const item=photoUrls.get(s.photoPath);
   if(item.expires>Date.now())return item.url;
  }
  if(!sb)return '';
  const {data,error}=await sb.storage.from(PRIVATE_BUCKET)
   .createSignedUrl(s.photoPath,3600);
  if(error){console.warn('写真の取得:',error.message);return ''}
  photoUrls.set(s.photoPath,{url:data.signedUrl,expires:Date.now()+3500000});
  return data.signedUrl;
 }
 return safeUrl(s.photo);
}

function imgHTML(s,cls='photo'){
 if(!s)return '';
 if(s.photoPath){
  return `<img class="${cls}" alt="" data-photo-path="${esc(s.photoPath)}">`;
 }
 const src=safeUrl(s.photo);
 return src?`<img class="${cls}" src="${esc(src)}" alt="">`:'';
}

async function decoratePhotos(){
 const elements=[...document.querySelectorAll('[data-photo-path]')];
 await Promise.all(elements.map(async el=>{
  const path=el.dataset.photoPath;
  const src=await resolvePhoto({photoPath:path});
  if(src&&el.isConnected)el.src=src;
 }));
}

async function uploadPhoto(file,di,si){
 if(!requireLogin()||busy)return;
 if(!file||!file.type.startsWith('image/'))return alert('画像を選択してください。');
 if(file.size>20*1024*1024)return alert('20MB以下の画像を選択してください。');
 if(!editingId)return alert('写真の追加前に、旅程を一度クラウド保存してください。');
 syncEditor();
 const s=schedule(draft)[di]?.stops[si];
 if(!s)return;
 busy=true;
 try{
  const url=URL.createObjectURL(file),img=new Image();
  try{
   await new Promise((resolve,reject)=>{
    img.onload=resolve;img.onerror=reject;img.src=url;
   });
  }finally{URL.revokeObjectURL(url)}
  const scale=Math.min(1,1200/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.width*scale));
  c.height=Math.max(1,Math.round(img.height*scale));
  const ctx=c.getContext('2d');
  ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.75));
  if(!blob)throw Error('画像変換に失敗しました。');
  const path=user.id+'/'+editingId+'/'+uid()+'.jpg';
  const {error}=await sb.storage.from(PRIVATE_BUCKET).upload(path,blob,{
   contentType:'image/jpeg',upsert:false
  });
  if(error)throw error;
  s.photoPath=path;s.photo='';
  saveDraftLocal();
  editorChanged();
  alert('写真をアップロードしました。旅程の保存ボタンも押してください。');
 }catch(e){fail(e)}
 finally{busy=false}
}

/* =================================================
   INITIALIZATION / CLOUD
================================================= */

async function initialize(){
 if(!configured()){
  app.innerHTML='<div class="warn"><h2>Supabase設定が必要です</h2><p>コード冒頭のSUPABASE_URLとSUPABASE_KEYを入力してください。</p></div>';
  return;
 }
 if(!window.supabase){
  app.innerHTML='<div class="warn">Supabaseライブラリを読み込めませんでした。</div>';
  return;
 }
 try{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data,error}=await sb.auth.getUser();
  if(error)console.warn(error.message);
  user=data?.user||null;
  sb.auth.onAuthStateChange((event,session)=>{
   const next=session?.user||null;
   if(user?.id!==next?.id){
    user=next;
    setTimeout(async()=>{
     await loadData();
     await searchCloud();
     go('home');
    },0);
   }
  });
  await loadData();
  await searchCloud();
  go('home');
 }catch(e){
  console.error(e);
  app.innerHTML='<div class="warn">初期化に失敗しました。Supabase設定を確認してください。</div>';
 }
}

async function loadData(){
 if(!sb)return;
 try{
  if(user){
   const ownResult=await sb.from('trips').select('*')
    .eq('user_id',user.id).order('updated_at',{ascending:false}).limit(500);
   if(ownResult.error)throw ownResult.error;
   trips=(ownResult.data||[]).map(normalize);
   const saved=await sb.from('bookmarks').select('trip_id').eq('user_id',user.id);
   if(saved.error)throw saved.error;
   bookmarks=(saved.data||[]).map(x=>x.trip_id);
  }else{trips=[];bookmarks=[]}
  const r=await sb.from('trips').select('*').eq('published',true)
   .order('updated_at',{ascending:false}).limit(12);
  if(r.error)throw r.error;
  publicTrips=(r.data||[]).map(normalize);
 }catch(e){fail(e)}
}

async function searchCloud(){
 if(!sb)return;
 try{
  let q=sb.from('trips').select('*',{count:'exact'}).eq('published',true);
  if(search.q.trim()){
   const term=search.q.trim().replace(/[%_,()]/g,' ').slice(0,80);
   q=q.or(`title.ilike.%${term}%,destination.ilike.%${term}%`);
  }
  if(search.days)q=q.eq('days',+search.days);
  if(search.style)q=q.eq('style',search.style);
  if(search.status)q=q.eq('status',search.status);
  if(search.people)q=q.eq('people',+search.people);
  if(search.sort==='oldest')q=q.order('updated_at',{ascending:true});
  else q=q.order('updated_at',{ascending:false});
  const start=searchPage*20;
  const {data,error,count}=await q.range(start,start+19);
  if(error)throw error;
  searchResults=(data||[]).map(normalize);
  searchTotal=count||0;
 }catch(e){console.error(e);searchResults=[];searchTotal=0;alert('検索に失敗しました：'+errorText(e))}
}

async function refresh(){
 await loadData();await searchCloud();render();
}

/* =================================================
   AUTH
================================================= */

function renderAccount(){
 if(user){
  app.innerHTML=`<div class="eyebrow">YOUR ACCOUNT</div><h2>アカウント</h2>
  <div class="panel"><p class="ok">ログイン中</p><p>${esc(user.email)}</p>
  <button class="btn alt" data-a="logout">ログアウト</button></div>
  <button class="btn alt" data-a="page" data-id="migration">旧データを移行</button>`;
  return;
 }
 app.innerHTML=`<div class="eyebrow">WELCOME TO TUMUGOU</div>
 <h2>${authMode==='signup'?'新規登録':'ログイン'}</h2>
 <div class="panel">
 <label>メールアドレス<input id="auth-email" type="email" autocomplete="email"></label>
 <label>パスワード<input id="auth-password" type="password" autocomplete="${authMode==='signup'?'new-password':'current-password'}"></label>
 <button class="btn" data-a="auth-submit">${authMode==='signup'?'新規登録':'ログイン'}</button>
 <button class="btn alt" data-a="auth-toggle">${authMode==='signup'?'ログインはこちら':'初めての方はこちら'}</button>
 <p class="muted">メール確認が有効な場合は、確認メールが届きます。</p></div>`;
}

async function submitAuth(){
 if(busy)return;
 const email=document.getElementById('auth-email')?.value.trim();
 const password=document.getElementById('auth-password')?.value||'';
 if(!email||password.length<6)return alert('メールアドレスと6文字以上のパスワードを入力してください。');
 busy=true;
 try{
  const r=authMode==='signup'
   ?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}})
   :await sb.auth.signInWithPassword({email,password});
  if(r.error)throw r.error;
  if(authMode==='signup'&&!r.data.session){
   alert('確認メールを送信しました。メール内のリンクを開いてください。');
   authMode='login';renderAccount();
  }else{
   user=r.data.user;
   await loadData();await searchCloud();go('home');
  }
 }catch(e){fail(e)}finally{busy=false}
}

async function logout(){
 if(!confirm('ログアウトしますか？'))return;
 const {error}=await sb.auth.signOut();
 if(error)return fail(error);
 user=null;trips=[];bookmarks=[];draft=null;editingId='';
 await loadData();go('home');
}

/* =================================================
   NAVIGATION
================================================= */

function menu(){
 nav.innerHTML=[
  ['home','HOME','⌂'],['search','SEARCH','⌕'],
  ['my','MY TRIP','♡'],['post','POST','＋'],['account','ACCOUNT','○']
 ].map(([id,name,icon])=>`<button class="${page===id?'active':''}" data-a="page" data-id="${id}">${icon}<br>${name}</button>`).join('');
}

function go(p,id=''){
 if(map){map.remove();map=null}
 page=p;selected=id;window.scrollTo(0,0);render();
 if(p==='detail')setTimeout(()=>{
  if(page==='detail')drawMap(find(id));
 },100);
}

function render(){
 menu();
 const views={
  home:renderHome,search:renderSearch,my:renderMy,post:renderPost,
  account:renderAccount,detail:renderDetail,edit:renderEditor,
  migration:renderMigration
 };
 views[page]?.();
 decoratePhotos();
}

/* =================================================
   CARDS / HOME
================================================= */

function hero(t){
 const s=firstPhoto(t);
 return `<div class="hero">${s?imgHTML(s,'hero-photo'):esc(t.icon||'🧳')}</div>`;
}

function card(t){
 return `<article class="card">${hero(t)}
 <div><span class="tag">${esc(t.destination||'目的地未設定')}</span>
 <span class="tag">${schedule(t).length}日間</span>
 <span class="tag">${count(t)}スポット</span>
 <span class="tag">${statusName(t)}</span></div>
 <h3>${esc(t.title)}</h3><p class="muted">${esc(t.description||'')}</p>
 <p class="muted">${t.trip_month?'旅行年月：'+esc(t.trip_month)+' / ':''}${t.people||1}人・記録費用：${money(total(t))}</p>
 <button class="btn" data-a="detail" data-id="${esc(t.id)}">旅程を見る →</button>
 <button class="btn alt" data-a="copy" data-id="${esc(t.id)}">コピーして編集</button>
 </article>`;
}

function stats(){
 const values={
  PLANNING:trips.filter(t=>t.status==='planning').length,
  COMPLETED:trips.filter(t=>t.status==='completed').length,
  POST:trips.filter(t=>t.published).length,
  SAVED:bookmarks.length
 };
 return `<div class="stats">${Object.entries(values).map(([k,v])=>
  `<div class="stat"><b>${v}</b><small>${k}</small></div>`).join('')}</div>`;
}

function renderHome(){
 const saved=readDraftLocal();
 app.innerHTML=`<div class="eyebrow">YOUR JOURNEY, OUR STORY</div>
 <h2>誰かの旅から、<br>次の旅がはじまる。</h2>
 <p>実際の旅程を参考に、自分だけの旅を紡いでいこう。</p>
 <button class="btn" data-a="new">＋ 新しい旅を計画</button>
 <button class="btn alt" data-a="page" data-id="search">旅程を探す</button>
 ${saved&&user&&saved.userId===user.id?`
 <div class="notice">編集中の旅程があります。
 <button class="btn" data-a="resume">下書きを再開</button>
 <button class="btn danger" data-a="discard">下書きを破棄</button></div>`:''}
 ${user?`<p class="ok">クラウド接続中：${esc(user.email)}</p>`:
 `<div class="notice">旅程を保存するにはログインしてください。
 <button class="btn" data-a="page" data-id="account">ログイン・新規登録</button></div>`}

function drawMap(t){
 const el=document.getElementById('trip-map');
 if(!el||!t)return;
 if(typeof L==='undefined'){el.textContent='地図を読み込めませんでした。';return}
 try{
  map=L.map(el,{scrollWheelZoom:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
   attribution:'&copy; OpenStreetMap contributors',maxZoom:19
  }).addTo(map);
  const bounds=[];
  schedule(t).forEach((d,di)=>{
   let previous=null;
   const color=COLORS[di%COLORS.length];
   (d.stops||[]).forEach((s,si)=>{
    if(!coords(s.coords)){previous=null;return}
    const pos=s.coords.map(Number);bounds.push(pos);
    L.marker(pos,{icon:L.divIcon({
     className:'',html:`<div class="pin" style="background:${color}">${si+1}</div>`,
     iconSize:[30,30],iconAnchor:[15,15]
    })}).addTo(map).bindPopup(esc(d.name)+' / '+esc(s.name));
    if(previous)L.polyline([previous,pos],{color,weight:4,opacity:.85}).addTo(map);
    previous=pos;
   });
  });
  if(bounds.length)map.fitBounds(bounds,{padding:[35,35],maxZoom:13});
  else map.setView([35.6812,139.7671],5);
  setTimeout(()=>{if(map)map.invalidateSize()},150);
 }catch(e){console.error(e);el.textContent='地図表示に失敗しました。'}
}

function newSpot(){

function newDraft(){

function saveDraftLocal(){
 if(!draft||!user)return;
 try{
  localStorage.setItem(DRAFT_KEY,JSON.stringify({
   userId:user.id,editingId,draft,updatedAt:new Date().toISOString()
  }));
  const el=document.getElementById('autosave');
  if(el)el.textContent='下書き保存済み：'+new Date().toLocaleTimeString('ja-JP');
 }catch(e){
  const el=document.getElementById('autosave');
  if(el)el.textContent='下書きの保存に失敗しました';
 }
}
function readDraftLocal(){
 try{
  const x=JSON.parse(localStorage.getItem(DRAFT_KEY));
  return x?.draft&&Array.isArray(x.draft.itinerary?.schedule)?x:null;
 }catch(e){return null}
}
function queueDraftSave(){
 clearTimeout(draftTimer);
 draftTimer=setTimeout(()=>{syncEditor();saveDraftLocal()},500);
}
function clearDraftLocal(){localStorage.removeItem(DRAFT_KEY)}
function resumeDraft(){
 if(!requireLogin())return;
 const x=readDraftLocal();
 if(!x||x.userId!==user.id)return alert('再開できる下書きがありません。');
 draft=normalize(x.draft);
 editingId=x.editingId||'';
 if(editingId&&!trips.some(t=>t.id===editingId))editingId='';
 go('edit');
}
function discardDraft(){
 if(!confirm('下書きを破棄しますか？'))return;
 clearDraftLocal();draft=null;editingId='';go('home');
}
function openNew(publish=false){
 if(!requireLogin())return;
 if(readDraftLocal()?.userId===user.id&&!confirm('保存済みの下書きがあります。新しく作成しますか？'))return;
 editingId='';draft=newDraft();draft.published=publish;
 saveDraftLocal();go('edit');

 saveDraftLocal();go('edit');

function openCopy(id){

 const t=find(id);if(!t)return;
 if(readDraftLocal()?.userId===user.id&&!confirm('現在の下書きを置き換えてコピーしますか？'))return;
 draft=normalize(t);
 delete draft.id;delete draft.user_id;delete draft.created_at;delete draft.updated_at;
 draft.title=t.title+'（コピー）';draft.status='planning';draft.published=false;
 editingId='';
 // 他人の非公開Storage写真を自分の旅程に直接引き継がない

 for(const d of schedule(draft))for(const s of d.stops){

}

function syncEditor(){
 if(!draft||page!=='edit')return;
 const fields={
  'trip-title':'title','trip-destination':'destination',
  'trip-description':'description','trip-month':'trip_month',
  'trip-people':'people','trip-style':'style',
  'trip-template':'template','trip-status':'status'
 };
 for(const [id,key] of Object.entries(fields)){
  const el=document.getElementById(id);if(el)draft[key]=el.value;
 }
 const pub=document.getElementById('trip-published');
 if(pub)draft.published=pub.value==='true';
 draft.people=Math.max(1,Math.min(99,parseInt(draft.people)||1));
 document.querySelectorAll('[data-dayname]').forEach(el=>{
  const d=schedule(draft)[+el.dataset.dayname];if(d)d.name=el.value;
 });
 document.querySelectorAll('[data-field]').forEach(el=>{
  const s=schedule(draft)[+el.dataset.day]?.stops[+el.dataset.spot];
  if(!s)return;
  const f=el.dataset.field;
  if(f==='name'&&s.name!==el.value){
   s.name=el.value;s.lookup='';delete s.coords;delete s.locationLabel;
  }else if(f!=='name')s[f]=el.value;
 });
}

function refreshCosts(){
 if(!draft)return;
 const a=document.getElementById('total-cost'),b=document.getElementById('per-person');
 if(a)a.textContent=money(total(draft));
 if(b)b.textContent=money(total(draft)/(draft.people||1));
 const sums={};
 for(const d of schedule(draft))for(const s of d.stops){
  const k=s.costCategory||'other';
  sums[k]=(sums[k]||0)+(num(s.cost)?+s.cost:0);
 }
 const el=document.getElementById('cost-categories');
 if(el)el.innerHTML=Object.entries(sums).filter(([,v])=>v>0).map(([k,v])=>
 `<p class="muted">${esc(CATEGORIES[k]||'その他')}：${money(v)}</p>`).join('');
}

function editorChanged(){
 saveDraftLocal();renderDays();refreshCosts();
}

}
function spotDelete(di,si){
 syncEditor();if(!confirm('このスポットを削除しますか？'))return;
 const a=schedule(draft)[di].stops;a.splice(si,1);
 if(a[si]){a[si].transport='';a[si].travelMinutes=''}
 editorChanged();
}
function spotMove(di,si,delta){
 syncEditor();const a=schedule(draft)[di].stops,j=si+delta;
 if(j<0||j>=a.length)return;
 [a[si],a[j]]=[a[j],a[si]];
 for(const s of a){s.transport='';s.travelMinutes=''}
 editorChanged();alert('訪問順を変更しました。移動情報を再確認してください。');
}
function spotDuplicate(di,si){
 syncEditor();const a=schedule(draft)[di].stops,s=clone(a[si]);
 s.uid=uid();s.transport='';s.travelMinutes='';
 a.splice(si+1,0,s);editorChanged();
}
function moveDay(di,si){
 const target=+document.querySelector(`[data-move-target="${di}-${si}"]`)?.value;
 syncEditor();
 if(target===di||!schedule(draft)[target])return alert('別のDAYを選択してください。');
 const from=schedule(draft)[di].stops,to=schedule(draft)[target].stops;
 const [s]=from.splice(si,1);
 s.transport='';s.travelMinutes='';
 to.push(s);
 if(from[si]){from[si].transport='';from[si].travelMinutes=''}
 editorChanged();
}
function calculateDay(di){
 syncEditor();const a=schedule(draft)[di].stops;
 if(a.length<2)return alert('スポットを2件以上登録してください。');
 let current=timeMin(a[0].time);
 if(current===null)return alert('最初の訪問時刻を設定してください。');
 const times=[];
 for(let i=1;i<a.length;i++){
  const prev=a[i-1],next=a[i];
  if(!num(prev.stayMinutes)||!num(next.travelMinutes))return alert('滞在時間と移動時間を入力してください。');
  if(!Number.isInteger(+prev.stayMinutes)||!Number.isInteger(+next.travelMinutes)||+prev.stayMinutes<0||+next.travelMinutes<0)return alert('時間は0以上の整数にしてください。');
  current+=+prev.stayMinutes+ +next.travelMinutes;
  const t=timeText(current);
  if(!t)return alert('翌日にまたがるため計算できません。');
  times.push(t);
 }
 if(!confirm('2件目以降の訪問時刻を上書きしますか？'))return;
 times.forEach((t,i)=>a[i+1].time=t);
 editorChanged();
}
function checkDay(di){
 syncEditor();const a=schedule(draft)[di].stops;
 const el=document.getElementById('check-'+di);if(!el)return;
 el.innerHTML=a.slice(1).map((s,i)=>{
  const p=a[i],x=timeMin(p.time),y=timeMin(s.time);
  if(x===null||y===null)return '<p class="warn">時刻未設定</p>';
  if(!num(p.stayMinutes)||!num(s.travelMinutes))return '<p class="muted">滞在時間または移動時間が未設定</p>';
  const gap=y-x-(+p.stayMinutes)-(+s.travelMinutes);
  return `<p class="${gap<0?'warn':'ok'}">${i+1} → ${i+2}：${gap<0?(-gap)+'分不足':gap+'分の余裕'}</p>`;
 }).join('')||'<p>スポットが2件以上必要です。</p>';
}

/* =================================================
   LOCATION SEARCH
================================================= */

async function lookupPlace(di,si){
 syncEditor();
 const s=schedule(draft)[di]?.stops[si],el=document.getElementById(`lookup-${di}-${si}`);
 if(!s||!el)return;
 const q=(s.lookup||s.name||'').trim();
 if(!q)return alert('検索キーワードを入力してください。');
 if(lookupBusy||Date.now()-lastLookup<1300)return alert('少し待ってから再検索してください。');
 lookupBusy=true;lastLookup=Date.now();el.textContent='検索中...';
 try{
  const params=new URLSearchParams({format:'jsonv2',q,limit:'5','accept-language':'ja,en'});
  const r=await fetch('https://nominatim.openstreetmap.org/search?'+params);
  if(!r.ok)throw Error('検索に失敗しました。');
  lookupResults=(await r.json()).map(x=>({name:x.display_name,coords:[+x.lat,+x.lon]})).filter(x=>coords(x.coords));
  el.innerHTML=lookupResults.map((x,i)=>`<div class="card"><p class="muted">${esc(x.name)}</p>
  <button class="btn alt" data-a="choose-location" data-day="${di}" data-spot="${si}" data-index="${i}">この場所を選択</button></div>`).join('')||'候補なし';
 }catch(e){console.error(e);el.textContent='場所の検索に失敗しました。'}
 finally{lookupBusy=false}
}
function chooseLocation(di,si,index){
 syncEditor();const s=schedule(draft)[di]?.stops[si],r=lookupResults[index];
 if(!s||!r)return;
 s.coords=r.coords;s.locationLabel=r.name;s.lookup=r.name;
 editorChanged();
}

/* =================================================
   CLOUD SAVE
================================================= */

async function saveTrip(){
 if(!requireLogin()||busy)return;
 syncEditor();
 if(!draft.title.trim()||!draft.destination.trim())return alert('タイトルと目的地を入力してください。');
 const days=schedule(draft);
 if(!days.length||days.some(d=>!d.stops.length||d.stops.some(s=>!s.name.trim())))
  return alert('すべてのDAYに訪問場所を入力してください。');
 for(const d of days)for(const s of d.stops)for(const v of [s.stayMinutes,s.travelMinutes,s.cost]){
  if(v!==''&&v!=null&&(!Number.isInteger(+v)||+v<0))return alert('時間と費用は0以上の整数にしてください。');
 }
 const payload={
  user_id:user.id,title:draft.title.trim(),destination:draft.destination.trim(),
  description:draft.description||'',style:draft.style||'',
  trip_month:draft.trip_month||null,people:draft.people||1,
  status:draft.status,published:!!draft.published,
  template:draft.template,itinerary:clone(draft.itinerary),
  updated_at:new Date().toISOString()
 };
 busy=true;
 try{
  const r=editingId
   ?await sb.from('trips').update(payload).eq('id',editingId).eq('user_id',user.id).select().single()
   :await sb.from('trips').insert(payload).select().single();
  if(r.error)throw r.error;
  const id=r.data.id;
  clearDraftLocal();
  draft=null;editingId='';
  await loadData();await searchCloud();
  go('detail',id);
  alert('旅程をクラウドに保存しました。');
 }catch(e){fail(e)}
 finally{busy=false}
}

async function updateTrip(id,changes){
 if(!requireLogin())return;
 const t=trips.find(x=>x.id===id);
 if(!t||!own(t))return;
 try{
  const {error}=await sb.from('trips').update({
   ...changes,updated_at:new Date().toISOString()
  }).eq('id',id).eq('user_id',user.id);
  if(error)throw error;
  await refresh();
 }catch(e){fail(e)}
}
async function toggleStatus(id){
 const t=trips.find(x=>x.id===id);if(!t)return;
 await updateTrip(id,{status:t.status==='completed'?'planning':'completed'});
}
async function togglePublish(id){
 const t=trips.find(x=>x.id===id);if(!t)return;
 if(!t.published&&!confirm('この旅程を公開しますか？'))return;
 await updateTrip(id,{published:!t.published});
}
async function deleteTrip(id){
 if(!requireLogin())return;
 const t=trips.find(x=>x.id===id);
 if(!t||!own(t)||!confirm('「'+t.title+'」を削除しますか？'))return;
 try{
  const {error}=await sb.from('trips').delete().eq('id',id).eq('user_id',user.id);
  if(error)throw error;
  await loadData();await searchCloud();go('my');
 }catch(e){fail(e)}
}
async function toggleBookmark(id){
 if(!requireLogin())return;
 const t=find(id);
 if(!t||t.sample)return alert('サンプル旅程は保存できません。');
 try{
  if(bookmarks.includes(id)){
   const {error}=await sb.from('bookmarks').delete().eq('user_id',user.id).eq('trip_id',id);
   if(error)throw error;
  }else{
   const {error}=await sb.from('bookmarks').insert({user_id:user.id,trip_id:id});
   if(error)throw error;
  }
  await loadData();render();
 }catch(e){fail(e)}
}

/* =================================================
   LEGACY DATA MIGRATION
================================================= */

function legacyState(){
 try{
  const x=JSON.parse(localStorage.getItem(LEGACY_KEY));
  return x&&Array.isArray(x.plans)?x:null;
 }catch(e){return null}
}

function renderMigration(){
 if(!user){
  app.innerHTML='<div class="notice">移行にはログインが必要です。</div>';
  return;
 }
 const old=legacyState();
 app.innerHTML=`<div class="eyebrow">DATA MIGRATION</div>
 <h2>ver.2.1の旅程を移行</h2>
 <div class="notice">この端末・このブラウザに保存されている旧旅程を、クラウドへコピーします。</div>
 <p>検出した旧旅程：<b>${old?.plans.length||0}件</b></p>
 <p class="warn">写真は旧IndexedDBから取得できる場合に限り移行します。元のデータは削除しません。途中で失敗した場合、再実行前にMY TRIPで重複を確認してください。</p>
 <button class="btn" data-a="migrate" ${!old?.plans.length?'disabled':''}>旧旅程をクラウドへ移行</button>
 <div id="migration-status"></div>`;
}

function legacyPhotoGet(id){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open('tumugou_photos_v21',1);
  req.onerror=()=>reject(req.error);
  req.onsuccess=()=>{
   const db=req.result;
   if(!db.objectStoreNames.contains('photos')){db.close();resolve('');return}
   const tx=db.transaction('photos','readonly');
   const get=tx.objectStore('photos').get(id);
   get.onsuccess=()=>{const value=get.result||'';db.close();resolve(value)};
   get.onerror=()=>{db.close();reject(get.error)};
  };
 });
}

async function migrateLegacy(){
 if(!requireLogin()||migrationBusy)return;
 const old=legacyState();
 if(!old?.plans.length)return alert('旧旅程が見つかりません。');
 if(!confirm(old.plans.length+'件の旅程をクラウドにコピーしますか？'))return;
 migrationBusy=true;
 const el=document.getElementById('migration-status');
 let done=0,failed=0;
 try{
  for(const original of old.plans){
   if(el)el.textContent=`移行中：${done+failed+1} / ${old.plans.length}`;
   try{
    const t=normalize({
     ...original,destination:original.place||original.destination||'',
     trip_month:original.tripMonth||original.trip_month||'',
     itinerary:{schedule:original.schedule||[]}
    });
    const payload={
     user_id:user.id,title:t.title,destination:t.destination,
     description:t.description||'',style:t.style||'',
     trip_month:t.trip_month||null,people:t.people||1,
     status:t.status,published:false,template:t.template,
     itinerary:clone(t.itinerary)
    };
    // 重複を避けるため、旧IDをJSON内に記録して照合する
    payload.itinerary.legacyId=original.id;
    const existing=trips.find(x=>x.itinerary?.legacyId===original.id);
    let id;
    if(existing){
     id=existing.id;
    }else{
     const {data,error}=await sb.from('trips').insert(payload).select().single();
     if(error)throw error;
     id=data.id;
     trips.push(normalize(data));
    }
    let photoChanged=false;
    for(const d of schedule(t))for(const s of d.stops){
     let data='';
     if(s.photoId){
      try{data=await legacyPhotoGet(s.photoId)}catch(e){console.warn(e)}
     }
     if(!data&&typeof s.photo==='string'&&s.photo.startsWith('data:image/'))data=s.photo;
     if(!data)continue;
     try{
      const response=await fetch(data);
      const blob=await response.blob();
      const path=user.id+'/'+id+'/'+uid()+'.jpg';
      const up=await sb.storage.from(PRIVATE_BUCKET).upload(path,blob,{
       contentType:blob.type||'image/jpeg',upsert:false
      });
      if(up.error)throw up.error;
      s.photoPath=path;s.photo='';
      photoChanged=true;
     }catch(e){console.warn('写真移行失敗:',e)}
    }
    if(photoChanged){
     t.itinerary.legacyId=original.id;
     const {error}=await sb.from('trips').update({itinerary:t.itinerary})
      .eq('id',id).eq('user_id',user.id);
     if(error)throw error;
    }
    done++;
   }catch(e){console.error('移行失敗:',original.title,e);failed++}
  }
  await loadData();await searchCloud();
  if(el)el.innerHTML=`<p class="ok">移行完了：${done}件／失敗：${failed}件</p>`;
  alert(`移行処理が終了しました。成功：${done}件、失敗：${failed}件。`);
 }finally{migrationBusy=false}
}

/* =================================================
   EVENTS
================================================= */

document.addEventListener('click',async e=>{
 const btn=e.target.closest('[data-a]');
 if(!btn||busy||migrationBusy)return;
 const a=btn.dataset.a,id=btn.dataset.id||'';
 const di=+btn.dataset.day,si=+btn.dataset.spot;
 try{
  switch(a){
   case 'page':
    if(page==='edit'&&draft){syncEditor();saveDraftLocal()}
    go(id);break;
   case 'detail':go('detail',id);break;
   case 'refresh':await refresh();break;
   case 'auth-toggle':authMode=authMode==='login'?'signup':'login';renderAccount();break;
   case 'auth-submit':await submitAuth();break;
   case 'logout':await logout();break;
   case 'new':openNew(false);break;
   case 'new-publish':openNew(true);break;
   case 'edit':openEdit(id);break;
   case 'copy':openCopy(id);break;
   case 'tab':tab=id;renderMy();break;
   case 'save-trip':await saveTrip();break;
   case 'save-draft':syncEditor();saveDraftLocal();alert('下書きを保存しました。');break;
   case 'resume':resumeDraft();break;
   case 'discard':discardDraft();break;
   case 'status':await toggleStatus(id);break;
   case 'publish':await togglePublish(id);break;
   case 'delete':await deleteTrip(id);break;
   case 'bookmark':await toggleBookmark(id);break;
   case 'search-run':await runSearch();break;
   case 'search-reset':
    search={q:'',days:'',style:'',status:'',people:'',sort:'newest'};
    searchPage=0;await searchCloud();renderSearch();break;
   case 'search-prev':
    if(searchPage>0){searchPage--;await searchCloud();renderResults()}break;
   case 'search-next':
    if((searchPage+1)*20<searchTotal){searchPage++;await searchCloud();renderResults()}break;
   case 'day-add':dayAdd();break;
   case 'day-delete':dayDelete(di);break;
   case 'day-up':dayMove(di,-1);break;
   case 'day-down':dayMove(di,1);break;
   case 'spot-add':spotAdd(di);break;
   case 'spot-delete':spotDelete(di,si);break;
   case 'spot-up':spotMove(di,si,-1);break;
   case 'spot-down':spotMove(di,si,1);break;
   case 'spot-duplicate':spotDuplicate(di,si);break;
   case 'move-day':moveDay(di,si);break;
   case 'calculate':calculateDay(di);break;
   case 'check':checkDay(di);break;
   case 'lookup':await lookupPlace(di,si);break;
   case 'choose-location':chooseLocation(di,si,+btn.dataset.index);break;
   case 'photo-remove':
    syncEditor();
    schedule(draft)[di].stops[si].photo='';
    schedule(draft)[di].stops[si].photoPath='';
    editorChanged();break;
   case 'migrate':await migrateLegacy();break;
  }
 }catch(e){fail(e)}
});

document.addEventListener('input',e=>{
 if(page==='edit'&&draft){
  if(e.target.matches('input,textarea,select')){
   syncEditor();refreshCosts();queueDraftSave();
  }
 }
});

document.addEventListener('change',async e=>{
 if(page==='edit'&&draft&&e.target.matches('select,input')){
  if(!e.target.matches('[data-photo]')){
   syncEditor();refreshCosts();queueDraftSave();
  }
 }
 if(e.target.matches('[data-photo]')){
  const file=e.target.files?.[0];
  if(file)await uploadPhoto(file,+e.target.dataset.day,+e.target.dataset.spot);
 }
});

window.addEventListener('pagehide',()=>{
 if(page==='edit'&&draft){syncEditor();saveDraftLocal()}
});

/* =================================================
   START
================================================= */

initialize();
