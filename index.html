/* ==========================================
   03. UTILITIES
========================================== */

function uid(){
 return 't'+Date.now().toString(36)+
 Math.random().toString(36).slice(2,9);
}

function clone(x){
 return JSON.parse(JSON.stringify(x));
}

function esc(x){
 return String(x??'').replace(
  /[&<>"']/g,
  c=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[c])
 );
}

function num(x){
 return x!=='' &&
 x!=null &&
 Number.isFinite(+x);
}

function money(n){
 return Math.round(n).toLocaleString('ja-JP')+'円';
}

function schedule(t){
 return t?.itinerary?.schedule||[];
}

function count(t){
 return schedule(t).reduce(
  (n,d)=>n+(d.stops||[]).length,0
 );
}

function total(t){
 return schedule(t).reduce(
  (n,d)=>n+(d.stops||[]).reduce(
   (a,s)=>a+(num(s.cost)?+s.cost:0),0
  ),0
 );
}

function own(t){
 return !!user&&t?.user_id===user.id;
}

function find(id){
 return [
  ...trips,
  ...savedTrips,
  ...publicTrips,
  ...searchResults,
  ...SAMPLES
 ].find(t=>t.id===id);
}

function fail(e){
 console.error(e);
 alert(e?.message||String(e));
}

function requireLogin(){
 if(user)return true;
 alert('ログインしてください。');
 go('account');
 return false;
}

function validCoords(c){
 return Array.isArray(c)&&
 c.length===2&&
 c.every(v=>Number.isFinite(+v))&&
 Math.abs(+c[0])<=90&&
 Math.abs(+c[1])<=180;
}

function safeURL(u){
 try{
  const x=new URL(u,location.href);
  return ['http:','https:'].includes(x.protocol)
   ?x.href:'';
 }catch(e){
  return '';
 }
}

function configured(){
 return SUPABASE_URL.startsWith('https://')&&
 SUPABASE_URL.includes('.supabase.co')&&
 (
  SUPABASE_KEY.startsWith('sb_publishable_')||
  SUPABASE_KEY.startsWith('eyJ')
 );
}

function photoArray(s){
 if(Array.isArray(s.photos)){
  return s.photos.filter(
   p=>p&&typeof p==='object'
  );
 }

 if(s.photoPath){
  return [{
   id:s.photoId||uid(),
   path:s.photoPath
  }];
 }

 if(s.photo){
  return [{
   id:s.photoId||uid(),
   url:s.photo
  }];
 }

 return [];
}

function normalize(t){
 const x=clone(t);

 if(!x.itinerary){
  x.itinerary={schedule:x.schedule||[]};
 }

 if(!Array.isArray(x.itinerary.schedule)){
  x.itinerary.schedule=[];
 }

 x.template=TEMPLATES[x.template]
  ?x.template:'scrapbook';

 x.status=x.status==='completed'
  ?'completed':'planning';

 x.people=Math.max(
  1,Math.min(99,parseInt(x.people)||1)
 );

 x.itinerary.schedule=
 x.itinerary.schedule.map((d,i)=>({
  name:d.name||'Day '+(i+1),
  stops:(d.stops||[]).map(s=>({
   ...s,
   uid:s.uid||uid(),
   name:s.name||'',
   time:s.time||'09:00',
   stayMinutes:s.stayMinutes??'',
   travelMinutes:s.travelMinutes??'',
   transport:s.transport||'',
   comment:s.comment||'',
   cost:s.cost??'',
   costCategory:s.costCategory||'other',
   photos:photoArray(s)
  }))
 }));

 return x;
}

function firstPhoto(t){
 for(const d of schedule(t)){
  for(const s of d.stops||[]){
   const p=photoArray(s);
   if(p.length)return p[0];
  }
 }
 return null;
}

function timeMin(t){
 if(!/^\d\d:\d\d$/.test(t||''))return null;

 const [h,m]=t.split(':').map(Number);

 return h<24&&m<60?h*60+m:null;
}

function timeText(n){
 return n>=0&&n<1440
  ?String(Math.floor(n/60)).padStart(2,'0')+
   ':'+String(n%60).padStart(2,'0')
  :null;
}

function slug(s){
 return String(s||'trip')
 .replace(/[^\w-]/g,'_')
 .slice(0,50);
}

/* ==========================================
   04. PHOTO ACCESS
========================================== */

async function photoURL(p){
 if(!p)return '';

 if(p.path){
  const cached=photoCache.get(p.path);

  if(cached&&cached.expires>Date.now()){
   return cached.url;
  }

  if(!sb)return '';

  const {data,error}=await sb.storage
  .from(BUCKET)
  .createSignedUrl(p.path,3600);

  if(error){
   console.warn(error.message);
   return '';
  }

  photoCache.set(p.path,{
   url:data.signedUrl,
   expires:Date.now()+3500000
  });

  return data.signedUrl;
 }

 return safeURL(p.url);
}

function photoHTML(p){
 if(!p)return '';

 if(p.path){
  return `<img data-private="${esc(p.path)}"
   alt="旅の写真">`;
 }

 const url=safeURL(p.url);

 return url
  ?`<img src="${esc(url)}" alt="旅の写真">`
  :'';
}

async function decoratePhotos(){
 const nodes=[
  ...document.querySelectorAll('[data-private]')
 ];

 await Promise.all(nodes.map(async el=>{
  const src=await photoURL({
   path:el.dataset.private
  });

  if(src&&el.isConnected){
   el.src=src;
  }
 }));
}

function photoGrid(s){
 const photos=photoArray(s);

 if(!photos.length)return '';

 return `<div class="photo-grid">
 ${photos.map(photoHTML).join('')}
 </div>`;
}

/* ==========================================
   05. INITIALIZATION
========================================== */

async function initialize(){
 if(!configured()){
  app.innerHTML=`
  <div class="warn">
   <h2>Supabase設定が必要です</h2>
   接続情報を確認してください。
  </div>`;
  return;
 }

 if(!window.supabase){
  app.innerHTML=`
  <div class="warn">
   Supabaseライブラリを読み込めませんでした。
  </div>`;
  return;
 }

 try{
  sb=window.supabase.createClient(
   SUPABASE_URL,
   SUPABASE_KEY
  );

  const {data,error}=await sb.auth.getUser();

  if(error){
   console.warn(error.message);
  }

  user=data?.user||null;

  sb.auth.onAuthStateChange(
   (event,session)=>{
    const next=session?.user||null;

    if(user?.id!==next?.id){
     user=next;

     setTimeout(async()=>{
      await loadData();
      await searchCloud();
      go('home');
     },0);
    }
   }
  );

  await loadData();
  await searchCloud();
  go('home');

 }catch(e){
  console.error(e);

  app.innerHTML=`
  <div class="warn">
   <h2>接続エラー</h2>
   <p>${esc(e.message)}</p>
  </div>`;
 }
}

/* ==========================================
   06. CLOUD DATA
========================================== */

async function loadData(){
 if(!sb)return;

 try{
  if(user){
   const r=await sb.from('trips')
   .select('*')
   .eq('user_id',user.id)
   .order('updated_at',{ascending:false})
   .limit(500);

   if(r.error)throw r.error;

   trips=(r.data||[]).map(normalize);

   const b=await sb.from('bookmarks')
   .select('trip_id')
   .eq('user_id',user.id);

   if(b.error)throw b.error;

   bookmarks=(b.data||[]).map(x=>x.trip_id);

   if(bookmarks.length){
    const saved=await sb.from('trips')
    .select('*')
    .in('id',bookmarks.slice(0,500));

    if(saved.error)throw saved.error;

    savedTrips=(saved.data||[]).map(normalize);
   }else{
    savedTrips=[];
   }

  }else{
   trips=[];
   bookmarks=[];
   savedTrips=[];
  }

  const r=await sb.from('trips')
  .select('*')
  .eq('published',true)
  .order('updated_at',{ascending:false})
  .limit(12);

  if(r.error)throw r.error;

  publicTrips=(r.data||[]).map(normalize);

 }catch(e){
  fail(e);
 }
}

async function searchCloud(){
 if(!sb)return;

 try{
  let q=sb.from('trips')
  .select('*',{count:'exact'})
  .eq('published',true);

  if(search.q.trim()){
   const term=search.q.trim()
   .replace(/[%_,().]/g,' ')
   .slice(0,80);

   q=q.or(
    `title.ilike.%${term}%,destination.ilike.%${term}%`
   );
  }

  if(search.days){
   q=q.eq('days',+search.days);
  }

  if(search.people){
   q=q.eq('people',+search.people);
  }

  if(search.style){
   q=q.eq('style',search.style);
  }

  if(search.status){
   q=q.eq('status',search.status);
  }

  q=q.order('updated_at',{
   ascending:search.sort==='oldest'
  });

  const start=searchPage*20;

  const r=await q.range(start,start+19);

  if(r.error)throw r.error;

  searchResults=(r.data||[]).map(normalize);
  searchTotal=r.count||0;

 }catch(e){
  console.error(e);
  searchResults=[];
  searchTotal=0;

  alert('検索に失敗しました：'+e.message);
 }
}

async function refresh(){
 await loadData();
 await searchCloud();
 render();
}

  'auth-password'
 )?.value||'';

 if(!email||password.length<6){

   'メールアドレスと6文字以上のパスワードを入力してください。'
  );
 }

 busy=true;

 try{
  const r=authMode==='signup'
   ?await sb.auth.signUp({
    email,
    password,
    options:{
     emailRedirectTo:
     location.origin+location.pathname
    }
   })
   :await sb.auth.signInWithPassword({
    email,password
   });

  if(r.error)throw r.error;

  if(authMode==='signup'&&!r.data.session){

   authMode='login';

   await loadData();
   await searchCloud();

   go('home');
  }

 }catch(e){

 }finally{
  busy=false;
 }
}

========================================== */

function routePoints(t){
 const points=[];

 schedule(t).forEach((d,di)=>{
  (d.stops||[]).forEach((s,si)=>{
   if(validCoords(s.coords)){
    points.push({
     lat:+s.coords[0],
     lng:+s.coords[1],
     name:s.name,
     di,
     si,
     travel:s.travelMinutes
    });
   }
  });
 });

 return points;
}

function projectPoints(points,w,h){
 if(!points.length)return [];

 const minLat=Math.min(
  ...points.map(p=>p.lat)
 );
 const maxLat=Math.max(
  ...points.map(p=>p.lat)
 );
 const minLng=Math.min(
  ...points.map(p=>p.lng)
 );
 const maxLng=Math.max(
  ...points.map(p=>p.lng)
 );

 const meanLat=(minLat+maxLat)/2;
 const cos=Math.max(
  .1,Math.cos(meanLat*Math.PI/180)
 );

 const xSpan=Math.max(
  .005,(maxLng-minLng)*cos
 );
 const ySpan=Math.max(
  .005,maxLat-minLat
 );

 const scale=Math.min(
  (w-120)/xSpan,
  (h-150)/ySpan
 );

 const centerLng=(minLng+maxLng)/2;
 const centerLat=(minLat+maxLat)/2;

 return points.map(p=>({
  ...p,
  x:w/2+(p.lng-centerLng)*cos*scale,
  y:h/2-(p.lat-centerLat)*scale
 }));
}

function routeSVG(t){
 const w=600,h=520;
 const points=projectPoints(
  routePoints(t),w,390
 ).map(p=>({
  ...p,
  y:p.y+60
 }));

 let shapes='';

 for(let i=0;i<9;i++){
  const x=40+i*70;
  const y=60+(i%3)*110;

  shapes+=`
  <path d="M ${x} ${y}
   q 25 -17 52 5"
   fill="none"
   stroke="#ded7c7"
   stroke-width="2"/>`;
 }

 schedule(t).forEach((d,di)=>{
  const ps=points.filter(p=>p.di===di);

  for(let i=1;i<ps.length;i++){
   const a=ps[i-1];
   const b=ps[i];

   shapes+=`
   <path d="M${a.x},${a.y}
    Q${(a.x+b.x)/2+15},
    ${(a.y+b.y)/2-18}
    ${b.x},${b.y}"
    fill="none"
    stroke="${COLORS[di%COLORS.length]}"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="10 7"/>`;

   if(num(b.travel)){
    shapes+=`
    <text x="${(a.x+b.x)/2}"
     y="${(a.y+b.y)/2-13}"
     text-anchor="middle"
     font-size="12"
     fill="#493c30">
     ${esc(b.travel)}分
    </text>`;
   }
  }
 });

 points.forEach(p=>{
  const color=COLORS[
   p.di%COLORS.length
  ];

  shapes+=`
  <circle cx="${p.x}"
   cy="${p.y}"
   r="16"
   fill="${color}"
   stroke="#fffdf8"
   stroke-width="3"/>

  <text x="${p.x}"
   y="${p.y+5}"
   font-size="14"
   text-anchor="middle"
   fill="white"
   font-weight="bold">
   ${p.si+1}
  </text>`;
 });

 const legend=schedule(t).map((d,i)=>`
  <circle cx="${25+(i%3)*190}"
   cy="${425+Math.floor(i/3)*23}"
   r="6"
   fill="${COLORS[i%COLORS.length]}"/>

  <text x="${38+(i%3)*190}"
   y="${430+Math.floor(i/3)*23}"
   font-size="13"
   fill="#493c30">
   ${esc(d.name)}
  </text>
 `).join('');

 return `
 <svg class="route-svg"
  viewBox="0 0 600 520"
  xmlns="http://www.w3.org/2000/svg">

  <rect width="600"
   height="520"
   fill="#f3eddf"/>

  <text x="30" y="37"
   font-family="Georgia,serif"
   font-size="25"
   fill="#59634a">
   THE JOURNEY MAP
  </text>

  ${shapes}
  ${legend}

  <text x="300" y="505"
   text-anchor="middle"
   font-size="11"
   fill="#857c6d">
   Illustrated route / Not to scale
  </text>
 </svg>`;
}

function drawRealMap(t){
 const el=document.getElementById(
  'trip-map'
 );

 if(!el||!t||typeof L==='undefined'){
  return;
 }

 try{
  map=L.map(el,{
   scrollWheelZoom:false
  });

  L.tileLayer(
   'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
   {
    attribution:
    '&copy; OpenStreetMap contributors',
    maxZoom:19
   }
  ).addTo(map);

  const bounds=[];

  schedule(t).forEach((d,di)=>{
   let previous=null;

   (d.stops||[]).forEach((s,si)=>{
    if(!validCoords(s.coords)){
     previous=null;
     return;
    }

    const pos=s.coords.map(Number);
    bounds.push(pos);

    L.circleMarker(pos,{
     radius:10,
     color:'#fff',
     weight:2,
     fillColor:
     COLORS[di%COLORS.length],
     fillOpacity:1
    })
    .addTo(map)
    .bindPopup(
     esc(d.name)+' / '+esc(s.name)
    );

    if(previous){
     L.polyline(
      [previous,pos],
      {
       color:COLORS[
        di%COLORS.length
       ],
       weight:4
      }
     ).addTo(map);
    }

    previous=pos;
   });
  });

  if(bounds.length){
   map.fitBounds(bounds,{
    padding:[30,30],
    maxZoom:13
   });
  }else{
   map.setView([35.6812,139.7671],5);
  }

  setTimeout(()=>{
   if(map)map.invalidateSize();
  },200);

 }catch(e){
  console.error(e);
 }
}

    }
   ]
  }
 };
}

function saveDraftLocal(){
 if(!draft||!user)return;

 try{
  localStorage.setItem(
   DRAFT_KEY,
   JSON.stringify({
    userId:user.id,
    editingId,
    draft,
    updatedAt:new Date().toISOString()
   })
  );

  const el=document.getElementById(
   'autosave'
  );

  if(el){
   el.textContent=
   '下書き保存済み：'+
   new Date().toLocaleTimeString('ja-JP');
  }

 }catch(e){
  console.warn(e);
 }
}

function readDraft(){
 try{
  const a=JSON.parse(
   localStorage.getItem(DRAFT_KEY)||'null'
  );

  if(a?.draft)return a;

  const b=JSON.parse(
   localStorage.getItem(OLD_DRAFT_KEY)||'null'
  );

  return b?.draft?b:null;

 }catch(e){
  return null;
 }
}

function clearDraft(){
 localStorage.removeItem(DRAFT_KEY);
 localStorage.removeItem(OLD_DRAFT_KEY);
}

function queueDraft(){
 clearTimeout(draftTimer);

 draftTimer=setTimeout(()=>{
  syncEditor();
  saveDraftLocal();
 },500);
}

function resumeDraft(){
 if(!requireLogin())return;

 const x=readDraft();

 if(!x||x.userId!==user.id){
  return alert('下書きがありません。');
 }

 draft=normalize(x.draft);
 editingId=x.editingId||'';

 if(editingId&&!trips.some(
  t=>t.id===editingId
 )){
  editingId='';
 }

 go('edit');
}

function discardDraft(){
 if(!confirm(
  '下書きを破棄しますか？'
 ))return;

 clearDraft();
 draft=null;
 editingId='';

 go('home');
}

function openNew(publish=false){
 if(!requireLogin())return;

 if(
  readDraft()?.userId===user.id&&
  !confirm(
   '保存済みの下書きを置き換えますか？'
  )
 )return;

 draft=newDraft();
 draft.published=publish;
 editingId='';

 saveDraftLocal();
 go('edit');
}

function openEdit(id){
 if(!requireLogin())return;

 const t=find(id);

 if(!t||!own(t))return;

 draft=normalize(t);
 editingId=id;

 saveDraftLocal();
 go('edit');
}

function openCopy(id){
 if(!requireLogin())return;

 const t=find(id);
 if(!t)return;

 if(
  readDraft()?.userId===user.id&&
  !confirm(
   '現在の下書きを置き換えますか？'
  )
 )return;

 draft=normalize(t);

 delete draft.id;
 delete draft.user_id;
 delete draft.created_at;
 delete draft.updated_at;

 draft.title=t.title+'（コピー）';
 draft.status='planning';
 draft.published=false;

 // 写真の所有権をコピーしない。
 // 元の旅程は引き続き閲覧できる。

 for(const d of schedule(draft)){
  for(const s of d.stops){
   s.photos=[];
   s.photo='';
   s.photoPath='';
  }
 }

 editingId='';

 saveDraftLocal();
 go('edit');
}

function syncEditor(){
 if(!draft||page!=='edit')return;

 const fields={
  'trip-title':'title',
  'trip-destination':'destination',
  'trip-description':'description',
  'trip-month':'trip_month',
  'trip-people':'people',
  'trip-style':'style',
  'trip-template':'template',
  'trip-status':'status'
 };

 for(const [id,key] of Object.entries(fields)){
  const el=document.getElementById(id);

  if(el){
   draft[key]=el.value;
  }
 }

 const pub=document.getElementById(
  'trip-published'
 );

 if(pub){
  draft.published=pub.value==='true';
 }

 draft.people=Math.max(
  1,Math.min(
   99,parseInt(draft.people)||1
  )
 );

 document.querySelectorAll(
  '[data-dayname]'
 ).forEach(el=>{
  const d=schedule(draft)[
   +el.dataset.dayname
  ];

  if(d){
   d.name=el.value;
  }
 });

 document.querySelectorAll(
  '[data-field]'
 ).forEach(el=>{
  const s=schedule(draft)[
   +el.dataset.day
  ]?.stops[
   +el.dataset.spot
  ];

  if(!s)return;

  const f=el.dataset.field;

  if(f==='name'&&s.name!==el.value){
   s.name=el.value;
   s.lookup='';
   delete s.coords;
   delete s.locationLabel;
  }else if(f!=='name'){
   s[f]=el.value;
  }
 });
}

function refreshCosts(){
 if(!draft)return;

 const a=document.getElementById(
  'total-cost'
 );

 const b=document.getElementById(
  'per-person'
 );

 if(a){
  a.textContent=money(total(draft));
 }

 if(b){
  b.textContent=money(
   total(draft)/(draft.people||1)
  );
 }

 const sums={};

 for(const d of schedule(draft)){
  for(const s of d.stops){
   const k=s.costCategory||'other';

   sums[k]=(sums[k]||0)+
   (num(s.cost)?+s.cost:0);
  }
 }

 const el=document.getElementById(
  'cost-categories'
 );

 if(el){
  el.innerHTML=Object.entries(sums)
  .filter(([,v])=>v>0)
  .map(([k,v])=>`
   <p class="muted">
    ${esc(CATEGORIES[k]||'その他')}：
    ${money(v)}
   </p>`
  ).join('');
 }
}

function moveDay(di,si){

 ){

 s.transport='';

function calculateDay(di){
 syncEditor();

 const a=schedule(draft)[di].stops;

 if(a.length<2){
  return alert(
   'スポットを2件以上登録してください。'
  );
 }

 let current=timeMin(a[0].time);

 if(current===null){
  return alert(
   '最初の訪問時刻を設定してください。'
  );
 }

 const times=[];

 for(let i=1;i<a.length;i++){
  const p=a[i-1];
  const n=a[i];

  if(
   !num(p.stayMinutes)||
   !num(n.travelMinutes)
  ){
   return alert(
    '滞在時間と移動時間を入力してください。'
   );
  }

  if(
   +p.stayMinutes<0||
   +n.travelMinutes<0
  ){
   return alert(
    '時間は0以上で入力してください。'
   );
  }

  current+=
   +p.stayMinutes+
   +n.travelMinutes;

  const t=timeText(current);

  if(!t){
   return alert(
    '翌日にまたがるため計算できません。'
   );
  }

  times.push(t);
 }

 if(!confirm(
  '2件目以降の時刻を上書きしますか？'
 ))return;

 times.forEach((t,i)=>{
  a[i+1].time=t;
 });

 editorChanged();
}

function checkDay(di){
 syncEditor();

 const a=schedule(draft)[di].stops;
 const el=document.getElementById(
  'check-'+di
 );

 if(!el)return;

 el.innerHTML=a.slice(1).map(
  (s,i)=>{
   const p=a[i];
   const x=timeMin(p.time);
   const y=timeMin(s.time);

   if(x===null||y===null){
    return '<p class="warn">時刻未設定</p>';
   }

   if(
    !num(p.stayMinutes)||
    !num(s.travelMinutes)
   ){
    return `
    <p class="muted">
     時間が未設定
    </p>`;
   }

   const gap=
    y-x-
    (+p.stayMinutes)-
    (+s.travelMinutes);

   return `
   <p class="${gap<0?'warn':'ok'}">
    ${i+1} → ${i+2}：
    ${gap<0
     ?(-gap)+'分不足'
     :gap+'分の余裕'}
   </p>`;
  }
 ).join('')||'<p>スポットが2件以上必要です。</p>';
}

async function uploadPhotos(files,di,si){
 if(!requireLogin()||busy)return;

 if(!editingId){
  return alert(
   '最初に旅程をクラウド保存してください。'
  );
 }

 syncEditor();

 const s=schedule(draft)[di]?.stops[si];

 if(!s)return;

 busy=true;

 let uploaded=0;

 try{
  for(const file of files){
   if(!file.type.startsWith('image/')){
    continue;
   }

   if(file.size>20*1024*1024){
    throw Error(
     '20MB以下の写真を選択してください。'
    );
   }

   const url=URL.createObjectURL(file);
   const img=new Image();

   try{
    await new Promise(
     (resolve,reject)=>{
      img.onload=resolve;
      img.onerror=reject;
      img.src=url;
     }
    );
   }finally{
    URL.revokeObjectURL(url);
   }

   const scale=Math.min(
    1,
    1400/Math.max(
     img.width,img.height
    )
   );

   const canvas=document.createElement(
    'canvas'
   );

   canvas.width=Math.max(
    1,Math.round(img.width*scale)
   );

   canvas.height=Math.max(
    1,Math.round(img.height*scale)
   );

   const ctx=canvas.getContext('2d');

   ctx.fillStyle='white';
   ctx.fillRect(
    0,0,canvas.width,canvas.height
   );

   ctx.drawImage(
    img,0,0,
    canvas.width,canvas.height
   );

   const blob=await new Promise(
    resolve=>canvas.toBlob(
     resolve,'image/jpeg',.8
    )
   );

   if(!blob){
    throw Error(
     '写真の変換に失敗しました。'
    );
   }

   const path=
    user.id+'/'+
    editingId+'/'+
    uid()+'.jpg';

   const r=await sb.storage
   .from(BUCKET)
   .upload(path,blob,{
    contentType:'image/jpeg',
    upsert:false
   });

   if(r.error)throw r.error;

   s.photos=photoArray(s);

   s.photos.push({
    id:uid(),
    path
   });

   uploaded++;

   saveDraftLocal();
  }

  editorChanged();

  alert(

async function lookupPlace(di,si){

  `lookup-${di}-${si}`
 );

 if(!s||!el)return;

  );

 lookupBusy=true;

  ).join('')||'候補なし';

 }finally{

 }
}

function exportSize(){

function exportPageCapacity(){

function buildExportPages(t){
 const pages=[
  {
   type:'cover',
   label:'表紙'
  },
  {
   type:'map',
   label:'全体ルートマップ'
  }
 ];

 schedule(t).forEach((d,di)=>{
  const stops=d.stops||[];
  const capacity=exportPageCapacity();

  if(!stops.length){
   pages.push({
    type:'day',
    di,
    start:0,
    end:0,
    label:'DAY '+(di+1)
   });
   return;
  }

  for(
   let start=0;
   start<stops.length;
   start+=capacity
  ){
   const end=Math.min(
    stops.length,
    start+capacity
   );

   pages.push({
    type:'day',
    di,
    start,
    end,
    label:
     'DAY '+(di+1)+
     (
      stops.length>capacity
       ?' / '+(
        Math.floor(start/capacity)+1
       )
       :''
     )
   });
  }
 });

 return pages;
}

/* ==========================================
   21. CANVAS DRAWING HELPERS
========================================== */

function roundRect(ctx,x,y,w,h,r,fill){
 ctx.beginPath();

 ctx.roundRect(
  x,y,w,h,r
 );

 ctx.fillStyle=fill;
 ctx.fill();
}

function wrapText(
 ctx,text,x,y,maxWidth,lineHeight,maxLines=5
){
 const chars=Array.from(
  String(text||'')
 );

 let line='';
 let lines=0;

 for(const c of chars){
  if(
   ctx.measureText(line+c).width>
   maxWidth&&line
  ){
   ctx.fillText(
    line,x,y+lines*lineHeight
   );

   lines++;
   line=c;

   if(lines>=maxLines){
    return y+lines*lineHeight;
   }
  }else{
   line+=c;
  }
 }

 if(line){
  ctx.fillText(
   line,x,y+lines*lineHeight
  );
  lines++;
 }

 return y+lines*lineHeight;
}

function canvasBase(ctx,w,h){
 ctx.fillStyle='#f7f4ec';
 ctx.fillRect(0,0,w,h);

 ctx.fillStyle='#e8ddca';
 ctx.fillRect(30,30,w-60,h-60);

 ctx.fillStyle='#fffdf8';
 ctx.fillRect(48,48,w-96,h-96);

 ctx.fillStyle='#59634a';
 ctx.font='bold 47px Georgia,serif';

 ctx.fillText(
  'TUMUGOU',88,120
 );

 ctx.font='22px sans-serif';

 ctx.fillText(
  'あなたの旅が、次の誰かの旅になる。',
  90,160
 );

 ctx.fillStyle='#857c6d';
 ctx.font='20px sans-serif';

 ctx.fillText(
  'TRAVEL JOURNAL / '+VERSION,
  90,h-95
 );
}

async function loadCanvasImage(p){
 const url=await photoURL(p);

 if(!url)return null;

 try{
  const response=await fetch(url);

  if(!response.ok)return null;

  const blob=await response.blob();
  const obj=URL.createObjectURL(blob);
  const img=new Image();

  try{
   await new Promise(
    (resolve,reject)=>{
     img.onload=resolve;
     img.onerror=reject;
     img.src=obj;
    }
   );

   return img;

  }finally{
   URL.revokeObjectURL(obj);
  }

 }catch(e){
  console.warn(
   '画像読み込み失敗:',
   e
  );
  return null;
 }
}

function drawImageCover(
 ctx,img,x,y,w,h
){
 const scale=Math.max(
  w/img.width,
  h/img.height
 );

 const sw=w/scale;
 const sh=h/scale;

 const sx=(img.width-sw)/2;
 const sy=(img.height-sh)/2;

 ctx.drawImage(
  img,
  sx,sy,sw,sh,
  x,y,w,h
 );
}

/* ==========================================
   22. CANVAS ROUTE MAP
========================================== */

function drawCanvasMap(
 ctx,t,x,y,w,h
){
 roundRect(
  ctx,x,y,w,h,18,'#f3eddf'
 );

 const points=projectPoints(
  routePoints(t),
  w-120,
  h-150
 ).map(p=>({
  ...p,
  x:x+60+p.x,
  y:y+65+p.y
 }));

 ctx.save();

 ctx.beginPath();
 ctx.rect(x,y,w,h);
 ctx.clip();

 for(let i=0;i<8;i++){
  ctx.strokeStyle='#ded7c7';
  ctx.lineWidth=3;

  ctx.beginPath();

  const px=x+30+i*120;
  const py=y+50+(i%3)*140;

  ctx.moveTo(px,py);
  ctx.quadraticCurveTo(
   px+40,py-25,
   px+85,py+5
  );

  ctx.stroke();
 }

 schedule(t).forEach((d,di)=>{
  const ps=points.filter(
   p=>p.di===di
  );

  ctx.strokeStyle=
  COLORS[di%COLORS.length];

  ctx.lineWidth=7;
  ctx.setLineDash([13,10]);

  for(let i=1;i<ps.length;i++){
   const a=ps[i-1];
   const b=ps[i];

   ctx.beginPath();
   ctx.moveTo(a.x,a.y);
   ctx.lineTo(b.x,b.y);
   ctx.stroke();

   if(num(b.travel)){
    ctx.fillStyle='#493c30';
    ctx.font='20px sans-serif';

    ctx.fillText(
     b.travel+'分',
     (a.x+b.x)/2,
     (a.y+b.y)/2-15
    );
   }
  }
 });

 ctx.setLineDash([]);

 points.forEach(p=>{
  const color=COLORS[
   p.di%COLORS.length
  ];

  ctx.fillStyle=color;
  ctx.strokeStyle='white';
  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.arc(
   p.x,p.y,21,0,Math.PI*2
  );
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle='white';
  ctx.font='bold 20px sans-serif';
  ctx.textAlign='center';

  ctx.fillText(
   String(p.si+1),
   p.x,p.y+7
  );

  ctx.textAlign='left';
 });

 ctx.restore();

 ctx.fillStyle='#59634a';
 ctx.font='20px sans-serif';

 ctx.fillText(
  'Illustrated route / Not to scale',
  x+25,y+h-30
 );
}

async function drawExportPage(index){
 const t=exportTrip;
 const p=exportPages[index];

 if(!t||!p)return;

 const canvas=document.getElementById(
  'export-canvas-'+index
 );

 if(!canvas)return;

 const [w,h]=exportSize();

 canvas.width=w;
 canvas.height=h;

 const ctx=canvas.getContext('2d');

 canvasBase(ctx,w,h);

 const left=92;
 const contentW=w-184;

 if(p.type==='cover'){
  ctx.fillStyle='#59634a';
  ctx.font='28px sans-serif';

  ctx.fillText(
   'MY TRAVEL STORY',
   left,245
  );

  const photo=firstPhoto(t);
  const img=await loadCanvasImage(photo);

  const imageY=285;
  const imageH=Math.min(
   650,h*.42
  );

  if(img){
   drawImageCover(
    ctx,img,
    left,imageY,
    contentW,imageH
   );
  }else{
   roundRect(
    ctx,
    left,imageY,
    contentW,imageH,
    18,'#b7c3ad'
   );

   ctx.fillStyle='#fffdf8';
   ctx.font='130px serif';

   ctx.fillText(
    '✈',
    w/2-70,
    imageY+imageH/2+45
   );
  }

  ctx.fillStyle='#493c30';
  ctx.font='bold 57px serif';

  const ty=imageY+imageH+85;

  const end=wrapText(
   ctx,t.title,
   left,ty,
   contentW,72,3
  );

  ctx.fillStyle='#59634a';
  ctx.font='30px sans-serif';

  ctx.fillText(
   t.destination||'',
   left,end+25
  );

  ctx.font='25px sans-serif';

  ctx.fillText(
   schedule(t).length+
   ' DAYS / '+
   count(t)+' SPOTS',
   left,end+80
  );

 }else if(p.type==='map'){
  ctx.fillStyle='#493c30';
  ctx.font='bold 48px serif';

  ctx.fillText(
   'THE JOURNEY MAP',
   left,240
  );

  const mapH=Math.min(
   850,h-500
  );

  drawCanvasMap(
   ctx,t,
   left,285,
   contentW,mapH
  );

  let legendY=285+mapH+50;

  schedule(t).forEach((d,di)=>{
   if(legendY>h-150)return;

   ctx.fillStyle=
   COLORS[di%COLORS.length];

   ctx.beginPath();
   ctx.arc(
    left+15,legendY-7,
    10,0,Math.PI*2
   );
   ctx.fill();

   ctx.fillStyle='#493c30';
   ctx.font='23px sans-serif';

   ctx.fillText(
    d.name,
    left+40,legendY
   );

   legendY+=37;
  });

 }else if(p.type==='day'){
  const d=schedule(t)[p.di];

  const stops=(d.stops||[])
  .slice(p.start,p.end);

  const color=COLORS[
   p.di%COLORS.length
  ];

  ctx.fillStyle=color;
  ctx.fillRect(
   left,225,12,80
  );

  ctx.fillStyle='#493c30';
  ctx.font='bold 53px Georgia,serif';

  ctx.fillText(
   'DAY '+(p.di+1),
   left+30,278
  );

  ctx.font='29px sans-serif';

  wrapText(
   ctx,d.name,
   left+30,330,
   contentW-30,39,2
  );

  const top=420;
  const bottom=h-160;

  const usable=bottom-top;
  const per=usable/
   Math.max(1,stops.length);

  for(let i=0;i<stops.length;i++){
   const s=stops[i];
   const y=top+i*per;

   ctx.fillStyle=color;

   ctx.beginPath();
   ctx.arc(
    left+15,y+17,
    12,0,Math.PI*2
   );
   ctx.fill();

   ctx.fillStyle='#493c30';
   ctx.font='bold 26px sans-serif';

   const spotNumber=p.start+i+1;

   wrapText(
    ctx,
    (s.time||'--:--')+
    '  '+spotNumber+'. '+s.name,
    left+42,y+25,
    contentW-45,32,2
   );

   ctx.fillStyle='#857c6d';
   ctx.font='20px sans-serif';

   const info=[
    num(s.stayMinutes)
     ?'滞在 '+s.stayMinutes+'分'
     :'',
    num(s.cost)
     ?money(+s.cost)
     :''
   ].filter(Boolean).join(' / ');

   ctx.fillText(
    info,
    left+42,y+85
   );

   const photos=photoArray(s);

   if(photos.length){
    const img=await loadCanvasImage(
     photos[0]
    );

    if(img){
     const photoY=y+108;

     const photoH=Math.min(
      150,
      Math.max(75,per-160)
     );

     drawImageCover(
      ctx,img,
      left+42,photoY,
      270,photoH
     );
    }
   }

   if(s.comment){
    ctx.fillStyle='#493c30';
    ctx.font='20px sans-serif';

    wrapText(
     ctx,s.comment,
     left+340,y+125,
     contentW-350,
     29,3
    );
   }

   if(i<stops.length-1){
    ctx.strokeStyle=color;
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(
     left+15,y+35
    );
    ctx.lineTo(
     left+15,y+per-10
    );
    ctx.stroke();

    const next=stops[i+1];

    if(num(next.travelMinutes)){
     ctx.fillStyle='#857c6d';
     ctx.font='18px sans-serif';

     ctx.fillText(
      '移動 '+
      next.travelMinutes+'分',
      left+42,y+per-17
     );
    }
   }
  }

  ctx.fillStyle='#59634a';
  ctx.font='21px sans-serif';

  ctx.fillText(
   'SPOTS '+
   (p.start+1)+' - '+p.end+
   ' / '+(d.stops||[]).length,
   left,h-170
  );
 }
}

  'TUMUGOU_'+

 );

  navigator.canShare({
   files:[file]
  })
 ){
  try{
   await navigator.share({
    files:[file],
    title:'TUMUGOU'
   });

   return;

  }catch(e){
   if(e.name==='AbortError'){
    return;
   }
  }
 }

 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');

 a.href=url;
 a.download=name;

 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(()=>{
  URL.revokeObjectURL(url);
 },60000);
}

  ${!old?.plans.length
   ?'disabled':''}>
  旧旅程を移行
 </button>

 <div id="migration-status"></div>`;
}

async function migrateLegacy(){
 if(!requireLogin()||busy)return;

 const old=legacyState();

 if(!old?.plans.length)return;

 if(!confirm(
  old.plans.length+
  '件をクラウドにコピーしますか？'
 ))return;

 busy=true;

 let done=0;
 let failed=0;

 const el=document.getElementById(
  'migration-status'
 );

 try{
  for(const original of old.plans){
   try{
    const t=normalize({
     ...original,
     destination:
      original.place||
      original.destination||
      '',
     trip_month:
      original.tripMonth||
      original.trip_month||
      '',
     itinerary:
      original.itinerary||
      {schedule:original.schedule||[]}
    });

    if(
     trips.some(
      x=>x.itinerary?.legacyId===
      original.id
     )
    ){
     done++;
     continue;
    }

    t.itinerary.legacyId=original.id;

    // 旧端末内の画像参照を
    // 新しい旅程には持ち込まない。
    // 元のデータは保持する。

    for(const d of schedule(t)){
     for(const s of d.stops){
      s.photos=[];
      s.photo='';
      s.photoPath='';
     }
    }

    const r=await sb.from('trips')
    .insert({
     user_id:user.id,
     title:t.title,
     destination:t.destination,
     description:t.description||'',
     style:t.style||'',
     trip_month:t.trip_month||null,
     people:t.people||1,
     status:t.status,
     published:false,
     template:t.template,
     itinerary:t.itinerary
    });

    if(r.error)throw r.error;

    done++;

   }catch(e){
    console.error(e);
    failed++;
   }

   if(el){
    el.textContent=
    '移行中：'+
    (done+failed)+' / '+
    old.plans.length;
   }
  }

  await loadData();
  await searchCloud();

  if(el){
   el.innerHTML=`
   <p class="ok">
    成功 ${done}件 /
    失敗 ${failed}件
   </p>`;
  }

  alert(
   '移行終了：成功 '+
   done+'件、失敗 '+
   failed+'件'
  );

 }finally{
  busy=false;
 }
}

/* ==========================================
   25. EVENTS
========================================== */

document.addEventListener(
 'click',
 async e=>{
  const btn=e.target.closest(
   '[data-a]'
  );

  if(!btn||busy)return;

  const a=btn.dataset.a;
  const id=btn.dataset.id||'';

  const di=+btn.dataset.day;
  const si=+btn.dataset.spot;
  const pi=+btn.dataset.index;

  try{
   switch(a){

    case 'page':
     if(page==='edit'&&draft){
      syncEditor();
      saveDraftLocal();
     }
     go(id);
     break;

    case 'detail':
     go('detail',id);
     break;

    case 'refresh':
     await refresh();
     break;

    case 'auth-toggle':
     authMode=authMode==='login'
      ?'signup':'login';
     renderAccount();
     break;

    case 'auth-submit':
     await submitAuth();
     break;

    case 'logout':
     await logout();
     break;

    case 'new':
     openNew(false);
     break;

    case 'new-publish':
     openNew(true);
     break;

    case 'edit':
     openEdit(id);
     break;

    case 'copy':
     openCopy(id);
     break;

    case 'tab':
     tab=id;
     renderMy();
     break;

    case 'save-trip':
     await saveTrip();
     break;

    case 'save-draft':
     syncEditor();
     saveDraftLocal();
     alert('下書きを保存しました。');
     break;

    case 'resume':
     resumeDraft();
     break;

    case 'discard':
     discardDraft();
     break;

    case 'status':
     await toggleStatus(id);
     break;

    case 'publish':
     await togglePublish(id);
     break;

    case 'delete':
     await deleteTrip(id);
     break;

    case 'bookmark':
     await toggleBookmark(id);
     break;

    case 'search-step':
     rememberSearchFields();
     searchStep=+id;
     renderSearch();
     break;

    case 'search-run':
     await runSearch();
     break;

    case 'search-reset':
     search={
      q:'',
      days:'',
      people:'',
      style:'',
      status:'',
      sort:'newest'
     };
     searchStep=1;
     searchPage=0;
     await searchCloud();
     renderSearch();
     break;

    case 'search-prev':
     if(searchPage>0){
      searchPage--;
      await searchCloud();
      renderResults();
     }
     break;

    case 'search-next':
     if(
      (searchPage+1)*20<
      searchTotal
     ){
      searchPage++;
      await searchCloud();
      renderResults();
     }
     break;

    case 'day-add':
     dayAdd();
     break;

    case 'day-delete':
     dayDelete(di);
     break;

    case 'day-up':
     dayMove(di,-1);
     break;

    case 'day-down':
     dayMove(di,1);
     break;

    case 'spot-add':
     spotAdd(di);
     break;

    case 'spot-delete':
     spotDelete(di,si);
     break;

    case 'spot-up':
     spotMove(di,si,-1);
     break;

    case 'spot-down':
     spotMove(di,si,1);
     break;

    case 'spot-duplicate':
     spotDuplicate(di,si);
     break;

    case 'move-day':
     moveDay(di,si);
     break;

    case 'calculate':
     calculateDay(di);
     break;

    case 'check':
     checkDay(di);
     break;

    case 'lookup':
     await lookupPlace(di,si);
     break;

    case 'choose-location':
     chooseLocation(di,si,pi);
     break;

    case 'photo-up':
     photoMove(di,si,pi,-1);
     break;

    case 'photo-down':
     photoMove(di,si,pi,1);
     break;

    case 'photo-remove':
     photoRemove(di,si,pi);
     break;

    case 'export':
     openExport(id);
     break;

    case 'export-save':
     await saveExport(pi);
     break;

    case 'migrate':
     await migrateLegacy();
     break;
   }

  }catch(e){
   fail(e);
  }
 }
);

document.addEventListener(
 'input',
 e=>{
  if(
   page==='edit'&&
   draft&&
   e.target.matches(
    'input,textarea,select'
   )
  ){
   syncEditor();
   refreshCosts();
   queueDraft();
  }
 }
);

document.addEventListener(
 'change',
 async e=>{
  if(
   page==='edit'&&
   draft&&
   !e.target.matches('[data-photo]')
  ){
   syncEditor();
   refreshCosts();
   queueDraft();
  }

  if(e.target.matches('[data-photo]')){
   const files=[
    ...(e.target.files||[])
   ];

   if(files.length){
    await uploadPhotos(
     files,
     +e.target.dataset.day,
     +e.target.dataset.spot
    );
   }
  }

  if(e.target.id==='export-ratio'){
   exportRatio=e.target.value;

   exportPages=buildExportPages(
    exportTrip
   );

   renderExport();
  }
 }
);

window.addEventListener(
 'pagehide',
 ()=>{
  if(page==='edit'&&draft){
   syncEditor();
   saveDraftLocal();
  }
 }
);

/* ==========================================
   26. START
========================================== */

initialize();

</script>
