<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#59634a">
<title>TUMUGOU ver.2.1</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
 --bg:#f8f5ee;--paper:#fffefa;--sand:#e9dfcc;
 --brown:#493c30;--olive:#59634a;--line:#ddd3c4
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--brown);font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
header{text-align:center;padding:22px;border-bottom:1px solid var(--line)}
header strong{font:bold 34px Georgia,serif;letter-spacing:5px}
header small{display:block;font-size:11px;margin-top:7px}
main{max-width:800px;margin:auto;padding:20px 15px 115px}
h2{font-size:25px}h3{font-size:18px}
p{line-height:1.65}
.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.btn{background:var(--olive);color:white;border:0;border-radius:9px;padding:11px 13px;margin:4px 4px 4px 0;font-size:13px;cursor:pointer}
.alt{background:var(--sand);color:var(--brown)}
.danger{background:#f4e2df;color:#88493c}
.btn:disabled{opacity:.4}
.actions{display:flex;flex-wrap:wrap;gap:4px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0}
input,select,textarea{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid #d3c8b8;border-radius:8px;background:white;color:var(--brown);font:inherit}
textarea{min-height:80px}
.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}
.muted{font-size:12px;color:#817768}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--olive);font-weight:bold}
.notice{background:#eee9dc;padding:13px;border-radius:10px;font-size:13px;line-height:1.7;margin:12px 0}
.warn{background:#fff0e6;padding:10px;border-radius:8px;color:#925333;font-size:12px}
.ok{background:#e8efe4;padding:10px;border-radius:8px;color:#42613e;font-size:12px}
.tag{display:inline-block;background:#e9eee3;color:var(--olive);padding:5px 9px;border-radius:20px;font-size:11px;margin:5px 4px 5px 0}
.hero{height:180px;background:linear-gradient(120deg,#bac6b4,#ead4b7);display:flex;align-items:center;justify-content:center;font-size:65px;border-radius:11px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.day{border-left:5px solid var(--olive)}
.spot{background:#f6f2e9;padding:13px;border-radius:11px;margin:12px 0}
.photo{width:100%;max-height:250px;object-fit:cover;border-radius:9px}
.map{height:350px;border-radius:12px;margin:14px 0}
.travel{background:#eee9dc;padding:9px;margin:8px 0;font-size:12px}
.pin{width:30px;height:30px;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--paper);border-top:1px solid var(--line);z-index:1000;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;padding:13px 0;color:var(--brown);font-size:11px}
nav .active{background:#e8ede0;font-weight:bold}
.tabs{display:flex;gap:5px;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{text-align:center;background:white;border:1px solid var(--line);border-radius:9px;padding:10px 2px}
.stat b{display:block;font-size:23px;color:var(--olive)}
.stat small{font-size:9px}
.file{display:block;background:#eee9dc;border:1px dashed #999;padding:13px;text-align:center;border-radius:9px}
.file input{display:none}
.preview img{width:100%;max-width:440px;display:block;margin:10px auto}
.backup{height:190px;font:11px monospace}
.template-scrapbook .day{box-shadow:4px 4px 0 var(--sand)}
.template-minimal .day{border-left-width:2px}
.template-magazine h2{font-family:Georgia,serif}
</style>
</head>
<body>
<header>
<strong>TUMUGOU</strong>
<small>あなたの旅が、次の誰かの旅になる。</small>
</header>
<main id="app"></main>
<nav id="nav"></nav>

<script>
'use strict';

/* ===== SETTINGS ===== */
const KEY='tumugou_v02';
const DRAFTKEY='tumugou_draft_v21';
const COLORS=['#59634a','#b47b59','#66869a','#b49a55','#977d9d'];
const STYLES={'':'未設定',culture:'歴史・文化',food:'グルメ',nature:'自然・絶景',relax:'のんびり',active:'アクティブ',city:'街歩き'};
const MODES={'':'未設定',walk:'徒歩',train:'電車',bus:'バス',car:'車',taxi:'タクシー',bike:'自転車',ferry:'船',other:'その他'};
const TEMPLATES={scrapbook:'手描きスクラップ',magazine:'トラベルマガジン',minimal:'シンプル'};
const CATEGORIES={food:'食事',transport:'交通',ticket:'入場料',hotel:'宿泊',shopping:'買い物',other:'その他'};
const app=document.getElementById('app');
const nav=document.getElementById('nav');

const SAMPLES=[
{id:'kyoto',title:'京都、街歩きと喫茶の2日間',place:'京都',icon:'🍵',description:'寺社と喫茶を巡る旅。',style:'culture',schedule:[
{name:'Day 1',stops:[
{name:'清水寺',time:'09:30',stayMinutes:90,coords:[34.9949,135.785]},
{name:'祇園',time:'11:25',stayMinutes:90,transport:'walk',travelMinutes:25,coords:[35.003,135.778]},
{name:'鴨川',time:'13:10',stayMinutes:60,transport:'walk',travelMinutes:15,coords:[35.01,135.771]}]},
{name:'Day 2',stops:[
{name:'嵐山',time:'10:00',stayMinutes:120,coords:[35.0094,135.6668]},
{name:'竹林の小径',time:'12:15',stayMinutes:90,transport:'walk',travelMinutes:15,coords:[35.017,135.671]}]}]},
{id:'taipei',title:'台北の街と夜市を楽しむ2日間',place:'台北',icon:'🏮',description:'ローカルグルメと街歩き。',style:'food',schedule:[
{name:'Day 1',stops:[{name:'迪化街',time:'11:00',coords:[25.0545,121.509]},{name:'寧夏夜市',time:'18:00',coords:[25.0567,121.5153]}]},
{name:'Day 2',stops:[{name:'龍山寺',time:'09:00',coords:[25.0372,121.4999]},{name:'中正紀念堂',time:'14:00',coords:[25.0345,121.5219]}]}]},
{id:'hokkaido',title:'札幌・小樽を巡る2日間',place:'北海道',icon:'🌲',description:'北海道の街歩き。',style:'nature',schedule:[
{name:'Day 1',stops:[{name:'札幌時計台',time:'10:00',coords:[43.0626,141.3535]},{name:'大通公園',time:'13:00',coords:[43.06,141.35]}]},
{name:'Day 2',stops:[{name:'小樽運河',time:'10:00',coords:[43.199,141.001]},{name:'堺町通り',time:'14:00',coords:[43.192,141.006]}]}]}
];

let state={plans:[],saved:[]};
try{
 const x=JSON.parse(localStorage.getItem(KEY));
 if(x&&Array.isArray(x.plans)&&Array.isArray(x.saved))state=x;
}catch(e){console.error(e)}

let page='home',selected='',tab='planning',draft=null,editing='',map=null;
let exportTrip=null,exportIndex=0,backupText='',restoreCandidate=null;
let lookupBusy=false,lastLookup=0,lookupResults=[];
let search={q:'',days:'',style:'',status:'',minStops:'',sort:'recommended'};
let photoCache=new Map();

/* ===== UTILITIES ===== */
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(x){return x!==''&&x!=null&&Number.isFinite(+x)}
function coords(x){return Array.isArray(x)&&x.length===2&&x.every(v=>Number.isFinite(+v))&&Math.abs(+x[0])<=90&&Math.abs(+x[1])<=180}
function count(t){return t.schedule.reduce((n,d)=>n+d.stops.length,0)}
function total(t){return t.schedule.reduce((n,d)=>n+d.stops.reduce((a,s)=>a+(num(s.cost)?+s.cost:0),0),0)}
function money(n){return Math.round(n).toLocaleString('ja-JP')+'円'}
function find(id){return [...SAMPLES,...state.plans].find(t=>t.id===id)}
function own(id){return state.plans.some(t=>t.id===id)}
function persist(){
 try{localStorage.setItem(KEY,JSON.stringify(state));return true}
 catch(e){alert('保存容量が不足しています。バックアップを取ってください。');return false}
}
function update(fn){
 const old=clone(state);fn();
 if(!persist()){state=old;return false}
 return true;
}
function norm(t){
 let x=clone(t);
 x.status=x.status==='completed'?'completed':'planning';
 x.published=!!x.published;
 x.style=STYLES[x.style]?x.style:'';
 x.template=TEMPLATES[x.template]?x.template:'scrapbook';
 x.people=Math.max(1,Math.min(99,parseInt(x.people)||1));
 x.tripMonth=x.tripMonth||'';
 x.schedule=(x.schedule||[]).map((d,i)=>({
  name:d.name||'Day '+(i+1),
  stops:(d.stops||[]).map(s=>({
   ...s,uid:s.uid||uid(),time:s.time||'09:00',name:s.name||'',
   stayMinutes:s.stayMinutes??'',travelMinutes:s.travelMinutes??'',
   transport:s.transport||'',comment:s.comment||'',
   cost:s.cost??'',costCategory:s.costCategory||'other',
   photo:s.photo||'',photoId:s.photoId||''
  }))
 }));
 x.days=x.schedule.length;
 return x;
}
function timeMin(t){
 if(!/^\d\d:\d\d$/.test(t||''))return null;
 const [h,m]=t.split(':').map(Number);
 return h<24&&m<60?h*60+m:null;
}
function timeText(n){
 return n>=0&&n<1440?String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'):null;
}
function travel(s){
 return [MODES[s.transport]||'',num(s.travelMinutes)?s.travelMinutes+'分':''].filter(Boolean).join('・')||'移動情報未設定';
}
function status(t){return SAMPLES.includes(t)?'サンプル':t.status==='completed'?'実際に行った旅':'旅行計画'}
function firstPhoto(t){
 for(const d of t.schedule)for(const s of d.stops)if(s.photoId||s.photo)return s;
 return null;
}

/* ===== INDEXEDDB PHOTOS ===== */
let dbPromise=null;
function dbOpen(){
 if(!('indexedDB' in window))return Promise.reject(Error('IndexedDB非対応'));
 if(dbPromise)return dbPromise;
 dbPromise=new Promise((resolve,reject)=>{
  const r=indexedDB.open('tumugou_photos_v21',1);
  r.onupgradeneeded=()=>{
   if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos');
  };
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
 return dbPromise;
}
async function photoPut(id,data){
 const db=await dbOpen();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('photos','readwrite');
  tx.objectStore('photos').put(data,id);
  tx.oncomplete=()=>{photoCache.set(id,data);resolve()};
  tx.onerror=()=>reject(tx.error);
 });
}
async function photoGet(id){
 if(!id)return '';
 if(photoCache.has(id))return photoCache.get(id);
 const db=await dbOpen();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('photos','readonly');
  const r=tx.objectStore('photos').get(id);
  r.onsuccess=()=>{const v=r.result||'';if(v)photoCache.set(id,v);resolve(v)};
  r.onerror=()=>reject(r.error);
 });
}
async function photoSource(s){
 if(s.photoId){
  try{return await photoGet(s.photoId)||s.photo||''}
  catch(e){return s.photo||''}
 }
 return s.photo||'';
}
async function decoratePhotos(){
 const nodes=[...document.querySelectorAll('[data-photo-id]')];
 await Promise.all(nodes.map(async el=>{
  const id=el.dataset.photoId;
  const s=JSON.parse(decodeURIComponent(el.dataset.photoFallback||'%22%22'));
  let src='';
  try{src=await photoGet(id)}catch(e){}
  src=src||s;
  if(src&&el.isConnected)el.src=src;
 }));
}
function imgHTML(s,cls='photo'){
 if(!s)return '';
 if(s.photoId)return `<img class="${cls}" alt="" data-photo-id="${esc(s.photoId)}" data-photo-fallback="${encodeURIComponent(JSON.stringify(s.photo||''))}">`;
 if(s.photo)return `<img class="${cls}" src="${s.photo}" alt="">`;
 return '';
}
async function migratePhotos(){
 let changed=false;
 const pending=[];
 for(const t of state.plans)for(const d of t.schedule||[])for(const s of d.stops||[]){
  if(s.photo&&!s.photoId&&s.photo.startsWith('data:image/')){
   const id=uid();
   try{await photoPut(id,s.photo);pending.push([s,id])}catch(e){}
  }
 }
 for(const [s,id] of pending){s.photoId=id;s.photo='';changed=true}
 if(changed)persist();
}

/* ===== DRAFT AUTO SAVE ===== */
function saveDraft(){
 if(!draft)return;
 try{
  const snapshot=clone(draft);
  // Photos remain in IndexedDB; large inline photos are not duplicated in draft.
  localStorage.setItem(DRAFTKEY,JSON.stringify({
   draft:snapshot,editing,updatedAt:new Date().toISOString()
  }));
  const el=document.getElementById('autosave');
  if(el)el.textContent='下書き保存済み：'+new Date().toLocaleTimeString('ja-JP');
 }catch(e){
  const el=document.getElementById('autosave');
  if(el)el.textContent='下書き保存に失敗しました';
 }
}
function clearDraft(){localStorage.removeItem(DRAFTKEY)}
function draftSaved(){
 try{
  const x=JSON.parse(localStorage.getItem(DRAFTKEY));
  return x&&x.draft&&Array.isArray(x.draft.schedule)?x:null;
 }catch(e){return null}
}
function resumeDraft(){
 const x=draftSaved();
 if(!x)return;
 draft=norm(x.draft);
 draft.publishAfterSave=!!x.draft.publishAfterSave;
 editing=x.editing&&own(x.editing)?x.editing:'';
 go('edit');
}
function abandonDraft(){
 if(!confirm('保存されている下書きを破棄しますか？'))return;
 clearDraft();draft=null;editing='';go('home');
}

/* ===== NAVIGATION ===== */
function menu(){
 nav.innerHTML=[['home','HOME','⌂'],['search','SEARCH','⌕'],['my','MY TRIP','♡'],['post','POST','＋']]
 .map(([id,n,icon])=>`<button class="${page===id?'active':''}" data-a="page" data-id="${id}">${icon}<br>${n}</button>`).join('');
}
function go(p,id=''){
 if(map){map.remove();map=null}
 page=p;selected=id;window.scrollTo(0,0);render();
 if(p==='detail')setTimeout(()=>{if(page==='detail'&&selected===id)drawMap(find(id))},80);
}
function render(){
 menu();
 ({home:renderHome,search:renderSearch,my:renderMy,post:renderPost,detail:renderDetail,
 edit:renderEditor,copy:renderCopy,backup:renderBackup,export:renderExport})[page]?.();
 decoratePhotos();
}

/* ===== CARDS ===== */
function hero(t){
 const s=firstPhoto(t);
 return `<div class="hero">${s?imgHTML(s,'hero-photo'):esc(t.icon||'🧳')}</div>`;
}
function card(t,enhanced=false){
 return `<article class="card">
 ${hero(t)}
 <div><span class="tag">${esc(t.place)}</span><span class="tag">${t.schedule.length}日間</span>
 <span class="tag">${count(t)}スポット</span><span class="tag">${status(t)}</span></div>
 <h3>${esc(t.title)}</h3><p class="muted">${esc(t.description||'')}</p>
 <p class="muted">${t.tripMonth?'旅行年月：'+esc(t.tripMonth)+' / ':''}${t.people||1}人 / 記録費用：${money(total(t))}</p>
 ${enhanced?`<p class="muted">${esc(t.schedule.flatMap(d=>d.stops.map(s=>s.name)).slice(0,5).join(' → '))}</p>`:''}
 <button class="btn" data-a="detail" data-id="${esc(t.id)}">旅程を見る →</button>
 ${enhanced?`<button class="btn alt" data-a="copy" data-id="${esc(t.id)}">コピーして編集</button>`:''}
 </article>`;
}
function stats(){
 const c={PLANNING:state.plans.filter(t=>t.status!=='completed').length,
 COMPLETED:state.plans.filter(t=>t.status==='completed').length,
 POST:state.plans.filter(t=>t.published).length,SAVED:state.saved.length};
 return `<div class="stats">${Object.entries(c).map(([k,v])=>`<div class="stat"><b>${v}</b><small>${k}</small></div>`).join('')}</div>`;
}

/* ===== HOME ===== */
function renderHome(){
 const saved=draftSaved();
 app.innerHTML=`<div class="eyebrow">YOUR JOURNEY, OUR STORY</div>
 <h2>誰かの旅から、<br>次の旅がはじまる。</h2>
 <p>実際の旅程を参考に、自分だけの旅を紡いでいこう。</p>
 ${saved?`<div class="notice"><b>編集中の旅程があります。</b><br>
 <button class="btn" data-a="resume">下書きを再開</button>
 <button class="btn danger" data-a="abandon">下書きを破棄</button></div>`:''}
 <button class="btn" data-a="new">＋ 新しい旅を計画</button>
 <button class="btn alt" data-a="page" data-id="search">旅程を探す</button>
 <div class="notice">ver.2.1 試作版。データはこのブラウザに保存されます。
 他のユーザーとの共有や端末間同期はまだできません。</div>
 <h2>公開した旅程</h2>
 ${state.plans.filter(t=>t.published).map(t=>card(t)).join('')||'<p class="muted">まだ公開旅程がありません。</p>'}
 <h2>サンプル旅程</h2>${SAMPLES.map(t=>card(t)).join('')}`;
}

/* ===== SEARCH ===== */
function renderSearch(){
 app.innerHTML=`<div class="eyebrow">FIND YOUR NEXT TRIP</div><h2>旅程を探す</h2>
 <div class="panel">
 <label>目的地・キーワード<input id="search-q" value="${esc(search.q)}" placeholder="京都、台北、夜市など"></label>
 <div class="row">
 <label>旅行日数<select id="search-days"><option value="">すべて</option>
 ${Array.from({length:14},(_,i)=>i+1).map(n=>`<option value="${n}" ${search.days===String(n)?'selected':''}>${n}日間</option>`).join('')}</select></label>
 <label>旅行スタイル<select id="search-style">
 ${Object.entries(STYLES).map(([k,v])=>`<option value="${k}" ${search.style===k?'selected':''}>${k?v:'すべて'}</option>`).join('')}</select></label>
 </div>
 <div class="row">
 <label>旅程の種類<select id="search-status">
 <option value="">すべて</option><option value="completed">実際に行った旅</option>
 <option value="planning">旅行計画</option><option value="sample">サンプル</option></select></label>
 <label>最低スポット数<select id="search-minStops"><option value="">指定なし</option>
 ${[3,5,8,10,15,20].map(n=>`<option value="${n}">${n}カ所以上</option>`).join('')}</select></label>
 </div>
 <label>並び順<select id="search-sort">
 <option value="recommended">おすすめ順</option><option value="stops-desc">スポット数が多い順</option>
 <option value="stops-asc">スポット数が少ない順</option>
 <option value="days-asc">旅行日数が短い順</option>
 <option value="days-desc">旅行日数が長い順</option></select></label>
 <button class="btn alt" data-a="reset-search">絞り込み解除</button></div>
 <div id="search-results"></div>`;
 for(const k of ['status','minStops','sort'])document.getElementById('search-'+k).value=search[k];
 renderResults();
}
function renderResults(){
 const el=document.getElementById('search-results');if(!el)return;
 let list=[...SAMPLES,...state.plans.filter(t=>t.published)].filter(t=>{
  const sample=SAMPLES.includes(t);
  const text=[t.title,t.place,t.description,...t.schedule.flatMap(d=>d.stops.map(s=>s.name))].join(' ').toLowerCase();
  return text.includes(search.q.toLowerCase())
  &&(!search.days||t.schedule.length===+search.days)
  &&(!search.style||t.style===search.style)
  &&(!search.minStops||count(t)>=+search.minStops)
  &&(!search.status||(search.status==='sample'?sample:!sample&&(t.status||'planning')===search.status));
 });
 if(search.sort==='stops-desc')list.sort((a,b)=>count(b)-count(a));
 if(search.sort==='stops-asc')list.sort((a,b)=>count(a)-count(b));
 if(search.sort==='days-asc')list.sort((a,b)=>a.schedule.length-b.schedule.length);
 if(search.sort==='days-desc')list.sort((a,b)=>b.schedule.length-a.schedule.length);
 el.innerHTML=`<h3>検索結果：${list.length}件</h3>${list.map(t=>card(t,true)).join('')||'<p>該当する旅程はありません。</p>'}`;
 decoratePhotos();
}

/* ===== MY TRIP ===== */
function renderMy(){
 const list=tab==='saved'?state.saved.map(find).filter(Boolean):
 tab==='post'?state.plans.filter(t=>t.published):
 state.plans.filter(t=>(t.status||'planning')===tab);
 app.innerHTML=`<div class="eyebrow">MY JOURNEYS</div><h2>MY TRIP</h2>${stats()}
 <button class="btn" data-a="new">＋ 旅程を作成</button>
 <button class="btn alt" data-a="page" data-id="backup">バックアップ・復元</button>
 <div class="tabs">${['planning','completed','post','saved'].map(k=>`<button class="btn ${tab===k?'':'alt'}" data-a="tab" data-id="${k}">${k.toUpperCase()}</button>`).join('')}</div>
 ${list.map(t=>`${card(t)}<div class="actions">
 ${own(t.id)?`

function drawMap(t){
 const el=document.getElementById('trip-map');
 if(!el||!t)return;
 if(typeof L==='undefined'){el.textContent='地図を読み込めませんでした。';return}
 try{
  map=L.map(el,{scrollWheelZoom:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
   attribution:'&copy; OpenStreetMap contributors',maxZoom:19
  }).addTo(map);
  const bounds=[];let missing=0;
  t.schedule.forEach((d,di)=>{
   let previous=null;const color=COLORS[di%COLORS.length];
   d.stops.forEach((s,si)=>{
    if(!coords(s.coords)){missing++;previous=null;return}
    const pos=s.coords.map(Number);bounds.push(pos);
    L.marker(pos,{icon:L.divIcon({
     className:'',html:`<div class="pin" style="background:${color}">${si+1}</div>`,
     iconSize:[30,30],iconAnchor:[15,15]
    })}).addTo(map).bindPopup(esc(d.name)+' / '+esc(s.name));
    if(previous)L.polyline([previous,pos],{color,weight:4,opacity:.85}).addTo(map);
    previous=pos;
   });
  });
  if(bounds.length)map.fitBounds(bounds,{padding:[35,35],maxZoom:13});
  else map.setView([35.6812,139.7671],5);
  if(missing)el.insertAdjacentHTML('afterend',`<p class="muted">位置未登録：${missing}件。編集画面で場所を検索してください。</p>`);
  setTimeout(()=>{if(map)map.invalidateSize()},150);
 }catch(e){console.error(e);el.textContent='地図表示に失敗しました。'}
}

function sync(){
 if(!draft)return;
 for(const [id,key] of [
 ['trip-title','title'],['trip-place','place'],['trip-description','description'],
 ['trip-month','tripMonth'],['trip-people','people'],['trip-style','style'],
 ['trip-template','template'],['trip-status','status']
 ]){
  const el=document.getElementById(id);if(el)draft[key]=el.value;
 }
 draft.people=Math.max(1,Math.min(99,parseInt(draft.people)||1));
 document.querySelectorAll('[data-dayname]').forEach(el=>{
  const d=draft.schedule[+el.dataset.dayname];if(d)d.name=el.value;
 });
 document.querySelectorAll('[data-field]').forEach(el=>{
  const s=draft.schedule[+el.dataset.day]?.stops[+el.dataset.spot];
  if(!s)return;
  const f=el.dataset.field;
  if(f==='name'&&s.name!==el.value){
   s.name=el.value;s.lookup='';delete s.coords;delete s.locationLabel;
  }else if(f!=='name')s[f]=el.value;
 });
}

function calculateDay(di){
 sync();const d=draft.schedule[di];if(d.stops.length<2)return alert('スポットを2件以上登録してください。');
 let current=timeMin(d.stops[0].time);
 if(current===null)return alert('最初の訪問時刻を設定してください。');
 const results=[];
 for(let i=1;i<d.stops.length;i++){
  const a=d.stops[i-1],b=d.stops[i];
  if(!num(a.stayMinutes)||!num(b.travelMinutes))return alert('滞在時間と移動時間を入力してください。');
  if(!Number.isInteger(+a.stayMinutes)||!Number.isInteger(+b.travelMinutes)||+a.stayMinutes<0||+b.travelMinutes<0)return alert('時間は0以上の整数にしてください。');
  current+=+a.stayMinutes+(+b.travelMinutes);
  const t=timeText(current);if(!t)return alert('翌日にまたがるため計算できません。');
  results.push(t);
 }
 if(!confirm('2件目以降の訪問時刻を上書きしますか？'))return;
 results.forEach((v,i)=>d.stops[i+1].time=v);
 changed();
 const box=document.getElementById('check-'+di);if(box)box.innerHTML='<p class="ok">✓ 到着時刻を計算しました。</p>';
}
function checkDay(di){
 sync();const a=draft.schedule[di].stops;
 document.getElementById('check-'+di).innerHTML=a.slice(1).map((s,i)=>{
  const p=a[i],x=timeMin(p.time),y=timeMin(s.time);
  if(x===null||y===null)return '<p class="warn">時刻未設定</p>';
  if(!num(p.stayMinutes)||!num(s.travelMinutes))return '<p class="muted">滞在時間または移動時間が未設定</p>';
  const gap=y-x-(+p.stayMinutes)-(+s.travelMinutes);
  return `<p class="${gap<0?'warn':'ok'}">${i+1} → ${i+2}：${gap<0?(-gap)+'分不足':gap+'分の余裕'}</p>`;
 }).join('')||'<p>スポットが2件以上必要です。</p>';
}

/* ===== LOCATION ===== */
function spotByUid(id){
 for(const d of draft?.schedule||[])for(const s of d.stops)if(s.uid===id)return s;

async function lookup(di,si){
 sync();const s=draft.schedule[di]?.stops[si],el=document.getElementById(`lookup-${di}-${si}`);
 if(!s||!el)return;
 const q=(s.lookup||s.name).trim();if(!q)return alert('検索語を入力してください。');
 if(lookupBusy||Date.now()-lastLookup<1300)return alert('少し待って再検索してください。');
 lookupBusy=true;lastLookup=Date.now();el.textContent='検索中...';
 try{
  const params=new URLSearchParams({format:'jsonv2',q,limit:'8','accept-language':'ja,en'});
  const r=await fetch('https://nominatim.openstreetmap.org/search?'+params);
  if(!r.ok)throw Error(r.status);
  lookupResults=(await r.json()).map(x=>({name:x.display_name,coords:[+x.lat,+x.lon]})).filter(x=>coords(x.coords));
  if(!spotByUid(s.uid))return;
  const target=document.getElementById(`lookup-${di}-${si}`);
  if(target)target.innerHTML=lookupResults.map((x,i)=>`<div class="card"><p class="muted">${esc(x.name)}</p><button class="btn alt" data-a="choose" data-index="${i}" data-uid="${esc(s.uid)}">この場所を選択</button></div>`).join('')||'候補なし';
 }catch(e){el.textContent='検索に失敗しました。'}
 finally{lookupBusy=false}
}
function choose(i,id){
 const s=spotByUid(id),r=lookupResults[i];if(!s||!r)return;
 sync();s.coords=r.coords;s.locationLabel=r.name;lookupResults=[];changed();
}

async function uploadPhoto(file,di,si){
 if(!file||!file.type.startsWith('image/'))return;
 if(file.size>20*1024*1024)return alert('20MB以下の画像を選択してください。');
 sync();const id=draft.schedule[di]?.stops[si]?.uid;
 try{
  const url=URL.createObjectURL(file),img=new Image();
  try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url})}
  finally{URL.revokeObjectURL(url)}
  const scale=Math.min(1,1200/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.width*scale));
  c.height=Math.max(1,Math.round(img.height*scale));
  const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height);
  const data=c.toDataURL('image/jpeg',.72);
  const photoId=uid();await photoPut(photoId,data);
  const s=spotByUid(id);if(s){s.photoId=photoId;s.photo='';changed();alert('写真を追加しました。')}
 }catch(e){alert('写真の保存に失敗しました。')}
}

 sync();
 if(!draft.title.trim()||!draft.place.trim())return alert('タイトルと目的地を入力してください。');
 if(!draft.schedule.some(d=>d.stops.length)||draft.schedule.some(d=>d.stops.some(s=>!s.name.trim())))return alert('スポットを入力してください。');
 for(const d of draft.schedule)for(const s of d.stops){
  for(const v of [s.stayMinutes,s.travelMinutes,s.cost]){
   if(v!==''&&v!=null&&(!Number.isInteger(+v)||+v<0))return alert('時間と費用は0以上の整数にしてください。');
  }
 }
 const t=norm(draft);if(draft.publishAfterSave)t.published=true;
 delete t.publishAfterSave;
 if(editing&&!own(editing))return alert('編集対象がありません。');
 if(!update(()=>{
  if(editing){const i=state.plans.findIndex(x=>x.id===editing);state.plans[i]=t}
  else state.plans.unshift(t);
 }))return;
 clearDraft();draft=null;editing='';go('detail',t.id);
}
function deleteTrip(id){
 const t=state.plans.find(x=>x.id===id);
 if(!t||!confirm('「'+t.title+'」を削除しますか？'))return;
 if(update(()=>{state.plans=state.plans.filter(x=>x.id!==id);state.saved=state.saved.filter(x=>x!==id)}))go('my');
}
function setStatus(id,status){
 const t=state.plans.find(x=>x.id===id);if(!t)return;
 if(status==='completed'&&!confirm('実際に行った旅として記録しますか？'))return;
 if(update(()=>{t.status=status})){tab=status;go('my')}
}
function publish(id,value){
 const t=state.plans.find(x=>x.id===id);if(!t)return;
 if(value&&!confirm('このブラウザ内で公開しますか？'))return;
 if(update(()=>{t.published=value}))render();
}
function bookmark(id){
 if(update(()=>{state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id]}))go('detail',id);
}

/* ===== BACKUP / RESTORE ===== */
function renderBackup(){
 app.innerHTML=`<h2>バックアップ・復元</h2>${stats()}
 <div class="notice">写真も含めたJSONバックアップを作成できます。写真が多い場合は非常に長くなります。</div>
 <div class="panel"><h3>① バックアップ</h3>
 <button class="btn" data-a="backup-create">バックアップを作成</button>
 <textarea id="backup-output" class="backup" readonly>${esc(backupText)}</textarea>
 <button class="btn alt" data-a="backup-copy">コピー</button></div>
 <div class="panel"><h3>② 復元</h3>
 <textarea id="restore-input" class="backup" placeholder="バックアップJSONを貼り付け"></textarea>
 <button class="btn alt" data-a="restore-preview">内容を確認</button>
 <div id="restore-preview"></div></div>`;
}
async function createBackup(){
 const data=clone(state),photos={};
 const ids=new Set();
 for(const t of data.plans)for(const d of t.schedule||[])for(const s of d.stops||[])if(s.photoId)ids.add(s.photoId);
 for(const id of ids){try{photos[id]=await photoGet(id)}catch(e){}}
 backupText=JSON.stringify({app:'TUMUGOU',backupVersion:2,exportedAt:new Date().toISOString(),data,photos},null,2);
 document.getElementById('backup-output').value=backupText;
 alert('バックアップを作成しました。');
}
async function copyBackup(){
 const el=document.getElementById('backup-output');
 if(!el?.value)return alert('先にバックアップを作成してください。');
 try{await navigator.clipboard.writeText(el.value);alert('コピーしました。')}
 catch(e){el.focus();el.select();alert('選択したテキストを手動でコピーしてください。')}
}
function validTrip(t){
 return t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.place==='string'
 &&Array.isArray(t.schedule)&&t.schedule.length>=1&&t.schedule.length<=14
 &&t.schedule.every(d=>d&&Array.isArray(d.stops)&&d.stops.length<=500&&d.stops.every(s=>
 s&&typeof s.name==='string'&&typeof s.time==='string'
 &&(s.coords===undefined||coords(s.coords))
 &&(s.photoId===undefined||typeof s.photoId==='string')
 &&(s.photo===undefined||(typeof s.photo==='string'&&(!s.photo||/^data:image\/(jpeg|png|webp);base64,/.test(s.photo))))
 ));
}
function previewRestore(){
 restoreCandidate=null;const el=document.getElementById('restore-preview');
 try{
  const raw=document.getElementById('restore-input').value.trim();
  if(raw.length>30000000)throw Error('データが大きすぎます。');
  const v=JSON.parse(raw);
  if(v.app!=='TUMUGOU'||![1,2].includes(v.backupVersion)||!v.data||!Array.isArray(v.data.plans)||!Array.isArray(v.data.saved))throw Error('対応していないバックアップです。');
  if(v.data.plans.length>1000||!v.data.plans.every(validTrip)||!v.data.saved.every(x=>typeof x==='string'))throw Error('データ形式が不正です。');
  const ids=v.data.plans.map(t=>t.id);if(new Set(ids).size!==ids.length)throw Error('旅程IDが重複しています。');
  restoreCandidate=v;
  el.innerHTML=`<p class="ok">✓ ${ids.length}件の旅程を確認しました。</p>
  <label>復元方法<select id="restore-mode"><option value="merge">既存データに追加</option><option value="replace">既存データを置き換え</option></select></label>
  <button class="btn danger" data-a="restore-confirm">復元を実行</button>`;
 }catch(e){el.innerHTML=`<p class="warn">${esc(e.message)}</p>`}
}
async function restoreData(){
 const v=restoreCandidate;if(!v)return;
 const mode=document.getElementById('restore-mode').value;
 if(!confirm(mode==='replace'?'現在の旅程データを置き換えますか？':'重複を除いて追加しますか？'))return;
 const imported=v.data.plans.map(norm);
 const photos=v.photos||{};
 try{
  for(const [id,data] of Object.entries(photos)){
   if(typeof data==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(data))await photoPut(id,data);
  }
 }catch(e){return alert('写真の復元に失敗しました。保存容量を確認してください。')}
 if(update(()=>{
  if(mode==='replace'){state.plans=imported;state.saved=[...new Set(v.data.saved)]}
  else{
   const ids=new Set(state.plans.map(t=>t.id));
   state.plans.push(...imported.filter(t=>!ids.has(t.id)));
   state.saved=[...new Set([...state.saved,...v.data.saved])];
  }
 })){restoreCandidate=null;alert('復元しました。');go('my')}
}

/* ===== INSTAGRAM EXPORT ===== */
function openExport(id){
 const t=find(id);if(!t)return;
 exportTrip=norm(t);exportIndex=0;go('export');
}
function renderExport(){
 if(!exportTrip)return go('home');
 app.innerHTML=`<div class="eyebrow">INSTAGRAM CAROUSEL</div><h2>旅を、投稿にしよう。</h2>
 <div class="notice">1080×1350pxの画像を生成します。画像を長押しして保存してください。全体ルートは訪問順の一覧です。</div>
 <label>画像を選択<select id="export-index">
 <option value="0">1. 表紙</option><option value="1">2. 全体ルート</option>
 ${exportTrip.schedule.map((d,i)=>`<option value="${i+2}">${i+3}. ${esc(d.name)}</option>`).join('')}</select></label>
 <p id="export-count" class="muted"></p><div class="preview" id="export-preview">画像を生成中...</div>
 <button class="btn alt" data-a="export-prev">← 前へ</button>
 <button class="btn" data-a="export-next">次へ →</button>
 <p class="muted">スポットが多い場合は画像下部が省略されることがあります。</p>`;
 document.getElementById('export-index').value=exportIndex;
 setTimeout(drawExport,50);
}
function wrap(ctx,text,width){
 const out=[];let line='';
 for(const ch of String(text||'')){
  if(ch==='\n'){out.push(line);line='';continue}
  if(line&&ctx.measureText(line+ch).width>width){out.push(line);line=ch}
  else line+=ch;
 }
 if(line)out.push(line);
 return out;
}
function writeLines(ctx,text,x,y,w,step,max=3){
 wrap(ctx,text,w).slice(0,max).forEach((v,i)=>ctx.fillText(v,x,y+i*step));
}
async function imageOf(s){
 const src=await photoSource(s);if(!src)return null;
 return new Promise(resolve=>{
  const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=src;
 });
}
function cover(ctx,img,x,y,w,h){
 if(!img)return;
 const scale=Math.max(w/img.width,h/img.height),sw=w/scale,sh=h/scale;
 ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h);
}
async function drawExport(){
 const t=exportTrip,index=exportIndex,el=document.getElementById('export-preview');
 if(!t||!el)return;
 const c=document.createElement('canvas');c.width=1080;c.height=1350;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#f8f5ee';ctx.fillRect(0,0,1080,1350);
 ctx.fillStyle='#59634a';ctx.fillRect(0,0,1080,14);
 ctx.fillStyle='#493c30';ctx.font='bold 42px Georgia';ctx.fillText('TUMUGOU',65,90);
 ctx.font='22px sans-serif';ctx.fillText('あなたの旅が、次の誰かの旅になる。',65,130);
 ctx.strokeStyle='#d9cfc0';ctx.beginPath();ctx.moveTo(65,160);ctx.lineTo(1015,160);ctx.stroke();
 if(index===0){
  const img=await imageOf(firstPhoto(t));
  if(img)cover(ctx,img,65,195,950,640);
  else{ctx.fillStyle='#d9decf';ctx.fillRect(65,195,950,640);ctx.fillStyle='#493c30';ctx.font='170px sans-serif';ctx.textAlign='center';ctx.fillText(t.icon||'🧳',540,585);ctx.textAlign='left'}
  ctx.fillStyle='#59634a';ctx.font='bold 28px sans-serif';
  ctx.fillText(t.place+' / '+t.schedule.length+' DAYS',70,925);
  ctx.fillStyle='#493c30';ctx.font='bold 64px sans-serif';writeLines(ctx,t.title,70,1020,930,82,3);
  ctx.font='25px sans-serif';writeLines(ctx,t.description,70,1220,930,34,2);
 }else if(index===1){
  ctx.fillStyle='#59634a';ctx.font='bold 32px sans-serif';ctx.fillText('OUR TRAVEL ROUTE',65,230);
  ctx.fillStyle='#493c30';ctx.font='bold 50px sans-serif';ctx.fillText('旅の全体ルート',65,310);
  let y=365;
  for(let di=0;di<t.schedule.length;di++){
   if(y>1180)break;const d=t.schedule[di];
   ctx.fillStyle=COLORS[di%COLORS.length];ctx.fillRect(65,y,950,54);
   ctx.fillStyle='white';ctx.font='bold 26px sans-serif';ctx.fillText(d.name,90,y+36);y+=73;
   for(let si=0;si<d.stops.length;si++){
    if(y>1200)break;const s=d.stops[si];
    ctx.fillStyle='#493c30';ctx.font='26px sans-serif';
    writeLines(ctx,(si+1)+'. '+s.time+' '+s.name,90,y+25,900,33,1);y+=49;
   }y+=20;
  }
 }else{
  const di=index-2,d=t.schedule[di];
  ctx.fillStyle=COLORS[di%COLORS.length];ctx.font='bold 35px sans-serif';ctx.fillText('DAY '+(di+1),65,235);
  ctx.fillStyle='#493c30';ctx.font='bold 49px sans-serif';ctx.fillText(d.name,65,310);
  let y=360;
  for(let si=0;si<d.stops.length;si++){
   if(y>1180)break;const s=d.stops[si],h=(s.photo||s.photoId)?255:140;
   ctx.fillStyle='#fffefa';ctx.fillRect(65,y,950,h);
   ctx.fillStyle=COLORS[di%COLORS.length];ctx.fillRect(65,y,8,h);
   ctx.font='bold 28px sans-serif';ctx.fillText(s.time,95,y+45);
   ctx.fillStyle='#493c30';ctx.font='bold 30px sans-serif';writeLines(ctx,(si+1)+'. '+s.name,260,y+45,710,38,2);
   if(s.photo||s.photoId){
    const img=await imageOf(s);if(img)cover(ctx,img,95,y+95,395,135);
    ctx.fillStyle='#817768';ctx.font='21px sans-serif';writeLines(ctx,s.comment,515,y+120,450,30,3);
   }else if(s.comment){
    ctx.fillStyle='#817768';ctx.font='21px sans-serif';writeLines(ctx,s.comment,260,y+105,700,29,2);
   }
   y+=h+18;
   if(si<d.stops.length-1){
    ctx.fillStyle='#817768';ctx.font='20px sans-serif';
    ctx.fillText('↓ '+travel(d.stops[si+1]),95,y+10);y+=45;
   }
  }
 }
 ctx.fillStyle='#493c30';ctx.font='22px Georgia';ctx.textAlign='right';
 ctx.fillText('TUMUGOU • '+(index+1)+' / '+(t.schedule.length+2),1010,1320);
 if(page!=='export'||exportIndex!==index)return;
 const img=document.createElement('img');img.alt='Instagram投稿用画像';img.src=c.toDataURL('image/png');
 el.innerHTML='';el.appendChild(img);
 document.getElementById('export-count').textContent=(index+1)+' / '+(t.schedule.length+2);
}
function exportMove(delta){
 if(!exportTrip)return;
 exportIndex=Math.max(0,Math.min(exportTrip.schedule.length+1,exportIndex+delta));
 renderExport();
}

/* ===== EVENTS ===== */
document.addEventListener('click',async e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const a=b.dataset.a,id=b.dataset.id,di=+b.dataset.day,si=+b.dataset.spot;
 if(a==='page')go(id);
 else if(a==='tab'){tab=id;render()}
 else if(a==='detail')go('detail',id);
 else if(a==='new')openNew(false);
 else if(a==='new-publish')openNew(true);
 else if(a==='edit')openEdit(id);
 else if(a==='copy')openCopy(id);
 else if(a==='copy-next')copyNext();
 else if(a==='resume')resumeDraft();
 else if(a==='abandon')abandonDraft();
 else if(a==='save-draft'){sync();saveDraft();alert('下書きを保存しました。')}
 else if(a==='day-add')dayAdd();
 else if(a==='day-delete')dayDelete(di);
 else if(a==='day-up')daySwap(di,-1);
 else if(a==='day-down')daySwap(di,1);
 else if(a==='add')add(di);
 else if(a==='remove')remove(di,si);
 else if(a==='up')move(di,si,-1);
 else if(a==='down')move(di,si,1);
 else if(a==='move-day')moveDay(di,si);
 else if(a==='duplicate')duplicateSpot(di,si);
 else if(a==='calculate')calculateDay(di);
 else if(a==='check')checkDay(di);
 else if(a==='lookup')lookup(di,si);
 else if(a==='choose')choose(+b.dataset.index,b.dataset.uid);
 else if(a==='remove-photo'){
  sync();const s=draft.schedule[di]?.stops[si];
  if(s&&confirm('写真を削除しますか？')){s.photo='';s.photoId='';changed()}
 }
 else if(a==='save-trip')saveTrip();
 else if(a==='delete')deleteTrip(id);
 else if(a==='complete')setStatus(id,'completed');
 else if(a==='planning')setStatus(id,'planning');
 else if(a==='publish')publish(id,true);
 else if(a==='unpublish')publish(id,false);
 else if(a==='bookmark')bookmark(id);
 else if(a==='backup-create')await createBackup();
 else if(a==='backup-copy')await copyBackup();
 else if(a==='restore-preview')previewRestore();
 else if(a==='restore-confirm')await restoreData();
 else if(a==='export')openExport(id);
 else if(a==='export-prev')exportMove(-1);
 else if(a==='export-next')exportMove(1);
 else if(a==='reset-search'){
  search={q:'',days:'',style:'',status:'',minStops:'',sort:'recommended'};renderSearch();
 }
});
let draftTimer=null;
document.addEventListener('input',e=>{
 if(e.target.id==='search-q'){search.q=e.target.value;renderResults();return}
 if(e.target.id==='restore-input'){restoreCandidate=null;const el=document.getElementById('restore-preview');if(el)el.innerHTML='';return}
 if(page==='edit'){
  if(e.target.dataset.field==='name'){
   const s=draft?.schedule[+e.target.dataset.day]?.stops[+e.target.dataset.spot];
   if(s&&s.name!==e.target.value){
    s.name=e.target.value;s.lookup='';delete s.coords;delete s.locationLabel;
   }
  }
  sync();refreshCosts();
  clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,500);
 }
});
document.addEventListener('change',async e=>{
 if(['search-days','search-style','search-status','search-minStops','search-sort'].includes(e.target.id)){
  search[e.target.id.replace('search-','')]=e.target.value;renderResults();
 }else if(e.target.id==='export-index'){
  exportIndex=+e.target.value;renderExport();
 }else if(e.target.dataset.photo){
  await uploadPhoto(e.target.files?.[0],+e.target.dataset.day,+e.target.dataset.spot);
 }else if(page==='edit'){
  sync();saveDraft();refreshCosts();
 }
});
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden'&&page==='edit'){sync();saveDraft()}
});

/* ===== START ===== */
render();
migratePhotos().catch(console.error);
</script>
