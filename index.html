<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#59634a">
<title>TUMUGOU ver.1.2</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
 --ivory:#f8f5ee;
 --sand:#e9dfcc;
 --brown:#493c30;
 --olive:#59634a;
 --light:#f0ece3;
 --line:#ddd3c4;
 --white:#fffefa;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 background:var(--ivory);
 color:var(--brown);
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
header{
 background:var(--ivory);
 text-align:center;
 padding:23px 12px 17px;
 border-bottom:1px solid var(--line);
}
.logo{
 font-family:Georgia,serif;
 font-size:34px;
 letter-spacing:5px;
 font-weight:bold;
}
.slogan{
 font-size:11px;
 letter-spacing:1px;
 margin-top:8px;
 color:#81796d;
}
main{
 max-width:780px;
 margin:auto;
 padding:20px 15px 120px;
}
h1,h2,h3{line-height:1.35}
h2{font-size:25px}
h3{font-size:18px}
p{line-height:1.7}
.eyebrow{
 font-size:11px;
 letter-spacing:3px;
 color:var(--olive);
 font-weight:bold;
}
.muted{
 color:#857b6e;
 font-size:13px;
}
.card,.panel{
 background:var(--white);
 border:1px solid var(--line);
 border-radius:17px;
 padding:17px;
 margin:15px 0;
 box-shadow:0 3px 15px #493c3008;
}
.card{overflow:hidden}
.hero{
 background:linear-gradient(135deg,#c3c9b6,#e6d6bb);
 min-height:175px;
 border-radius:12px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:62px;
 overflow:hidden;
}
.hero img{
 width:100%;
 height:210px;
 object-fit:cover;
}
.btn{
 background:var(--olive);
 color:white;
 border:0;
 border-radius:10px;
 padding:11px 15px;
 margin:5px 5px 5px 0;
 font-size:13px;
}
.btn.alt{
 background:var(--sand);
 color:var(--brown);
}
.btn.danger{
 background:#f3e4e0;
 color:#91483b;
}
.btn:disabled{opacity:.4}
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:4px;
}
.badge{
 display:inline-block;
 background:#e9ede4;
 color:var(--olive);
 border-radius:20px;
 padding:5px 10px;
 font-size:11px;
 margin:6px 5px 4px 0;
}
label{
 display:block;
 font-size:13px;
 font-weight:600;
 margin:13px 0;
}
input,select,textarea{
 display:block;
 width:100%;
 margin-top:7px;
 padding:11px;
 border:1px solid #d5cabb;
 border-radius:9px;
 background:white;
 color:var(--brown);
}
textarea{min-height:85px}
.notice{
 background:#eee9dc;
 padding:13px;
 border-radius:11px;
 font-size:13px;
 line-height:1.7;
 margin:14px 0;
}
.warning{
 background:#fff0e6;
 color:#8e5034;
 padding:12px;
 border-radius:9px;
 font-size:13px;
}
.success{
 background:#e7efe3;
 color:#486444;
 padding:12px;
 border-radius:9px;
 font-size:13px;
}
nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:1000;
 background:var(--white);
 border-top:1px solid var(--line);
 display:flex;
 padding-bottom:env(safe-area-inset-bottom);
}
nav button{
 flex:1;
 border:0;
 background:transparent;
 color:var(--brown);
 padding:13px 2px;
 font-size:11px;
}
nav button.active{
 background:#e8eddf;
 color:var(--olive);
 font-weight:bold;
}
.tabs{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:8px 0;
}
.tabs button{white-space:nowrap}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
}
.stat{
 background:white;
 border:1px solid var(--line);
 padding:13px 5px;
 text-align:center;
 border-radius:11px;
}
.stat strong{
 display:block;
 font-size:22px;
 color:var(--olive);
}
.stat small{font-size:9px}
.day{
 border-left:5px solid var(--olive);
}
.spot{
 background:#f7f3eb;
 padding:13px;
 border-radius:12px;
 margin:12px 0;
}
.spot-photo{
 width:100%;
 max-height:260px;
 object-fit:cover;
 border-radius:11px;
 margin:8px 0;
}
.photo-thumb{
 width:100%;
 max-height:190px;
 object-fit:cover;
 border-radius:9px;
}
.time{
 color:var(--olive);
 font-weight:bold;
}
.transport{
 background:#f0ece3;
 padding:10px;
 margin:10px 0;
 border-left:3px solid #b2a48f;
 border-radius:5px;
 font-size:12px;
}
.check{
 font-size:12px;
 padding:8px;
 border-radius:7px;
 margin:5px 0;
 background:#edf0e7;
}
.check.bad{background:#fff0e6;color:#975333}
.map{
 height:340px;
 border-radius:12px;
 margin:14px 0;
 z-index:0;
}
.map-pin{
 width:29px;
 height:29px;
 border:2px solid white;
 border-radius:50%;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 box-shadow:0 2px 5px #0005;
}
.route-arrow{
 width:24px;
 height:24px;
 background:white;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:20px;
}
.legend{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 font-size:12px;
}
.dot{
 display:inline-block;
 width:10px;
 height:10px;
 border-radius:50%;
 margin-right:4px;
}
.magazine-title{
 font-family:Georgia,serif;
 font-size:31px;
 line-height:1.3;
}
.template-scrap .day{
 background:#fffdf6;
 border-radius:3px 16px 9px 18px;
 transform:rotate(-.25deg);
 box-shadow:3px 5px 0 #e9dfcc;
}
.template-scrap .spot-photo{
 border:7px solid white;
 box-shadow:0 3px 12px #0002;
}
.template-minimal .day{
 border-left:2px solid #9b978b;
 border-radius:3px;
 box-shadow:none;
}
.template-minimal .hero{
 background:#e9e7e1;
}
.template-magazine .day{
 border-left:7px solid var(--olive);
}
.template-magazine .magazine-title{
 text-transform:uppercase;
}
.export-preview{
 background:#e7e0d4;
 padding:12px;
 border-radius:13px;
 margin:15px 0;
}
.export-preview canvas{
 width:100%;
 max-width:420px;
 display:block;
 margin:auto;
 border-radius:4px;
 box-shadow:0 5px 20px #0002;
}
.result{
 border-bottom:1px solid var(--line);
 padding:11px 0;
 font-size:13px;
}
.row{
 display:flex;
 gap:9px;
 align-items:flex-start;
}
.row>*{flex:1;min-width:0}
.row .short{flex:0 0 115px}
.file-label{
 display:block;
 border:1px dashed #a7a08f;
 background:#f0ece3;
 border-radius:9px;
 padding:13px;
 text-align:center;
 cursor:pointer;
}
.file-label input{display:none}
hr{
 border:0;
 border-top:1px solid var(--line);
 margin:20px 0;
}
</style>
</head>

<body>
<header>
<div class="logo">TUMUGOU</div>
<div class="slogan">
あなたの旅が、次の誰かの旅になる。
</div>
</header>

<main id="app"></main>
<nav id="nav"></nav>

<script>
'use strict';

/* =========================
   基本設定
========================= */

const KEY='tumugou_v02';

const COLORS=[
 '#59634a',
 '#b47b59',
 '#66869a',
 '#b49a55',
 '#977d9d'
];

const MODES={
 '':'未設定',
 walk:'🚶 徒歩',
 train:'🚃 電車',
 bus:'🚌 バス',
 car:'🚗 車',
 taxi:'🚕 タクシー',
 bike:'🚲 自転車',
 ferry:'⛴️ 船',
 other:'🚩 その他'
};

const TEMPLATES={
 scrapbook:'手描きスクラップ',
 magazine:'トラベルマガジン',
 minimal:'シンプル'
};

const KNOWN={
 '清水寺':[34.9949,135.785],
 '祇園で昼食':[35.003,135.778],
 '鴨川散歩':[35.01,135.771],
 '嵐山':[35.0094,135.6668],
 '竹林の小径':[35.017,135.671],
 '京都駅':[34.9858,135.7588],
 '迪化街':[25.0545,121.509],
 '寧夏夜市':[25.0567,121.5153],
 '龍山寺':[25.0372,121.4999],
 '中正紀念堂':[25.0345,121.5219],
 '札幌時計台':[43.0626,141.3535],
 '大通公園':[43.06,141.35],
 '小樽運河':[43.199,141.001],
 '堺町通り':[43.192,141.006]
};

const ALIASES={
 'コロッセオ':'Colosseo Roma Italia',
 'トレビの泉':'Fontana di Trevi Roma Italia',
 'スペイン広場':'Piazza di Spagna Roma Italia',
 'パンテオン':'Pantheon Roma Italia'
};

const SAMPLES=[
 {
  id:'kyoto',
  title:'京都、街歩きと喫茶の2日間',
  place:'京都',
  icon:'🍵',
  description:'寺社と喫茶をゆっくり巡る旅。',
  template:'scrapbook',
  schedule:[
   {name:'Day 1',stops:[
    {time:'09:30',name:'清水寺'},
    {time:'12:00',name:'祇園で昼食',
     transport:'walk',travelMinutes:25},
    {time:'15:00',name:'鴨川散歩',
     transport:'walk',travelMinutes:15}
   ]},
   {name:'Day 2',stops:[
    {time:'10:00',name:'嵐山'},
    {time:'13:00',name:'竹林の小径',
     transport:'walk',travelMinutes:15},
    {time:'16:00',name:'京都駅',
     transport:'train',travelMinutes:35}
   ]}
  ]
 },
 {
  id:'taipei',
  title:'台北の街と夜市を楽しむ2日間',
  place:'台北',
  icon:'🏮',
  description:'ローカルグルメと街歩き。',
  template:'magazine',
  schedule:[
   {name:'Day 1',stops:[
    {time:'11:00',name:'迪化街'},
    {time:'18:00',name:'寧夏夜市'}
   ]},
   {name:'Day 2',stops:[
    {time:'09:00',name:'龍山寺'},
    {time:'14:00',name:'中正紀念堂'}
   ]}
  ]
 },
 {
  id:'hokkaido',
  title:'札幌・小樽を巡る2日間',
  place:'北海道',
  icon:'🌲',
  description:'海辺の街と北海道グルメ。',
  template:'minimal',
  schedule:[
   {name:'Day 1',stops:[
    {time:'10:00',name:'札幌時計台'},
    {time:'13:00',name:'大通公園'}
   ]},
   {name:'Day 2',stops:[
    {time:'10:00',name:'小樽運河'},
    {time:'14:00',name:'堺町通り'}
   ]}
  ]
 }
];

let state={plans:[],saved:[]};

try{
 const v=JSON.parse(localStorage.getItem(KEY));
 if(v&&Array.isArray(v.plans)&&Array.isArray(v.saved)){
  state=v;
 }
}catch(e){console.error(e)}

const app=document.getElementById('app');
const nav=document.getElementById('nav');

let page='home';
let selected='';
let myTab='planning';
let query='';
let duration='';
let draft=null;
let editing='';
let map=null;
let searchBusy=false;
let lastSearch=0;
let searchContext=null;
let searchResults=[];
let exportTrip=null;
let exportIndex=0;
let restoreCandidate=null;
let backupText='';

/* =========================
   共通関数
========================= */

function uid(){
 return 't'+Date.now().toString(36)+
 Math.random().toString(36).slice(2,9);
}

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function clone(x){
 return JSON.parse(JSON.stringify(x));
}

function persist(){
 try{
  localStorage.setItem(KEY,JSON.stringify(state));
  return true;
 }catch(e){
  alert(
   '保存容量が不足している可能性があります。\n'+
   '写真を減らすか、バックアップを取ってください。'
  );
  return false;
 }
}

function update(fn){
 const before=clone(state);
 fn();
 if(!persist()){
  state=before;
  return false;
 }
 return true;
}

function find(id){
 return [...SAMPLES,...state.plans]
  .find(t=>t.id===id);
}

function own(id){
 return state.plans.some(t=>t.id===id);
}

function norm(t){
 const x=clone(t);
 x.status=x.status==='completed'
  ?'completed':'planning';
 x.published=!!x.published;
 x.template=TEMPLATES[x.template]
  ?x.template:'scrapbook';
 x.schedule=(x.schedule||[]).map((d,i)=>({
  name:d.name||'Day '+(i+1),
  stops:(d.stops||[]).map(s=>({
   ...s,
   uid:s.uid||uid(),
   transport:s.transport||'',
   travelMinutes:s.travelMinutes??'',
   stayMinutes:s.stayMinutes??'',
   photo:s.photo||''
  }))
 }));
 x.days=x.schedule.length;
 return x;
}

function days(t){
 return (t.schedule||[]).length;
}

function coords(p){
 return Array.isArray(p)&&p.length===2&&
 p.every(v=>Number.isFinite(Number(v)))&&
 Math.abs(Number(p[0]))<=90&&
 Math.abs(Number(p[1]))<=180;
}

function hasNum(v){
 return v!==''&&v!==null&&
 v!==undefined&&Number.isFinite(Number(v));
}

function label(t){
 if(SAMPLES.includes(t))return 'サンプル';
 return t.status==='completed'
  ?'実際に行った旅':'旅行計画';
}

function travel(s){
 return [
  MODES[s.transport]||'',
  hasNum(s.travelMinutes)
   ?s.travelMinutes+'分':''
 ].filter(x=>x&&x!=='未設定')
 .join('・')||'移動情報未設定';
}

function firstPhoto(t){
 for(const d of t.schedule||[]){
  for(const s of d.stops||[]){
   if(s.photo)return s.photo;
  }
 }
 return '';
}

function hero(t){
 const p=firstPhoto(t);
 return `<div class="hero">${
  p?`<img src="${p}" alt="">`:esc(t.icon||'🧳')
 }</div>`;
}

function card(t){
 return `
 <article class="card">
  ${hero(t)}
  <div>
   <span class="badge">${esc(t.place)}</span>
   <span class="badge">${days(t)}日間</span>
   <span class="badge">${label(t)}</span>
  </div>
  <h3>${esc(t.title)}</h3>
  <p class="muted">${esc(t.description||'')}</p>
  <button class="btn"
   data-action="detail" data-id="${esc(t.id)}">
   旅程を見る →
  </button>
 </article>`;
}

function counts(){
 return {
  planning:state.plans.filter(
   t=>t.status!=='completed').length,
  completed:state.plans.filter(
   t=>t.status==='completed').length,
  post:state.plans.filter(t=>t.published).length,
  saved:state.saved.length
 };
}

function stats(){
 const c=counts();
 return `<div class="stats">${
  Object.entries(c).map(([k,v])=>`
  <div class="stat">
   <strong>${v}</strong>
   <small>${k.toUpperCase()}</small>
  </div>`).join('')
 }</div>`;
}

function menu(){
 nav.innerHTML=[
  ['home','HOME','⌂'],
  ['search','SEARCH','⌕'],
  ['my','MY TRIP','♡'],
  ['post','POST','＋']
 ].map(([id,name,icon])=>`
 <button class="${page===id?'active':''}"
  data-action="page" data-id="${id}">
  ${icon}<br>${name}
 </button>`).join('');
}

function go(p,id=''){
 if(map){
  map.remove();
  map=null;
 }
 page=p;
 selected=id;
 window.scrollTo(0,0);
 render();
 if(p==='detail'){
  setTimeout(()=>{
   if(page==='detail'&&selected===id){
    drawMap(find(id));
   }
  },100);
 }
}

/* =========================
   画面表示
========================= */

function render(){
 menu();

 if(page==='home')renderHome();
 if(page==='search')renderSearch();
 if(page==='my')renderMy();
 if(page==='post')renderPost();
 if(page==='detail')renderDetail();
 if(page==='edit')renderEditor();
 if(page==='backup')renderBackup();
 if(page==='export')renderExport();
}

function renderHome(){
 app.innerHTML=`
 <div class="eyebrow">YOUR JOURNEY, OUR STORY</div>
 <h2 class="magazine-title">
  誰かの旅から、<br>次の旅がはじまる。
 </h2>
 <p>
  実際の旅程を参考に、<br>
  自分だけの旅を紡いでいこう。
 </p>

 <button class="btn" data-action="new">
  ＋ 新しい旅を計画
 </button>

 <button class="btn alt"
  data-action="page" data-id="search">
  旅程を探す
 </button>

 <div class="notice">
  現在は試作版です。
  公開した旅程は同じブラウザ内でのみ表示されます。
  サンプルは実体験を保証するものではありません。
 </div>

 <div class="eyebrow">DISCOVER</div>
 <h2>公開した旅程</h2>
 ${
  state.plans.filter(t=>t.published)
  .map(card).join('')||
  '<p class="muted">公開した旅程はまだありません。</p>'
 }

 <h2>旅程サンプル</h2>
 ${SAMPLES.map(card).join('')}
 `;
}

function renderSearch(){
 app.innerHTML=`
 <div class="eyebrow">FIND YOUR NEXT TRIP</div>
 <h2>旅程を探す</h2>

 <label>目的地・キーワード
  <input id="query" value="${esc(query)}"
   placeholder="例：京都、台北">
 </label>

 <label>旅行日数
  <select id="duration">
   <option value="">すべて</option>
   ${Array.from({length:14},(_,i)=>i+1)
    .map(n=>`
    <option value="${n}"
     ${duration===String(n)?'selected':''}>
     ${n}日間
    </option>`).join('')}
  </select>
 </label>

 <div id="results"></div>
 `;
 renderResults();
}

function renderResults(){
 const el=document.getElementById('results');
 if(!el)return;

 const list=[
  ...SAMPLES,
  ...state.plans.filter(t=>t.published)
 ].filter(t=>
  (t.title+' '+t.place).toLowerCase()
  .includes(query.toLowerCase())&&
  (!duration||days(t)===Number(duration))
 );

 el.innerHTML=list.map(card).join('')||
 '<p class="muted">該当する旅程はありません。</p>';
}

function renderMy(){
 const c=counts();
 const tabs=[
  ['planning','PLANNING'],
  ['completed','COMPLETED'],
  ['post','POST'],
  ['saved','SAVED']
 ];

 let list=[];

 if(myTab==='saved'){
  list=state.saved.map(find).filter(Boolean);
 }else if(myTab==='post'){
  list=state.plans.filter(t=>t.published);
 }else{
  list=state.plans.filter(t=>
   (t.status||'planning')===myTab);
 }

 app.innerHTML=`
 <div class="eyebrow">MY JOURNEYS</div>
 <h2>MY TRIP</h2>

 ${stats()}

 <button class="btn alt"
  data-action="page" data-id="backup">
  🛡 バックアップ・復元
 </button>

 <div class="tabs">
 ${tabs.map(([id,name])=>`
  <button class="btn ${myTab===id?'':'alt'}"
   data-action="tab" data-id="${id}">
   ${name}
  </button>`).join('')}
 </div>

 ${list.map(t=>`
  ${card(t)}
  <div class="actions">
   ${own(t.id)?`
    <button class="btn alt"
     data-action="edit" data-id="${esc(t.id)}">
     編集
    </button>

    ${t.status==='completed'?`
     <button class="btn alt"
      data-action="planning" data-id="${esc(t.id)}">
      PLANNINGに戻す
     </button>`:`
     <button class="btn alt"
      data-action="complete" data-id="${esc(t.id)}">
      旅行を完了
     </button>`}

    <button class="btn alt"
     data-action="${t.published?'unpublish':'publish'}"
     data-id="${esc(t.id)}">
     ${t.published?'公開取り消し':'POSTに公開'}
    </button>

    <button class="btn danger"
     data-action="delete" data-id="${esc(t.id)}">
     削除
    </button>
   `:`
    <button class="btn alt"
     data-action="copy" data-id="${esc(t.id)}">
     コピーして編集
    </button>`}
  </div>
 `).join('')||
 '<p class="muted">まだ旅程がありません。</p>'}

 <div class="notice">
  公開済みの旅程はPOSTに表示されます。
  PLANNINGまたはCOMPLETEDからも編集できます。
 </div>
 `;
}

function renderPost(){
 app.innerHTML=`
 <div class="eyebrow">SHARE YOUR JOURNEY</div>
 <h2>あなたの旅を紡ぐ。</h2>
 <p>
  誰かの次の旅につながる、
  あなたの旅程を投稿しよう。
 </p>

 <button class="btn" data-action="new-publish">
  ＋ 新しい旅程を作成して投稿
 </button>

 <h3>既存の旅程から投稿</h3>

/* =========================
   時間チェック
========================= */

function minutes(v){
 if(!/^\d\d:\d\d$/.test(v||''))return null;
 const [h,m]=v.split(':').map(Number);
 return h<24&&m<60?h*60+m:null;
}

function timeCheckHTML(a,b){
 const x=minutes(a.time);
 const y=minutes(b.time);

 if(x===null||y===null){
  return '<div class="check">時刻未設定</div>';
 }

 if(y<x){
  return '<div class="check bad">⚠ 時刻が前後しています</div>';
 }

 if(!hasNum(a.stayMinutes)||
    !hasNum(b.travelMinutes)){
  return '<div class="check">移動・滞在時間が未設定</div>';
 }

 const gap=y-x-Number(a.stayMinutes)-
 Number(b.travelMinutes);

 return gap<0
  ?`<div class="check bad">⚠ ${-gap}分不足</div>`
  :`<div class="check">✓ ${gap}分の余裕</div>`;
}

/* =========================
   地図
========================= */

function drawMap(t){
 const el=document.getElementById('trip-map');
 if(!el||!t)return;

 if(typeof L==='undefined'){
  el.textContent='地図を読み込めませんでした。';
  return;
 }

 try{
  map=L.map(el,{scrollWheelZoom:false});

  L.tileLayer(
   'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
   {
    attribution:'&copy; OpenStreetMap contributors',
    maxZoom:19
   }
  ).addTo(map);

  const bounds=[];
  const arrows=[];
  let missing=0;

  t.schedule.forEach((d,di)=>{
   const color=COLORS[di%COLORS.length];
   let prev=null;

   d.stops.forEach((s,si)=>{
    const p=coords(s.coords)
     ?s.coords:KNOWN[s.name];

    if(!coords(p)){
     missing++;
     prev=null;
     return;
    }

    const pos=p.map(Number);
    bounds.push(pos);

    const icon=L.divIcon({
     className:'',
     html:`<div class="map-pin"
      style="background:${color}">
      ${si+1}</div>`,
     iconSize:[29,29],
     iconAnchor:[14,14]
    });

    L.marker(pos,{icon})
     .addTo(map)
     .bindPopup(
      esc(d.name)+' / '+
      (si+1)+'. '+esc(s.name)
     );

    if(prev){
     L.polyline([prev,pos],{
      color,
      weight:4,
      opacity:.85
     }).addTo(map);

     arrows.push({from:prev,to:pos,color});
    }

    prev=pos;
   });
  });

  if(bounds.length){
   map.fitBounds(bounds,{
    padding:[35,35],
    maxZoom:13
   });
  }else{
   map.setView([35.6812,139.7671],5);
  }

  let markers=[];

  function drawArrows(){
   markers.forEach(m=>map.removeLayer(m));
   markers=[];

   arrows.forEach(a=>{
    const f=map.latLngToLayerPoint(a.from);
    const t=map.latLngToLayerPoint(a.to);
    const dx=t.x-f.x;
    const dy=t.y-f.y;

    if(Math.hypot(dx,dy)<12)return;

    const angle=Math.atan2(dy,dx)*180/Math.PI;

    const center=[
     (a.from[0]+a.to[0])/2,
     (a.from[1]+a.to[1])/2
    ];

    const icon=L.divIcon({
     className:'',
     html:`<div class="route-arrow"
      style="color:${a.color}">
      <span style="
       display:inline-block;
       transform:rotate(${angle}deg)
      ">➜</span></div>`,
     iconSize:[24,24],
     iconAnchor:[12,12]
    });

    markers.push(
     L.marker(center,{
      icon,
      interactive:false
     }).addTo(map)
    );
   });
  }

  map.on('zoomend',drawArrows);
  drawArrows();

  if(missing){
   el.insertAdjacentHTML('afterend',
    `<p class="muted">
     位置未登録：${missing}件。
     編集画面から登録してください。
    </p>`);
  }

  setTimeout(()=>{
   if(map)map.invalidateSize();
  },150);

 }catch(e){
  console.error(e);
  el.textContent='地図の表示に失敗しました。';
 }
}

function sync(){
 if(!draft)return;

 const fields={
  'trip-title':'title',
  'trip-place':'place',
  'trip-description':'description',
  'trip-status':'status',
  'trip-template':'template'
 };

 Object.entries(fields).forEach(([id,k])=>{
  const el=document.getElementById(id);
  if(el)draft[k]=el.value;
 });

 document.querySelectorAll('[data-field]')
 .forEach(el=>{
  const s=draft.schedule[+el.dataset.day]
   ?.stops[+el.dataset.spot];

  if(!s)return;

  const f=el.dataset.field;

  if(f==='name'&&s.name!==el.value){
   s.name=el.value;
   s.lookup='';
   delete s.coords;
   delete s.locationLabel;
  }else if(f!=='name'){
   s[f]=el.value;
  }
 });
}

function changeDays(n){
 sync();
 n=Number(n);

 if(!Number.isInteger(n)||n<1||n>14)return;

 while(draft.schedule.length<n){
  draft.schedule.push({
   name:'Day '+(draft.schedule.length+1),
   stops:[newSpot()]
  });
 }

 if(n<draft.schedule.length){
  if(!confirm(
   '日数を減らすと、削除されるDAYの入力内容も失われます。続けますか？'
  )){
   document.getElementById('trip-days').value=
    draft.schedule.length;
   return;
  }
 }

 draft.schedule.length=n;
 renderDays();
}

function removeSpot(di,si){
 sync();

 if(!confirm('このスポットを削除しますか？'))return;

 const a=draft.schedule[di].stops;
 a.splice(si,1);

 if(a.length){
  a[0].transport='';
  a[0].travelMinutes='';

  if(si<a.length){
   a[si].transport='';
   a[si].travelMinutes='';
  }
 }

 renderDays();
}

function moveSpot(di,si,delta){
 sync();

 const a=draft.schedule[di].stops;
 const to=si+delta;

 if(to<0||to>=a.length)return;

 [a[si],a[to]]=[a[to],a[si]];

 new Set([si,si+1,to,to+1]).forEach(i=>{
  if(a[i]){
   a[i].transport='';
   a[i].travelMinutes='';
  }
 });

 a[0].transport='';
 a[0].travelMinutes='';

 renderDays();

 alert(
  '訪問順を変更しました。\n'+
  '影響する移動区間の情報は再入力してください。'
 );
}

async function loadPhoto(file,di,si){
 if(!file||!draft)return;

 sync();

 const s=draft.schedule[di]?.stops[si];
 if(!s)return;

 const spotId=s.uid;

 if(!file.type.startsWith('image/')){
  alert('画像ファイルを選択してください。');
  return;
 }

 if(file.size>20*1024*1024){
  alert('20MB以下の画像を選択してください。');
  return;
 }

 try{
  const url=URL.createObjectURL(file);
  const img=new Image();

  try{
   await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=reject;
    img.src=url;
   });
  }finally{
   URL.revokeObjectURL(url);
  }

  const max=900;
  const scale=Math.min(
   1,max/Math.max(img.width,img.height)
  );

  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(img.width*scale));
  canvas.height=Math.max(1,Math.round(img.height*scale));

  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);

  const data=canvas.toDataURL('image/jpeg',0.65);

  const current=draft.schedule.flatMap(d=>d.stops)
   .find(x=>x.uid===spotId);

  if(!current){
   alert('編集中のスポットが見つかりません。');
   return;
  }

  current.photo=data;
  renderDays();

  alert(
   '写真を追加しました。\n'+
   '「旅程を保存」を押すと保存されます。'
  );

 }catch(e){
  console.error(e);
  alert('写真の読み込みに失敗しました。');
 }
}

function spotByUid(id){
 for(const d of draft?.schedule||[]){
  for(const s of d.stops){
   if(s.uid===id)return s;
  }
 }
 return null;
}

async function lookup(di,si){
 sync();

 const s=draft.schedule[di]?.stops[si];
 const el=document.getElementById(
  'lookup-'+di+'-'+si
 );

 if(!s||!el)return;

 if(!s.name.trim()){
  el.textContent='訪問場所を入力してください。';
  return;
 }

 if(searchBusy||Date.now()-lastSearch<1300){
  el.textContent='少し時間を空けて検索してください。';
  return;
 }

 searchBusy=true;
 lastSearch=Date.now();

 const token=uid();
 searchContext={uid:s.uid,token};

 el.textContent='検索中...';

 try{
  const q=(s.lookup||ALIASES[s.name]||s.name).trim();

  const params=new URLSearchParams({
   format:'jsonv2',
   q,
   limit:'10',
   addressdetails:'1',
   accept_language:'ja,en'
  });

  if(/イタリア|italy|italia/i.test(draft.place)){
   params.set('countrycodes','it');
  }

  const res=await fetch(
   'https://nominatim.openstreetmap.org/search?'+
   params.toString(),
   {headers:{Accept:'application/json'}}
  );

  if(!res.ok)throw Error(res.status);

  const data=await res.json();

  if(searchContext?.token!==token)return;

  searchResults=data.map(x=>({
   name:x.display_name,
   coords:[Number(x.lat),Number(x.lon)]
  })).filter(x=>coords(x.coords));

  const target=document.getElementById(
   'lookup-'+di+'-'+si
  );

  if(!target)return;

  target.innerHTML=searchResults.length
   ?searchResults.map((r,i)=>`
    <div class="result">
     ${esc(r.name)}<br>
     <button class="btn alt"
      data-action="choose"
      data-index="${i}"
      data-uid="${esc(s.uid)}">
      この場所を選択
     </button>
    </div>`).join('')
   :'<p class="muted">候補がありません。検索語を変更してください。</p>';

 }catch(e){
  el.textContent='検索に失敗しました。';
 }finally{
  searchBusy=false;
 }
}

function choosePlace(i,id){
 if(searchContext?.uid!==id)return;

 const s=spotByUid(id);
 const r=searchResults[i];

 if(!s||!r)return;

 s.coords=r.coords;
 s.locationLabel=r.name;

 searchContext=null;
 searchResults=[];
 renderDays();
}

function saveTrip(){
 sync();

 if(!draft.title.trim()||!draft.place.trim()){
  alert('タイトルと目的地を入力してください。');
  return;
 }

 if(
  !draft.schedule.some(d=>d.stops.length)||
  draft.schedule.some(d=>
   d.stops.some(s=>!s.name.trim()))
 ){
  alert('スポットを入力してください。');
  return;
 }

 for(const d of draft.schedule){
  for(const s of d.stops){
   for(const v of [s.stayMinutes,s.travelMinutes]){
    if(v!==''&&v!==null&&v!==undefined&&
      (!Number.isInteger(Number(v))||Number(v)<0)){
     alert('時間は0以上の整数で入力してください。');
     return;
    }
   }
  }
 }

 const t=norm(draft);

 if(draft.publishAfterSave)t.published=true;

 delete t.publishAfterSave;

 if(editing&&!own(editing)){
  alert('編集対象が見つかりません。');
  return;
 }

 const ok=update(()=>{
  if(editing){
   const i=state.plans.findIndex(x=>x.id===editing);
   state.plans[i]=t;
  }else{
   state.plans.unshift(t);
  }
 });

 if(!ok)return;

 draft=null;
 editing='';
 go('detail',t.id);
}

function deleteTrip(id){
 const t=state.plans.find(x=>x.id===id);
 if(!t)return;

 if(!confirm(
  '「'+t.title+'」を削除しますか？\n'+
  'この操作は取り消せません。'
 ))return;

 if(update(()=>{
  state.plans=state.plans.filter(x=>x.id!==id);
  state.saved=state.saved.filter(x=>x!==id);
 })){
  go('my');
 }
}

function setStatus(id,status){
 const t=state.plans.find(x=>x.id===id);
 if(!t)return;

 if(status==='completed'&&!confirm(
  '実際に行った旅として記録しますか？'
 ))return;

 if(update(()=>{t.status=status})){
  myTab=status;
  go('my');
 }
}

function publish(id,value){
 const t=state.plans.find(x=>x.id===id);
 if(!t)return;

 if(value&&!confirm(
  'POSTとして公開しますか？\n'+
  '現在は同じブラウザ内のみの公開です。'
 ))return;

 if(update(()=>{t.published=value})){
  if(page==='detail')go('detail',id);
  else render();
 }
}

function bookmark(id){
 if(update(()=>{
  state.saved=state.saved.includes(id)
   ?state.saved.filter(x=>x!==id)
   :[...state.saved,id];
 })){
  go('detail',id);
 }
}

function copyTrip(id){
 const t=find(id);
 if(!t)return;

 const c=norm(t);
 c.id='plan-'+uid();
 c.title+='（コピー）';
 c.status='planning';
 c.published=false;

 if(update(()=>{
  state.plans.unshift(c);
 })){
  openEdit(c.id);
 }
}

/* =========================
   バックアップ ver.0.9
========================= */

function renderBackup(){
 app.innerHTML=`
 <h2>バックアップ・復元</h2>
 ${stats()}

 <div class="notice">
  バックアップはテキスト形式です。
  iPadのメモアプリなどに保存してください。
  写真データも含まれるため、
  テキストが非常に長くなる場合があります。
 </div>

 <section class="panel">
  <h3>① バックアップ</h3>

  <button class="btn"
   data-action="backup-create">
   バックアップを作成
  </button>

  <textarea id="backup-output"
   readonly
   style="min-height:170px;font-size:11px"
   placeholder="ここにバックアップが表示されます">${esc(backupText)}</textarea>

  <button class="btn alt"
   data-action="backup-copy">
   テキストをコピー
  </button>
 </section>

 <section class="panel">
  <h3>② データの復元</h3>

  <textarea id="restore-input"
   style="min-height:170px;font-size:11px"
   placeholder="バックアップテキストを貼り付け"></textarea>

  <button class="btn alt"
   data-action="restore-preview">
   データを確認
  </button>

  <div id="restore-preview"></div>
 </section>
 `;
}

function createBackup(){
 backupText=JSON.stringify({
  app:'TUMUGOU',
  backupVersion:1,
  exportedAt:new Date().toISOString(),
  data:clone(state)
 },null,2);

 const el=document.getElementById('backup-output');
 if(el)el.value=backupText;
}

async function copyBackup(){
 const el=document.getElementById('backup-output');
 if(!el||!el.value){
  alert('先にバックアップを作成してください。');
  return;
 }

 try{
  await navigator.clipboard.writeText(el.value);
  alert('コピーしました。');
 }catch(e){
  el.focus();
  el.select();
  alert('選択したテキストを手動でコピーしてください。');
 }
}

function validTrip(t){
 return t&&
 typeof t.id==='string'&&t.id.length>0&&
 typeof t.title==='string'&&
 typeof t.place==='string'&&
 Array.isArray(t.schedule)&&
 t.schedule.length>=1&&
 t.schedule.length<=14&&
 t.schedule.every(d=>
  d&&Array.isArray(d.stops)&&
  d.stops.length<=500&&
  d.stops.every(s=>
   s&&typeof s.name==='string'&&
   typeof s.time==='string'&&
   (s.coords===undefined||coords(s.coords))&&
   (s.photo===undefined||
    (typeof s.photo==='string'&&
     (!s.photo||/^data:image\/jpeg;base64,/.test(s.photo))))
  )
 );
}

function previewRestore(){
 const raw=document.getElementById('restore-input')
  ?.value.trim()||'';

 const el=document.getElementById('restore-preview');
 restoreCandidate=null;

 try{
  if(raw.length>15000000){
   throw Error('バックアップが大きすぎます。');
  }

  const v=JSON.parse(raw);

  if(v.app!=='TUMUGOU'||
     v.backupVersion!==1||
     !v.data||
     !Array.isArray(v.data.plans)||
     !Array.isArray(v.data.saved)){
   throw Error('対応していないデータ形式です。');
  }

  if(v.data.plans.length>1000||
     v.data.saved.length>2000||
     !v.data.plans.every(validTrip)||
     !v.data.saved.every(x=>typeof x==='string')){
   throw Error('旅程データが正しくありません。');
  }

  const ids=v.data.plans.map(t=>t.id);
  if(new Set(ids).size!==ids.length){
   throw Error('バックアップ内に重複IDがあります。');
  }

  restoreCandidate=v;

  const existing=new Set(state.plans.map(t=>t.id));
  const duplicates=ids.filter(id=>existing.has(id)).length;

  el.innerHTML=`
   <div class="success">
    ✓ バックアップを読み取りました。
   </div>

   <p>旅程：${ids.length}件</p>
   <p>既存旅程との重複：${duplicates}件</p>

   <label>復元方法
    <select id="restore-mode">
     <option value="merge">
      既存データに追加
     </option>
     <option value="replace">
      既存データを置き換え
     </option>
    </select>
   </label>

   <button class="btn danger"
    data-action="restore-confirm">
    復元を実行
   </button>
  `;

 }catch(e){
  el.innerHTML=`
   <div class="warning">
    ${esc(e.message)}
   </div>`;
 }
}

function restoreData(){
 if(!restoreCandidate)return;

 const mode=document.getElementById('restore-mode')
  ?.value||'merge';

 if(!confirm(
  mode==='replace'
   ?'現在のデータを置き換えます。実行しますか？'
   :'重複を除いて追加します。実行しますか？'
 ))return;

 const data=restoreCandidate.data;

 const ok=update(()=>{
  if(mode==='replace'){
   state.plans=data.plans.map(norm);
   state.saved=[...new Set(data.saved)];
  }else{
   const ids=new Set(state.plans.map(t=>t.id));

   state.plans.push(
    ...data.plans
     .filter(t=>!ids.has(t.id))
     .map(norm)
   );

   state.saved=[
    ...new Set([...state.saved,...data.saved])
   ];
  }
 });

 if(ok){
  restoreCandidate=null;
  alert('復元しました。');
  go('my');
 }
}

function openExport(id){
 const t=find(id);
 if(!t)return;

 exportTrip=norm(t);
 exportIndex=0;
 go('export');
}

function renderExport(){
 if(!exportTrip){
  go('home');
  return;
 }

 const t=exportTrip;
 const total=2+days(t);

 app.innerHTML=`
 <div class="eyebrow">INSTAGRAM CAROUSEL</div>
 <h2>旅を、投稿にしよう。</h2>

 <p>
  表紙・全体ルート・DAY別スケジュールを

}

function wrapLines(ctx,text,maxWidth){
 const lines=[];
 let line='';

 for(const ch of String(text)){
  if(ch==='\n'){
   lines.push(line);
   line='';
   continue;
  }

  if(ctx.measureText(line+ch).width>maxWidth&&line){
   lines.push(line);
   line=ch;
  }else{
   line+=ch;
  }
 }

 if(line)lines.push(line);
 return lines;
}

function drawText(ctx,text,x,y,maxWidth,lineHeight,maxLines=99){
 const lines=wrapLines(ctx,text,maxWidth);
 const n=Math.min(lines.length,maxLines);

 for(let i=0;i<n;i++){
  let value=lines[i];

  if(i===n-1&&lines.length>maxLines){
   while(ctx.measureText(value+'…').width>maxWidth){
    value=value.slice(0,-1);
   }
   value+='…';
  }

  ctx.fillText(value,x,y+i*lineHeight);
 }

 return y+n*lineHeight;
}

function roundRect(ctx,x,y,w,h,r,fill){
 ctx.fillStyle=fill;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

async function loadImage(src){
 return new Promise(resolve=>{
  if(!src){resolve(null);return}

  const img=new Image();
  img.onload=()=>resolve(img);
  img.onerror=()=>resolve(null);
  img.src=src;
 });
}

function drawCoverImage(ctx,img,x,y,w,h){
 if(!img)return;

 const scale=Math.max(w/img.width,h/img.height);
 const sw=w/scale;
 const sh=h/scale;

 ctx.drawImage(
  img,
  (img.width-sw)/2,
  (img.height-sh)/2,
  sw,sh,x,y,w,h
 );
}

async function drawExport(){
 const t=exportTrip;
 if(!t||page!=='export')return;

 const index=exportIndex;
 const preview=document.getElementById('export-preview');
 if(!preview)return;

 const canvas=document.createElement('canvas');
 canvas.width=1080;
 canvas.height=1350;

 const ctx=canvas.getContext('2d');
 const W=1080,H=1350;

 const palette={
  bg:'#f8f5ee',
  brown:'#493c30',
  olive:'#59634a',
  sand:'#e9dfcc',
  white:'#fffefa'
 };

 const template=t.template||'scrapbook';

 ctx.fillStyle=template==='minimal'
  ?'#f6f6f3':palette.bg;
 ctx.fillRect(0,0,W,H);

 ctx.fillStyle=palette.olive;
 ctx.fillRect(0,0,W,15);

 ctx.fillStyle=palette.brown;
 ctx.font='bold 40px Georgia,serif';
 ctx.fillText('TUMUGOU',70,95);

 ctx.font='22px sans-serif';
 ctx.fillStyle='#8c8274';
 ctx.fillText(
  'あなたの旅が、次の誰かの旅になる。',
  70,137
 );

 ctx.strokeStyle='#d9cfc0';
 ctx.beginPath();
 ctx.moveTo(70,165);
 ctx.lineTo(1010,165);
 ctx.stroke();

 if(index===0){
  const photo=await loadImage(firstPhoto(t));

  if(photo){
   drawCoverImage(ctx,photo,70,205,940,640);
  }else{
   roundRect(
    ctx,70,205,940,640,25,'#d8ddcf'
   );

   ctx.font='180px sans-serif';
   ctx.textAlign='center';
   ctx.fillStyle=palette.brown;
   ctx.fillText(t.icon||'🧳',540,590);
   ctx.textAlign='left';
  }

  ctx.fillStyle=palette.olive;
  ctx.font='bold 27px sans-serif';
  ctx.fillText(
   t.place.toUpperCase()+'  /  '+days(t)+' DAYS',
   75,925
  );

  ctx.fillStyle=palette.brown;
  ctx.font='bold 65px sans-serif';

  drawText(
   ctx,t.title,70,1020,940,85,3
  );

  ctx.font='27px sans-serif';
  ctx.fillStyle='#84786a';

  drawText(
   ctx,t.description||'旅の記録',
   75,1220,930,38,2
  );

 }else if(index===1){

  ctx.fillStyle=palette.olive;
  ctx.font='bold 32px sans-serif';
  ctx.fillText('OUR TRAVEL ROUTE',70,235);

  ctx.fillStyle=palette.brown;
  ctx.font='bold 50px sans-serif';
  ctx.fillText('旅の全体ルート',70,310);

  let y=365;
  let maxRows=0;

  t.schedule.forEach((d,di)=>{
   if(y>1190)return;

   const color=COLORS[di%COLORS.length];

   roundRect(
    ctx,70,y,940,55,12,color
   );

   ctx.fillStyle='white';
   ctx.font='bold 27px sans-serif';
   ctx.fillText(d.name,95,y+38);

   y+=75;

   d.stops.forEach((s,si)=>{
    if(y>1210)return;

    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(100,y+8,17,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='white';
    ctx.font='bold 20px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(String(si+1),100,y+15);
    ctx.textAlign='left';

    ctx.fillStyle=palette.brown;
    ctx.font='bold 26px sans-serif';

    const name=wrapLines(ctx,s.name,680)[0]||'';
    ctx.fillText(
     s.time+'  '+name,
     145,y+17
    );

    y+=48;
    maxRows++;
   });

   y+=25;
  });

  if(y>1210){
   ctx.fillStyle='#8b6555';
   ctx.font='22px sans-serif';
   ctx.fillText(
    '※ 表示しきれないスポットはDAY別画像をご確認ください。',
    70,1260
   );
  }

  ctx.fillStyle='#80796d';
  ctx.font='20px sans-serif';
  ctx.fillText(
   '訪問順を示す一覧です。地理的な地図画像ではありません。',
   70,1310
  );

 }else{

  const di=index-2;
  const d=t.schedule[di];

  const color=COLORS[di%COLORS.length];

  ctx.fillStyle=color;
  ctx.font='bold 34px sans-serif';
  ctx.fillText('DAY '+(di+1),70,235);

  ctx.fillStyle=palette.brown;
  ctx.font='bold 50px sans-serif';
  ctx.fillText(d.name,70,310);

  let y=360;

  for(let si=0;si<d.stops.length;si++){
   const s=d.stops[si];

   if(y>1190)break;

   const hasPhoto=!!s.photo;
   const cardHeight=hasPhoto?270:135;

   roundRect(
    ctx,70,y,940,cardHeight,15,palette.white
   );

   ctx.fillStyle=color;
   ctx.fillRect(70,y,8,cardHeight);

   ctx.fillStyle=color;
   ctx.font='bold 27px sans-serif';
   ctx.fillText(s.time||'--:--',100,y+45);

   ctx.fillStyle=palette.brown;
   ctx.font='bold 31px sans-serif';

   drawText(
    ctx,(si+1)+'. '+s.name,
    250,y+45,700,40,2
   );

   if(hasPhoto){
    const photo=await loadImage(s.photo);

    if(photo){
     drawCoverImage(
      ctx,photo,100,y+105,390,140
     );
    }

    ctx.fillStyle='#766d62';
    ctx.font='22px sans-serif';

    if(s.comment){
     drawText(
      ctx,s.comment,520,y+130,440,31,3
     );
    }
   }else if(s.comment){
    ctx.fillStyle='#766d62';
    ctx.font='21px sans-serif';

    drawText(
     ctx,s.comment,250,y+100,700,27,2
    );
   }

   y+=cardHeight+18;

   if(si<d.stops.length-1){
    const next=d.stops[si+1];

    ctx.fillStyle='#857b6e';
    ctx.font='20px sans-serif';
    ctx.fillText(
     '↓ '+travel(next),
     100,y+10
    );

    y+=45;
   }
  }

  if(y>1210){
   ctx.fillStyle='#8b6555';
   ctx.font='20px sans-serif';
   ctx.fillText(
    '※ スポット数が多い場合は一部省略されます。',
    70,1270
   );
  }
 }

 ctx.fillStyle=palette.brown;
 ctx.font='21px Georgia,serif';
 ctx.textAlign='right';
 ctx.fillText(
  'TUMUGOU  •  '+(index+1)+' / '+(2+days(t)),
  1000,1320
 );
 ctx.textAlign='left';

 if(page!=='export'||exportIndex!==index)return;

 const img=document.createElement('img');
 img.alt='Instagram投稿用画像';
 img.style.width='100%';
 img.style.display='block';
 img.style.webkitTouchCallout='default';

 img.src=canvas.toDataURL('image/png');

 preview.innerHTML='';
 preview.appendChild(img);

 document.getElementById('export-count').textContent=
  (index+1)+' / '+(2+days(t));
}

function changeExport(delta){
 if(!exportTrip)return;

 exportIndex=Math.max(
  0,
  Math.min(
   1+days(exportTrip),
   exportIndex+delta
  )
 );

 renderExport();
}

/* =========================
   イベント処理
========================= */

document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');
 if(!b)return;

 const a=b.dataset.action;
 const id=b.dataset.id;
 const di=Number(b.dataset.day);
 const si=Number(b.dataset.spot);

 if(a==='page')go(id);
 else if(a==='tab'){
  myTab=id;
  render();
 }
 else if(a==='detail')go('detail',id);
 else if(a==='new')openNew(false);
 else if(a==='new-publish')openNew(true);
 else if(a==='edit')openEdit(id);
 else if(a==='add')addSpot(di);
 else if(a==='remove')removeSpot(di,si);
 else if(a==='up')moveSpot(di,si,-1);
 else if(a==='down')moveSpot(di,si,1);
 else if(a==='check')checkTimes(di);
 else if(a==='lookup')lookup(di,si);
 else if(a==='choose'){
  choosePlace(Number(b.dataset.index),b.dataset.uid);
 }
 else if(a==='remove-photo'){
  sync();
  const s=draft.schedule[di]?.stops[si];
  if(s&&confirm('写真を削除しますか？')){
   s.photo='';
   renderDays();
  }
 }
 else if(a==='save-trip')saveTrip();
 else if(a==='delete')deleteTrip(id);
 else if(a==='complete')setStatus(id,'completed');
 else if(a==='planning')setStatus(id,'planning');
 else if(a==='publish')publish(id,true);
 else if(a==='unpublish')publish(id,false);
 else if(a==='bookmark')bookmark(id);
 else if(a==='copy')copyTrip(id);
 else if(a==='backup-create')createBackup();
 else if(a==='backup-copy')copyBackup();
 else if(a==='restore-preview')previewRestore();
 else if(a==='restore-confirm')restoreData();
 else if(a==='export')openExport(id);
 else if(a==='export-prev')changeExport(-1);
 else if(a==='export-next')changeExport(1);
});

document.addEventListener('input',e=>{
 if(e.target.id==='query'){
  query=e.target.value;
  renderResults();
 }

 if(e.target.id==='restore-input'){
  restoreCandidate=null;
  const el=document.getElementById('restore-preview');
  if(el)el.innerHTML='';
 }

 if(e.target.dataset.field==='name'){
  const s=draft?.schedule[
   +e.target.dataset.day
  ]?.stops[
   +e.target.dataset.spot
  ];

  if(s&&s.name!==e.target.value){
   s.name=e.target.value;
   s.lookup='';
   delete s.coords;
   delete s.locationLabel;

   const box=e.target.closest('.spot');
   const lookupField=box?.querySelector(
    '[data-field="lookup"]'
   );

   if(lookupField){
    lookupField.value=ALIASES[s.name]||s.name;
   }

   const status=box?.querySelector('.muted');
   if(status&&status.textContent.includes('位置登録済み')){
    status.textContent='位置未登録';
   }

   const result=box?.querySelector('[id^="lookup-"]');
   if(result)result.innerHTML='';
  }
 }
});

document.addEventListener('change',async e=>{
 if(e.target.id==='duration'){
  duration=e.target.value;
  renderResults();
 }

 else if(e.target.id==='trip-days'){
  changeDays(e.target.value);
 }

 else if(e.target.id==='export-index'){
  exportIndex=Number(e.target.value);
  renderExport();
 }

 else if(e.target.dataset.photo){
  await loadPhoto(
   e.target.files?.[0],
   +e.target.dataset.day,
   +e.target.dataset.spot
  );
 }
});

render();

</script>
